<!-- Wardiya - sign-in (20 Nov 2026). Email code, no password. Public values only on this
     page: the project URL and the publishable key. Row security in the database decides
     what each person can see; this page never holds the server key. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p50:#FDF2F7;--p100:#FBE4EF;--p200:#F7C6DC;--p300:#F09CC0;--p400:#E66A9E;--p500:#D9417E;
  --p600:#BF2C66;--p700:#9C2353;--p900:#5C1733;--bg:#FDF2F7;--card:#fff;--ink:#3A1426;--dim:#8A5A6F;
  --line:#F7C6DC;--main:#D9417E;--ok:#1F8A5B;--bad:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0D14;--card:#2A1520;--ink:#FBE4EF;
  --dim:#C99AB0;--line:#4A2436;--main:#F09CC0}}
:root[data-theme="dark"]{--bg:#1A0D14;--card:#2A1520;--ink:#FBE4EF;--dim:#C99AB0;--line:#4A2436;--main:#F09CC0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:520px;width:100%;margin:0 auto}
.brand{font-weight:700;font-size:22px;color:var(--main);letter-spacing:0}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
main{flex:1;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;width:100%;max-width:420px;
  box-shadow:0 10px 30px rgba(217,65,126,.10);animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
h1{margin:0 0 6px;font-size:22px}
p.sub{margin:0 0 20px;color:var(--dim);font-size:14.5px;line-height:1.6}
label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--main)}
input.code{letter-spacing:.35em;text-align:center;font-size:24px;direction:ltr}
button.go{width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:14px;
  background:var(--p500);color:#fff;cursor:pointer;transition:transform .1s,opacity .15s}
button.go:active{transform:scale(.98)} button.go:disabled{opacity:.55;cursor:default}
button.link{background:none;border:0;color:var(--main);font:inherit;font-size:14px;cursor:pointer;margin-top:12px;padding:4px}
.msg{margin-top:12px;font-size:14px;line-height:1.6;min-height:1.2em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.who{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;background:var(--p100);color:var(--p700);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .pill{background:#4A2436;color:var(--p200)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{background:#4A2436;color:var(--p200)}}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:16px}
/* app (20 Nov 2026): entry, today, team */
.app{width:100%;max-width:560px;margin:0 auto;padding:0 16px 90px;overflow-x:hidden}
.app input,.app select{min-width:0;max-width:100%}
.fname{font-weight:700;font-size:18px;margin:4px 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;min-width:0;background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--dim);padding:10px 0;white-space:nowrap;overflow:hidden;
  border-radius:12px;cursor:pointer}
.tabs button.on{color:#fff;background:var(--p500)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big4 button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:22px 10px;
  font:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .1s,border-color .15s}
.big4 button:active{transform:scale(.97)} .big4 button:hover{border-color:var(--main)}
.big4 .ic{font-size:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-top:14px;animation:rise .3s ease-out both}
.panel h2{margin:0 0 12px;font-size:18px}
.fld{margin-bottom:12px}
select{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px;font:inherit;cursor:pointer}
.seg button.on{border-color:var(--main);color:var(--main);font-weight:700}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tot b{display:block;font-size:20px} .tot span{font-size:12px;color:var(--dim)}
.ent{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:8px}
.ent .w{font-size:15px;font-weight:600} .ent .m{font-size:12.5px;color:var(--dim);margin-top:2px}
.ent.void{opacity:.45} .ent.void .w{text-decoration:line-through}
.x{border:1px solid var(--line);background:none;color:var(--dim);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.st{font-size:11.5px;border-radius:999px;padding:2px 8px;margin-inline-start:6px}
.st.pending{background:#FFF3D6;color:#8A5A00} .st.void{background:#eee;color:#666}
.empty{color:var(--dim);text-align:center;padding:20px 0}
/* shell (21 Nov 2026) */
body.inapp{padding-top:calc(58px + env(safe-area-inset-top))}
.apphdr{position:fixed;top:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.apphdr .hb{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;height:57px}
.apphdr .hl{display:flex;align-items:baseline;gap:10px;min-width:0}
.apphdr .logo{font-weight:700;font-size:20px;color:var(--main)} .apphdr .fac{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;border:0;background:var(--p500);color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.menu{position:absolute;top:58px;inset-inline-end:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:230px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);padding:8px;animation:rise .2s ease-out both}
.menu .mh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu button{display:block;width:100%;text-align:start;background:none;border:0;font:inherit;font-size:15px;color:var(--ink);padding:10px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--bg)} .menu button.danger{color:var(--bad)}
.subtabs{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  max-width:560px;margin:0 auto;padding:10px 16px 8px;background:var(--bg)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;
  font-weight:600;padding:8px 16px;cursor:pointer;transition:background .2s,color .2s}
.subtabs button.on{background:var(--p500);border-color:var(--p500);color:#fff}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px!important}
.tabs button svg{opacity:.8} .tabs button.on{background:transparent!important;color:var(--main)!important} .tabs button.on svg{opacity:1}
.tabs button.on span{font-weight:700}
.app{padding-top:6px}
.app.swap{animation:fadein .25s ease-out both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.skel{padding:14px 0} .skel i{display:block;height:14px;border-radius:8px;margin:10px 0;background:linear-gradient(90deg,var(--line),var(--card),var(--line));
  background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--ink);color:var(--card);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;pointer-events:none;transition:all .25s;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)} #toast.bad{background:var(--bad);color:#fff}
.hcard{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;
  font:inherit;color:var(--ink);cursor:pointer;transition:transform .12s,box-shadow .2s;animation:rise .3s ease-out both}
button.hcard:active{transform:scale(.985)} button.hcard:hover{box-shadow:0 8px 22px rgba(217,65,126,.12)}
.hk{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:8px}
.hrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.hrow b{font-size:22px} .hrow span{display:block;font-size:12px;color:var(--dim)}
.hnone{color:var(--dim);font-size:14px} .hnone.ok{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--p500);border-radius:6px;transition:width .6s}
.hal{display:block;width:100%;text-align:start;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;margin-top:6px;cursor:pointer}
.hal::after{content:" \2039";float:inline-end;color:var(--dim)} html[dir="ltr"] .hal::after{content:" \203A"}
.hsl{margin-top:6px} .soonp{text-align:center;color:var(--dim)} .soonp svg{width:40px;height:40px;color:var(--main);margin:6px auto 0;display:block}
.m{font-size:12.5px;color:var(--dim)}
.app input[type=time],.app input[type=date],.app input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;min-height:50px}
.big4>*,.seg>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tot.tot2{grid-template-columns:1fr 1fr} .tot.tot2>div{padding:12px} .tot.tot2 b{font-size:22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink);white-space:nowrap}
.chip b{font-weight:700} .chip.warn{background:#FFF3D6;border-color:#F1D9A0;color:#8A5A00}
.gaprow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.gaprow:last-child{border-bottom:0} .gaprow .h{color:var(--dim);font-size:12px}
/* closed groups (Aziz, 20 Nov 2026): a long list opens one product / area at a time */
details.grp{border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--card)}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"\203A";display:inline-block;transition:transform .2s;color:var(--dim);font-size:18px}
html[dir="rtl"] details.grp>summary::before{content:"\2039"}
details.grp[open]>summary::before{transform:rotate(-90deg)}
details.grp>summary .gs{margin-inline-start:auto;font-weight:600;font-size:13px;color:var(--dim)}
details.grp>summary .gt{font-weight:700;color:var(--main);font-size:14px}
details.grp>.gb{padding:0 10px 6px}
[hidden]{display:none !important}
</style>
</head>

<script>
const SB_URL="https://txqrrnymaglkilowgvee.supabase.co";
const SB_KEY="sb_publishable_Jc1BIS5tm2t04X6982tHfQ_mQmSokSJ";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
const T={
 ar:{brand:"وردية",other:"EN",hello:"تسجيل الدخول",sub:"اكتب بريدك، ونرسل لك رمز دخول. لا توجد كلمة مرور.",

  fail:"تعذّر الاتصال. حاول مرة أخرى.",nameT:"مرحبًا بك",nameSub:"اكتب اسمك كما تريد أن يظهر للفريق.",
  name:"الاسم",save:"حفظ",inT:"أنت داخل",factory:"المصنع",role:"الدور",none:"حسابك غير مرتبط بمصنع بعد. اطلب من المدير إضافتك.",
  out:"تسجيل الخروج",foot:"وردية · أول مصنع: إيرماين",
  roles:{owner:"المالك",admin:"مدير",planner:"مخطِّط",chef:"شيف",lead:"قائد محطة",storekeeper:"أمين المخزن",qc:"الجودة",viewer:"مشاهد"}},
 en:{brand:"Wardiya",other:"ع",hello:"Sign in",sub:"Type your email and we send you a sign-in code. No password.",
  email:"Email",send:"Send the code",sending:"Sending…",codeT:"Enter the code",
  codeSub:"We sent a code to {e}. It arrives within a minute; check spam if you cannot see it.",code:"Code",verify:"Sign in",
  checking:"Checking…",back:"Change email",resend:"Send the code again",badEmail:"Type a valid email.",
  badCode:"The code is wrong or has expired. Ask for a new one.",wait:"Wait a little before asking for a new code.",
  fail:"Could not connect. Try again.",nameT:"Welcome",nameSub:"Type your name as the team should see it.",
  name:"Name",save:"Save",inT:"You are signed in",factory:"Factory",role:"Role",none:"Your account is not linked to a factory yet. Ask the owner to add you.",
  out:"Sign out",foot:"Wardiya · first factory: ERMINE",
  roles:{owner:"Owner",admin:"Admin",planner:"Planner",chef:"Chef",lead:"Station lead",storekeeper:"Storekeeper",qc:"Quality",viewer:"Viewer"}}};
let L="ar"; try{ L=localStorage.getItem("wd-lang")||"ar"; }catch(e){}
let EMAIL="", STEP="email";
const t=(k,v={})=>String(T[L][k]).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function msg(text,cls){ const m=$("#msg"); if(m){ m.textContent=cls==="ok"?"":(text||""); m.className="msg "+(cls||""); }
  if(text&&typeof toast==="function"&&$("#app")&&!$("#app").hidden) toast(text,cls==="ok"?"ok":"bad"); }
async function draw(){
  document.documentElement.lang=L; document.documentElement.dir=L==="ar"?"rtl":"ltr";
  $("#brand").textContent=t("brand"); $("#lang").textContent=t("other"); $("#foot").textContent=t("foot");
  document.title=t("brand");
  const {data:{session}}=await sb.auth.getSession();
  const c=$("#card");
  if(session){ return drawIn(session); }
  $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
  if(STEP==="code"){
    c.innerHTML=`<h1>${t("codeT")}</h1><p class="sub">${esc(t("codeSub",{e:EMAIL}))}</p>
      <label for="code">${t("code")}</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="go" id="verify" type="button">${t("verify")}</button>
      <div class="msg" id="msg"></div>
      <button class="link" id="resend" type="button">${t("resend")}</button>
      <button class="link" id="back" type="button">${t("back")}</button>`;
    $("#code").focus();
    $("#code").addEventListener("keydown",e=>{ if(e.key==="Enter") verify(); });
    $("#verify").onclick=verify; $("#resend").onclick=send; $("#back").onclick=()=>{STEP="email";draw();};
    return;
  }
  c.innerHTML=`<h1>${t("hello")}</h1><p class="sub">${t("sub")}</p>
    <label for="email">${t("email")}</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(EMAIL)}">
    <button class="go" id="send" type="button">${t("send")}</button><div class="msg" id="msg"></div>`;
  $("#email").focus();
  $("#email").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
  $("#send").onclick=send;
}
async function send(){
  const el=$("#email"); if(el) EMAIL=el.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(EMAIL)) return msg(t("badEmail"),"bad");
  const b=$("#send")||$("#resend"); if(b){ b.disabled=true; b.textContent=t("sending"); }
  const {error}=await sb.auth.signInWithOtp({email:EMAIL,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  if(error){ if(b){ b.disabled=false; b.textContent=STEP==="code"?t("resend"):t("send"); }
    return msg(/rate|seconds|security/i.test(error.message)?t("wait"):t("fail"),"bad"); }
  STEP="code"; draw();
}
async function verify(){
  const token=($("#code").value||"").replace(/\D/g,"");
  if(token.length<6) return msg(t("badCode"),"bad");
  const b=$("#verify"); b.disabled=true; b.textContent=t("checking");
  const {error}=await sb.auth.verifyOtp({email:EMAIL,token,type:"email"});
  if(error){ b.disabled=false; b.textContent=t("verify"); return msg(t("badCode"),"bad"); }
  STEP="email"; draw();
}

  pcs:"حبة",boxes:"بوكس",tMade:"صُنع",tCoat:"غُطّي",tPack:"عُبّئ",nothing:"لا إدخالات لهذا اليوم بعد.",

async function saveForm(k){
  const R=S.ref, day=riyadh(S.day), v=id=>($("#"+id)||{}).value||"";
  let row, table="production_entries";
  if(k==="delay"){
    const rid=v("fr"), rs=R.reasons.find(r=>r.id===rid), note=v("fn").trim();
    if(!rid) return msg(u("pickAll"),"bad");
    if(rs&&rs.needs_note&&!note) return msg(u("noteNeed"),"bad");
    const mins=parseInt(v("fm").replace(/\D/g,""))||null;
    table="delays"; row={factory_id:S.fid,client_id:uuid(),day,product_id:v("fp")||null,reason_id:rid,minutes_lost:mins,what_happened:note||null};
  } else {
    const q=parseInt(v("fq").replace(/\D/g,""))||0;
    if(k==="packed"){
      const bid=v("fb"), b=R.boxes.find(x=>x.id===bid), pc=R.bc.find(x=>x.box_id===bid);
      if(!bid||!q||(b&&b.by_flavour&&pc&&!v("ff"))) return msg(u("pickAll"),"bad");
      if(q>1500&&!confirm(u("big",{n:q}))) return;
      row={factory_id:S.fid,client_id:uuid(),day,stage:"packed",box_id:bid,product_id:pc?pc.product_id:null,flavour_id:v("ff")||null,qty:q};
    } else {
      const pid=v("fp"), hasFl=R.flavours.some(f=>f.product_id===pid);
      if(!pid||!q||(hasFl&&!v("ff"))) return msg(u("pickAll"),"bad");
      if(q>15000&&!confirm(u("big",{n:q}))) return;
      row={factory_id:S.fid,client_id:uuid(),day,stage:k,product_id:pid,flavour_id:v("ff")||null,qty:q};
    }
  }
  const btn=$("#fs"); btn.disabled=true;
  const {error}=await sb.from(table).insert(row);
  btn.disabled=false;
  if(error){ console.warn(error); return msg(t("fail")+" ("+(error.code||"")+")","bad"); }
  msg(u("saved"),"ok"); if($("#fq")) $("#fq").value=""; if($("#fm")) $("#fm").value=""; if($("#fn")) $("#fn").value="";
}

async function savePlan(day,pub){

  const row={factory_id:S.fid,day,staff_in:toInt($("#ps").value),break_min:toInt($("#pb").value),
    shift_start:$("#p1").value||null,shift_end:$("#p2").value||null,note:$("#pn").value.trim()||null};
  if(pub){ row.published=true; row.published_at=new Date().toISOString(); }
  const {data:pl,error}=await sb.from("daily_plans").upsert(row,{onConflict:"factory_id,day"}).select("id").single();
  if(error){ console.warn(error); return msg(t("fail"),"bad"); }
  const id=pl.id;
  const lines=[]; a.querySelectorAll(".pq").forEach(i=>{ const q=toInt(i.value); if(q) lines.push({plan_id:id,stage:"made",product_id:i.dataset.p,flavour_id:i.dataset.f,qty:q}); });

  const tasks=[]; a.querySelectorAll(".tk").forEach(s=>{ if(s.value) tasks.push({plan_id:id,station_id:s.dataset.st,half:s.dataset.h,slot:+s.dataset.sl,task:s.value}); });

    const d=await sb.from(tb).delete().eq("plan_id",id); if(d.error){ console.warn(d.error); return msg(t("fail"),"bad"); }
    if(rows.length){ const r=await sb.from(tb).insert(rows); if(r.error){ console.warn(r.error); return msg(t("fail"),"bad"); } }

  const bg={}; M.boxes.forEach(x=>{ const pc2=(R.bc.find(c=>c.box_id===x.id)||{}).product_id; const k=pcode(pc2); (bg[k]=bg[k]||[]).push(x); });
  h+=`<div class="fname" style="margin-top:14px">${u("mtBox")}</div>`+Object.entries(bg).map(([k,xs])=>grp(`<bdi>${esc(k)}</bdi>`,xs.map(x=>row(bc(x.id),x,u("boxes"))).join(""),
     `${n0(xs.reduce((s2,x)=>s2+x.left,0))} ${u("mtLeft")}`)).join("");
  if(M.prods.length) h+=`<div class="fname" style="margin-top:14px">${u("mtProd")}</div>`+grp(u("mtTarget"),M.prods.map(x=>row(pcode(x.id),x,u("pcs"))).join(""),`${n0(M.prods.reduce((s2,x)=>s2+x.left,0))} ${u("mtLeft")}`);
  if(M.fls.length){ const fg={}; M.fls.forEach(x=>{ const fl=R.flavours.find(y=>y.id===x.id); const k=pcode(fl&&fl.product_id); (fg[k]=fg[k]||[]).push(x); });
    h+=`<div class="fname" style="margin-top:14px">${u("mtFl")}</div>`+Object.entries(fg).map(([k,xs])=>grp(`<bdi>${esc(k)}</bdi>`,xs.map(x=>row(fname(x.id),x,u("pcs"))).join(""),`${n0(xs.filter(x=>x.left>0).length)} / ${n0(xs.length)}`)).join(""); }
  a.innerHTML=h;
}
const WI={lines:[{box:"",n:""}],date:null,staff:""};
async function drawWhatif(a){
  const R=S.ref; if(!WI.date) WI.date=riyadh(-7);
  const X=await loadPlanExtras();
  a.innerHTML=`<div class="panel" style="margin-top:0"><h2>${u("wiT")}</h2><p class="sub">${u("wiSub")}</p>
    ${WI.lines.map((l,i)=>`<div class="seg"><select class="wb" data-i="${i}" style="flex:2">${opt("",u("any"))}${R.boxes.map(b=>opt(b.id,b.code+" · "+b.pieces_per_box,b.id===l.box)).join("")}</select>
      <input class="wn" data-i="${i}" inputmode="numeric" placeholder="${u("boxes")}" value="${esc(l.n)}" style="flex:1"></div>`).join("")}
    <button class="x" id="wadd" type="button">+ ${u("wiAdd")}</button>
    <div class="seg" style="margin-top:12px"><label style="flex:1;margin:0">${u("wiDate")}<input type="date" id="wd" value="${WI.date}"></label>
      <label style="flex:1;margin:0">${u("wiStaff")}<input id="ws" inputmode="numeric" value="${esc(WI.staff)}" placeholder="23"></label></div>
    <button class="go" id="wgo" type="button">${u("wiCalc")}</button><div id="wout"></div></div>`;
  const keep=()=>{ a.querySelectorAll(".wb").forEach(s2=>WI.lines[+s2.dataset.i].box=s2.value); a.querySelectorAll(".wn").forEach(i2=>WI.lines[+i2.dataset.i].n=i2.value);
    WI.date=$("#wd").value; WI.staff=$("#ws").value; };
  $("#wadd").onclick=()=>{ keep(); WI.lines.push({box:"",n:""}); drawApp(); };
  $("#wgo").onclick=async()=>{ keep();
    const td=riyadh(0), d=WI.date, staff=+WI.staff||23;
    if(!d||d<=td){ $("#wout").innerHTML=`<p class="msg bad">${u("wiTooSoon")}</p>`; return; }
    const pcsBy={}, boxBy={};
    WI.lines.forEach(l=>{ const q=+String(l.n).replace(/\D/g,"")||0, b=R.boxes.find(x=>x.id===l.box); if(!b||!q) return;
      const pc2=(R.bc.find(c=>c.box_id===b.id)||{}).product_id; boxBy[b.id]=(boxBy[b.id]||0)+q; if(pc2) pcsBy[pc2]=(pcsBy[pc2]||0)+q*b.pieces_per_box; });
    const need=engineRun(X,pcsBy,boxBy).labour;
    // the orders already booked from tomorrow to the date, priced the same way
    const {data:so}=await sb.from("sales_orders").select("box_id,qty").eq("factory_id",S.fid).gt("day",td).lte("day",d);
    const bP={}, bB={}; (so||[]).forEach(o=>{ const b=R.boxes.find(x=>x.id===o.box_id); if(!b) return; const pc2=(R.bc.find(c=>c.box_id===b.id)||{}).product_id;
      bB[b.id]=(bB[b.id]||0)+o.qty; if(pc2) bP[pc2]=(bP[pc2]||0)+o.qty*b.pieces_per_box; });
    const booked=engineRun(X,bP,bB).labour;
    const {data:fac}=await sb.from("factories").select("week_off").eq("id",S.fid).maybeSingle();
    const tmw=new Date(td+"T00:00:00Z"); tmw.setUTCDate(tmw.getUTCDate()+1);
    const dEnd=new Date(d+"T00:00:00Z"); dEnd.setUTCDate(dEnd.getUTCDate()-1);   // made the day before delivery
    const days=workDays(tmw.toISOString().slice(0,10),dEnd.toISOString().slice(0,10),(fac||{}).week_off||[5]);
    const cap=days*staff*X.std, free=cap-booked, over=need-free, pp=days?over/(days*staff):null;
    const loc=L==="ar"?"ar-EG":"en-GB", n1=v=>(+v).toLocaleString(loc,{maximumFractionDigits:1});
    const verdict=!days?`<span class="st void" style="background:#FDE2E2;color:var(--bad)">${u("wiTooSoon")}</span>`
      : over<=0?`<span class="pill" style="background:#E3F5EC;color:var(--ok)">${u("wiFits")}</span>`
      : pp<=X.maxd-X.std?`<span class="st pending">${u("wiOt",{h:n1(pp)})}</span>`:`<span class="st void" style="background:#FDE2E2;color:var(--bad)">${u("wiNo",{h:n1(pp)})}</span>`;
    $("#wout").innerHTML=`<div class="tot tot2" style="margin-top:14px"><div><b>${n0(need)}</b><span>${u("wiNeed")} · ${u("hrsU")}</span></div>
      <div><b>${n0(Math.max(0,free))}</b><span>${u("wiFree")} · ${u("hrsU")}</span></div><div><b>${n0(booked)}</b><span>${u("wiBooked")}</span></div>
      <div><b>${n0(days)}</b><span>${u("wiDays")}</span></div></div><div style="margin-top:10px">${verdict}</div>`; };
}
async function signOut(){ await sb.auth.signOut(); STEP="email"; S.fid=null; S.ref=null; $("#app").hidden=true; $("#tabs").hidden=true;
  $("#apphdr").hidden=true; $("#subtabs").hidden=true; document.querySelector(".top").hidden=false; $("#foot").hidden=false; document.body.classList.remove("inapp");
  $("#mainbox").hidden=false; draw(); }
$("#lang").onclick=()=>{ L=L==="ar"?"en":"ar"; try{ localStorage.setItem("wd-lang",L); }catch(e){} draw(); };
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"||ev==="SIGNED_IN") draw(); });
draw();
