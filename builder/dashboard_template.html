/* ================================================================== *
 *  Export.                                                           *
 *                                                                    *
 *  The report is built as real HTML and handed to the browser's own   *
 *  print dialog, where "Save as PDF" is one click. No PDF library:    *
 *  every one of them would have to shape and reorder the Arabic       *
 *  itself, which is exactly where they break, and rasterising the     *
 *  page would turn a report into a picture of a report. The browser   *
 *  already shapes Arabic correctly and already has the brand fonts,   *
 *  so the file comes out as selectable text at a fraction of the size.*
 *                                                                    *
 *  Each language is rendered by running the ordinary view functions   *
 *  with the language switched - so a translation that is right on     *
 *  screen is right in the report, and there is no second wording to   *
 *  drift out of step.                                                 *
 * ================================================================== */
const EXPORTABLE = {plan:viewPlan, shift:viewShift, store:viewStore, month:viewMonth, rep:viewRep, late:viewLate};

function exportDialog(){
  // The first version built the options with attributes called "data-l=ar" and then
  // looked for them with [data-l\=ar]. That is not an attribute name - the markup
  // produced data-l="ar" - so nothing ever matched, no handler was attached, and both
  // choices sat frozen on their defaults however hard they were tapped. Plain
  // data-lang / data-scope values and one delegated listener now, which cannot drift
  // apart the same way.
  let lang = localStorage.getItem("erm-explang") || "both";
  let scope = "page";
  /* the sections of the page on screen, so a report can leave some out - the box list
     for sales without the cover table under it */
  const secs = [];
  if(VIEW!=="home" && EXPORTABLE[VIEW]){
    if(leadBlock().length) secs.push({i:0, label:t("expTop")});
    document.querySelectorAll("#main > h3").forEach((h,k)=>secs.push({i:k+1,
      label:(h.childNodes[0]&&h.childNodes[0].textContent||h.textContent).replace(/[0-9\u0660-\u0669]+\s*$/,"").trim()}));
  }
  const sel = new Set(secs.map(x=>x.i));
  const sc = document.createElement("div");
  sc.className = "scrim"; sc.id = "scrim";
  sc.onclick = e => { if(e.target === sc) closeExport(); };
  document.body.appendChild(sc);

  const draw = () => {
    /* redrawing replaced the whole dialog and threw the reader back to its top on every
       tick of a section - keep where they were */
    const old = sc.querySelector(".dlg"), keepY = old ? old.scrollTop : 0;
    requestAnimationFrame(()=>{ const d=sc.querySelector(".dlg"); if(d) d.scrollTop=keepY; });
    const page = VIEW==="home" ? "hHome"
      : ({plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth",rep:"vRep",late:"vLate"})[VIEW];
    const opt = (attr,val,on,lbl,sub) =>
      `<button class="opt ${on?"sel":""}" data-${attr}="${val}">${lbl}
         <small>${sub}</small></button>`;
    sc.innerHTML = `<div class="dlg">
      <h2>${t("exportT")}</h2><p>${t("exportSub")}</p>
      ${opt("lang","ar",  lang==="ar",  t("expAr"),  t("expArS"))}
      ${opt("lang","en",  lang==="en",  t("expEn"),  t("expEnS"))}
      ${opt("lang","both",lang==="both",t("expBoth"),t("expBothS"))}
      <div style="height:10px"></div>
      ${opt("scope","page",scope==="page",t("expScope"),t(page))}
      ${opt("scope","all", scope==="all", t("expAll"),
            [t("vPlan"),t("vShift"),t("vStore"),t("vMonth")].join(" · "))}
      ${scope==="page" && secs.length>1 ? `<div style="height:10px"></div><p style="margin:0 0 6px">${t("expSecs")}</p>`
        + secs.map(x=>`<button class="opt ${sel.has(x.i)?"sel":""}" data-sec="${x.i}">${sel.has(x.i)?"\u2713 ":""}${esc(x.label)}</button>`).join("") : ""}
      <div class="dlgrow">
        <button data-act="cancel">${t("expCancel")}</button>
        <button class="go" data-act="go">${t("expGo")} \u2913</button></div></div>`;
  };
  draw();

  sc.addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b || !sc.contains(b)) return;
    if(b.dataset.lang){ lang = b.dataset.lang;
      localStorage.setItem("erm-explang", lang); draw(); return; }
    if(b.dataset.scope){ scope = b.dataset.scope; draw(); return; }
    if(b.dataset.sec!=null){ const i=+b.dataset.sec; if(sel.has(i)) sel.delete(i); else sel.add(i); draw(); return; }
    if(b.dataset.act === "cancel") return closeExport();
    if(b.dataset.act === "go"){
      const one = (scope==="page" && secs.length>1 && sel.size===1) ? secs.find(x=>sel.has(x.i)) : null;
      return doExport(lang, scope, (scope==="page" && secs.length>1) ? sel : null, one ? one.label : null);
    }
  });
}

function closeExport(){ const s=$("#scrim"); if(s) s.remove(); }
window.closeExport=closeExport;

/* charts are canvases; a canvas does not survive being copied, so each visible one is
   frozen to a PNG and dropped into the report as an image */
function chartImages(){
  const out={};
  document.querySelectorAll("#main canvas").forEach(c=>{
    try{ if(c.width && c.height) out[c.id]=c.toDataURL("image/png",1); }catch(e){}
  });
  return out;
}

/* keep only the chosen sections: 0 is everything above the first heading, then one
   number per heading, in page order - the same in both languages */
function keepSections(html, sel){
  const tpl=document.createElement("template"); tpl.innerHTML=html;
  let k=0;
  [...tpl.content.childNodes].forEach(n=>{
    if(n.nodeType===1 && n.tagName==="H3") k++;
    if(!sel.has(k)) n.remove();
  });
  return tpl.innerHTML;
}

function doExport(lang, scope, sel, title){
  const langs = lang==="both" ? ["ar","en"] : [lang];
  const pages = scope==="all" ? ["plan","shift","store","month"]
                              : (VIEW==="home" ? ["plan","month"] : [VIEW]);
  const shots = chartImages();
  const keep = L;
  let html="";
  // Page first, language second - so in a bilingual report each section is followed
  // immediately by its own translation instead of the whole Arabic report and then the
  // whole English one. Reading it the other way round, the English half sits past the
  // end of the Arabic half and looks like it was never generated.
  for(const pg of pages){
    for(const lg of langs){
      L = lg;
      const rtl = lg==="ar";
      const titles={plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth",rep:"vRep",late:"vLate"};
      let body = EXPORTABLE[pg] ? EXPORTABLE[pg]() : "";
      if(sel && pages.length===1) body = keepSections(body, sel);
      // strip the on-screen affordances, they mean nothing on paper
      body = body.replace(/<div class="card noexp"[^>]*>[\s\S]*?<\/div>/g,"").replace(/<div class="card repctl">[\s\S]*?<\/div>/g,"").replace(/<div class="dlgrow"[^>]*>[\s\S]*?<\/div>/g,"")
                 .replace(/<div class="tapnote">.*?<\/div>/g,"")
                 .replace(/ class="card tap"/g,' class="card"')
                 .replace(/ onclick="[^"]*"/g,"");
      html += `<section class="rsec" dir="${rtl?"rtl":"ltr"}" lang="${lg}">
        <div class="rhead">
          ${MARK?`<img src="${MARK}" alt="">`:""}
          <div class="rt">${T[lg].repTitle}</div>
          <div class="rd">${langs.length>1?`<b>${lg==="ar"?"عربي":"English"}</b> · `:""}${T[lg][titles[pg]]}<br>${
            new Date().toLocaleString(lg==="ar"?"ar-EG":"en-GB",
              {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
        </div>
        <div class="rsub">${T[lg][titles[pg]+"Sub"]||""}</div>
        ${body}
        <div class="rfoot">${(pg==="rep"||pg==="late")?"":T[lg].src}</div></section>`;
    }
  }
  L = keep;
  $("#report").innerHTML = html;
  /* folds print as they sit on screen: what is open there is open on paper, the rest
     shows its summary line only - the box and its total */
  const openOnScreen=new Set([...document.querySelectorAll("#main details[open] .gname")].map(e=>e.textContent));
  $("#report").querySelectorAll("details").forEach(d=>{ const g=d.querySelector(".gname");
    d.open = !!(g && openOnScreen.has(g.textContent)); });
  // the canvases inside the report are empty copies - swap in the frozen pictures
  $("#report").querySelectorAll("canvas").forEach(c=>{
    const src = shots[c.id];
    if(src){ const i=document.createElement("img"); i.src=src; i.className="rchart";
             c.replaceWith(i); }
    else { const box=c.closest(".chartbox"); if(box) box.remove(); }
  });
  closeExport();
  /* On a phone - above all a page added to the home screen - window.print() does
     nothing: you pick the options, press Export, and nothing happens. There the same
     report goes out as a self-contained file through the share sheet (WhatsApp, Mail,
     Files - and Print from there makes the PDF). The page's own stylesheet travels with
     it, its print rules switched on for screen, so the file looks like the printout. */
  const phone = (window.navigator.standalone === true)
    || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)
    || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  /* The file is named for what is in it and the day: "Month guide for the chef 2026-11-11",
     not "ERMINE". Print-to-PDF takes its name from the page title, so the title is
     swapped for the length of the print. */
  const pgName = title || (pages.length===1
    ? T[lg0(langs)][({plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth",rep:"vRep",late:"vLate"})[pages[0]]]
    : T[lg0(langs)].repTitle);
  const fname = (pgName+" "+todayIso()).replace(/[\\/:*?"<>|]+/g,"-").trim();
  if(phone){ makePdf(fname); return; }
  const oldTitle=document.title; document.title=fname;
  const back=()=>{ document.title=oldTitle; window.removeEventListener("afterprint",back); };
  window.addEventListener("afterprint",back); setTimeout(back, 60000);
  setTimeout(()=>{ window.print(); }, 60);
}
function lg0(langs){ return langs.length===1 ? langs[0] : L; }

/* A real PDF on the phone. The report is laid out in a hidden frame with the page's own
   print stylesheet switched on for screen, and drawn to PDF there - the browser does the
   Arabic, the library only photographs it, so the shaping is right. Then it goes out
   through the share sheet as a .pdf. */
const PDF_LIB="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
function makePdf(fname){
  toast(t("pdfMaking"));
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n")
    .replace(/@media\s+print/g,"@media all");
  const fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;left:-10000px;top:0;width:760px;height:1100px;border:0";
  document.body.appendChild(fr);
  window.__pdfDone=(blob,err)=>{
    fr.remove(); delete window.__pdfDone;
    if(!blob){ toast(t("pdfFail")); return; }
    sendBlob(new File([blob], fname+".pdf", {type:"application/pdf"}), fname);
  };
  fr.srcdoc=`<!doctype html><html lang="${L}" dir="${L==="ar"?"rtl":"ltr"}" data-theme="light"><head><meta charset="utf-8">
<style>${css}
html,body{background:#fff !important} body{padding:0 !important;margin:0;width:760px}
*{letter-spacing:0 !important;text-transform:none !important;word-spacing:.12em}
#report{display:block !important}</style>
<script src="${PDF_LIB}"><\/script></head><body><div id="report">${$("#report").innerHTML}</div>
<script>
(async()=>{ try{
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  const blob=await html2pdf().set({margin:[10,8,10,8],
    image:{type:"jpeg",quality:0.95},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},
    jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
    pagebreak:{mode:["css","legacy"],avoid:["tr",".rhead",".pill",".row"]}})
    .from(document.getElementById("report")).outputPdf("blob");
  parent.__pdfDone(blob);
 }catch(e){ parent.__pdfDone(null,String(e)); } })();
<\/script></body></html>`;
}
async function sendBlob(file, title){
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title}); return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url=URL.createObjectURL(file), a=document.createElement("a");
  a.href=url; a.download=file.name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000);
  toast(t("exportSaved"));
}

$("#exp").onclick=exportDialog;
$("#hide").onclick=toggleHidden;
/* Fetch the page again from the server rather than from the phone's cache. A home-
   screen app will happily hand back this morning's copy otherwise, which is the whole
   reason this button is here. */
/* What this button does (since 11 Nov 2026).

   1. If a newer build is already published, it simply loads it.
   2. Otherwise it asks the QC backend to start the cloud rebuild on GitHub (reads the
      Excel files from OneDrive, no laptop needed), then waits for the new build and
      reloads itself - about 3-5 minutes. It never claims the figures are fresh before
      the new build is actually there.
   3. If the backend cannot start it, it says so and keeps the page as it is. */
let RF_T=null;
function rfReload(){ const u=new URL(location.href); u.searchParams.set("r",Date.now()); location.replace(u.toString()); }
function rfWait(done){
  const t0=Date.now();
  const tick=()=>{
    fetch("data/build.txt?t="+Date.now(),{cache:"no-store"})
      .then(r=>r.ok?r.text():null)
      .then(latest=>{
        if(latest && new Date(latest.trim())-BUILT>2000){ rfReload(); return; }
        if(Date.now()-t0>10*60*1000){ done(); toast(t("refreshSlow")); return; }
        RF_T=setTimeout(tick,20000);
      })
      .catch(()=>{ RF_T=setTimeout(tick,20000); });
  };
  RF_T=setTimeout(tick,20000);
}
$("#reload").onclick=()=>{
  const b=$("#reload"); if(b.disabled) return;
  b.disabled=true; b.textContent="\u00B7\u00B7\u00B7";
  const done=()=>{ clearTimeout(RF_T); b.disabled=false; b.textContent="\u21BB"; };
  fetch("data/build.txt?t="+Date.now(),{cache:"no-store"})
    .then(r=>r.ok?r.text():null)
    .then(latest=>{
      if(latest && new Date(latest.trim())-BUILT>2000){ rfReload(); return; }
      if(!QC_API){ done(); toast(t("reloadSame")); return; }
      return qcPost({action:"refresh"},20000).then(res=>{
        if(!res || !res.ok){ done(); toast(t("refreshFail")); return; }
        toast(t(res.started ? "refreshStarted" : "refreshBusy"));
        rfWait(done);
      });
    })
    .catch(()=>{ done(); toast(t("refreshFail")); });
};

/* A line that appears, is read, and goes. Used only where a button would otherwise do
   nothing visible and leave you guessing whether it worked. */
let TOAST_T=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
  el.textContent=msg;
  el.classList.add("on");
  clearTimeout(TOAST_T);
  TOAST_T=setTimeout(()=>el.classList.remove("on"), 5200);
}

applyTheme();
VIEW=(location.hash||"").replace("#","")||"home";
if(!PAGES.includes(VIEW)) VIEW="home";
render();
checkFresh();
swipeInit();
/* Coming back to a home-screen app after an hour is exactly when the copy in front of
   you is most likely to be yesterday's. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") checkFresh();
});
