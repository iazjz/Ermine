/* What would still be owed on the month target if today's plan were done in full.
   done already counts what was made or packed today, so only the part of the plan not
   yet done is added on top. Negative = still short (red); zero or more = the target is
   met, and making more of it is making stock nobody asked for. */
function tgtAfter(target, done, plan, actual){
  if(!target) return null;
  return (done||0) + Math.max(0,(plan||0)-(actual||0)) - target;
}
function tgtCell(v){
  if(v==null) return `<span class="muted">${t("noTgt")}</span>`;
  if(v<0) return `<b dir="ltr" style="color:var(--bad);white-space:nowrap">\u2212${n0(-v)}</b>`;
  return `<span class="pill p-ok" style="white-space:nowrap"><span dir="ltr">\u2713 ${v>0?"+"+n0(v):""}</span> ${v>0?"":t("tgtDone")+" "}\u00b7 ${t("tgtStop")}</span>`;
}
/* A box short of its target is not always a production problem. The pieces may already
   be made and only waiting to be packed - or, for the coated boxes, waiting to be coated
   first. So the shortfall is split three ways, in this order:
     ready   - boxes the Stock sheet says can be packed now ("Max possible"), less what
               today's packing plan will already take out of it
     coat    - Mini and Large Bites only: uncoated pieces that become boxes once coated
     make    - whatever is left, which needs new production
   Worked out from today's stock, so approximate - the page says so. */
function boxSplit(b, short, P){
  const B=b.box, pcs=((D.mtarget||{}).rows||[]).find(r=>r.box===B)?.pcs||0;
  const pb=(P.boxes||[]).find(x=>x.box===B)||{};
  const remPlan=Math.max(0,(b.plan||0)-(b.actual||0));
  if(pb.max==null) return null;
  let left=short;
  const ready=Math.min(left, Math.max(0,(pb.max||0)-remPlan)); left-=ready;
  let coat=0;
  const fl=P.flavours||[];
  if(left>0 && B==="Mini"){
    const m=fl.filter(f=>f.counts==="Mini" && (f.per||{})["Other box"]===10);
    if(m.length){ const cap=Math.floor(Math.min(...m.map(f=>Math.max(0,(f.stock||0)-(f.cstock||0))))/10);
      coat=Math.min(left,Math.max(0,cap)); }
  } else if(left>0 && B==="Large Bites"){
    const names=["Classic Dark Chocolate","Classic Salted Caramel","Classic Coffee"];
    const cap=fl.filter(f=>names.includes(f.flavour)).reduce((a,f)=>a+Math.floor(Math.max(0,(f.stock||0)-(f.cstock||0))/45),0);
    coat=Math.min(left,cap);
  }
  left-=coat;
  /* which flavours actually run out - a Big 30 is short because one flavour is, not all
     six, so the pieces to make are the per-flavour gaps, not boxes x 30 */
  let comp=fl.filter(f=>((f.per||{})[B]||0)>0).map(f=>({f, per:f.per[B]}));
  if(!comp.length && ["Mini","Coins","Origin","Ice Cream"].includes(B))
    comp=fl.filter(f=>f.counts===B && ((f.per||{})["Other box"]||0)>0 && !(B==="Mini"&&f.per["Other box"]===30))
           .map(f=>({f, per:f.per["Other box"]}));
  let mpcs=left*pcs, short_f=[];
  if(left>0 && comp.length){
    mpcs=0;
    comp.forEach(({f,per})=>{ const need=(remPlan+short)*per - ((f.stock||0)+(B==="Mini"?0:0));
      if(need>0){ mpcs+=need; short_f.push(f.flavour); } });
  }
  return {ready, coat, make:left, pcs:mpcs, flav:short_f};
}
function splitLine(x){
  if(!x) return `<div class="sub2">${t("splitNone")}</div>`;
  const parts=[];
  if(x.ready) parts.push(t("splitReady",{n:n0(x.ready)}));
  if(x.coat) parts.push(t("splitCoat",{n:n0(x.coat)}));
  if(x.make) parts.push(`<b style="color:var(--bad)">${t("splitMake",{n:n0(x.make),p:n0(x.pcs)})}</b>`
    + (x.flav&&x.flav.length?` <span class="muted">(${esc(x.flav.join(L==="ar"?"، ":", "))})</span>`:""));
  return `<div class="sub2" style="white-space:normal;line-height:1.5">${parts.join(" \u00b7 ")}</div>`;
}
function viewPlan(){
  const P=D.plan||{flavours:[],boxes:[]};
  const MT=D.mtarget||{}, FT={}, BT={};
  (MT.flavours||[]).forEach(x=>{ if(x.target) FT[x.flavour]=x; });
  (MT.rows||[]).forEach(x=>{ if(x.target) BT[x.box]=x; });
  const fl=P.flavours.filter(f=>f.plan||f.sugg||f.stock||f.actual||FT[f.flavour]);
  /* a flavour with a target that is not on the Stock sheet at all still owes its target */
  const known=new Set(P.flavours.map(f=>f.flavour));
  Object.values(FT).forEach(x=>{ if(!known.has(x.flavour))
    fl.push({flavour:x.flavour, counts:x.counts||"\u2014", plan:0, actual:null, stock:null, sugg:0}); });
  const bx=P.boxes.filter(b=>b.plan||b.asked||b.actual);
  const fAfter=f=>FT[f.flavour]?tgtAfter(FT[f.flavour].target,FT[f.flavour].made,f.plan,f.actual):null;
  const bAfter=b=>BT[b.box]?tgtAfter(BT[b.box].target,BT[b.box].packed,b.plan,b.actual):null;
  const doneList=[];
  fl.forEach(f=>{ const v=fAfter(f); if(v!=null&&v>=0) doneList.push({n:f.flavour,p:f.plan,u:t("pieces")}); });
  const bAll=[...bx]; Object.keys(BT).forEach(k=>{ if(!bAll.some(b=>b.box===k)) bAll.push({box:k,plan:0,actual:null}); });
  bAll.forEach(b=>{ const v=bAfter(b); if(v!=null&&v>=0) doneList.push({n:b.box,p:b.plan,u:t("boxes")}); });
  const S0=D.stage_today||{}, pd=S0.date||isoOf(P.date);
  let h=`<div class="card" data-focus="plandate"><div class="lbl">${t("planFor")}</div>
      <div class="big" style="font-size:21px;line-height:1.35">${esc(longDay(pd))}${dayBadge(pd)}</div>
      <div class="lbl" style="margin-top:12px">${t("stagesTitle")}</div>${stageChips(S0)}
      <div class="src">${t("planLead")}</div>
      <div class="src">${D.saved&&D.saved.plan ? t("stSaved",{t:clock(D.saved.plan)}) : ""}${
        S0.made_from==="log" ? " \u00b7 "+t("stMade")+": "+t("stMadeLog") : ""}</div></div>`;
  if(doneList.length){
    doneList.sort((a,b)=>(b.p||0)-(a.p||0));
    h+=`<div class="warnbox" style="border-color:var(--ok)">${t("tgtStopBox",{l:doneList.map(x=>
      x.p?`<b>${esc(x.n)}</b> (${t("tgtPlanned",{n:n0(x.p)+" "+x.u})})`:esc(x.n)).join(" \u00b7 ")})}</div>`;
  }
  h+=idealBlock();
  h+=`<div class="card"><div class="row">
      <div><div class="lbl">${t("pieces")}</div><div class="big">${n0(fl.reduce((s,f)=>s+(f.plan||0),0))}</div></div>
      <div><div class="lbl">${t("boxes")}</div><div class="big">${n0(bx.reduce((s,b)=>s+(b.plan||0),0))}</div></div>
      <div><div class="lbl">${t("hours")}</div><div class="big">${n0(D.plans[0].hours)}</div></div>
    </div><div class="muted" style="margin-top:8px">${esc(sCommit())}</div></div>`;

  // grouped, not one flat list of thirty-nine flavours. The question is always "what is
  // Classic doing today", and the answer was spread over five rows a screen apart.
  // Group on "Counts as", not on "Product". The Stock sheet's Product column says "Big"
  // for every large macaron - Classic and Kingdom alike - and the name a person actually
  // asks for sits in "Counts as". Grouping on Product produced one giant "Big" heading
  // and no way to see Classic apart from Kingdom, which is the exact split being asked
  // for. "Counts as" also matches the names the Actual Log uses, so the two agree.
  const byProd = {};
  fl.forEach(f => { const k = f.counts || f.product || "—";
                    (byProd[k] = byProd[k] || []).push(f); });
  h+=`<h3>${t("inPieces")}</h3>`;
  const fcols=[{h:t("flavour"),wrap:true},{h:t("stockNow")},{h:t("suggested2")},
               {h:t("planned")},{h:t("actual")},{h:t("tgtAfter")+" \u00b7 "+t("pieces")}];
  h+= Object.keys(byProd).length ? Object.entries(byProd).map(([prod,list])=>{
        const tot=list.reduce((s,f)=>s+(f.plan||0),0);
        return group(prod||"—", tot, t("pieces"),
          list.map(f=>[esc(f.flavour),dash(n0(f.stock)),dash(f.sugg?n0(f.sugg):null),
                       f.plan?`<b>${n0(f.plan)}</b>`:dash(null),
                       dash(f.actual?n0(f.actual):null), tgtCell(fAfter(f))]),
          fcols, tot>0);
      }).join("")
    : `<div class="card"><div class="muted">${t("nothingPlanned")}</div></div>`;
  h+=`<div class="card"><b>${t("totalRow")}</b> &nbsp; ${
      n0(fl.reduce((s,f)=>s+(f.plan||0),0))} <span class="unit">${t("pieces")}</span>
      <div class="src">${t("suggNote")}</div><div class="src">${t("tgtNote")}</div></div>`;

  // and each box opens on the flavours that feed it
  h+=`<h3>${t("inBoxes")}</h3>`;
  /* Planned against actual, the same way the pieces section does it. The boxes section
     only ever showed the plan, so there was no way to see on this page whether the
     packing had happened. */
  const bp = bAll.filter(b=>(b.plan||0)||(b.actual||0)||BT[b.box]);
  if(bp.length){
    h+=`<div class="card" data-focus="packed">`+tbl(
      [{h:t("box")},{h:t("planned")+" \u00b7 "+t("packedHead")},
       {h:t("actual")+" \u00b7 "+t("packedHead")},{h:t("diff")},{h:t("tgtAfter")+" \u00b7 "+t("boxes")}],
      bp.map(b=>{
        const d=(b.actual||0)-(b.plan||0);
        return [esc(b.box), dash(b.plan?n0(b.plan):null),
                `<b>${n0(b.actual||0)}</b>`,
                !b.plan?dash(null)
                  :`<span class="ou ${d<0?"dn":"up"}">${d>0?"+":""}${n0(d)}</span>`,
                (()=>{ const v=bAfter(b); return tgtCell(v)+(v!=null&&v<0?splitLine(boxSplit(b,-v,P)):""); })()];
      }),
      [t("totalRow"), n0(bp.reduce((a,b)=>a+(b.plan||0),0)),
       n0(bp.reduce((a,b)=>a+(b.actual||0),0)), "", ""])
      +`<div class="src">${t("packedNote")}</div><div class="src">${t("tgtNote")}</div><div class="src">${t("splitNote")}</div></div>`;
  }
  h+=stationsBlock();
  h+=ideasBlock();
  return h;
}

/* A made figure the chef typed and one this page worked out are not the same thing,
   and a reader has no way to tell them apart unless the page says so. */
function flavMadeCell(x){
  if(x.made) return `<b>${n0(x.made)}</b>${x.made_inferred
    ? `<span class="sub2" title="${esc(t("inferred"))}">\u2248</span>` : ""}`;
  if(x.made_ambiguous)
    return `<span class="muted" title="${esc(t("ambiguous").replace("{p}", x.made_ambiguous))}">\u2014 \u2047</span>`;
  return dash(null);
}

function viewShift(){
  const S=D.shift;
  if(!S) return `<div class="card"><div class="muted">—</div></div>`;
  const dd=(a,p)=>{
    if(p==null) return dash(null);
    const v=(a||0)-p;
    return `<span class="ou ${v<0?"dn":"up"}">${v>0?"+":""}${n0(v)}</span>`;
  };
  let h=`<div class="card"><div class="lbl">${esc(longDay(S.date))}${dayBadge(S.date)}</div>
    ${dayStage(S.date) ? stageChips(dayStage(S.date)) : ""}
    <div class="row" style="margin-top:7px">
      <div><div class="lbl">${t("hoursWorked")}</div><div class="mid">${n1(S.hours)}</div></div>
      <div><div class="lbl">${t("hoursModel")}</div><div class="mid">${n1(S.model)}</div></div>
      <div><div class="lbl">${t("drift")}</div><div class="mid" style="color:${
        S.ratio==null?"var(--ink)":(S.ratio>=0.85&&S.ratio<=1.15)?"var(--ok)":"var(--bad)"
        }">${n1(S.ratio)}</div></div>
      <div><div class="lbl">${t("people")}</div><div class="mid">${n0(S.staff)}</div></div>
    </div>${S.note?`<div class="muted" style="margin-top:9px">${esc(S.note)}</div>`:""}</div>`;
  if(!S.same_day_plan) h+=`<div class="warnbox">${t("noPlanKept")}</div>`;

  /* the fillings, which the product families cannot tell you */
  const F=D.flav_last;
  h+=`<h3>${t("flavTitle")}</h3>`;
  if(F && F.rows && F.rows.length){
    const fr=F.rows.filter(x=>x.made||x.coated||x.plan);
    /* The same shift read two ways, and they can disagree - see flavSource. */
    const flavMade=fr.reduce((a,x)=>a+(x.made||0),0);
    const prodMade=(S.products||[]).reduce((a,p)=>a+(p.actual||0),0);
    const gap=prodMade-flavMade;
    h+=`<div class="card" data-focus="made"><div class="lbl">${esc(dmy(F.date))}${
      D.flav_days?` · <span class="muted">${n0(D.flav_days)} ${t("flavDays")}</span>`:""}</div>
      <div style="margin-top:8px">${tbl(
        [{h:t("product"),wrap:true},{h:t("flavPlan")},{h:t("flavMade")},{h:t("flavCoat")}],
        /* One table, one total, and that total is the day's real figure.
           The flavour rows are a copy taken at a moment; the day's product total is
           permanent and authoritative. When the copy is behind, the difference is shown
           as its own line rather than left to be discovered by subtraction. Two tables
           that disagree force the reader to decide which to believe - which is the one
           thing a dashboard must never ask. */
        fr.map(x=>[esc(x.name),dash(x.plan?n0(x.plan):null),
                   flavMadeCell(x), x.coated?n0(x.coated):dash(null)])
          .concat(gap>1 ? [[`<span class="muted">${t("flavRest")}</span>`,
                            dash(null),
                            `<b style="color:var(--warn)">${n0(gap)}</b>`,
                            dash(null)]] : []),
        [t("totalRow"),n0(fr.reduce((a,x)=>a+(x.plan||0),0)),
         n0(fr.reduce((a,x)=>a+(x.made||0),0) + (gap>1?gap:0)),
         n0(fr.reduce((a,x)=>a+(x.coated||0),0))])}</div>
      ${ (prodMade && flavMade < prodMade*0.98)
          ? `<div class="warnbox" style="margin-top:10px">${
              t("shiftSnapShort").replace("{n}", n0(flavMade)).replace("{m}", n0(prodMade))}</div>`
          : "" }
      <div class="src">${gap>1 ? t("flavGap",{n:n0(gap)}) : t("flavSource")}</div></div>`;
  } else {
    h+=`<div class="card"><div class="src">${t("flavNone")}</div></div>`;
  }

  if((D.log||[]).length){
    h+=`<h3>${t("trendTitle")}</h3><div class="card">
        <div class="chartbox"><canvas id="c-h"></canvas></div></div>`;
  }

  /* the series the capture makes possible: planned against made, day by day */
  const K=D.kept||[];
  if(K.length){
    const avg=K.reduce((s,k)=>s+k.hit,0)/K.length;
    h+=`<h3>${t("keptTitle")}</h3><div class="card">
      <div class="row">
        <div><div class="lbl">${t("keptAvg")}</div><div class="big">${pc(avg)}</div></div>
        <div><div class="lbl">${t("keptDays")}</div><div class="mid">${n0(K.length)}</div></div>
      </div>
      <div class="chartbox" style="height:200px;margin-top:8px"><canvas id="c-k"></canvas></div>
      <div class="src">${t("keptNote")}</div></div>`;
  }

  const pr=S.products.filter(p=>p.actual||p.plan);
  h+=`<h3>${t("byProduct")}</h3><div class="card">`;
  h+= pr.length ? tbl(
      S.same_day_plan?[{h:t("product")},{h:t("planned")},{h:t("actual")},{h:t("diff")}]
                     :[{h:t("product")},{h:t("actual")}],
      pr.map(p=>S.same_day_plan
        ?[esc(p.name),dash(p.plan?n0(p.plan):null),`<b>${n0(p.actual)}</b>`,dd(p.actual,p.plan)]
        :[esc(p.name),`<b>${n0(p.actual)}</b>`]),
      S.same_day_plan
        ?[t("totalRow"),n0(pr.reduce((s,p)=>s+(p.plan||0),0)),n0(pr.reduce((s,p)=>s+(p.actual||0),0)),""]
        :[t("totalRow"),n0(pr.reduce((s,p)=>s+(p.actual||0),0))])
    : `<div class="muted">\u2014</div>`;
  if(S.from_snapshot) h+=`<div class="src">${t("shiftPlanSrc")}</div>`;
  h+=`</div>`;

  /* Each table asks its OWN question. Both switched on one flag, so a day with a
     product plan and no box plan drew a box comparison with every planned cell empty -
     columns of dashes that read as a failure to pack rather than a plan nobody kept. */
  const un=S.units.filter(u=>u.actual||u.plan);
  const unPlan = un.some(u=>u.plan);
  h+=`<h3>${t("byUnit")}</h3><div class="card">`;
  h+= un.length ? tbl(
      unPlan?[{h:t("box")},{h:t("planned")},{h:t("actual")},{h:t("diff")}]
            :[{h:t("box")},{h:t("actual")}],
      un.map(u=>unPlan
        ?[esc(u.name),dash(u.plan?n0(u.plan):null),`<b>${n0(u.actual)}</b>`,dd(u.actual,u.plan)]
        :[esc(u.name),`<b>${n0(u.actual)}</b>`]),
      unPlan
        ?[t("totalRow"),n0(un.reduce((s,u)=>s+(u.plan||0),0)),n0(un.reduce((s,u)=>s+(u.actual||0),0)),""]
        :[t("totalRow"),n0(un.reduce((s,u)=>s+(u.actual||0),0))])
    : `<div class="muted">\u2014</div>`;
  if(un.length && !unPlan) h+=`<div class="src">${t("shiftNoBoxPlan")}</div>`;
  h+=`<div class="src">${t("src")}</div></div>`;
  return h;
}

        <span class="unit">${t("boxes")}</span></div></div>
      <div><div class="lbl">${t("asPieces")}</div><div class="mid">${n0(
        S.reduce((s,b)=>s+((b.in_store_now||0)*(b.pcs||0)),0))}</div></div>
    </div></div>`;
  // The ten-column table was unreadable on a phone: the one figure anyone opens this
  // page for - what is on the shelf right now - sat at the far end, past six columns of

       {h:t("salesTook")},{h:t("waste")},{h:t("pcsBox")},{h:t("asPieces")}],
      [[dash(n0(b.stocktake)),
        dash(n0(b.packed_since!=null?b.packed_since:b.chef_packed)),
        dash(n0(b.ali_received)),
        (b.gap?`<span class="ou ${b.gap<0?"dn":"up"}">${n0(b.gap)}</span>`:dash(null)),
        dash(n0(b.sales_took)),dash(b.waste?n0(b.waste):null),
        dash(n0(b.pcs)),n0(now*(b.pcs||0))]]);

         {h:t("asPieces")}],
        fl.map(f=>[esc(f.name), `<b>${n0(f.now)}</b>`, dash(f.in?n0(f.in):null),
                   dash(f.out?n0(f.out):null), n0(f.now*(b.pcs||0))]),
        [t("totalRow"), n0(fl.reduce((a,f)=>a+f.now,0)),
         n0(fl.reduce((a,f)=>a+f.in,0)), n0(fl.reduce((a,f)=>a+f.out,0)),
         n0(fl.reduce((a,f)=>a+f.now,0)*(b.pcs||0))])
      + `<div class="src">${t("byFlavourNote")}</div></div>` : "";

    return `<details class="grp" data-focus="box:${esc(b.box).replace(/"/g,"&quot;")}">
      <summary><span class="caret">\u276F</span>

/* The chef's pieces, flavour by flavour. The box store answers "what can sales take";
   this answers "what is still with the chef" - pieces waiting to be packed, or still
   in production. Folded by product, shut until opened, like the box store. */
function viewPcs(){
  const F=((D.plan||{}).flavours||[]).filter(f=>(f.stock||0)+(f.cstock||0)>0);
  if(!F.length) return `<div class="card"><div class="muted">${t("pNone")}</div></div>`;
  const sum=(l,k)=>l.reduce((s,f)=>s+(f[k]||0),0);
  const all=l=>sum(l,"stock")+sum(l,"cstock");
  let h=`<div class="card"><div class="row">
      <div><div class="lbl">${t("pTotal")}</div><div class="big">${n0(all(F))}
        <span class="unit">${t("pieces")}</span></div></div>
      <div><div class="lbl">${t("pUncoated")}</div><div class="mid">${n0(sum(F,"stock"))}</div></div>
      <div><div class="lbl">${t("pCoated")}</div><div class="mid">${n0(sum(F,"cstock"))}</div></div>
    </div><div class="src">${D.saved&&D.saved.plan ? t("pAsOf",{t:clock(D.saved.plan)}) : ""}</div></div>`;
  const by={};
  F.forEach(f=>{ const k=f.counts||f.product||"\u2014"; (by[k]=by[k]||[]).push(f); });
  const pmax=Math.max(1, ...Object.values(by).map(all));
  const cols=[{h:t("flavour"),wrap:true},{h:t("pUncoated")},{h:t("pCoated")},{h:t("pTotal")}];
  h+=`<h3>${t("byFlavour")}</h3>`;
  h+=Object.entries(by).map(([prod,list])=>{
    const tot=all(list);
    const rows=list.map(f=>[esc(f.flavour), dash(f.stock?n0(f.stock):null),
      dash(f.cstock?n0(f.cstock):null), `<b>${n0((f.stock||0)+(f.cstock||0))}</b>`]);
    return `<details class="grp" data-focus="pcs:${esc(prod).replace(/"/g,"&quot;")}">
      <summary><span class="caret">\u276F</span>
        <span class="gname">${esc(prod)}</span>
        <span class="gnum" style="color:var(--ok)">${n0(tot)}</span>
        <span class="unit">${t("pieces")}</span>
        <span class="minibar" style="flex:0 0 70px"><i style="width:${
          Math.round(100*tot/pmax)}%;background:var(--teal)"></i></span>
      </summary><div class="inner">${tbl(cols, rows,
        [t("totalRow"), n0(sum(list,"stock")), n0(sum(list,"cstock")), n0(tot)])}</div></details>`;
  }).join("");
  h+=`<div class="card"><div class="src">${t("pSrc")}</div></div>`;
  return h;
}

/* IDEAL, product by product: what the Stock sheet suggests making today so the orders
   ship and the month stays on pace. A suggestion beside the chef's plan, never in it. */
function idealBlock(){
  const SG=(D.sugg&&D.sugg.rows)||[];
  if(!SG.length) return "";
  const P=(D.plans||[]).find(p=>p.name==="IDEAL")||{};
  const rows=SG.filter(r=>(r.ideal||0)>0||(r.chef||0)>0);
  const drv=s=>/month.s pace/i.test(s||"") ? t("drvPace") : (s&&s!=="-" ? esc(s) : "");
  let h=`<h3>${t("idealTitle")}</h3><div class="card"><div class="src" style="margin:0 0 8px">${t("idealSub")}</div>`;
  if(!SG.some(r=>(r.ideal||0)>0)) h+=`<div class="warnbox" style="background:none">${t("idealNone")}</div>`;
  if(rows.length) h+=tbl([{h:t("product")},{h:t("idealCol")+" · "+t("pieces")},
                          {h:t("chefCol")+" · "+t("pieces")},{h:t("whyCol"),wrap:true}],
      rows.map(r=>[esc(r.product), r.ideal?`<b>${n0(r.ideal)}</b>`:dash(null),
                   r.chef?n0(r.chef):dash(null), (r.ideal||0)>0?drv(r.driver):""]));
  if(P.pcs!=null) h+=`<div class="src">${t("idealTot",{p:n0(P.pcs), h:n0(P.hours)})}</div>`;
  return h+`</div>`;
}

/* Half, Fingers and Large Bites by filling: what sales asked for, and any boxes booked
   with no filling behind them, flagged - the chef cannot make "Half" without knowing which. */
function fillBlock(){
  const F=D.fill||{}, BX=F.boxes||{}, names=Object.keys(BX);
  if(!names.length) return "";
  const rq=(F.requests||[]).map(r=>dmy(r.from)+" \u2192 "+dmy(r.to)).join(" \u00b7 ");
  let h=`<h3>${t("fillTitle")}</h3><div class="card">
    <div class="src" style="margin:0 0 8px">${t("fillUntil",{d:dmy(F.until)})} \u00b7 ${t("boxes")}</div>`;
  names.forEach(b=>{
    const x=BX[b], rows=Object.entries(x.flav||{}).filter(([,v])=>v>=0.5)
      .sort((a,c)=>c[1]-a[1]).map(([f,v])=>[esc(f), n0(v)]);
    if(Math.round(x.unknown)>=1)
      rows.push([`<span class="pill p-bad">${t("fillNeed")}</span>`, `<b style="color:var(--bad)">${n0(x.unknown)}</b>`]);
    h+=`<div class="lbl" style="margin-top:10px">${esc(b)} \u00b7 ${n0(x.ordered)} ${t("boxes")}</div>`
      + tbl([{h:t("flavour"),wrap:true},{h:t("boxes")}], rows);
  });
  h+=`<div class="src">${rq ? t("fillSub",{r:rq}) : t("fillNone")}</div>`;
  return h+`</div>`;
}

/* What if: a special order weighed before it is accepted - against the month's target,
   what sales have already booked, the stock on hand, and the hours the floor has.
   Everything is the page's own arithmetic on figures from the files, and says so. */
const TRY={box:null, n:"", date:"", mode:"box", prod:null};
const WINTER_BOX=12;           // Winter Box: marshmallow macarons, 12 to a box
const MAIN_UNIT={Classic:"Big 30",Kingdom:"Big 24",Mini:"Mini",Coins:"Coins",Half:"Half",
  Origin:"Origin",Fingers:"Fingers",Cake:"Cake","Ice Cream":"Ice Cream"};
const trySizes=()=>Object.assign({}, (D.ob&&D.ob.pcs)||{}, {"Winter Box":WINTER_BOX});
const PROD_OF={"Big 30":"Classic","Big 12":"Classic","Big 6":"Classic","Large Bites":"Classic",
  "Classic pcs loose":"Classic","Big 24":"Kingdom","Kingdom pcs loose":"Kingdom",
  "Mini Raspberry loose":"Mini","Winter Box":"Winter"};
const prodOf=b=>PROD_OF[b]||b;
const WDAY=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function isoPlus(iso,k){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+k);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isOff(iso){ const off=(D.dayoff||[]).map(x=>String(x||"").trim().toLowerCase()).filter(Boolean);
  return off.includes(WDAY[new Date(iso+"T00:00:00").getDay()]); }
function tryCalc(){
  const sz=trySizes(), pm=TRY.mode==="pcs", box=TRY.box, qty=Math.max(0,+TRY.n||0);
  if((pm?!TRY.prod:!box)||!qty||!TRY.date) return null;
  const pcs=pm ? qty : qty*(sz[box]||1), q=pm ? TRY.prod : prodOf(box);
  const hpk0=(D.fc&&D.fc.hpk)||0;
  /* pieces only: take out the share of this product's time the model spends packing */
  let share=1;
  if(pm){ const R=D.rates||{}, mk=(R.make||{})[q], u=MAIN_UNIT[q], pk=u?(R.pack||{})[u]:null, s=u?sz[u]:null;
    if(mk && pk && s) share=mk/(mk+pk/s); }
  const hpkNew=hpk0*share, hpk=hpk0, cap=(D.day&&D.day.capacity_h)||D.available_h||0;
  const staff=(D.day&&D.day.staff_n)||(D.fc&&D.fc.crew)||1, rate=(D.fc&&D.fc.rate)||13.7;
  const t0=todayIso(), days=[];
  for(let k=1;k<150;k++){ const iso=isoPlus(t0,k); if(iso>=TRY.date) break; if(!isOff(iso)) days.push(iso); }
  const n=days.length;
  if(!n) return {n:0};
  const first=isoPlus(t0,2), ord={};
  ((D.ob&&D.ob.days)||[]).forEach(x=>{ if(x.date>=first && x.date<=TRY.date)
    for(const b in x.by){ const p=prodOf(b); ord[p]=(ord[p]||0)+x.by[b]*(sz[b]||1); } });
  const M=D.mtarget||{}, dl=M.days_left||((D.month||{}).days_left)||0;
  const stock={};
  ((D.plan||{}).flavours||[]).forEach(f=>{ const p=f.counts||f.product;
    stock[p]=(stock[p]||0)+(f.stock||0)+(f.cstock||0); });
  const names=new Set([...(M.pieces||[]).map(r=>r.product), ...Object.keys(ord)]);
  const rows=[...names].map(p=>{
    const pr=(M.pieces||[]).find(r=>r.product===p)||{};
    const pace=dl ? Math.max(0,pr.left||0)/dl*Math.min(n,dl) : 0;
    const o=ord[p]||0, s=stock[p]||0;
    return {p, pace, o, s, must:Math.max(0,Math.max(pace,o)-s)};
  }).filter(r=>r.pace||r.o||r.s);
  const booked=rows.reduce((a,r)=>a+r.must,0)*hpk/1000, capH=n*cap, free=capH-booked;
  const qr=rows.find(r=>r.p===q)||{pace:0,o:0};
  const spare=Math.max(0,(stock[q]||0)-Math.max(qr.pace,qr.o));
  const make=Math.max(0,pcs-spare), needH=make*hpkNew/1000;
  const over=Math.max(0, needH-Math.max(0,free)), perP=over/(n*staff);
  // the box against its own month target: packed so far + booked to month end + this
  const mr=(M.rows||[]).find(r=>r.box===box)||{}, mon=String(M.month||"").slice(0,7);
  let rest=0; ((D.ob&&D.ob.days)||[]).forEach(x=>{ if(x.date.slice(0,7)===mon) rest+=(x.by[box]||0); });
  const pr=(M.pieces||[]).find(r=>r.product===q)||{};
  return {n, pcs, q, hpk, hpkNew, share, pm, pr, capH, booked, free, spare:Math.min(spare,pcs), make, needH, over, perP,
          cost:over*rate, rows, mr, rest, qty, base:Math.max(0,-free)};
}

/* One card the chef can be sent instead of the target table: what is finished (stop),
   which flavours still need making, and which boxes still need packing - with, for each
   box, whether the pieces already exist (pack only / coat then pack) or must be made.
   Month target against what is done so far; nothing here is today's plan. */
function guideHtml(){
  const M=D.mtarget||{}, P=D.plan||{flavours:[],boxes:[]}, dl=M.days_left||0;
  const stop=[], prod=[], pack=[];
  (M.flavours||[]).filter(x=>x.target).forEach(x=>{
    const d=(x.made||0)-x.target;
    if(d>=0) stop.push({n:x.flavour,d,u:t("pieces")});
    else prod.push({n:x.flavour,left:-d,day:dl?Math.ceil(-d/dl):null}); });
  (M.rows||[]).filter(x=>x.target).forEach(x=>{
    const d=(x.packed||0)-x.target;
    if(d>=0){ stop.push({n:x.box,d,u:t("boxes")}); return; }
    pack.push({n:x.box,left:-d,day:dl?Math.ceil(-d/dl):null,
               sp:boxSplit({box:x.box,plan:0,actual:0},-d,P)}); });
  prod.sort((a,b)=>b.left-a.left); pack.sort((a,b)=>b.left-a.left);
  const red=v=>`<b dir="ltr" style="color:var(--bad);white-space:nowrap">\u2212${n0(v)}</b>`;
  const how=sp=>{
    if(!sp) return `<span class="muted">${t("splitNone")}</span>`;
    const parts=[];
    if(!sp.make && !sp.coat) return `<span style="color:var(--ok)">${t("gReady")}</span>`;
    if(sp.ready) parts.push(t("splitReady",{n:n0(sp.ready)}));
    if(sp.coat) parts.push(`<span style="color:var(--warn)">${t("gCoat",{n:n0(sp.coat)})}</span>`);
    if(sp.make) parts.push(`<b style="color:var(--bad)">${t("gMake",{p:n0(sp.pcs)})}</b>${
      sp.flav&&sp.flav.length?`<div dir="ltr" class="muted" style="font-size:11px;text-align:start">${esc(sp.flav.join(", "))}</div>`:""}`);
    return parts.join(" \u00b7 ");
  };
  let h=`<div class="card" id="guide"><div class="src" style="margin:0 0 10px">${
    t("gHead",{d:dmy(todayIso()),n:n0(dl)})}</div>`;
  /* a table, not chips: English names inside Arabic chips came out of the PDF with the
     words drawn on top of each other */
  h+=`<div class="lbl" style="color:var(--ok)">${t("gStop")}</div>`+(stop.length?tbl(
      [{h:t("gItem"),wrap:true},{h:t("gOver")}],
      stop.map(x=>[`\u2713 ${esc(x.n)}`,`<b dir="ltr" style="color:var(--ok);white-space:nowrap">+${n0(x.d)}</b> <span class="unit">${x.u}</span>`]))
      :`<div class="muted">${t("gNone")}</div>`)+`<div style="height:14px"></div>`;
  h+=`<div class="lbl" style="color:var(--bad)">${t("gProd")}</div>`+(prod.length?tbl(
      [{h:t("flavour"),wrap:true},{h:t("gLeft")+" \u00b7 "+t("pieces")},{h:t("gPerDay")}],
      prod.map(x=>[esc(x.n),red(x.left),x.day==null?dash(null):n0(x.day)])):`<div class="muted">${t("gNone")}</div>`);
  h+=`<div class="lbl" style="color:var(--bad);margin-top:14px">${t("gPack")}</div>`+(pack.length?tbl(
      [{h:t("box")},{h:t("gLeft")+" \u00b7 "+t("boxes")},{h:t("gPerDay")},{h:t("gHow"),wrap:true}],
      pack.map(x=>[esc(x.n),red(x.left),x.day==null?dash(null):n0(x.day),how(x.sp)])):`<div class="muted">${t("gNone")}</div>`);
  h+=`<div class="src">${t("gNote")}</div></div>`;
  return h;
}

/* ================================================================== *
 *  Quality.                                                          *
 *                                                                    *
 *  The reports live in a private Google Sheet and the only way in is  *
 *  the Apps Script, which wants the manager code. That code is asked  *
 *  for here and kept in this browser: it is never built into the      *
 *  page, because the page is public and anyone holding the link would *
 *  otherwise hold the code too.                                       *
 *                                                                    *
 *  The request is a plain POST with a text/plain content type - the   *
 *  same shape the QC page itself uses - because Apps Script answers   *
 *  no CORS preflight, and any other content type triggers one.        *
 * ================================================================== */
var QC = { code: null, reports: null, state: "idle", err: "", days: 7, emp: "" };
try { QC.code = localStorage.getItem("erm-qccode"); } catch (e) {}

function qcPost(body, ms){
  /* A request that never answers used to leave a button disabled for good, and the
     page looked dead. With a limit it fails, and says so. */
  const ctl = (ms && typeof AbortController!=="undefined") ? new AbortController() : null;
  const tm = ctl ? setTimeout(()=>ctl.abort(), ms) : null;
  return fetch(QC_API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                         body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
    .then(r=>r.json())
    .finally(()=>{ if(tm) clearTimeout(tm); });
}

function qcLoad(){
  if(!QC_API){ QC.state="noapi"; render(); return; }
  QC.state="loading"; QC.err="";
  // pull a wide window once and filter in the page: the backend round trip is the
  // slow part, and changing the filter should not pay for it again.
  const to=new Date(), from=new Date(to.getTime()-90*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  qcPost({action:"list", managerCode:QC.code, from:iso(from), to:iso(to)})
    .then(res=>{
      if(res && res.ok){ QC.reports=res.reports||[]; QC.sheetUrl=res.sheetUrl||""; QC.state="ready"; }
      else { QC.state="gate"; QC.err=(res&&res.error==="bad_code")?t("qcBad"):(res&&res.error)||t("qcFail");
             QC.code=null; try{localStorage.removeItem("erm-qccode");}catch(e){} }
      render();
    })
    .catch(e=>{ QC.state="gate"; QC.err=t("qcFail")+" — "+e.message; render(); });
}

const QCSEC = s => t("qcSec"+(s||"").charAt(0).toUpperCase()+(s||"").slice(1)) || s;
/* Inside a report the checklist items carry their own section name from the catalogue
   (before, after, receiving, cold, freezer, safety, preventive, facility, weekly), so
   they are grouped by it rather than dumped as one long list. */
const CHKSEC = id => t("chk_"+(id||"other")) || id;

/* Everything that is a SUGGESTION rather than a fact lives here, kept together and
   labelled as proposals - on the overview these were read as decisions already taken.

   Was a page of its own. The three plans and the headcount question answer "what
   should today be", which is the question Today's plan asks - so they live at the
   foot of it now rather than one tap away. */
let OPENPLAN=null;
window.planOpen=function(n){ OPENPLAN = OPENPLAN===n ? null : n; render(); };
function planDetail(name){
  const key = name==="A" ? "a" : name==="B" ? "b" : "ideal";
  const SG=(D.sugg&&D.sugg.rows)||[], PK=(D.sugg&&D.sugg.pack)||[];
  const FL=((D.plan||{}).flavours)||[], FT=((D.mtarget||{}).flavours)||[];
  let h=`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">`;
  /* make: each product's figure split into fillings */
  h+=`<div class="lbl">${t("pdMake")}</div>`;
  let any=false;
  SG.forEach(r=>{
    const q=Math.round(r[key]||0); if(q<=0) return; any=true;
    const fl=FL.filter(f=>(f.counts||f.product)===r.product), out={};
    let rest=q;
    fl.forEach(f=>{ const s=Math.min(rest, Math.max(0, Math.round(f.sugg||0)));
      if(s>0){ out[f.flavour]=(out[f.flavour]||0)+s; rest-=s; } });
    if(rest>0){
      const w=fl.map(f=>{ const x=FT.find(y=>y.flavour===f.flavour); return [f.flavour, x?Math.max(0,x.left||0):0]; });
      const W=w.reduce((a,[,v])=>a+v,0);
      if(W>0) w.forEach(([n,v])=>{ if(v>0) out[n]=(out[n]||0)+rest*v/W; });
      else out[r.product+" "+t("pdAny")]=(out[r.product+" "+t("pdAny")]||0)+rest;
    }
    const rows=Object.entries(out).filter(([,v])=>v>=0.5).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[esc(n), n0(v)]);
    h+=group(r.product, q, t("pieces"), rows, [{h:t("flavour"),wrap:true},{h:t("pieces")}], true);
  });
  if(!any) h+=`<div class="muted">${t("pdNothing")}</div>`;
  /* pack: the same for every plan - today's deliveries */
  const pk=PK.filter(x=>(x.pack||0)>0);
  if(pk.length) h+=`<div class="lbl" style="margin-top:12px">${t("pdPack")}</div>`+tbl(
    [{h:t("box")},{h:t("boxes")}], pk.map(x=>[esc(x.box), `<b>${n0(x.pack)}</b>`]),
    [t("totalRow"), n0(pk.reduce((a,x)=>a+x.pack,0))]);
  /* ganache: two days ahead of delivery, so today's ganache serves the day after tomorrow */
  const d2=isoPlus(isoOf(D.today&&D.today.date)||todayIso(), 2), sz=(D.ob&&D.ob.pcs)||{}, g={};
  ((D.ob&&D.ob.days)||[]).filter(x=>x.date===d2).forEach(x=>{ for(const b in x.by){
    const p=prodOf(b); if(p==="Ice Cream") continue; g[p]=(g[p]||0)+x.by[b]*(sz[b]||1); } });
  const gr=Object.entries(g).filter(([,v])=>v>0);
  if(gr.length) h+=`<div class="lbl" style="margin-top:12px">${t("pdGanache")} · ${dmy(d2)}</div>`+tbl(
    [{h:t("product")},{h:t("pieces")}], gr.map(([p,v])=>[esc(p), n0(v)]),
    [t("totalRow"), n0(gr.reduce((a,[,v])=>a+v,0))]);
  return h+`<div class="src">${t("pdNote")}</div></div>`;
}

  let h=`<h3>${t("ideasHead")}</h3><div class="card">`;
  h+=`<div class="lbl" style="margin:0 0 2px">${t("focus")}</div>
      <div class="src" style="margin:0 0 8px">${t("focusSub")}</div>`;

      ${i.hours?`<span class="muted">${n0(i.hours)} ${t("hours")}</span>`:""}</div>`);

         (p.pcs===0&&(p.boxes||0)>0)?`<span class="sub2">${t("nothingToMake")}</span>`:""

    h+=`<h3>${t("sensTitle")}</h3><div class="card">

  return h;

function viewMat(){
  const M=(D.materials||[]);
  const ms=D.saved&&D.saved.mat, mage=ms?Math.floor((Date.now()-new Date(ms))/864e5):null;
  const stampM = ms ? `<div class="card"><div class="src" style="margin:0">${t("matSaved",{t:clock(ms)})}${
      mage>3?` <b style="color:var(--warn)">${t("matOld",{n:n0(mage)})}</b>`:""}</div></div>` : "";
  if(!M.length) return stampM+`<div class="card"><div class="muted">${t("matOk")}</div>
    <div class="src">${t("matNote")}</div></div>`;
  /* Packaging is counted once a week, raw materials and consumables daily. Mixed in one
     list, a week-old packaging count read as today's shortage - so the counters and the
     main list are the daily tabs only, and packaging sits apart, folded, with its own date. */
  const P=M.filter(x=>x.tab==="Packaging"), MD=M.filter(x=>x.tab!=="Packaging");
  const neg=MD.filter(x=>x.negative), low=MD.filter(x=>!x.negative);
  const rows=list=>tbl(
    [{h:t("matItem"),wrap:true},{h:t("matUnit")},{h:t("matLeft")},{h:t("matNeed")},{h:t("matAct")}],
    list.map(x=>[
      `${esc(x.item)}<span class="sub2">${esc(x.tab)}</span>`,
      `<span class="muted">${esc(x.unit)}</span>`,
      x.left==null?dash(null)
        :`<b style="color:${x.negative?"var(--bad)":"var(--warn)"}">${n1(x.left)}</b>`,
      x.need==null?dash(null):n1(x.need),
      x.action?`<span class="pill ${/make|need/i.test(x.action)?"p-bad":"p-ok"}">${esc(x.action)}</span>`:""]));
  let h=stampM+`<div class="card"><div class="row">
      <div><div class="lbl">${t("matNeg")}</div>
        <div class="big" style="color:${neg.length?"var(--bad)":"var(--ok)"}">${n0(neg.length)}</div></div>
      <div><div class="lbl">${t("matLow")}</div>
        <div class="big" style="color:${low.length?"var(--warn)":"var(--ok)"}">${n0(low.length)}</div></div>
    </div></div>`;
  /* Grouped by what the thing IS - chocolate is not a cardboard box and does not get
     reordered the same way - and inside each group the worst line is first, because the
     order within a kind is the order of danger. */
  const KIND={"Raw Materials":"matRaw","Consumables":"matCons","Packaging":"matPack"};
  (D.mat_groups||Object.keys(KIND)).filter(g=>g!=="Packaging").forEach(g=>{
    const inG=MD.filter(x=>x.tab===g);
    if(!inG.length) return;
    const nneg=inG.filter(x=>x.negative).length;
    h+=`<h3>${t(KIND[g]||"matLow")} <span class="n">${inG.length}</span></h3>
      <div class="card">
        <div class="src" style="margin:0 0 8px">${t("matWorst")}${
          nneg?` · <b style="color:var(--bad)">${n0(nneg)} ${t("matNeg").toLowerCase()}</b>`:""}</div>
        ${rows(inG)}</div>`;
  });
  if(P.length){
    const pc=D.pack_count_date, pnn=P.filter(x=>x.negative).length;
    h+=`<h3>${t("matPack")} · ${t("matWeekly")} <span class="n">${P.length}</span></h3>
      <div class="card"><details><summary class="src" style="margin:0;cursor:pointer">${
        pc?t("matPackAt",{d:longDay(pc)})+" "+dayBadge(pc):t("matPackNone")}${
        pnn?` · <b style="color:var(--bad)">${n0(pnn)} ${t("matNeg").toLowerCase()}</b>`:""} · ${t("matShow")}</summary>
        <div style="margin-top:8px">${rows(P)}</div></details></div>`;
  }
  h+=`<div class="card"><div class="src">${t("matNote")}</div></div>`;
  return h;
}

function viewQc(){
  if(!QC_API) return `<div class="card"><div class="warnbox">${t("qcNoApi")}</div></div>`;
  if(QC.state==="loading") return `<div class="card"><div class="muted">${t("qcLoading")}</div></div>`;
  if(QC.state!=="ready"){
    return codeGate(t("qcGateSub"));
  }

  const R=QC.reports||[];
  const days=[...new Set(R.map(r=>r.date))].sort().reverse();
  const latest=days[0];
  const today=R.filter(r=>r.date===latest);
  let h="";

  /* ---- the latest check ---- */
  h+=`<h3>${t("qcToday")} ${latest?`<span class="n">${esc(dmy(latest))}</span>`:""}</h3>`;
  if(!today.length){
    h+=`<div class="card"><div class="muted">${t("qcNoToday")}</div></div>`;
  } else {
    h+=today.map(r=>`<div class="card"><div class="row">
        <div><div class="lbl">${t("qcBy")}</div><div class="mid">${esc(r.employee)}</div></div>
        <div><div class="lbl">${t("qcShift")}</div><div class="mid">${
          r.shift==="evening"?t("qcEvening"):t("qcMorning")}</div></div>
        <div><div class="lbl">${t("qcDone")}</div><div class="mid">${n0(r.done)}<span class="unit">/${n0(r.total)}</span></div></div>
        <div><div class="lbl">${t("qcIssues")}</div><div class="big" style="color:${
          r.issues?"var(--bad)":"var(--ok)"}">${n0(r.issues)}</div></div>
      </div>${r.notes?`<div class="muted" style="margin-top:9px">${esc(r.notes)}</div>`:""}</div>`).join("");
  }

  /* ---- what failed ---- */
  const bad=[];
  const SECOF = k => k==="units" ? "temperature"
                   : k==="zones" ? "cleanliness"
                   : k==="hyg"   ? "hygiene" : "checks";
  R.forEach(r=>["units","zones","hyg","checks"].forEach(k=>(r.items&&r.items[k]||[]).forEach(it=>{
    if(it.status==="bad") bad.push({d:r.date, who:r.employee, sec:SECOF(k), it:it});
  })));
  const badToday=bad.filter(b=>b.d===latest);
  h+=`<h3>${t("qcOpen")} <span class="n">${badToday.length}</span></h3><div class="card">`;
  h+= badToday.length ? tbl([{h:t("qcSection")},{h:t("qcItem"),wrap:true},{h:t("qcNote"),wrap:true},{h:t("qcBy")}],
        badToday.map(b=>[QCSEC(b.sec), esc(L==="ar"?(b.it.ar||b.it.en):(b.it.en||b.it.ar)),
                         `<span class="muted">${esc(b.it.note||"")}</span>`, esc(b.who)]))
    : `<div class="muted">${t("qcNoOpen")}</div>`;
  h+=`</div>`;

  /* ---- temperatures past their limit ---- */
  const hot=[];
  today.forEach(r=>(r.items&&r.items.units||[]).forEach(u=>{
    if(u.temp==null||u.limit==null) return;
    const over=(u.type==="freezer") ? (u.temp>u.limit) : (u.temp>u.limit);
    if(over) hot.push({u:u, who:r.employee});
  }));
  h+=`<h3>${t("qcTemps")} <span class="n">${hot.length}</span></h3><div class="card">`;
  h+= hot.length ? tbl([{h:t("qcItem"),wrap:true},{h:t("qcReading")},{h:t("qcLimit")},{h:t("qcOver")}],
        hot.map(x=>[esc(L==="ar"?(x.u.ar||x.u.en):(x.u.en||x.u.ar)),
                    `<b style="color:var(--bad)">${n1(x.u.temp)}°</b>`, n1(x.u.limit)+"°",
                    `<span class="ou dn">${n1(x.u.temp-x.u.limit)}°</span>`]))
    : `<div class="muted">${t("qcNoTemps")}</div>`;
  h+=`</div>`;

  /* ---- the filter, then every report, each one openable ---- */
  // Seven days by default. The fetch brings ninety, but a page that opens on three
  // months of checks buries today's under scrolling, and today's is the one that
  // matters most mornings.
  const chip=(v,lbl)=>`<button class="opt" style="display:inline-block;width:auto;
      margin:0 6px 0 0;padding:6px 12px;font-size:12.5px;${
      QC.days===v?"border-color:var(--green);background:var(--okbg)":""}"
      onclick="qcSetDays(${v})">${lbl}</button>`;
  const names=[...new Set((QC.reports||[]).map(r=>r.employee))].sort();
  h+=`<h3>${t("qcFilter")}</h3><div class="card">
    <div>${chip(7,t("qcLast7"))}${chip(30,t("qcLast30"))}${chip(0,t("qcAll"))}</div>
    <div style="margin-top:10px">
      <select onchange="qcSetEmp(this.value)" style="width:100%;padding:9px 11px;
        border:1.5px solid var(--line);border-radius:10px;background:var(--bg);
        color:var(--ink);font:inherit">
        <option value=""${QC.emp?"":" selected"}>${t("qcAllEmp")}</option>
        ${names.map(nm=>`<option value="${esc(nm)}"${QC.emp===nm?" selected":""}>${esc(nm)}</option>`).join("")}
      </select></div></div>`;

  const cut = QC.days ? new Date(Date.now()-QC.days*864e5).toISOString().slice(0,10) : "0000-00-00";
  const shown = R.filter(r=>r.date>=cut && (!QC.emp || r.employee===QC.emp));

  /* per-employee summary, over the filtered window */
  const byEmp={};
  shown.forEach(r=>{ const e=byEmp[r.employee]=byEmp[r.employee]||{n:0,iss:0,last:""};
                     e.n++; e.iss+=(r.issues||0); if(r.date>e.last) e.last=r.date; });
  const emps=Object.entries(byEmp).sort((a,b)=>b[1].n-a[1].n);
  if(emps.length){
    h+=`<h3>${t("qcByEmp")}</h3><div class="card">`+tbl(
        [{h:t("qcBy")},{h:t("qcChecks")},{h:t("qcIssues")},{h:t("qcLast")}],
        emps.map(([nm,e])=>[
          `<a href="#" onclick="qcSetEmp('${esc(nm).replace(/'/g,"\\'")}');return false;">${esc(nm)}</a>`,
          n0(e.n),
          e.iss?`<span class="ou dn">${n0(e.iss)}</span>`:`<span class="ou up">0</span>`,
          esc(dmy(e.last))]))
      +`</div>`;
  }

  /* every report in the window, each opening on the checklist as it was filled */
  h+=`<h3>${t("qcReports")} <span class="n">${shown.length}</span></h3>`;
  h+= shown.length ? shown.map(r=>{
        const secs=[["checks","checks"],["units","temperature"],
                    ["zones","cleanliness"],["hyg","hygiene"]];
        let inner="";
        secs.forEach(([k,sec])=>{
          const list=(r.items&&r.items[k])||[];
          if(!list.length) return;
          /* The checklist is long enough that one flat table is unreadable, so it is
             grouped by the catalogue's own sections - the same grouping the person saw
             while filling it in. */
          if(k==="checks"){
            const order=[], byS={};
            list.forEach(it=>{ const g=it.section||"other";
                               if(!byS[g]){ byS[g]=[]; order.push(g); } byS[g].push(it); });
            order.forEach(g=>{
              const done=byS[g].filter(x=>x.status).length, badN=byS[g].filter(x=>x.status==="bad").length;
              inner+=`<div class="lbl" style="margin:10px 0 4px">${esc(CHKSEC(g))}
                 <span class="muted">${done}/${byS[g].length}${badN?" · "+badN+" \u2717":""}</span></div>`
                + tbl([{h:t("qcItem"),wrap:true},{h:""},{h:t("qcNote"),wrap:true}],
                    byS[g].map(it=>[
                      esc(L==="ar"?(it.ar||it.en):(it.en||it.ar)),
                      it.status==="ok" ?`<span class="pill p-ok">${t("qcStatusOk")}</span>`
                       :it.status==="bad"?`<span class="pill p-bad">${t("qcStatusBad")}</span>`
                       :`<span class="muted">\u2014</span>`,
                      `<span class="muted">${esc(it.note||"")}</span>`]));
            });
            return;
          }
          inner+=`<div class="lbl" style="margin:10px 0 4px">${QCSEC(sec)}</div>`
            + tbl([{h:t("qcItem"),wrap:true},
                   ...(k==="units"?[{h:t("qcReading")},{h:t("qcLimit")}]:[]),
                   {h:""},{h:t("qcNote"),wrap:true}],
                list.map(it=>[
                  esc(L==="ar"?(it.ar||it.en):(it.en||it.ar)),
                  ...(k==="units"?[
                      it.temp==null?dash(null)
                        :`<b style="color:${it.status==="bad"?"var(--bad)":"var(--ink)"}">${n1(it.temp)}°</b>`,
                      it.limit==null?dash(null):n1(it.limit)+"°"]:[]),
                  it.status==="ok" ?`<span class="pill p-ok">${t("qcStatusOk")}</span>`
                   :it.status==="bad"?`<span class="pill p-bad">${t("qcStatusBad")}</span>`
                   :`<span class="muted">${t("qcStatusNone")}</span>`,
                  `<span class="muted">${esc(it.note||"")}</span>`]));
        });
        return `<details class="grp">
          <summary><span class="caret">❯</span>
            <span class="gname">${esc(dmy(r.date))} · ${esc(r.employee)}</span>
            <span class="muted">${r.shift==="evening"?t("qcEvening"):t("qcMorning")}</span>
            <span class="gnum">${n0(r.done)}<span class="unit">/${n0(r.total)}</span></span>
            <span class="pill ${r.issues?"p-bad":"p-ok"}">${n0(r.issues)}</span>
          </summary>
          <div class="inner">
            ${r.notes?`<div class="muted" style="margin:6px 0">${esc(r.notes)}</div>`:""}
            ${inner||`<div class="muted">${t("qcStatusNone")}</div>`}
            <div class="src">${t("qcOpenFull")} · ${t("qcFetched")} ${esc(String(r.submittedAt).slice(11,16))}</div>
          </div></details>`;
      }).join("")
    : `<div class="card"><div class="muted">${t("qcNone")}</div></div>`;

  /* ---- the last fortnight ---- */
  h+=`<h3>${t("qcTrend")}</h3><div class="card">
      <div class="chartbox"><canvas id="c-qc"></canvas></div>
      <div class="src">${QC.sheetUrl?`<a href="${esc(QC.sheetUrl)}" target="_blank" rel="noopener">${t("qcSheet")}</a> · `:""}
      <a href="#" onclick="qcForget();return false;">${t("qcForget")}</a></div></div>`;
  return h;
}

function qcChart(){
  const R=QC.reports||[]; if(!R.length) return;
  const by={};
  R.forEach(r=>{ const d=by[r.date]=by[r.date]||{done:0,total:0,iss:0};
                 d.done+=r.done||0; d.total+=r.total||0; d.iss+=r.issues||0; });
  const days=Object.keys(by).sort().slice(-14);
  chart("c-qc",{data:{labels:days.map(d=>dmy(d)),
    datasets:[
      {type:"bar",label:t("qcIssues"),data:days.map(d=>by[d].iss),
       backgroundColor:css("--red"),borderRadius:4,yAxisID:"y"},
      {type:"line",label:t("qcPctDone"),yAxisID:"y1",
       data:days.map(d=>by[d].total?Math.round(100*by[d].done/by[d].total):null),
       borderColor:css("--teal"),tension:.3,pointRadius:2.5,fill:false}]},
    options:{plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
      scales:{y:{beginAtZero:true},
              y1:{position:"right",beginAtZero:true,suggestedMax:100,
                  grid:{drawOnChartArea:false},ticks:{callback:v=>v+"%"}}}}});
}


/* ================================================================== *
 *  The last seven days.                                              *
 *                                                                    *
 *  Until now the page could show today's plan and the last shift's   *
 *  output, and nothing in between: the question "did the week do     *
 *  what it said it would" had no page to be asked on.                *
 *                                                                    *
 *  Two sources, kept apart on purpose. PLANNED is the page's own      *
 *  daily copy of the plan column, because the workbook clears that    *
 *  column every morning and after today nothing else remembers it.    *
 *  Everything else comes from the Actual Log, which the chef          *
 *  corrects and which is therefore final. Where the flavour snapshot  *
 *  disagrees with the log - it was taken mid-afternoon, the chef kept *
 *  working - the log wins and the snapshot says what time it was      *
 *  taken, rather than the two being quietly averaged into a number    *
 *  that is nobody's.                                                 *
 * ================================================================== */
/* The workbook writes this column in English, and it went straight onto the Arabic
   page - the same fault as the finish note, found the same way, an hour apart. The
   cell is a verdict out of a fixed set, so it is matched and re-said; anything the
   sheet starts writing that is not in the set passes through unchanged rather than
   disappearing. */
function reading(v){
  const x=String(v||"").toLowerCase();
  if(!x) return "";
  if(x.indexOf("too low")>=0)  return t("rdLow");
  if(x.indexOf("too high")>=0) return t("rdHigh");
  if(x.indexOf("within")>=0)   return t("rdOk");
  return v;
}

/* ---------------- Delays: which closed days missed the plan, and why ----------------
   Reads d.delays (builder 3b). "Late" is the file's own rule, not a new one, so the page
   and the sheet's "days that still need a reason" can never disagree. */
const LATE={all:false};
const RS_AR={"Ingredient out of stock":"مادة خام نفدت","Delivery arrived late":"توريد متأخر",
 "Packaging or boxes not available":"تغليف أو بوكسات غير متوفرة","Machine breakdown":"عطل آلة",
 "Unplanned maintenance":"صيانة غير مخطّطة","Staff absent":"غياب موظفين","Short-handed on the day":"نقص عمالة في اليوم",
 "New worker still being trained":"موظف جديد تحت التدريب","Batch reworked":"دفعة أُعيد عملها","Batch scrapped":"دفعة أُتلفت",
 "The plan was bigger than the day could carry":"الخطة أكبر من طاقة اليوم","Order changed during the day":"تغيّر الطلب أثناء اليوم",
 "Urgent order added":"أُضيف طلب عاجل","Waiting on an earlier step":"انتظار مرحلة سابقة","The plan was below what the day could carry":"الخطة أقل من طاقة اليوم","Power or water cut":"انقطاع كهرباء أو ماء",
 "Outside our control - see notes":"خارج إرادتنا (انظر الملاحظة)"};
const CAT_AR={Material:"مواد",Machine:"معدات",People:"عمالة",Quality:"جودة",Planning:"تخطيط",External:"خارجي"};
const trR=x=>L==="ar"?(RS_AR[x]||x):x, trC=x=>L==="ar"?(CAT_AR[x]||x):x;
const trP=x=>x==="Whole day"?t("lWhole"):x;
function lateDay(x){
  const gap=(x.made||0)-(x.plan||0);
  let st;
  if(!x.plan) st=`<span class="pill">${t("lNoPlan")}</span>`;
  else if(!x.recorded) st=`<span class="pill p-bad">${t("lNoRec")}</span>`;
  else if(x.late) st=`<span class="pill ${gap<0?"p-bad":"p-warn"}">${t(gap<0?"lBehind":"lOver",{p:pc(x.miss)})}</span>`;
  else st=`<span class="pill p-ok">${t("lOn")}</span>`;
  const rs=x.reasons||[];
  const why = x.late ? `<span class="pill ${rs.length?"p-ok":"p-bad"}">${t(rs.length?"lHasWhy":"lNoWhy")}</span>`
            : rs.length ? `<span class="pill">${t("lNoted")}</span>` : "";
  const wd=new Date(x.date+"T00:00:00").toLocaleDateString(loc(),{weekday:"long"});
  let h=`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between">
    <div><b>${esc(wd)} ${esc(dmy(x.date))}</b></div><div>${st} ${why}</div></div>`;
  if(x.plan) h+=`<div class="row" style="margin-top:10px">
      <div><div class="lbl">${t("lPlan")}</div><div class="mid">${n0(x.plan)}<span class="unit">${t("pieces")}</span></div></div>
      <div><div class="lbl">${t("lMade")}</div><div class="mid">${x.recorded?n0(x.made):"—"}<span class="unit">${t("pieces")}</span></div></div>
      <div><div class="lbl">${t("lGap")}</div><div class="mid" style="color:${gap<0?"var(--bad)":"var(--ok)"}">${x.recorded?(gap>0?"+":"")+n0(gap):"—"}<span class="unit">${t("pieces")}</span></div></div>
    </div>`;
  const P=x.prods||[], sh=P.filter(p=>p.made<p.plan), ov=P.filter(p=>p.made>p.plan);
  const line=(arr,cls)=>arr.map(p=>`<span class="name">${esc(p.p)} <b style="color:var(${cls})">${p.made>p.plan?"+":""}${n0(p.made-p.plan)}</b> <i class="muted">(${n0(p.made)} / ${n0(p.plan)})</i></span>`).join("");
  if(x.recorded && x.late && sh.length) h+=`<div class="lbl" style="margin-top:10px">${t("lShortP")}</div><div class="names">${line(sh,"--bad")}</div>`;
  if(x.recorded && x.late && ov.length) h+=`<div class="lbl" style="margin-top:8px">${t("lOverP")}</div><div class="names">${line(ov,"--warn")}</div>`;
  const rt=x.ratio;
  h+=`<div class="src" style="margin-top:8px">${rt==null?t("lModelNone")
     : !x.model_off?t("lModelOk",{r:n1(rt)})
     : `<b style="color:var(--warn)">${t(rt<1?"lModelSlow":"lModelFast",{p:pc(Math.abs(1/rt-1))})}</b>`}${
     x.hours?` · ${t("lHrs",{h:n1(x.hours),s:n0(x.staff)})}`:""}</div>`;
  if(rs.length){
    h+=`<div class="lbl" style="margin-top:10px">${t("lReasons")}</div>`;
    h+=rs.map(z=>`<div style="margin:6px 0;padding:8px 10px;border-inline-start:3px solid var(--warn);background:var(--soft,transparent);border-radius:6px">
      <b>${esc(trR(z.reason)||"—")}</b>${z.cat?` <span class="pill">${esc(trC(z.cat))}</span>`:""}
      <span class="muted"> · ${esc(trP(z.prod||""))}${z.where?" · "+esc(z.where):""}</span>
      ${z.what?`<div class="src" style="margin-top:4px">${t("lChef")}: “${esc(z.what)}”</div>`:""}</div>`).join("");
  }
  if(x.note && x.note!=="None") h+=`<div class="src">${t("lLogNote")}: ${esc(x.note)}</div>`;
  return h+`</div>`;
}
function viewLate(){
  const A=(D.delays||[]).slice().reverse();
  if(!A.length) return `<div class="card"><div class="muted">${t("lNone")}</div></div>`;
  const mo=String(D.today.date||"").slice(0,7);
  const M=A.filter(x=>x.date.slice(0,7)===mo && x.plan);
  const nL=M.filter(x=>x.late).length, nW=M.filter(x=>x.late&&x.reasons.length).length;
  const nM=M.filter(x=>x.model_off).length;
  const cats={}; A.filter(x=>x.date.slice(0,7)===mo).forEach(x=>x.reasons.forEach(z=>{const k=z.reason||z.cat||"—"; cats[k]=(cats[k]||0)+1;}));
  let h=`<h3>${t("lMonth")}</h3><div class="card"><div class="row">
    <div><div class="lbl">${t("lDays")}</div><div class="big">${n0(M.length)}</div></div>
    <div><div class="lbl">${t("lLate")}</div><div class="big" style="color:${nL?"var(--warn)":"var(--ok)"}">${n0(nL)}</div></div>
    <div><div class="lbl">${t("lWhy")}</div><div class="mid">${n0(nW)}</div></div>
    <div><div class="lbl">${t("lNeed")}</div><div class="big" style="color:${nL-nW?"var(--bad)":"var(--ok)"}">${n0(nL-nW)}</div></div>
    <div><div class="lbl">${t("lModel")}</div><div class="mid">${n0(nM)}</div></div></div>`;
  const ck=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
  if(ck.length) h+=`<div class="lbl" style="margin-top:12px">${t("lCats")}</div><div class="names">${
     ck.map(k=>`<span class="name">${esc(trR(k))} <b>${n0(cats[k])}</b></span>`).join("")}</div>`;
  h+=`<div class="src">${t("lRule")}</div></div>`;
  const list=LATE.all?A:A.filter(x=>x.late||x.reasons.length||x.model_off||!x.recorded&&x.plan);
  h+=`<div class="dlgrow" style="margin:8px 0"><button class="go alt" onclick="LATE.all=!LATE.all;render()">${t(LATE.all?"lShowLess":"lShowAll")}</button></div>`;
  h+= list.length ? list.map(lateDay).join("") : `<div class="card"><div class="muted">${t("lAllOk")}</div></div>`;
  return h;
}

/* ---------------- Stations: the Station Sheets, one fold per work area ---------------- */
const ST_AR={"KITCHEN":"المطبخ","KITCHEN (OVEN)":"المطبخ (الفرن)","CHOCOLATE ROOM":"غرفة الشوكولاتة",
  "HALLWAY":"الممر","DISHWASHING AREA":"منطقة غسيل الأطباق","ENTRANCE":"المدخل"};
const stName=x=>{const k=String(x||"").replace(/\s+/g," ").trim(); return L==="ar"?(ST_AR[k]||k):k;};
const stStrip=x=>String(x).replace(/\s*\[also[^\]]*\]/,"").trim();
function stationsBlock(){
  const S=D.stations||[]; if(!S.length) return "";
  let h=`<h3>${t("stTitle")}</h3>`;
  h+=S.map(s=>{
    const ppl=[...new Set([...s.am,...s.pm].map(stStrip))];
    const lab=s.tasks.reduce((a,x)=>a+(x.h||0)*(x.crew||0),0);
    const per=ppl.length?lab/ppl.length:null;
    const prods=[...new Set(s.tasks.map(x=>x.prod).filter(Boolean))];
    const ld=s.load||0, col=ld>1?"var(--bad)":ld>0.85?"var(--warn)":"var(--ok)";
    const nm=list=>list.length?list.map(x=>{const m=/\[also (\d+)\]/.exec(x);
      return `<span class="name">${esc(stStrip(x))}${m?` <i class="muted">${t("stAlso",{n:m[1]})}</i>`:""}</span>`;}).join("")
      :`<span class="muted">${t("stNobody")}</span>`;
    let inner=`<div class="row">
      <div><div class="lbl">${t("stPeople")}</div><div class="mid">${n0(ppl.length)}</div></div>
      <div><div class="lbl">${t("stBusy")}</div><div class="mid">${n1(s.busy||0)}<span class="unit">${t("hours")}</span></div></div>
      <div><div class="lbl">${t("stLoad")}</div><div class="mid" style="color:${col}">${pc(ld)}</div></div>
      <div><div class="lbl">${t("stLab")}</div><div class="mid">${n1(lab)}<span class="unit">${t("hours")}</span></div></div>
      <div><div class="lbl">${t("stPer")}</div><div class="mid" style="color:${per>8?"var(--warn)":"inherit"}">${per==null?"—":n1(per)}<span class="unit">${t("hours")}</span></div></div></div>
      <div class="lbl" style="margin-top:10px">${t("stAm")}</div><div class="names">${nm(s.am)}</div>
      <div class="lbl" style="margin-top:6px">${t("stPm")}</div><div class="names">${nm(s.pm)}</div>`;
    inner+= s.tasks.length ? `<div style="margin-top:10px">`+tbl([{h:t("stTask")},{h:t("stProd")},{h:t("stQty")},{h:t("stHrs")},{h:t("stCrew")}],
        s.tasks.map(x=>[esc(x.task),esc(x.prod),x.qty==null?"—":n0(x.qty),n1(x.h||0),x.crew==null?"—":n0(x.crew)]),
        [t("totalRow"),"","",n1(s.tasks.reduce((a,x)=>a+(x.h||0),0)),""])+`</div>`
      : `<div class="muted" style="margin-top:8px">${t("stNoTask")}</div>`;
    if(s.wait.length) inner+=`<div class="lbl" style="margin-top:10px">${t("stWait")}</div><div class="names">${
      s.wait.map(w=>`<span class="name">${esc(w.task)} · ${esc(w.prod)} <i class="muted">${n0(w.min)} ${L==="ar"?"د":"min"}</i></span>`).join("")}</div>`;
    if(s.tied) inner+=`<div class="src">${t("stTied",{h:n1(s.tied)})}</div>`;
    return `<details class="grp"><summary><span class="caret">❯</span>
      <span class="gname">${s.no} · ${esc(stName(s.title))}</span>
      <span class="gnum" style="color:${col}">${pc(ld)}</span><span class="unit">${t("stLoad")}</span>
      <span class="muted">${n0(ppl.length)} ${t("stPeople")}${prods.length?" · "+esc(prods.join(", ")):""}</span></summary>
      <div class="inner">${inner}</div></details>`;
  }).join("");
  return h+`<div class="src">${t("stNote")}</div>`;
}

/* ---------------- Reports: any month or range, from the history (d.rep) ---------------- */
const REP={from:null,to:null};
function repMonths(){ return [...new Set((D.rep||[]).map(x=>x.d.slice(0,7)))].sort().reverse(); }
function repSetMonth(m){ if(!m) return; const [y,mo]=m.split("-").map(Number);
  const last=new Date(y,mo,0).getDate(); REP.from=m+"-01"; REP.to=m+"-"+String(last).padStart(2,"0"); render(); }
function repShift(k){ const ms=repMonths(); if(!ms.length) return; repSetMonth(ms[Math.min(k,ms.length-1)]); }
function repMonthName(m){ return new Date(m+"-01T00:00:00").toLocaleDateString(loc(),{month:"long",year:"numeric"}); }
function viewRep(){
  const ms=repMonths();
  if(!REP.from && ms.length){ const m=ms[0]; const [y,mo]=m.split("-").map(Number);
    REP.from=m+"-01"; REP.to=m+"-"+String(new Date(y,mo,0).getDate()).padStart(2,"0"); }
  const rate=(D.fc&&D.fc.rate)||13.7;
  const curM=(REP.from||"").slice(0,7), whole=REP.from&&REP.to&&REP.from.slice(0,7)===REP.to.slice(0,7)&&REP.from.endsWith("-01");
  let h=`<div class="card repctl">
    <label class="lbl">${t("rpMonth")} <select onchange="repSetMonth(this.value)">
      ${ms.map(m=>`<option value="${m}" ${whole&&m===curM?"selected":""}>${esc(repMonthName(m))}</option>`).join("")}</select></label>
    <label class="lbl">${t("rpFrom")} <input type="date" value="${REP.from||""}" onchange="REP.from=this.value;render()"></label>
    <label class="lbl">${t("rpTo")} <input type="date" value="${REP.to||""}" onchange="REP.to=this.value;render()"></label>
    <button class="go alt" onclick="repShift(0)">${t("rpThis")}</button>
    <button class="go alt" onclick="repShift(1)">${t("rpLast")}</button></div>`;
  const X=(D.rep||[]).filter(x=>x.d>=REP.from && x.d<=REP.to);
  h+=`<div class="src" style="margin:4px 2px 10px"><b>${t("rpRange",{a:dmy(REP.from),b:dmy(REP.to),n:n0(X.length)})}</b>${
     whole?" · "+esc(repMonthName(curM)):""}</div>`;
  if(!X.length) return h+`<div class="card"><div class="muted">${t("rpNone")}</div></div>`;
  const sum=f=>X.reduce((a,x)=>a+(f(x)||0),0);
  const made=sum(x=>x.m), n=X.length;
  const boxOf=x=>Object.entries(x.bb||{}).filter(([k])=>!/loose/i.test(k)).reduce((a,[,v])=>a+v,0);
  const looseOf=x=>Object.entries(x.bb||{}).filter(([k])=>/loose/i.test(k)).reduce((a,[,v])=>a+v,0);
  const boxes=sum(boxOf), loose=sum(looseOf);
  const P=X.filter(x=>x.p), onp=P.filter(x=>Math.abs((x.m||0)-x.p)/x.p<0.10);
  const late=P.filter(x=>Math.abs((x.m||0)-x.p)/x.p>=0.10), expl=late.filter(x=>x.rs&&x.rs.length);
  const pSum=P.reduce((a,x)=>a+x.p,0), pMade=P.reduce((a,x)=>a+(x.m||0),0);
  const sh=sum(x=>(x.s||0)*(x.h||0)), avgS=sum(x=>x.s)/n, ot=sum(x=>x.o);
  const R=X.filter(x=>x.r), rOk=R.filter(x=>x.r>=0.85&&x.r<=1.15);
  const why={}; X.forEach(x=>(x.rs||[]).forEach(z=>{const k=z.r||z.c||t("rpNoWhy"); why[k]=(why[k]||0)+1;}));
  const wk=Object.keys(why).sort((a,b)=>why[b]-why[a]);
  const MT=whole&&D.months?D.months[curM]:null;
  const tile=(l,v,u,sub,c)=>`<div><div class="lbl">${l}</div><div class="big" ${c?`style="color:${c}"`:""}>${v}${u?`<span class="unit">${u}</span>`:""}</div>${sub?`<div class="src" style="margin-top:2px">${sub}</div>`:""}</div>`;
  h+=`<h3>${t("rpHead")}</h3><div class="card"><div class="row">
    ${tile(t("rpMade"),n0(made),t("pieces"),`${n0(made/n)} ${t("rpPerDay")}`)}
    ${tile(t("rpPacked"),n0(boxes),t("boxes"),loose?`+ ${n0(loose)} ${t("rpLoose")}`:"")}
    ${tile(t("rpAdh"),P.length?pc(onp.length/P.length):"—","",t("rpAdhOf",{a:n0(onp.length),b:n0(P.length)}),
        P.length?(onp.length/P.length>=0.8?"var(--ok)":"var(--warn)"):"")}
    ${tile(t("rpHit"),pSum?pc(pMade/pSum):"—","",pSum?`${n0(pMade)} / ${n0(pSum)} ${t("pieces")}`:"")}
  </div><div class="row" style="margin-top:14px">
    ${tile(t("rpLate"),n0(late.length),"",`${n0(expl.length)} ${t("rpExpl")}`,late.length-expl.length?"var(--bad)":"")}
    ${tile(t("rpOt"),n0(ot),t("hours"),`${n1(avgS?ot/avgS:0)} ${t("perHead")}<br>${t("rpOtCost")}: <b>${n0(ot*rate)}</b> ${sar()}`,ot?"var(--warn)":"")}
    ${tile(t("rpProd"),sh?n1(made/sh):"—",t("rpProdU"),`${n0(sh)} ${t("rpHrs")} · ${n1(avgS)} ${t("rpStaff")}`)}
    ${tile(t("rpModel"),R.length?pc(rOk.length/R.length):"—",t("rpModelU"),`${n0(rOk.length)} / ${n0(R.length)}`)}
  </div>`;
  if(whole) h+= MT ? `<div class="row" style="margin-top:14px">
      ${tile(t("rpTarget"),pc((MT.packed_box||0)/(MT.target_box||1)),"",t("rpTargetOf",{a:n0(MT.packed_box),b:n0(MT.target_box),d:dmy(String(MT.at).slice(0,10))}))}
      ${MT.value_target?tile(t("rpValue"),n0(MT.value),sar(),`/ ${n0(MT.value_target)} ${sar()}`):""}</div>`
    : `<div class="src">${t("rpNoTarget")}</div>`;
  if(wk.length) h+=`<div class="src" style="margin-top:10px"><b>${t("rpTopWhy")}:</b> ${esc(trR(wk[0]))} (${n0(why[wk[0]])} ${t("rpCount")})</div>`;
  h+=`</div>`;
  if(wk.length){
    const tot=wk.reduce((a,k)=>a+why[k],0);
    h+=`<h3>${t("rpByWhy")}</h3><div class="card">`+tbl([{h:t("rpWhyC")},{h:t("rpCount")},{h:t("rpShare")}],
      wk.map(k=>[esc(trR(k)),n0(why[k]),pc(why[k]/tot)]));
    const notes=[]; X.forEach(x=>(x.rs||[]).forEach(z=>notes.push([x.d,z])));
    if(notes.length) h+=`<div class="lbl" style="margin-top:10px">${t("rpNotes")}</div>`+tbl(
      [{h:t("rpDay")},{h:t("rpWhyC")},{h:t("lChef")}],
      notes.map(([d,z])=>[esc(dmy(d)), esc(trR(z.r||z.c)||t("rpNoWhy"))+(z.p&&z.p!=="Whole day"?` <span class="sub2">${esc(z.p)}</span>`:""),
        `<span style="white-space:normal">${esc(z.w||"\u2014")}</span>`]));
    h+=`</div>`;
  }
  /* By box and by product. A whole month with a stored target reads the Monthly Targets
     sheet (target, packed, value) - the same source the target is set in. Any other range
     reads the Actual Log and prices it at the month's box price, marked as worked out.
     Boxes and loose pieces are never summed together; money is. */
  const MS=D.months||{}, MKS=Object.keys(MS).sort().reverse();
  const priceOf=bx=>{ for(const m of [curM,...MKS]){ const rr=(MS[m]||{}).rows; const z=rr&&rr.find(q=>q.box===bx);
      if(z&&z.price) return z; } return null; };
  const isLoose=k=>/loose/i.test(k);
  const unitTag=k=>isLoose(k)?` <span class="sub2">${t("pieces")}</span>`:"";
  const MR=whole&&MT&&MT.rows&&MT.rows.length?MT.rows.filter(z=>z.target||z.packed):null;
  h+=`<h3>${t("rpByBox")}</h3><div class="card">`;
  if(MR){
    const tb=MR.filter(z=>!isLoose(z.box));
    h+=tbl([{h:t("box")},{h:t("rpTgt")},{h:t("rpPackedS")},{h:"%"},{h:t("rpVs")},{h:t("rpValP")},{h:t("rpValT")}],
      MR.map(z=>{ const d=(z.packed||0)-(z.target||0);
        return [esc(z.box)+unitTag(z.box), z.target?n0(z.target):"—", n0(z.packed),
          z.target?`<b style="color:${(z.packed||0)>=z.target?"var(--ok)":"var(--bad)"}">${pc((z.packed||0)/z.target)}</b>`:"—",
          z.target?`<span class="ou ${d<0?"dn":"up"}">${d>0?"+":""}${n0(d)}</span>`:"—",
          z.value!=null?n0(z.value):"—", z.value_target?n0(z.value_target):"—"]; }),
      [t("rpBoxesOnly"), n0(tb.reduce((a,z)=>a+(z.target||0),0)), n0(tb.reduce((a,z)=>a+(z.packed||0),0)), "", "",
       n0(MR.reduce((a,z)=>a+(z.value||0),0))+" "+sar(), n0(MR.reduce((a,z)=>a+(z.value_target||0),0))+" "+sar()]);
    h+=`<div class="src">${t("rpBoxNoteM",{d:dmy(String(MT.at).slice(0,10))})}</div>`;
  } else {
    const bb={}; X.forEach(x=>Object.entries(x.bb||{}).forEach(([k,v])=>bb[k]=(bb[k]||0)+v));
    const bbk=Object.keys(bb).sort((a,c)=>bb[c]-bb[a]);
    let vt=0;
    h+=tbl([{h:t("box")},{h:t("rpPackedL")},{h:t("rpPrice")},{h:t("rpValP")}],
      bbk.map(k=>{ const z=priceOf(k), v=z?bb[k]*z.price:null; if(v) vt+=v;
        return [esc(k)+unitTag(k), n0(bb[k]), z?n1(z.price):"—", v==null?"—":`${n0(v)} <span class="sub2">≈</span>`]; }),
      [t("rpBoxesOnly"), n0(bbk.filter(k=>!isLoose(k)).reduce((a,k)=>a+bb[k],0)), "", n0(vt)+" "+sar()]);
    h+=`<div class="src">${t("rpBoxNoteR")}</div>`;
  }
  h+=`</div>`;
  /* pieces: made against what the box target needs, and what the pieces are worth at
     the main box's price per piece - a value of PIECES, which overlaps the boxes'
     value once they are packed, so the two are shown apart and never added */
  const bp={}; X.forEach(x=>Object.entries(x.bp||{}).forEach(([k,v])=>bp[k]=(bp[k]||0)+v));
  const PR=whole&&MT&&MT.pieces&&MT.pieces.length?MT.pieces.filter(z=>z.need||z.made):null;
  const ppc=p=>{ const z=priceOf(MAIN_UNIT[p]||p); return z&&z.pcs?z.price/z.pcs:null; };
  const prods=PR?PR.map(z=>z.product):Object.keys(bp).sort((a,c)=>bp[c]-bp[a]);
  let pv=0, pn=0, pm=0;
  h+=`<h3>${t("rpByProd")}</h3><div class="card">`+tbl(
    PR ? [{h:t("stProd")},{h:t("rpNeed")},{h:t("rpMadeS")},{h:"%"},{h:t("rpMadeL")},{h:t("rpPpc")},{h:t("rpValM")}]
       : [{h:t("stProd")},{h:t("rpMadeL")},{h:t("rpShare")},{h:t("rpPpc")},{h:t("rpValM")}],
    prods.map(p=>{ const z=PR?PR.find(q=>q.product===p):null, mL=bp[p]||0, mm=PR?(z.made||0):mL, pp=ppc(p), v=pp!=null?mm*pp:null;
      if(v) pv+=v; if(z) pn+=z.need||0; pm+=mm;
      const vc = v==null?"—":`${n0(v)} <span class="sub2">≈</span>`;
      return PR ? [esc(p), n0(z.need), n0(z.made), z.need?`<b style="color:${(z.made||0)>=z.need?"var(--ok)":"var(--bad)"}">${pc((z.made||0)/z.need)}</b>`:"—", n0(mL), pp==null?"—":n1(pp), vc]
                : [esc(p), n0(mL), pc(mL/(made||1)), pp==null?"—":n1(pp), vc]; }),
    PR ? [t("totalRow"), n0(pn), n0(pm), "", n0(made), "", n0(pv)+" "+sar()]
       : [t("totalRow"), n0(made), "", "", n0(pv)+" "+sar()])
    +`<div class="src">${t(PR?"rpPcsNoteM":"rpPcsNoteR")}</div></div>`;
  h+=`<h3>${t("rpDaily")}</h3><div class="card">`+tbl(
    [{h:t("rpDay")},{h:t("rpPlan")},{h:t("rpMadeC")},{h:t("rpDiff")},{h:t("rpPackC")},{h:t("rpStaffC")},{h:t("rpHrsC")},{h:t("rpOtC")},{h:t("rpWhyC")}],
    X.map(x=>{ const d=x.p?((x.m||0)-x.p)/x.p:null;
      return [esc(dmy(x.d)), x.p?n0(x.p):"—", n0(x.m), d==null?"—":`<span class="ou ${d<0?"dn":"up"}" ${Math.abs(d)>=0.1?'style="font-weight:700"':""}>${d>0?"+":""}${pc(d)}</span>`,
        n0(boxOf(x)), n0(x.s), n1(x.h), x.o?n1(x.o):"—", esc((x.rs||[]).map(z=>trR(z.r)).filter(Boolean).join("، "))]; }),
    [t("totalRow"), n0(pSum), n0(made), "", n0(boxes), "", "", n0(ot), ""])+`</div>`;
  h+=`<div class="card"><div class="src">${t("rpSrc",{r:n1(rate)})}</div></div>`;
  return h;
}

function viewDays(){
  const DD=(D.days||[]).slice().reverse();      // newest first; that is what gets read
  if(!DD.length) return `<div class="card"><div class="muted">${t("dFlavNone")}</div></div>`;

  let h=`<h3>${t("vDays")}</h3><div class="card">
    <div class="chartbox" style="height:240px"><canvas id="c-d"></canvas></div></div>`;

  const noPlan=DD.some(x=>!x.plan);

  /* One row per day, and the day's flavours fold out of the row that owns them.
     Seven separate cards below the table meant the page was eight screens long and
     the detail sat far from the number it explains. A fold costs one tap and puts
     them together. */
  h+=`<h3>${t("dPlanned")} · ${t("dMade")}</h3><div class="card">
    <div class="scroll"><table><thead><tr>
      <th>${t("dDayCol")}</th><th>${t("dPlanned")}</th><th>${t("dMade")}</th>
      <th>${t("dHit")}</th><th>${t("dPacked")}</th><th>${t("dHrs")}</th>
      <th>${t("dStaff")}</th><th class="wrap">${t("dReading")}</th>
    </tr></thead><tbody>`;

  DD.forEach((x,i)=>{
    const open = dayOpen(x.date);
    h+=`<tr class="tap" onclick="dayFold('${x.date}')">
      <td><span class="caret${open?" on":""}">❯</span> <b>${dmy(x.date)}</b>${stageDots(
        {plan_pcs:x.plan, plan_boxes:x.plan_boxes, made:x.made, coated:x.coated, packed:x.packed})}</td>
      <td>${x.plan==null?`<span class="muted">${t("dNoPlan")}</span>`:n0(x.plan)}</td>
      <td>${x.made==null?dash(null):`<b>${n0(x.made)}</b>`}</td>
      <td>${x.hit==null?dash(null)
        :`<span class="ou ${x.hit<.9?"dn":"up"}">${pc(x.hit)}</span>`}</td>
      <td>${x.packed==null?dash(null):n0(x.packed)}</td>
      <td>${x.hours==null?dash(null):n1(x.hours)}</td>
      <td>${x.staff==null?dash(null):n0(x.staff)}</td>
      <td class="wrap"><span class="muted">${esc(reading(x.reading))}</span></td></tr>`;

    if(!open) return;
    let inner;
    if(!x.rows.length){
      inner = `<div class="muted">${t("dFlavNone")}</div>`;
    } else {
      inner = tbl([{h:t("flavour"),wrap:true},{h:t("dPlanned")},{h:t("dMade")},{h:t("dHit")}],
        x.rows.map(r=>[
          esc(r.name),
          r.plan?n0(r.plan):dash(null),
          flavMadeCell(r),
          (r.plan&&r.made)?`<span class="ou ${r.made/r.plan<.9?"dn":"up"}">${
             pc(r.made/r.plan)}</span>`:dash(null)]));
      /* The mismatch is the point, not the timestamp: a snapshot that caught nothing
         is exactly the case worth saying out loud. */
      if(x.made && x.rows_made < x.made*0.98)
        inner += `<div class="warnbox" style="margin-top:10px">${
          x.rows_at ? t("dSnapShort").replace("{t}", x.rows_at.slice(11))
                    : t("dSnapPart").replace("{n}", n0(x.rows_made)).replace("{m}", n0(x.made))
        }</div>`;
      else if(x.rows_at)
        inner += `<div class="src">${t("dSnapAt").replace("{t}", x.rows_at.replace("T"," "))}</div>`;
    }
    h+=`<tr class="subrow"><td colspan="8">${stageChips(
        {plan_pcs:x.plan, plan_boxes:x.plan_boxes, made:x.made, coated:x.coated, packed:x.packed})}
        <div style="margin-top:10px">${inner}</div></td></tr>`;
  });

  h+=`</tbody><tfoot><tr>
      <td style="font-weight:750">${t("dTotalRow")}</td>
      <td style="font-weight:750">${n0(DD.reduce((a,x)=>a+(x.plan||0),0))}</td>
      <td style="font-weight:750">${n0(DD.reduce((a,x)=>a+(x.made||0),0))}</td>
      <td></td>
      <td style="font-weight:750">${n0(DD.reduce((a,x)=>a+(x.packed||0),0))}</td>
      <td style="font-weight:750">${n1(DD.reduce((a,x)=>a+(x.hours||0),0))}</td>
      <td></td><td></td></tr></tfoot></table></div>
    <div class="src">${t("dSrc")}${noPlan?"<br>"+t("dNoPlanWhy"):""}</div>
    <div class="src">${t("dTapDay")}</div><div class="src">${t("stLegend")}</div></div>`;
  return h;
}

/* Which days are open. Newest open, the rest shut, until somebody says otherwise -
   and the choice survives a rebuild, because a page that forgets what you opened is
   a page you stop opening things on. */
function dayOpen(date){
  let open;
  try{ open = JSON.parse(localStorage.getItem("erm-dayopen")||"null"); }catch(e){}
  if(!Array.isArray(open)) return date === ((D.days||[]).slice(-1)[0]||{}).date;
  return open.indexOf(date) >= 0;
}
function dayFold(date){
  let open;
  try{ open = JSON.parse(localStorage.getItem("erm-dayopen")||"null"); }catch(e){}
  if(!Array.isArray(open)){
    const newest = ((D.days||[]).slice(-1)[0]||{}).date;
    open = newest ? [newest] : [];
  }
  const i = open.indexOf(date);
  if(i>=0) open.splice(i,1); else open.push(date);
  try{ localStorage.setItem("erm-dayopen", JSON.stringify(open)); }catch(e){}
  render();
}
