<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#014833">
<title>ERMINE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
/*__FONTS__*/
/* ------------------------------------------------------------------ *
 *  The Ermine palette, straight off the brand kit.                   *
 *  Green is the brand; the other four are for meaning, never decor:  *
 *  teal reads "good", orange "watch", red "wrong", purple is the     *
 *  second voice in charts.                                           *
 * ------------------------------------------------------------------ */
:root{
  --green:#014833; --purple:#7C2981; --orange:#F37121; --teal:#00918B; --red:#BF2028;
  color-scheme: light;
  --bg:#F7F5F1; --card:#fff; --line:#E4E0D8; --ink:#14201B; --dim:#6E7A74;
  --ok:var(--teal); --warn:#B8650F; --bad:var(--red); --accent:var(--green);
  --okbg:rgba(0,145,139,.10); --warnbg:rgba(243,113,33,.12); --badbg:rgba(191,32,40,.09);
  --shadow:0 1px 2px rgba(1,72,51,.05),0 10px 26px -14px rgba(1,72,51,.28);
  /* the brand faces, inlined above: Zarid Display for titles, Dubai for text */
  --serif:"Zarid Display",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Dubai",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
}
html[data-theme=dark]{
  color-scheme: dark;
  --bg:#0B1411; --card:#13201B; --line:#223029; --ink:#ECEFE9; --dim:#8DA096;
  --ok:#2BC2B6; --warn:#F3913F; --bad:#E8645F; --accent:#2BC2B6;
  --okbg:rgba(43,194,182,.13); --warnbg:rgba(243,145,63,.13); --badbg:rgba(232,100,95,.13);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 var(--sans);
  padding:0 0 calc(44px + env(safe-area-inset-bottom))}
html[dir=rtl] body{font-family:var(--sans)}

/* ---------- header: the green band, the wordmark, the menu ---------- */
header{position:sticky;top:0;z-index:40;background:var(--green);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;
  box-shadow:0 6px 22px -14px rgba(1,72,51,.7)}
.hrow{display:flex;align-items:center;gap:10px;min-height:38px}
.mark{height:19px;width:auto;display:block;flex:none}
.markfall{font-family:var(--serif);font-size:19px;letter-spacing:.16em;font-weight:600}
.hspace{flex:1}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  color:#fff;border-radius:9px;min-width:32px;height:32px;padding:0 8px;font-size:13px;
  font-weight:700;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.stamp{color:rgba(255,255,255,.72);font-size:11.5px;padding:5px 0 0;letter-spacing:.2px}
.stamp.old{color:#FFC98B;font-weight:650}

/* the menu is the only navigation, so it is always visible and always shows where you are */
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px;
  padding-bottom:0}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:rgba(255,255,255,.62);cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:650;padding:9px 11px 10px;white-space:nowrap;
  border-bottom:2.5px solid transparent;transition:color .18s,border-color .18s}
nav button.on{color:#fff;border-bottom-color:var(--orange)}
nav button:hover{color:#fff}

/* ---------- page title: you always know which page you are on ---------- */
.pagehead{padding:16px 16px 2px;max-width:1240px;margin:0 auto}
.pagetitle{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.2px;
  margin:0;line-height:1.2}
.pagesub{color:var(--dim);font-size:12.5px;margin-top:4px}
main{padding:10px 16px;max-width:760px;margin:0 auto}

/* ---------- the banner ---------- */
.banner{border-radius:16px;padding:17px 18px;margin-bottom:14px;color:#fff;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.banner.ok{background:linear-gradient(135deg,#016A4C,#01382A)}
.banner.warn{background:linear-gradient(135deg,#F3853C,#C4551A)}
.banner.bad{background:linear-gradient(135deg,#CE3A32,#8E1E20)}
/* the ermine, watermarked - the brand mark earning its place rather than sitting in a corner */
.banner .crest{position:absolute;inset-inline-end:-18px;top:50%;transform:translateY(-50%);
  height:132%;opacity:.13;pointer-events:none;filter:saturate(0)}
.banner .lbl{color:rgba(255,255,255,.76);position:relative}
.banner .big{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.3px;
  margin-top:3px;position:relative}
.banner .sub{color:rgba(255,255,255,.92);font-size:13.5px;margin-top:8px;position:relative}
.banner .tapnote{color:rgba(255,255,255,.72)}

/* ---------- cards and the standard section heading ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
h3{margin:20px 0 9px;font-size:15px;font-weight:700;font-family:var(--serif);letter-spacing:-.1px;
  color:var(--ink);display:flex;align-items:center;gap:8px}
h3::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--green);
  flex:none}
html[data-theme=dark] h3::before{background:var(--teal)}
h3 .n{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:0}
h3:first-child{margin-top:4px}

.big{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.mid{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.unit{font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:0}
.sar{display:inline-block;width:.85em;height:.85em;vertical-align:-.08em;margin:0 .12em}
.sar svg{width:100%;height:100%;fill:currentColor;display:block}
.lbl{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
  font-weight:700}
.row{display:flex;gap:12px} .row>*{flex:1;min-width:0}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:5px;width:0;
  transition:width .9s cubic-bezier(.2,.8,.2,1)}
html[data-theme=dark] .bar>i{background:var(--teal)}
.chartbox{position:relative;height:180px;margin-top:5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  text-align:end;padding:8px 5px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  font-weight:750}
th:first-child,td:first-child{text-align:start}
td{padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:end}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--dim);font-size:12px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.name{background:var(--bg);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-size:12.5px}
.fo{display:flex;gap:10px;align-items:baseline;padding:8px 0}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stg span{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:12.5px;border:1px solid var(--line);color:var(--dim)}
.stg span.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.stg span b{font-weight:800}
.dots{display:inline-flex;gap:3px;margin-inline-start:7px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--ok)}
.pbadge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;
  margin-inline-start:8px;vertical-align:middle;color:#fff}
.pbadge.today{background:var(--ok)}
.pbadge.old{background:var(--warn)}
.pbadge.fut{background:var(--teal)}
.flash{outline:3px solid var(--warn);outline-offset:3px;border-radius:12px}
.fo+.fo{border-top:1px solid var(--line)}
.fo b{font-variant-numeric:tabular-nums}
.src{font-size:10.5px;color:var(--dim);margin-top:10px;letter-spacing:.2px;line-height:1.5}

.tap{cursor:pointer;position:relative;transition:transform .14s,border-color .14s,box-shadow .14s}
.tap:active{transform:scale(.985)}
.tap:hover{border-color:var(--green)}
.tap::after{content:"›";position:absolute;inset-inline-end:14px;top:11px;
  color:var(--dim);font-size:21px;line-height:1;font-weight:700}
html[dir=rtl] .tap::after{content:"‹"}
.banner.tap::after{color:rgba(255,255,255,.9);font-size:25px;top:15px}
.tapnote{font-size:11px;color:var(--dim);margin-top:9px;letter-spacing:.2px;font-weight:600}

.ou{font-variant-numeric:tabular-nums;font-weight:700}
.ou.up{color:var(--ok)} .ou.dn{color:var(--bad)}
.minibar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;
  min-width:56px;margin-top:4px}
.minibar>i{display:block;height:100%;border-radius:4px}
td.wrap,th.wrap{white-space:normal}
.warnbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--warn);margin-bottom:11px;line-height:1.5}

/* ---------- motion ---------- *
 * Brand movement is slow and even - things arrive, they do not bounce. One stagger on
 * entry and nothing that repeats, because this page is read twenty times a day and a
 * loop would be unbearable by the third. Anyone who has asked their system for less
 * movement gets none at all.                                                           */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes sweep{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.anim{animation:rise .42s cubic-bezier(.22,.8,.26,1) both}
.pagehead{animation:sweep .34s ease-out both}
@media (prefers-reduced-motion:reduce){
  .anim,.pagehead{animation:none !important}
  .bar>i{transition:none}
}

/* ---------- the task board ---------- *
 * One layout, two shapes. On a phone the tasks are a single column of cards you can
 * read with a thumb; past 900px the same cards fall into columns by bucket, which is
 * the view that makes sense on a desk where you are deciding what to do next rather
 * than ticking something off. CSS grid does both from one set of markup - no second
 * template to keep in step, and no device sniffing to get wrong.                       */
.tkwrap{display:grid;gap:12px}
@media (min-width:900px){
  .tkwrap{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}
.tkcol{min-width:0}
.tkhead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:750;
  font-size:13.5px;font-family:var(--serif)}
.tkhead .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tkhead .cnt{color:var(--dim);font-weight:600;font-size:12px}
.tkcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
html[dir=rtl] .tkcard{border-left:1px solid var(--line);border-right:3px solid var(--line)}
.tkcard.p-high{border-left-color:var(--bad)}
html[dir=rtl] .tkcard.p-high{border-right-color:var(--bad)}
.tkcard.p-med{border-left-color:var(--orange)}
html[dir=rtl] .tkcard.p-med{border-right-color:var(--orange)}
.tkcard.is-done{opacity:.55}
.tkcard.is-done .tktitle{text-decoration:line-through}
.tktitle{font-weight:650;font-size:13.5px;line-height:1.4}
.tkmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.due{font-variant-numeric:tabular-nums;font-weight:650}
.tag.late{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tag.now{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.tknote{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45}
@media print{ .tkwrap{display:block} .tkcard{break-inside:avoid} }

/* ---------- expandable rows ---------- *
 * A <details> element, not a script-driven toggle: the browser remembers nothing to get
 * wrong, it works with a keyboard, and when the page is printed every row is forced open
 * so the report carries the detail the screen was hiding.                               */
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:7px;
  background:var(--card);overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:10px 13px;display:flex;
  align-items:center;gap:10px;font-weight:700;font-size:13.5px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .caret{color:var(--dim);font-size:12px;transition:transform .18s;
  flex:none}
details.grp[open]>summary .caret{transform:rotate(90deg)}
html[dir=rtl] details.grp>summary .caret{transform:rotate(180deg)}
html[dir=rtl] details.grp[open]>summary .caret{transform:rotate(90deg)}
details.grp>summary .gname{flex:1;min-width:0}
details.grp>summary .gnum{font-variant-numeric:tabular-nums;font-weight:750}
details.grp>summary:hover{background:var(--bg)}
details.grp .inner{padding:0 13px 11px}
details.grp[open]>summary{border-bottom:1px solid var(--line);margin-bottom:9px}
@media print{
  details.grp{border-color:#D8D8D8;page-break-inside:avoid}
  details.grp>summary{background:#F4F6F4}
  details.grp>summary .caret{display:none}
  details.grp:not([open]) .inner{display:none !important}
}

/* ---------- export dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(1,24,18,.55);z-index:90;display:grid;
  place-items:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:88vh;overflow:auto;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:rise .22s ease-out both}
.dlg h2{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.dlg p{color:var(--dim);font-size:12.5px;margin:0 0 15px;line-height:1.5}
.opt{display:block;width:100%;text-align:start;background:var(--bg);color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
  font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt.sel{border-color:var(--green);background:var(--okbg)}
.opt small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:2px}
.dlgrow{display:flex;gap:8px;margin-top:14px}
.dlgrow button{flex:1;border-radius:11px;padding:11px;font:inherit;font-weight:700;
  cursor:pointer;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.dlgrow button.go{background:var(--green);color:#fff;border-color:var(--green)}

/* ---------- the printed report ---------- *
 * Printing rather than drawing a PDF in JavaScript. A PDF library would have to shape
 * and reorder the Arabic itself, which is where every one of them falls down, and
 * html2canvas would turn the whole report into a picture of text. The browser already
 * does Arabic properly and already has the brand fonts loaded, so the report is real
 * selectable text and the file comes out small.                                        */
#report{display:none}
@media print{
  /* The report is ink on paper and has one palette, whatever the screen is set to.
     Printing in dark mode produced a page half dark-theme and half light - dark text
     colours over a white background, with the greys unreadable. These overrides are
     inside @media print so they cannot touch the screen. */
  html[data-theme=dark]{
    --bg:#fff; --card:#fff; --line:#D8D8D8; --ink:#111; --dim:#555;
    --ok:#0B6B4F; --warn:#9A5A10; --bad:#B3241C; --accent:#014833;
    --okbg:#EAF4F0; --warnbg:#FDF1E6; --badbg:#FBECEB; --shadow:none;
  }
  @page{size:A4;margin:14mm 12mm}
  header,.pagehead,main,.scrim{display:none !important}
  #report{display:block}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .rsec{page-break-after:always}
  /* Nothing is cut across a page: a card, a fold, a table row or a heading moves to the
     next page whole, so any single page printed on its own reads complete. */
  #report .card,#report details,#report .row,#report tr,#report .warnbox{break-inside:avoid;page-break-inside:avoid}
  /* ...except a card that holds a table. A long one is taller than a page; told never to
     break, it jumped whole to page 2 and left page 1 holding nothing but the header. */
  #report .card:has(table),#report #guide{break-inside:auto;page-break-inside:auto}
  #report h3{break-after:avoid;page-break-after:avoid;margin:14px 0 6px}
  #report thead{display:table-header-group}
  #report .card{box-shadow:none;border:1px solid #D8D8D8;margin-bottom:10px}
  .rsec:last-child{page-break-after:auto}
  .rhead{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #014833;
    padding-bottom:9px;margin-bottom:14px}
  .rhead img{height:22px}
  .rhead .rt{flex:1;font-family:var(--serif);font-size:17pt;font-weight:600;color:#014833}
  .rhead .rd{font-size:9pt;color:#555}
  .rsub{font-size:10pt;color:#444;margin:-8px 0 14px}
  .rblock{margin-bottom:16px;page-break-inside:avoid}
  .rblock h4{font-family:var(--serif);font-size:12.5pt;margin:0 0 7px;color:#014833;
    border-inline-start:3px solid #F37121;padding-inline-start:8px}
  #report table{width:100%;border-collapse:collapse;font-size:9pt}
  #report th{background:#014833;color:#fff;padding:5px 6px;text-align:end;
    font-size:8pt;text-transform:uppercase;letter-spacing:.3px}
  #report th:first-child,#report td:first-child{text-align:start}
  #report td{padding:4px 6px;border-bottom:.5px solid #D8D8D8;text-align:end}
  #report tfoot td{font-weight:700;border-top:1.2px solid #014833}
  #report tbody tr:nth-child(even){background:#F4F6F4}
  #report .kpis{display:flex;gap:10px;margin-bottom:12px}
  #report .kpi{flex:1;border:1px solid #D8D8D8;border-radius:7px;padding:8px 10px}
  #report .kpi .k{font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#666}
  #report .kpi .v{font-size:14pt;font-weight:700;color:#014833}
  #report .rchart{max-width:100%;height:auto;margin:6px 0 2px;
    border:1px solid #E2E2E2;border-radius:6px}
  #report .rfoot{margin-top:12px;font-size:7.5pt;color:#666;line-height:1.45;
    border-top:.5px solid #D8D8D8;padding-top:7px}
  .ou.up{color:#0B6B4F !important} .ou.dn{color:#B3241C !important}
  .muted,.src,.tapnote{color:#666 !important}
  .pill{border:.5px solid #999;padding:1px 6px}
  .tap::after{display:none}
  .minibar,.bar{display:none}
}

@media (min-width:900px){
  header{padding:14px 28px 0}
  .mark{height:22px}
  .pagehead{padding:20px 28px 2px} .pagetitle{font-size:30px}
  main{max-width:1240px;padding:12px 28px;
       display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
  main.detail{grid-template-columns:1fr;max-width:1020px}
  .banner{grid-column:1/-1}
  .colA{grid-column:1} .colB{grid-column:2}
  /* Wide tables get the whole row. Three narrow columns with a six-column table inside
     one of them is what made the laptop view look badly fitted. */
  .colW{grid-column:1/-1}
  .card{padding:16px 18px} .chartbox{height:210px}
}
@media (min-width:1400px){
  /* Still two columns, only roomier. A third column made every card narrower than its
     own contents, which is a worse trade than some white space at the edges. */
  main{max-width:1440px;gap:0 28px}
  main.detail{max-width:1100px}
}
.tkcard .tktitle{display:flex;align-items:flex-start;gap:9px}
.tkbox{flex:0 0 auto;width:23px;height:23px;margin-top:1px;border-radius:7px;
  border:1.8px solid var(--line);background:var(--bg);color:var(--teal);
  font:700 14px/1 inherit;cursor:pointer;display:grid;place-items:center;padding:0}
.tkbox:active{transform:scale(.92)}
.tkbox.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tkbox:disabled{opacity:.45;cursor:default}
.tkcard.is-done .tktitle span{text-decoration:line-through;opacity:.6}
.tkform label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
.tkform input,.tkform select{width:100%;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;
  margin:0 0 10px;-webkit-appearance:none;appearance:none}
.tkform input[type=date],.tkform input[type=time]{min-height:42px}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.segsw{display:flex;gap:0;margin:0 0 12px;border:1.5px solid var(--line);
  border-radius:12px;overflow:hidden;background:var(--card)}
.segsw button{flex:1;padding:9px 0;border:0;background:transparent;color:var(--dim);
  font:600 14px/1 inherit;cursor:pointer}
.segsw button.on{background:var(--accent);color:#fff}
.calcard{padding:12px}
.calbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.calbar b{flex:1;text-align:center;font-size:15px}
.calnav{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:600 17px/1 inherit;cursor:pointer}
.go.sm{padding:6px 11px;font-size:13px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead div{text-align:center;font-size:11px;color:var(--dim);padding:0 0 5px}
.cell{position:relative;min-height:46px;border:1.5px solid transparent;border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;padding:4px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.celloff{min-height:46px}
.cell .dnum{font-size:13px;line-height:1}
.cell.is-today{border-color:var(--accent);font-weight:700}
.cell.is-sel{background:var(--accent);color:#fff}
.cell .dots{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block;background:var(--dim)}
.cell .dots i.p1{background:var(--bad)} .cell .dots i.p2{background:var(--warn)}
.cell .dots i.p3{background:var(--teal)}
.cell .dots i.late{box-shadow:0 0 0 1.5px var(--bad)}
.cell .more{font-size:9px;color:var(--dim)}
.cell.is-sel .more{color:#fff}
.mid b.stale{color:var(--warn)}
.mid .unit{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px}
.mid.inl .unit{display:inline;margin:0 2px}
.tkcol>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  padding:9px 2px;user-select:none}
.tkcol>summary::-webkit-details-marker{display:none}
.tkcol>summary .caret{display:inline-block;transition:transform .16s;font-size:11px;
  color:var(--dim)}
.tkcol[open]>summary .caret{transform:rotate(90deg)}
html[dir=rtl] .tkcol>summary .caret{transform:rotate(180deg)}
html[dir=rtl] .tkcol[open]>summary .caret{transform:rotate(90deg)}
.tkcol>.tkbody{display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
/* Blur rather than blank: the page keeps its shape, so it is still navigable with the
   figures unreadable. Labels and headings stay sharp - they are what you steer by. */
/* One section's figures, blurred. The heading, its labels and the eye stay sharp, so
   the section is still identifiable and can be opened again. */
.fcsec{border-top:1px solid var(--line);padding:13px 0 3px;margin-top:11px}
.fcsec:first-child{border-top:0;padding-top:0;margin-top:0}
.fcsec.total{border-top:2px solid var(--line)}
.parthead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.subrow>td{background:var(--bg);padding:12px 10px}
tr.tap{cursor:pointer}
tr.tap .caret{display:inline-block;transition:transform .15s ease;color:var(--dim)}
tr.tap .caret.on{transform:rotate(90deg)}
html[dir=rtl] tr.tap .caret{transform:rotate(180deg)}
html[dir=rtl] tr.tap .caret.on{transform:rotate(90deg)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(1,24,17,.42);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheetin{background:var(--card);width:100%;max-width:620px;max-height:84vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px -16px rgba(1,72,51,.5)}
@media (min-width:700px){.sheet{align-items:center}
  .sheetin{border-radius:18px;max-height:78vh}}
.parthead .lbl{flex:1;margin:0}
.fcrow{border-top:1px solid var(--line);padding:12px 0 2px;margin-top:10px}
.fcnums{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;font-size:16px;margin-top:3px}
.fcnums i{font-style:normal;color:var(--dim);font-size:13px}
.fcnums .arr{color:var(--line)}
.fccost{margin-inline-start:4px;color:var(--warn);font-size:15px}
.expbtn{width:24px;height:24px;margin-inline-start:6px;border-radius:8px;
  border:1.5px solid var(--line);background:var(--card);color:var(--dim);
  cursor:pointer;display:inline-grid;place-items:center;padding:0;vertical-align:middle}
.expbtn:active{background:var(--field)}
.eyebtn{width:24px;height:24px;margin-inline-start:8px;border-radius:8px;
  border:1.5px solid var(--line);background:var(--card);color:var(--dim);
  font:13px/1 inherit;cursor:pointer;display:inline-grid;place-items:center;
  padding:0;vertical-align:middle}
.eyebtn:active{background:var(--field)}
/* One rule, set by blurNums on the elements that actually carry a figure. The old
   selector list blurred whole sentences because they happened to live in a .sub or a
   td, which hid the reasoning along with the number. */
.numblur{ filter: blur(7px); }
span.nb.numblur{ display:inline-block; }
.blurred .lbl, .blurred th, .blurred .src, .blurred h2 { filter: none; }
/* .backbtn sets display, which beats the browser's own [hidden]{display:none} - so the
   button stayed on screen on the home page, offering to go back from the beginning. */
.backbtn[hidden]{display:none}
.backbtn{display:inline-flex;align-items:center;gap:4px;margin:0 0 6px;padding:6px 12px;
  border:1.5px solid var(--line);border-radius:999px;background:var(--card);
  color:var(--ink);font:600 13px/1 inherit;cursor:pointer}
.backbtn:active{background:var(--field)}
html[dir=rtl] .backbtn{transform:scaleX(1)}
/* The banner carries the day's cost now, in a compact row under the headline. */
.banner .brow{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 2px}
.banner .brow>div{display:flex;flex-direction:column;gap:1px}
.banner .brow .lbl{opacity:.72;font-size:11px}
.banner .brow b{font-size:19px;font-weight:700}
.banner .brow b i{font-size:11px;font-weight:400;opacity:.75;font-style:normal}
/* The month target is the loudest thing on the page after the judgement itself. */
.card.target{border:2px solid var(--accent)}
.card.target .huge{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.card.target .huge .unit{font-size:14px;font-weight:500;color:var(--dim);letter-spacing:0}
#livebar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#livebar[hidden]{display:none}
#livebar .lb{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;line-height:1.6;
  background:var(--okbg);color:var(--ok);border:1px solid transparent}
#livebar .lb.bad{background:var(--badbg);color:var(--bad)}
#livebar .lb i{font-style:normal;opacity:.75}
.card.overcard{border:2px solid var(--warn)}
.card.otcard{border:2px solid var(--warn)}
.card.notarget{border:1.5px dashed var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
  max-width:min(520px,calc(100vw - 32px));padding:11px 16px;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:13px;line-height:1.5;z-index:90;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center}
#toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}
.fo.tap{cursor:pointer}
.fo.tap:active{background:var(--field)}
.fo .chev{color:var(--dim);font-size:15px;margin-inline-start:4px}
</style>
</head>

const loc=()=>L==="ar"?"ar-EG":"en-GB";
const n0=v=>v==null?"—":Math.round(v).toLocaleString(loc());
const n1=v=>v==null?"—":(Math.round(v*10)/10).toLocaleString(loc(),{minimumFractionDigits:1});
const pc=v=>v==null?"—":Math.round(v*100).toLocaleString(loc())+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dmy=s=>s?new Date(s+"T00:00:00").toLocaleDateString(loc(),{day:"2-digit",month:"short"}):"";

/* ---- the sentences the workbook only speaks in English ---- *
 * Each takes the token and the numbers the builder pulled out, and writes the sentence
 * in the language on screen. If the builder could not classify it, the workbook's own
 * words are shown rather than a blank.                                                  */
function sFits(p){
  if(p.fits_code==="fits") return T[L].sFits(n0(p.fits_h));
  if(p.fits_code==="over") return T[L].sOver(n0(p.fits_h));
  return p.fits||"";
}
function sVerdict(){
  const c=D.today.verdict_code;
  if(c==="ok") return T[L].sVerdictOk;
  if(c==="overtime") return T[L].sVerdictOt(n1(D.today.verdict_h));
  if(c==="toomuch") return T[L].sVerdictBad;
  return D.today.verdict||"";
}
function sCommit(){
  if(D.today.pcs!=null && D.today.boxes!=null)
    return T[L].sCommit(n0(D.today.pcs), n0(D.today.boxes));
  return D.today.committed||"";
}
/* "00:35" -> "12:35 AM (next day)": Excel shows this cell as h:mm AM/PM, so the page does too */
function finTxt(){
  const m=/^(\d{1,2}):(\d{2})/.exec(String(D.today.finish||"")); if(!m) return "";
  let h=+m[1]; const pm=h>=12; h=h%12||12;
  const n=D.today.finish_days||0;
  return h+":"+m[2]+" "+t(pm?"pmS":"amS")+(n===1?" "+t("nextDay"):n>1?" "+t("plusDays",{n:n}):"");
}
function sDayNote(){
  const h=D.today.day_hours, s=D.today.day_staff;
  return (h!=null&&s!=null) ? T[L].sDayNote(n1(h), n0(s)) : (D.today.finish_note||"");
}
function sMonth(){
  const c=D.month.verdict_code;
  if(c==="ok") return T[L].sMonthOk;
  if(c==="overtime") return T[L].sMonthOt;
  if(c==="outofreach") return T[L].sMonthBad;
  return D.month.verdict||"";
}

window.__charts=[];
function chart(id,cfg){
  const el=document.getElementById(id); if(!el||!el.offsetParent) return;
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
  Chart.defaults.color=css("--dim");
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,
    animation:{duration:matchMedia("(prefers-reduced-motion:reduce)").matches?0:700}},
    cfg.options||{});
  for(const k of Object.keys(cfg.options.scales||{}))
    Object.assign(cfg.options.scales[k],{grid:{color:css("--line"),drawBorder:false}});
  window.__charts.push(new Chart(el,cfg));
}

/* Is this page the current one?

   The dashboard is installed to a home screen, and an installed web page is cached hard
   - it will serve yesterday's file all day without asking anyone. That turned a morning
   of fixes into a morning of "it still does not work", because the fixes were published
   and the phone was reading the old copy. So the page now checks a one-line file holding
   the stamp of the latest build, and if it is running something older it reloads itself
   once. Once, and recorded in sessionStorage - a reload loop on a page you cannot easily
   close is far worse than a stale one. */
function checkFresh(){
  fetch("data/build.txt?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.text() : null)
    .then(latest => {
      if(!latest) return;
      latest = latest.trim();
      const mine = BUILT.toISOString();
      if(!latest || Math.abs(new Date(latest) - BUILT) < 2000) return;
      if(new Date(latest) <= BUILT) return;            // never go backwards
      let done = "";
      try { done = sessionStorage.getItem("erm-reloaded") || ""; } catch(e){}
      if(done === latest) return;
      try { sessionStorage.setItem("erm-reloaded", latest); } catch(e){}
      location.reload();
    })
    .catch(()=>{});
}

/* Hiding the numbers, the way a banking app does.

   The dashboard carries revenue, wages and headcount, and it is opened on a factory
   floor and in meetings with people standing behind you. Blur is the right tool: the
   page keeps its shape so you can still find your way around it, and one tap brings it
   back. This is not security - whoever holds the phone can tap it too - it is privacy
   from a glance over your shoulder, which is the thing actually at risk in a corridor. */
/* Hiding is per section, not per page.

   The point of it is showing the dashboard to people who may see some of it. Blurring
   everything defeats that: you end up with nothing to show. So each block of figures
   carries its own eye, and the header button is only a shortcut that closes or opens
   all of them at once. What is hidden is remembered per section, because the set of
   things you will not show the board is the same set every time.

   It is privacy from the room, not security: whoever holds the phone can tap the eye. */
/* 12 Nov 2026: the per-section memory in localStorage left sections hidden on the next
   visit with no one remembering why - cards looked broken. Now: the top button hides
   every number on EVERY page until tapped again (kept only for this browser session),
   and a section's own eye is a one-off exception that is forgotten on reload. */
try { localStorage.removeItem("erm-hidden"); } catch(e){}
let HIDE_ALL = (() => { try { return sessionStorage.getItem("erm-hideall")==="1"; } catch(e){ return false; } })();
let HIDDEN = new Set();     // sections hidden one by one while HIDE_ALL is off
let REVEAL = new Set();     // sections shown one by one while HIDE_ALL is on
function saveHidden(){
  try { sessionStorage.setItem("erm-hideall", HIDE_ALL ? "1" : "0"); } catch(e){}
}
function isHid(k){ return HIDE_ALL ? !REVEAL.has(k) : HIDDEN.has(k); }
/* Rather than marking up every section by hand across eight views, the eye is added
   after the fact: each heading gets one, and the blur is applied to the siblings that
   follow it up to the next heading. That is a precise definition of "this section",
   which CSS alone cannot express. The key is the heading's own words, so a preference
   survives a rebuild. */
/* An eye, open or struck through. The filled circle was being read as a screen-
   recording dot, which is an alarming thing at the top of a page about money. */
function eyeIcon(shut){
  return shut
    ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18"/>
         <path d="M10.6 5.2A9.9 9.9 0 0 1 12 5c5 0 9 4.5 9 7a12 12 0 0 1-2.4 3.4"/>
         <path d="M6.3 7.3C4 8.8 3 11 3 12c0 2.5 4 7 9 7 1.5 0 2.8-.4 4-1"/>
         <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`
    : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round"><path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7z"/>
         <circle cx="12" cy="12" r="2.6"/></svg>`;
}
/* Exporting one section.

   window.print() was the whole export mechanism, and on a phone - especially a page
   added to the home screen - it does nothing at all. So a section is turned into a
   small self-contained HTML file instead: shared through the system share sheet where
   that exists (which is what you want on a phone, to send it to finance), and
   downloaded where it does not. No print dialog, no popup window, nothing that a
   standalone web app is allowed to block.

   The file carries its own styling, so it opens correctly in Mail, WhatsApp, Word or a
   browser with nothing else needed. */
function exportCss(){
  const v = getComputedStyle(document.documentElement);
  const g = n => v.getPropertyValue(n).trim() || "";
  return `body{margin:0;padding:22px;background:#fff;color:#14201B;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
    h1{font-size:19px;margin:0 0 2px} .when{color:#66726C;font-size:12px;margin:0 0 18px}
    h3{font-size:16px;margin:18px 0 8px;color:${g("--green")||"#014833"}}
    .card{border:1px solid #E4E0D8;border-radius:12px;padding:14px 16px;margin:0 0 12px}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    th{text-align:start;color:#66726C;font-weight:600;padding:6px 8px;
       border-bottom:1.5px solid #E4E0D8;white-space:nowrap}
    td{padding:6px 8px;border-bottom:1px solid #F1EEE8}
    .lbl{color:#66726C;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .big,.mid{font-size:20px;font-weight:700}
    .row{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 6px}
    .src{color:#66726C;font-size:11.5px;line-height:1.55;margin-top:8px}
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
          border:1px solid #E4E0D8}
    .unit{font-size:11px;color:#66726C;font-weight:400}
    .sar{display:inline-block;width:.85em;height:.85em;vertical-align:-.08em;margin:0 .12em}
    .sar svg{width:100%;height:100%;fill:currentColor;display:block}
    .sub2{display:block;font-size:10.5px;color:#66726C}
    .bar,.chartbox,canvas,button,.eyebtn,.expbtn,.tapnote,.chev{display:none!important}`;
}

/* Hiding is for the screen in the room, not for the file you send afterwards. A
   section exported while hidden came out blurred - a document of smudges, which is
   worse than useless because it looks like it worked. */
/* A <details> exports exactly as it sits on screen, so a closed one arrives as a
   heading with nothing under it. Anything worth exporting is worth exporting open. */
function openFolds(node){
  // querySelectorAll never matches the node it is called on, and on this page every
  // box IS a <details> at the top of its own clone - so the first version opened the
  // folds nested inside and left all thirteen outer ones shut. The export looked
  // right in the DOM and arrived as a list of closed headings.
  if(node.tagName === "DETAILS") node.setAttribute("open","");
  node.querySelectorAll("details").forEach(d=>d.setAttribute("open",""));
}

function unblur(node){
  node.querySelectorAll(".numblur,.blurred").forEach(x=>{
    x.classList.remove("numblur"); x.classList.remove("blurred");
  });
  node.classList && node.classList.remove("numblur", "blurred");
}

function sectionHtml(h3){
  const parts = [h3, ...sectionBody(h3)].map(el=>{
    const c = el.cloneNode(true);
    c.querySelectorAll("button,canvas,.chartbox,.tapnote,.chev").forEach(x=>x.remove());
    unblur(c);
    return c.outerHTML;
  }).join("\n");
  const title = secTitle(h3);
  const when = new Date().toLocaleString(loc(),
      {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return `<!doctype html><html lang="${L}" dir="${L==="ar"?"rtl":"ltr"}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title><style>${exportCss()}</style></head>
<body><h1>ERMINE \u2014 ${esc(title)}</h1>
<div class="when">${esc(when)}</div>
${parts}
</body></html>`;
}

function secTitle(h3){
  const c=h3.cloneNode(true);
  c.querySelectorAll("button").forEach(x=>x.remove());
  return (c.textContent||"").replace(/\s+/g," ").trim();
}

/* Two blocks that belong in one box still want their own export, so the exporter can
   take any element and a title rather than only a heading and everything after it. */
function partHtml(el, title){
  const c = el.cloneNode(true);
  c.querySelectorAll("button,canvas,.chartbox,.tapnote,.chev").forEach(x=>x.remove());
  unblur(c);
  const when = new Date().toLocaleString(loc(),
      {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return `<!doctype html><html lang="${L}" dir="${L==="ar"?"rtl":"ltr"}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title><style>${exportCss()}</style></head>
<body><h1>ERMINE \u2014 ${esc(title)}</h1>
<div class="when">${esc(when)}</div>
${c.outerHTML}
</body></html>`;
}

async function sendFile(html, title){
  const name = title.replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"").slice(0,48)
             + " " + new Date().toISOString().slice(0,10) + ".html";
  const file = new File([html], name, {type:"text/html"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:title});
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
  toast(t("exportSaved"));
}

function exportPart(id, titleKey){
  const el = document.getElementById(id);
  if(!el) return;
  sendFile(partHtml(el, t(titleKey)), t(titleKey));
}

async function exportSection(h3){
  return sendFile(sectionHtml(h3), secTitle(h3));
}

function secKey(el){
  /* Digits are stripped out of the key. Several headings carry a live count - "On the
     floor today 20", "Reports 14" - and keying on the whole text would silently forget
     your choice the moment the count moved. */
  return (el.textContent||"").replace(/[0-9\u0660-\u0669]/g,"")
         .replace(/\s+/g," ").trim().slice(0,60).toLowerCase();
}
function leadBlock(){
  /* Everything in the page before its first heading: on the home page that is the
     banner, which carries the committed pieces, the boxes and the finish time - the
     single most sensitive block on the dashboard and, until now, the only one with no
     eye at all, because there was no heading to hang one on. */
  const main=document.getElementById("main");
  if(!main) return [];
  const out=[];
  for(const el of main.children){ if(el.tagName==="H3") break; out.push(el); }
  return out;
}
function decorateSections(){
  const main=document.getElementById("main");
  if(!main) return;
  const head=document.querySelector(".pagehead");
  if(head && leadBlock().length && !head.querySelector("[data-eye]")){
    const k="lead:"+VIEW;
    head.dataset.sec=k;
    const b=document.createElement("button");
    b.className="eyebtn"; b.setAttribute("data-eye","");
    b.onclick=(e)=>{ e.stopPropagation(); toggleSec(k); };
    (head.querySelector("#ptitle")||head).appendChild(b);
  }
  main.querySelectorAll("h3").forEach(h=>{
    if(h.querySelector("[data-eye]")) return;
    const k=secKey(h);
    if(!k) return;
    /* No figures in the section, no eye. The quality and task pages are mostly words,
       and an eye above a list of sentences offers to hide nothing. */
    const body=sectionBody(h);
    const hasNums=body.some(el=>el.querySelector(
      ".big,.mid,.n,.cnt,.gnum,canvas,table td") || /[0-9\u0660-\u0669]/.test(el.textContent||""));
    if(!hasNums) return;
    h.dataset.sec=k;
    const b=document.createElement("button");
    b.className="eyebtn"; b.setAttribute("data-eye","");
    b.onclick=(e)=>{ e.stopPropagation(); toggleSec(k); };
    h.appendChild(b);
    const x=document.createElement("button");
    x.className="expbtn"; x.title=t("exportBtn");
    x.innerHTML=`<svg viewBox="0 0 24 24" width="14" height="14" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
       <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>`;
    x.onclick=(e)=>{ e.stopPropagation(); exportSection(h); };
    h.appendChild(x);
  });
}
function sectionBody(h){
  const out=[];
  let n=h.nextElementSibling;
  while(n && n.tagName!=="H3"){ out.push(n); n=n.nextElementSibling; }
  return out;
}
function hideKeys(){
  const k=[...document.querySelectorAll("#main h3[data-sec]")].map(e=>e.dataset.sec);
  const head=document.querySelector(".pagehead[data-sec]");
  if(head) k.push(head.dataset.sec);
  return k;
}
/* Blur the FIGURES, and only the figures.
 *
 * This used to be a list of CSS selectors - .big, .mid, td, .pill, .sub, .tapnote -
 * which blurred whole sentences along with the numbers in them. Holding the page up
 * in a meeting then hid the explanation as well as the figure, which is the opposite
 * of what hiding is for: the point is to say "we are behind on Coins" without saying
 * by how much.
 *
 * So the text is walked and only the elements that actually carry a digit are
 * blurred - Arabic-Indic digits included, since the page renders in both. Charts go
 * whole, because a bar chart with no numbers on it is still a number.
 */
const NUMRE = /[0-9٠-٩]/;
/* 12 Nov 2026: the blur used to land on the ELEMENT holding a digit, so a card with one
   figure in a sentence went entirely. Now each number token is wrapped in its own span
   and only that span blurs - the words, product names and reasons stay readable.
   "Big 30" / "Big 12" are box names, not figures, and are left alone. */
const NUMTOK = /[+\-−]?[0-9٠-٩][0-9٠-٩,،٬.٫:%٪\/\u00A0\u202F]*[0-9٠-٩%٪]|[+\-−]?[0-9٠-٩]/g;
function wrapNums(tn){
  const s = tn.nodeValue || "";
  let m, last = 0, frag = null;
  NUMTOK.lastIndex = 0;
  while((m = NUMTOK.exec(s))){
    if(/Big\s*$/i.test(s.slice(Math.max(0, m.index-5), m.index))) continue;
    frag = frag || document.createDocumentFragment();
    frag.appendChild(document.createTextNode(s.slice(last, m.index)));
    const sp = document.createElement("span");
    sp.className = "nb numblur"; sp.textContent = m[0];
    frag.appendChild(sp);
    last = m.index + m[0].length;
  }
  if(!frag) return;
  frag.appendChild(document.createTextNode(s.slice(last)));
  tn.parentNode.replaceChild(frag, tn);
}
function blurNums(root, on){
  root.querySelectorAll(".numblur").forEach(e=>e.classList.remove("numblur"));
  if(!on) return;
  root.querySelectorAll("canvas,.bar,.minibar,.dots").forEach(e=>e.classList.add("numblur"));
  root.querySelectorAll("span.nb").forEach(e=>e.classList.add("numblur"));
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const todo=[]; let n;
  while((n=w.nextNode())){
    if(!NUMRE.test(n.nodeValue||"")) continue;
    const el=n.parentElement;
    /* Never the column headings or the source notes - a date in a footnote is part of
       the sentence, not a figure anyone is hiding. */
    if(!el || el.closest(".src") || el.closest("span.nb") || el.tagName==="TH"
       || el.classList.contains("lbl") || el.closest("button")) continue;
    todo.push(n);
  }
  todo.forEach(wrapNums);
}

function applyHidden(){
  decorateSections();
  const head=document.querySelector(".pagehead[data-sec]");
  if(head){
    const on=isHid(head.dataset.sec);
    leadBlock().forEach(el=>{ el.classList.toggle("blurred", on); blurNums(el, on); });
    const b=head.querySelector("[data-eye]");
    if(b){ b.innerHTML = eyeIcon(on); b.title = on ? t("showNums") : t("hideNums"); }
  }
  document.querySelectorAll("#main h3[data-sec]").forEach(h=>{
    const on = isHid(h.dataset.sec);
    sectionBody(h).forEach(el=>{ el.classList.toggle("blurred", on); blurNums(el, on); });
    const b = h.querySelector("[data-eye]");
    if(b){ b.innerHTML = eyeIcon(on); b.title = on ? t("showNums") : t("hideNums"); }
  });
  const all = hideKeys();
  const b = document.getElementById("hide");
  if(b){ b.innerHTML = eyeIcon(HIDE_ALL); b.title = HIDE_ALL ? t("showNums") : t("hideNums"); }
}
function toggleSec(key){
  const set = HIDE_ALL ? REVEAL : HIDDEN;
  if(set.has(key)) set.delete(key); else set.add(key);
  applyHidden();
}
function toggleHidden(){
  HIDE_ALL = !HIDE_ALL; HIDDEN.clear(); REVEAL.clear();
  saveHidden(); applyHidden();
}


/* The top line answers "how current is this", so the two facts that belong to that
   question moved here off the overview: when the files themselves last changed, and
   whether anyone is still writing things down. They are one line, green while all is
   well, so they cost nothing to carry and are impossible to miss when they are not. */
function stamp(){
  const h=(Date.now()-BUILT)/36e5;
  /* No "just now". A page left open for an hour still said it, which is the one case
     where the phrase is actively wrong. A clock time cannot go stale. */
  /* One timestamp, not the same one twice. "just now" is gone because a page left
     open for an hour went on saying it. */
  const el=$("#stamp");
  el.textContent = t("read") + " · " + (h < 24
    ? BUILT.toLocaleString(loc(), {day:"2-digit", month:"short",
                                   hour:"2-digit", minute:"2-digit"})
    : Math.round(h/24) + t("dAgo") + " · " + BUILT.toLocaleDateString(loc(),
        {day:"2-digit", month:"short"}));
  el.classList.toggle("old",h>18);

  const bar=$("#livebar");
  if(!bar) return;
  const SV=D.saved||{}, H=D.health||{};
  const ago=iso=>{
    if(!iso) return null;
    const d=new Date(iso), hrs=(Date.now()-d)/36e5;
    return hrs<24 ? d.toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"})
                  : Math.round(hrs/24)+t("dAgo");
  };
  const bits=[];
  const planAge=ago(SV.plan), storeAge=ago(SV.store);
  if(planAge)  bits.push({k:t("savedPlan"),  v:planAge,  bad:(Date.now()-new Date(SV.plan))/36e5>30});
  if(storeAge) bits.push({k:t("savedStore"), v:storeAge, bad:(Date.now()-new Date(SV.store))/36e5>30});
  if(D.chef_last_day){
    const dd=Math.round((Date.now()-new Date(D.chef_last_day))/864e5);
    bits.push({k:t("savedChef"), v:dd<=0?t("just"):dd+t("dAgo"), bad:dd>1});
  }
  /* Named for what it measures: the longest any of the two people has gone without
     writing a line. "Written up" meant nothing to anybody. */
  if(H.chef_days!=null || H.ali_days!=null){
    const worst=Math.max(H.chef_days==null?0:H.chef_days, H.ali_days==null?0:H.ali_days);
    bits.push({k:t("healthShort"), v:worst<=0?t("healthOk"):worst+t("dAgo"), bad:worst>2});
  }
  bar.innerHTML = bits.map(b=>`<span class="lb ${b.bad?"bad":"ok"}">
      <i>${esc(b.k)}</i> ${esc(b.v)}</span>`).join("");
  bar.hidden = !bits.length;
}

function overall(){
  const bad=[], warn=[];
  const A=D.plans[0], last=D.last, M=D.month;
  if(D.today.verdict_code==="toomuch"||A.fits_code==="over") bad.push("today");
  else if(D.today.verdict_code==="overtime") warn.push("today");
  if(last && last.ratio!=null && (last.ratio<0.85||last.ratio>1.15)) warn.push("drift");
  if(M.verdict_code==="outofreach") bad.push("month");
  else if(M.verdict_code==="overtime") warn.push("month");
  return bad.length?"bad":warn.length?"warn":"ok";
}

/* ------------------------------------------------------------------ *
 *  Routing. One file, so a page is a state. The browser's back        *
 *  button is wired in, because on a phone the back swipe is the only  *
 *  way out of a detail view.                                          *
 * ------------------------------------------------------------------ */
/* The order Aziz reads them in: what happened, what is planned, what is left.
   Planning ideas is no longer a page of its own - the three plans are a block at the
   foot of Today's plan, which is where the question they answer is actually asked. */
const PAGES=["home","plan","shift","days","late","store","pcs","mat","month","rep","try","qc"];
let VIEW="home";
/* Where you came from, and where you were on that page.

   Tapping a card to open a detail page and then having to scroll the home page from the
   top again is the kind of small friction that stops people using a thing. The trail
   records the page and the scroll position, so Back returns you to the spot you left,
   not to the top of it. Only a trail, not a history: going Home clears it, because
   "back" from the start of a journey means nothing. */
let TRAIL = [];
function go(v, push){
  // Planning ideas used to be its own page; anyone with that link still has it.
  if(v === "ideas") v = "plan";
  const from = VIEW;
  if(v && v !== VIEW) TRAIL.push({v: from, y: window.scrollY});
  if(v === "home") TRAIL = [];
  if(TRAIL.length > 12) TRAIL.shift();
  VIEW = v || "home";
  if(push !== false){
    /* the page being left keeps its scroll position in its own history entry, so the
       phone's back gesture returns to the same spot, not to the top */
    try{ history.replaceState({v:from, y:window.scrollY}, ""); }catch(e){}
    history.pushState({v:VIEW}, "", "#"+VIEW);
  }
  window.scrollTo(0,0);
  render();
}
/* A line that summarises something opens the page AT that thing: the box Ali moved,
   the boxes the chef packed. Opening the page at its top left you hunting for it. */
let FOCUS=null;
function goFocus(v, f){ FOCUS=f||null; go(v); }
window.goFocus=goFocus;
function applyFocus(){
  if(!FOCUS) return;
  const f=FOCUS; FOCUS=null;
  const el=[...document.querySelectorAll("[data-focus]")].find(e=>e.dataset.focus===f);
  if(!el) return;
  if(el.tagName==="DETAILS") el.open=true;
  requestAnimationFrame(()=>{ el.scrollIntoView({block:"center"}); el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"),1800); });
}
function restoreY(y){
  requestAnimationFrame(()=>{ window.scrollTo(0,y||0);
    setTimeout(()=>window.scrollTo(0,y||0),120); });
}
/* Swipe left and right to change page.

   On a phone the menu is a row of eight small targets at the top, and reaching it means
   scrolling back up from wherever you were. A swipe is the gesture people already use.

   Three things keep it from firing by accident: it must be clearly horizontal (twice as
   much sideways as vertical), it must cover real distance, and it is ignored inside
   anything that scrolls sideways itself - the wide tables would otherwise change page
   when you tried to read their last column. Right-to-left Arabic flips the direction,
   because "next" follows the reading order, not the compass. */
let TOUCH = null;
function swipeInit(){
  const main = document.body;
  main.addEventListener("touchstart", e => {
    if(e.touches.length !== 1){ TOUCH = null; return; }
    const t = e.touches[0];
    TOUCH = { x: t.clientX, y: t.clientY, el: e.target };
  }, {passive:true});
  main.addEventListener("touchend", e => {
    if(!TOUCH) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - TOUCH.x, dy = t.clientY - TOUCH.y;
    const start = TOUCH; TOUCH = null;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    /* not inside a table or any other sideways-scrolling box */
    for(let el = start.el; el && el !== main; el = el.parentElement){
      if(el.scrollWidth > el.clientWidth + 8) return;
    }
    const i = PAGES.indexOf(VIEW);
    if(i < 0) return;
    const back = (L === "ar") ? (dx < 0) : (dx > 0);
    const j = back ? i - 1 : i + 1;
    if(j < 0 || j >= PAGES.length) return;
    go(PAGES[j]);
  }, {passive:true});
}

function goBack(){
  const prev = TRAIL.pop();
  if(!prev){ VIEW = "home"; history.pushState({v:"home"}, "", "#home"); render();
             window.scrollTo(0,0); return; }
  VIEW = prev.v;
  history.pushState({v:VIEW}, "", "#"+VIEW);
  render();
  /* after the new page has painted, not before */
  restoreY(prev.y||0);
}
window.go = go;
try{ history.scrollRestoration="manual"; }catch(e){}
addEventListener("popstate", e => {

function tbl(cols, rows, foot){
  return `<div class="scroll"><table><thead><tr>`
    + cols.map(c=>`<th class="${c.wrap?"wrap":""}">${c.h}</th>`).join("")
    + `</tr></thead><tbody>`
    + rows.map(r=>`<tr>`+r.map((c,i)=>`<td class="${cols[i]&&cols[i].wrap?"wrap":""}">${c}</td>`).join("")+`</tr>`).join("")
    + `</tbody>`
    + (foot?`<tfoot><tr>`+foot.map(c=>`<td style="font-weight:750;border-top:2px solid var(--line)">${c}</td>`).join("")+`</tr></tfoot>`:"")
    + `</table></div>`;
}
const dash = v => (v==null||v==="") ? `<span class="muted">—</span>` : v;

                shift:["vShift","vShiftSub"],store:["vStore","vStoreSub"],pcs:["vPcs","vPcsSub"],try:["vTry","vTrySub"],

               store:viewStore, pcs:viewPcs, month:viewMonth, try:viewTry, qc:viewQc, mat:viewMat};
  if(VIEW!=="home"){
    $("#main").className="detail";
    /* A view that throws used to leave the page blank with nothing said - the tasks page
       spent three days dead because one undefined name inside the calendar brought the
       whole view down and the failure was completely silent. A page that breaks should
       say so, in words, on the screen. */
    try {
      $("#main").innerHTML=VIEWS[VIEW]();
    } catch(err) {
      $("#main").innerHTML=`<div class="card"><div class="warnbox">
        <b>${t("viewBroke")}</b><br>

      return;

                     if(VIEW==="days") daysChart();
                     if(VIEW==="plan") ideasAfter(); if(VIEW==="qc") qcAfter(); },40);
    return;
  }
  $("#main").className="";
  renderHome();
  applyHidden();
}

/* entry motion: cards arrive in order, 45ms apart, once */
function stagger(){

  [...document.querySelectorAll("#main .card, #main .banner")].forEach((el,i)=>{
    el.classList.add("anim"); el.style.animationDelay=(i*45)+"ms";

}

/* ------------------------------------------------------------------ *
 *  The flavours behind a product's piece count.                       *
 *                                                                     *
 *  The overview says 30,097 Classic in the factory. The next question *
 *  is always "which Classic", and the answer was on another page in a *
 *  different table. A tap on the bar opens it here instead.           *
 *                                                                     *
 *  The two figures come from two sheets and will not always agree -   *
 *  the headline is the Dashboard's own count, the breakdown is the    *
 *  Stock sheet flavour by flavour. Where they differ the panel says   *
 *  so, rather than quietly showing a total that is not the one above. *
 * ------------------------------------------------------------------ */
function pcsOpen(product){
  const rows=((D.plan&&D.plan.flavours)||[])
    .filter(f=>(f.counts||f.product)===product && (f.stock||0)>0)
    .sort((a,b)=>(b.stock||0)-(a.stock||0));
  const head=(D.pieces||[]).find(p=>p.product===product);
  const sum=rows.reduce((s,f)=>s+(f.stock||0),0);
  const off=head && Math.abs((head.pcs||0)-sum) > Math.max(5, 0.01*(head.pcs||0));

  let body = rows.length
    ? tbl([{h:t("flavour"),wrap:true},{h:t("stockNow")},{h:t("share")}],
        rows.map(f=>[esc(f.flavour), n0(f.stock),
                     pc(sum?(f.stock||0)/sum:0)]),
        [t("totalRow"), n0(sum), ""])
    : `<div class="muted">${t("pcsNoDetail")}</div>`;
  if(off) body += `<div class="warnbox" style="margin-top:10px">${
      t("pcsOff").replace("{a}", n0(head.pcs)).replace("{b}", n0(sum))}</div>`;

  document.getElementById("pcsdlg")?.remove();
  document.body.insertAdjacentHTML("beforeend",
    `<div id="pcsdlg" class="sheet" onclick="if(event.target===this)this.remove()">
       <div class="sheetin">
         <div class="parthead"><div class="lbl">${esc(product)} · ${t("stockPcs")}</div>
           <button class="expbtn" onclick="this.closest('#pcsdlg').remove()">✕</button></div>
         ${body}
       </div></div>`);
}

function group(name, total, unit, rows, cols, open){
  if(!rows || !rows.length)
    return `<div class="fo"><span style="flex:1"><b>${esc(name)}</b></span>
      <b>${n0(total)}</b><span class="unit">${unit}</span></div>`;
  return `<details class="grp" ${open?"open":""}>
    <summary><span class="caret">\u276F</span>
      <span class="gname">${esc(name)}</span>
      <span class="gnum">${n0(total)}</span><span class="unit">${unit}</span>
      <span class="muted">${rows.length}</span></summary>
    <div class="inner">${tbl(cols, rows)}</div></details>`;
}

/* what changed today - the only place the two people's work meets */
/* What sales asked for above the month's target.

   Kept apart from the sales table on purpose. Inside that table it would read as one
   more column of a plan; on its own it reads as what it is - a list of quantities that
   will not be made unless somebody with the authority says so. */
/* Overtime, on the overview rather than buried in the last shift.

   It is a month-level number about money and about people's evenings, so it belongs
   where the month lives. Three figures rather than one: the total means little on its
   own, the per-day and per-person figures are the ones you can actually argue with. */
/* The overtime request: what is being asked for, and what refusing it costs.

   The request is never stored - it is read from the plan each time, because the plan
   changes all morning and a saved copy would be answering yesterday's question. Only
   the decision is kept, because a decision is a fact about a person. */
const OT = { rec: undefined, busy:false, err:"", why:false };

function isoOf(v){ return String(v||"").slice(0,10); }

function otLoad(){
  if(!QC_API || !QC.code || OT.rec !== undefined) return;
  OT.rec = null;
  qcPost({action:"otGet", managerCode:QC.code, date:isoOf(D.today.date)})
    .then(r=>{ if(r && r.ok) OT.rec = r.record; render(); })
    .catch(()=>{});
}

function otDecide(status){
  if(OT.busy) return;
  const DY=D.day||{};
  OT.busy=true; OT.err=""; render();
  qcPost({action:"otDecide", managerCode:QC.code, date:isoOf(D.today.date),
          status:status, hours:DY.extra_staff_h||0, cost:otReqCost()}, 25000)
    .then(r=>{ OT.busy=false;
      if(r && r.ok){ OT.rec=r.record; if(status==="declined") OT.why=true; }
      /* The backend answers with a named reason - bad_code, bad_date, setup_incomplete.
         Showing "something went wrong" instead meant a wrong stored code and a broken
         deployment looked identical, and neither could be acted on. */
      else OT.err = t("e_"+((r&&r.error)||"error")) + ((r&&r.error)?" ("+r.error+")":"");
      render(); })
    .catch(e=>{ OT.busy=false;
      OT.err = (e && e.name==="AbortError") ? t("e_timeout") : t("e_net")+" \u2014 "+e.message;
      render(); });
}

/* overtime is paid at the overtime rate (D.fc.rate), not the 10.6 average wage */
function otReqCost(){ const DY=D.day||{}; return Math.round((DY.extra_staff_h||0)*((D.fc&&D.fc.rate)||13.7)); }
function otRequest(){
  const DY=D.day||{};
  if(!DY.extra_staff_h || DY.extra_staff_h <= 0) return "";
  /* a few minutes over is inside the model's own error - say it, do not ask for a decision */
  const extraPP=(DY.per_person_h||0)-(DY.standard_h||8);
  if(extraPP < 0.5)
    return `<div class="card"><div class="src" style="margin:0">${t("otSmall",{m:n0(extraPP*60),h:n1(DY.extra_staff_h),c:n0(otReqCost()),s:sar()})}</div></div>`;
  otLoad();
  const rec=OT.rec, decided=rec && rec.status;
  const pill = decided
    ? `<span class="pill ${rec.status==="approved"?"p-ok":"p-bad"}">${
        t(rec.status==="approved"?"otApproved":"otDeclined")}${
        rec.at?` \u00B7 ${esc(String(rec.at).slice(11,16))}`:""}</span>`
    : `<span class="pill p-warn">${t("otPending")}</span>`;

  let h=`<h3>${t("otAskTitle")}</h3><div class="card otcard">
    <div class="row">
      <div><div class="lbl">${t("otExtraEach")}</div><div class="big">${
        n1((DY.per_person_h||0)-(DY.standard_h||0))}<span class="unit">${t("hours")}</span></div></div>
      <div><div class="lbl">${t("otExtraAll")}</div><div class="big" style="color:var(--warn)">${
        n1(DY.extra_staff_h)}<span class="unit">${t("hours")}</span></div></div>
      <div><div class="lbl">${t("otCost")}</div><div class="mid">${n0(otReqCost())}
        <span class="unit">${sar()}</span></div></div>
      <div><div class="lbl">${t("people")}</div><div class="mid">${n0(DY.staff_n||0)}</div></div>
    </div>
    <div style="margin-top:10px">${pill}</div>
    <div class="src">${t("otAskNote",{a:n0(DY.labour_h||0), b:n0(DY.capacity_h||0)})}</div>`;

  if(!QC.code){
    h+=`<div class="src">${t("otNeedCode")}</div>`;
  } else {
    h+=`<div class="dlgrow">
      <button class="go" ${OT.busy?"disabled":""} onclick="otDecide('approved')">${OT.busy?t("otBusy"):t("otApprove")}</button>
      <button class="go alt" ${OT.busy?"disabled":""} onclick="otDecide('declined')">${OT.busy?t("otBusy"):t("otDecline")}</button>
      <button class="go alt" onclick="OT.why=!OT.why;render()">${t("otWhat")}</button></div>`;
  }
  h+=`<div class="src">${t("otDecideNote")}</div>`;
  if(OT.err) h+=`<div class="warnbox">${esc(OT.err)}</div>`;

  if(OT.why || (decided && rec.status==="declined")){
    const st=(D.steps||[]);
    h+=`<div class="src" style="margin-top:10px"><b>${
        t("otCutNeeded",{n:n1(DY.extra_staff_h)})}</b></div>`;
    h+= st.length ? tbl([{h:t("otStep")},{h:t("hours")},{h:t("otShare")}],
          st.map(x=>[esc(x.step), n1(x.hours), pc(x.hours/(DY.labour_h||1))]),
          [t("totalRow"), n1(st.reduce((a,x)=>a+x.hours,0)), ""])
      : `<div class="muted">\u2014</div>`;
    h+=`<div class="src">${t("otCutNote")}</div>`;
  }
  return h+`</div>`;
}

/* ------------------------------------------------------------------ *
 *  Overtime: one block, three tenses.                                 *
 *                                                                     *
 *  There were two - a bill for the calendar month, and a forecast for *
 *  the pay run - sitting one above the other with no way to tell which *
 *  number belonged to which period. They are the same subject, so they *
 *  are one block now: what the closed run cost, what the current one   *
 *  has cost so far, and what the rest of it will cost if the orders    *
 *  stand.                                                             *
 *                                                                     *
 *  Everything here follows PAYROLL, the 21st to the 20th, because that *
 *  is the period Aziz is billed for. A calendar month would be a       *
 *  different number answering a question nobody asked.                 *
 * ------------------------------------------------------------------ */
function fcLine(k, srcKey, f){
  if(!f || !f.pieces) return "";
  const none = !f.ot;
  return `<div class="fcrow">
    <div class="lbl">${t(k)}</div>
    <div class="fcnums">
      <span>${n0(f.pieces)} <i>${t("pieces")}</i></span>
      <span class="arr">→</span>
      <span>${n0(f.hours)} <i>${t("fcHours")}</i></span>
      <span class="arr">→</span>

function otBlock(){
  const F=D.fc, M=D.month||{};
  if(!F) return "";
  const crew=F.crew||25, capDay=crew*8, need=M.hours_day||0, rate=F.rate||13.7;
  const otDay=Math.max(0, need-capDay), rest=otDay*(F.days_left||0);
  const so=F.ot_sofar||0, soC=F.cost_sofar!=null?F.cost_sofar:so*rate;
  let h=`<h3>${t("otRunTitle",{a:dmy(F.from), b:dmy(F.to)})}</h3><div class="card"><div class="row">
      <div><div class="lbl">${t("otSoFar")}</div><div class="big">${n0(so)}<span class="unit">${t("hours")}</span></div>
        <div class="src" style="margin-top:2px">${n1((so)/crew)} ${t("perHead")} \u00b7 ${n0(soC)} ${sar()}</div></div>
      <div><div class="lbl">${t("otRest",{b:dmy(F.to)})}</div><div class="big" style="color:${rest>0?"var(--warn)":"var(--ok)"}">${n0(rest)}<span class="unit">${t("hours")}</span></div>
        <div class="src" style="margin-top:2px">${n1((rest)/crew)} ${t("perHead")} \u00b7 ${n0(rest*rate)} ${sar()}</div></div>
      <div><div class="lbl">${t("otTotal")}</div><div class="mid">${n0(so+rest)}<span class="unit">${t("hours")}</span></div>
        <div class="src" style="margin-top:2px">${n1((so+rest)/crew)} ${t("perHead")} \u00b7 ${n0(soC+rest*rate)} ${sar()}</div></div>
    </div>`;
  h+=`<div class="src">${t("otRunWhy",{n:n0(need), c:n0(capDay), p:n0(crew), d:n0(F.days_left), b:dmy(F.to)})}</div>`;
  if(!rest) h+=`<div class="src">${t("otNoneLeft")}</div>`;
  /* the whole plan: what the month target costs in overtime to its last day */
  const mdl=M.days_left||0, mo=String((D.mtarget||{}).month||"").slice(0,10);
  if(mdl && mo){ const d0=new Date(mo+"T00:00:00"), end=new Date(d0.getFullYear(), d0.getMonth()+1, 0);
    const iso=end.getFullYear()+"-"+String(end.getMonth()+1).padStart(2,"0")+"-"+String(end.getDate()).padStart(2,"0");
    h+=`<div class="fcsec total" style="margin-top:10px"><div class="lbl">${t("otMonthTitle",{d:dmy(iso)})}</div>
      <div class="mid inl" style="margin-top:4px">${n0(otDay*mdl)} <span class="unit">${t("hours")}</span> \u00b7 ${n1(otDay*mdl/crew)} <span class="unit">${t("perHead")}</span> \u00b7 ${n0(otDay*mdl*rate)} ${sar()}</div>
      <div class="src">${t("otMonthWhy",{n:n0(mdl), o:n1(otDay/crew)})}</div></div>`; }
  const P=F.prev;
  if(P && P.ot!=null) h+=`<div class="src">${t("otPrevLine",{a:dmy(P.from), b:dmy(P.to), h:n0(P.ot), e:n1(P.each!=null?P.each:P.ot/crew), c:n0(P.cost), s:sar()})}</div>`;
  return h+`</div>`;
}

/* Which day a plan belongs to, in words. A date alone left the question open - is this
   today's plan, or yesterday's that nobody has replaced? - so it carries a badge. */
function todayIso(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayBadge(iso){
  iso=isoOf(iso); if(!iso) return "";
  const n=Math.round((new Date(todayIso()+"T00:00:00")-new Date(iso+"T00:00:00"))/864e5);
  if(n===0) return `<span class="pbadge today">${t("bToday")}</span>`;
  if(n===1) return `<span class="pbadge old">${t("bYesterday")}</span>`;
  if(n===-1) return `<span class="pbadge fut">${t("bTomorrow")}</span>`;
  return n>0 ? `<span class="pbadge old">${t("bAgo",{n:n0(n)})}</span>`
             : `<span class="pbadge fut">${t("bAhead",{n:n0(-n)})}</span>`;
}
function longDay(iso){ iso=isoOf(iso); return iso ? new Date(iso+"T00:00:00").toLocaleDateString(loc(),
  {weekday:"long", day:"numeric", month:"long", year:"numeric"}) : ""; }
function clock(iso){ if(!iso) return ""; const d=new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString(loc(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }
/* How far the chef has got: four stages, each recorded or not - never a zero for one
   that simply has not been written yet. */
function stageList(s){ s=s||{}; return [
  ["stPlan", s.plan_pcs||s.plan_boxes,
     s.plan_pcs ? n0(s.plan_pcs)+" "+t("pieces") : (s.plan_boxes ? n0(s.plan_boxes)+" "+t("boxes") : "")],
  ["stMade", s.made, s.made ? n0(s.made)+" "+t("pieces") : ""],
  ["stCoat", s.coated, s.coated ? n0(s.coated)+" "+t("pieces") : ""],
  ["stPacked", s.packed, s.packed ? n0(s.packed)+" "+t("boxes") : ""]]; }
function stageChips(s){
  return `<div class="stg">` + stageList(s).map(([k,on,txt])=>
    `<span class="${on?"on":""}">${on?"\u2713":"\u25CB"} ${t(k)} \u00b7 ${on&&txt?`<b>${txt}</b>`:t("stNone")}</span>`
  ).join("") + `</div>`;
}
function stageDots(s){

    stageList(s).map(([k,on])=>`<i class="${on?"on":""}"></i>`).join("") + `</span>`;

function dayStage(iso){
  iso=isoOf(iso);
  const x=(D.days||[]).find(d=>d.date===iso);
  return x ? {plan_pcs:x.plan, plan_boxes:x.plan_boxes, made:x.made, coated:x.coated, packed:x.packed} : null;
