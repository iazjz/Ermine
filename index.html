/* ================================================================== *
 *  Quality.                                                          *
 *                                                                    *
 *  The reports live in a private Google Sheet and the only way in is  *
 *  the Apps Script, which wants the manager code. That code is asked  *
 *  for here and kept in this browser: it is never built into the      *
 *  page, because the page is public and anyone holding the link would *
 *  otherwise hold the code too.                                       *
 *                                                                    *
 *  The request is a plain POST with a text/plain content type - the   *
 *  same shape the QC page itself uses - because Apps Script answers   *
 *  no CORS preflight, and any other content type triggers one.        *
 * ================================================================== */
var QC = { code: null, reports: null, state: "idle", err: "", days: 7, emp: "" };
try { QC.code = localStorage.getItem("erm-qccode"); } catch (e) {}

function qcPost(body){
  return fetch(QC_API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                         body: JSON.stringify(body) }).then(r=>r.json());
}

/* ---- tasks, live ----------------------------------------------------------
   The task list used to be a photograph: built into the page once a day from the
   spreadsheet, so ticking something on a phone changed a picture and nothing else.
   It now talks to the same Apps Script that holds quality, behind the same code, so
   a task added at the factory floor is a task, not a note that has to be retyped on
   a laptop later. The snapshot is kept only as a fallback for when the backend is
   unreachable, and is labelled as such rather than quietly standing in for the truth. */
const TK = { state:"idle", list:null, done:null, err:"", busy:false,
             showDone:false, adding:false };

function tkLoad(force){
  if(!QC_API || !QC.code) return;
  if(TK.state==="loading" || (TK.list && !force)) return;
  TK.state="loading"; TK.err=""; render();
  Promise.all([
    qcPost({action:"tasksList", managerCode:QC.code}),
    qcPost({action:"tasksList", managerCode:QC.code, archived:true})
  ]).then(([open,done])=>{
    if(open && open.ok){
      TK.list=open.tasks||[]; TK.done=(done&&done.ok&&done.tasks)||[]; TK.state="ready";
    } else {
      TK.state="error";
      TK.err=(open&&open.error==="bad_code")?t("qcBad"):t("tkFail");
      if(open&&open.error==="bad_code"){ QC.code=null; try{localStorage.removeItem("erm-qccode");}catch(e){} }
    }
    render();
  }).catch(e=>{ TK.state="error"; TK.err=t("tkFail")+" — "+e.message; render(); });
}

function tkDone(id, done){
  if(TK.busy) return;
  TK.busy=true; render();
  qcPost({action:"tasksDone", managerCode:QC.code, id:id, done:done})
    .then(res=>{
      TK.busy=false;
      /* The old version ignored the reply and reloaded regardless. A refused tick then
         looked exactly like a successful one that had not moved - the card sat where it
         was and said nothing. Now a refusal says so. */
      if(res && res.ok){ tkLoad(true); return; }
      TK.err=(res && res.error==="bad_code") ? t("qcBad") : ((res && res.error) || t("tkFail"));
      render();
    })
    .catch(e=>{ TK.busy=false; TK.err=t("tkFail")+" \u2014 "+e.message; render(); });
}

function tkSave(){
  const g=id=>{const el=document.getElementById(id); return el?el.value.trim():"";};
  const title=g("tk-title");
  if(!title){ TK.err=t("tkNeedTitle"); render(); const el=document.getElementById("tk-title"); if(el) el.focus(); return; }
  if(TK.busy) return;
  TK.busy=true; TK.err=""; render();
  qcPost({action:"tasksSave", managerCode:QC.code, task:{
    title:title, owner:g("tk-owner"), section:g("tk-section"), due:g("tk-due"),
    time:g("tk-time"), priority:g("tk-prio")||"Medium", status:"To do",
    repeat:g("tk-repeat"), notes:g("tk-notes")}})
    .then(res=>{ TK.busy=false;
      if(res&&res.ok){ TK.adding=false; tkLoad(true); }
      else { TK.err=(res&&res.error)||t("tkFail"); render(); } })
    .catch(e=>{ TK.busy=false; TK.err=t("tkFail")+" — "+e.message; render(); });
}

function qcLoad(){
  if(!QC_API){ QC.state="noapi"; render(); return; }
  QC.state="loading"; QC.err="";
  // pull a wide window once and filter in the page: the backend round trip is the
  // slow part, and changing the filter should not pay for it again.
  const to=new Date(), from=new Date(to.getTime()-90*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  qcPost({action:"list", managerCode:QC.code, from:iso(from), to:iso(to)})
    .then(res=>{
      if(res && res.ok){ QC.reports=res.reports||[]; QC.sheetUrl=res.sheetUrl||""; QC.state="ready"; }
      else { QC.state="gate"; QC.err=(res&&res.error==="bad_code")?t("qcBad"):(res&&res.error)||t("qcFail");
             QC.code=null; try{localStorage.removeItem("erm-qccode");}catch(e){} }
      render();
    })
    .catch(e=>{ QC.state="gate"; QC.err=t("qcFail")+" — "+e.message; render(); });
}
window.qcSubmitCode=function(){
  const v=(document.querySelector("#qccode")||{}).value||"";
  if(!v.trim()) return;
  QC.code=v.trim(); try{localStorage.setItem("erm-qccode",QC.code);}catch(e){}
  // On the tasks page there is nothing to fetch - the tasks are already in the page -
  // so unlock and redraw. On the quality page the code still has to be proved against
  // the backend, and a wrong one is cleared again there.
  if(VIEW==="tasks") render(); else qcLoad();
};
window.qcSetDays=function(d){ QC.days=d; render(); };
window.qcSetEmp=function(e){ QC.emp=e||""; render(); };
window.qcForget=function(){
  QC.code=null; QC.reports=null; QC.state="idle"; QC.err="";
  try{localStorage.removeItem("erm-qccode");}catch(e){}
  render();
};

function qcAfter(){
  if(QC.state==="idle"){ if(QC.code) qcLoad(); else { QC.state="gate"; render(); } return; }
  if(QC.state==="ready") qcChart();
}

const QCSEC = s => t("qcSec"+(s||"").charAt(0).toUpperCase()+(s||"").slice(1)) || s;
/* Inside a report the checklist items carry their own section name from the catalogue
   (before, after, receiving, cold, freezer, safety, preventive, facility, weekly), so
   they are grouped by it rather than dumped as one long list. */
const CHKSEC = id => t("chk_"+(id||"other")) || id;

/* Everything that is a SUGGESTION rather than a fact lives here, kept together and
   labelled as proposals - on the overview these were read as decisions already taken.

   Was a page of its own. The three plans and the headcount question answer "what
   should today be", which is the question Today's plan asks - so they live at the
   foot of it now rather than one tap away. */
function ideasBlock(){
  let h=`<h3>${t("ideasHead")}</h3><div class="card">`;
  h+=`<div class="lbl" style="margin:0 0 2px">${t("focus")}</div>
      <div class="src" style="margin:0 0 8px">${t("focusSub")}</div>`;
  (D.focus||[]).forEach(f=>{
    const mk = f.kind==="make";
    h+=`<div class="lbl" style="margin-top:10px">${mk?t("focusMake"):t("focusPack")}</div>
        <div class="src" style="margin:1px 0 4px">${mk?t("focusMakeSrc"):t("focusPackSrc")}</div>`;
    (f.items||[]).forEach(i=>h+=`<div class="fo"><span style="flex:1">${esc(i.box)}</span>
      <b>${n0(i.n)}</b><span class="unit">${t("boxes")}</span>
      ${i.hours?`<span class="muted">${n0(i.hours)} ${t("hours")}</span>`:""}</div>`);
  });
  /* The two lists were read as one instruction - make this, then pack that - when they
     are two separate counts from two separate sources that happen to overlap. */
  h+=`<div class="src" style="margin-top:11px">${t("focusBoth")}</div></div>`;

  h+=`<h3>${t("suggested")}</h3><div class="card"><div class="scroll"><table>
    <thead><tr><th></th><th>${t("pieces")}</th><th>${t("boxes")}</th><th>${t("hours")}</th>
      <th>${t("wages")}</th><th class="wrap">${t("still")}</th></tr></thead><tbody>`
    + (D.plans||[]).map(p=>`<tr><td><b>${esc(p.name)}</b>${
         (p.pcs===0&&(p.boxes||0)>0)?`<span class="sub2">${t("nothingToMake")}</span>`:""
       }</td><td>${n0(p.pcs)}</td>

    + `</tbody></table></div></div>`;

function viewMat(){
  const M=(D.materials||[]);
  if(!M.length) return `<div class="card"><div class="muted">${t("matOk")}</div>
    <div class="src">${t("matNote")}</div></div>`;
  const neg=M.filter(x=>x.negative), low=M.filter(x=>!x.negative);
  const rows=list=>tbl(
    [{h:t("matItem"),wrap:true},{h:t("matUnit")},{h:t("matLeft")},{h:t("matNeed")},{h:t("matAct")}],
    list.map(x=>[
      `${esc(x.item)}<span class="sub2">${esc(x.tab)}</span>`,
      `<span class="muted">${esc(x.unit)}</span>`,
      x.left==null?dash(null)
        :`<b style="color:${x.negative?"var(--bad)":"var(--warn)"}">${n1(x.left)}</b>`,
      x.need==null?dash(null):n1(x.need),
      x.action?`<span class="pill ${/make|need/i.test(x.action)?"p-bad":"p-ok"}">${esc(x.action)}</span>`:""]));
  let h=`<div class="card"><div class="row">
      <div><div class="lbl">${t("matNeg")}</div>
        <div class="big" style="color:${neg.length?"var(--bad)":"var(--ok)"}">${n0(neg.length)}</div></div>
      <div><div class="lbl">${t("matLow")}</div>
        <div class="big" style="color:${low.length?"var(--warn)":"var(--ok)"}">${n0(low.length)}</div></div>
    </div></div>`;
  /* Grouped by what the thing IS - chocolate is not a cardboard box and does not get
     reordered the same way - and inside each group the worst line is first, because the
     order within a kind is the order of danger. */
  const KIND={"Raw Materials":"matRaw","Consumables":"matCons","Packaging":"matPack"};
  (D.mat_groups||Object.keys(KIND)).forEach(g=>{
    const inG=M.filter(x=>x.tab===g);
    if(!inG.length) return;
    const nneg=inG.filter(x=>x.negative).length;
    h+=`<h3>${t(KIND[g]||"matLow")} <span class="n">${inG.length}</span></h3>
      <div class="card">
        <div class="src" style="margin:0 0 8px">${t("matWorst")}${
          nneg?` · <b style="color:var(--bad)">${n0(nneg)} ${t("matNeg").toLowerCase()}</b>`:""}</div>
        ${rows(inG)}</div>`;
  });
  h+=`<div class="card"><div class="src">${t("matNote")}</div></div>`;
  return h;
}

/* A month grid, because a list answers "what is late" and a calendar answers "what is
   this week actually going to feel like" - and those are different questions. Sunday
   first, which is how a Saudi working week reads. */
const CAL = { ym:null, day:null, mode:"list" };

function monthName(y,m){
  return new Date(y,m,1).toLocaleDateString(loc(),{month:"long",year:"numeric"});
}
function ymKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function isoDay(y,m,d){
  return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}

function calView(tasks){
  const today=new Date().toISOString().slice(0,10);
  if(!CAL.ym) CAL.ym=today.slice(0,7);
  const [Y,M]=CAL.ym.split("-").map(Number), y=Y, m=M-1;
  const first=new Date(y,m,1), lead=first.getDay();          /* 0 = Sunday */
  const days=new Date(y,m+1,0).getDate();

  const byDay={};
  tasks.forEach(t=>{ if(t.due){ (byDay[t.due]=byDay[t.due]||[]).push(t); } });

  const dow=(L==="ar"?["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"]
                     :["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]);
  let h=`<div class="card calcard">
    <div class="calbar">
      <button class="calnav" onclick="calStep(-1)" aria-label="prev">‹</button>
      <b>${esc(monthName(y,m))}</b>
      <button class="calnav" onclick="calStep(1)" aria-label="next">›</button>
      <button class="go sm" onclick="calToday()">${t("tkToday")}</button>
    </div>
    <div class="calgrid calhead">${dow.map(d=>`<div>${d}</div>`).join("")}</div>
    <div class="calgrid">`;
  for(let i=0;i<lead;i++) h+=`<div class="celloff"></div>`;
  for(let d=1;d<=days;d++){
    const iso=isoDay(y,m,d), list=byDay[iso]||[];
    const open=list.filter(x=>x.status!=="Done");
    const late=open.filter(x=>iso<today).length;
    h+=`<button class="cell${iso===today?" is-today":""}${CAL.day===iso?" is-sel":""}"
         onclick="calPick('${iso}')">
      <span class="dnum">${d}</span>
      ${list.length?`<span class="dots">${open.slice(0,3).map(x=>
         `<i class="${x.priority==="High"?"p1":x.priority==="Low"?"p3":"p2"}${late?" late":""}"></i>`).join("")}${
         open.length>3?`<span class="more">+${open.length-3}</span>`:""}</span>`:""}
    </button>`;
  }
  h+=`</div></div>`;

  if(CAL.day){
    const list=(byDay[CAL.day]||[]);
    h+=`<h3>${esc(dmy(CAL.day))} <span class="n">${list.length}</span></h3>`;
    h+= list.length ? `<div class="tkcol">${list.map(tkCard).join("")}</div>`
                    : `<div class="card"><div class="muted">${t("tkNoDay")}</div></div>`;
  }
  return h;
}
function calStep(n){
  const [y,m]=CAL.ym.split("-").map(Number);
  const d=new Date(y,m-1+n,1); CAL.ym=ymKey(d); CAL.day=null; render();
}
function calToday(){ const t=new Date(); CAL.ym=ymKey(t); CAL.day=t.toISOString().slice(0,10); render(); }
function calPick(iso){ CAL.day = CAL.day===iso?null:iso; render(); }
let tkCard = x => "";

/* Remembering a fold is slightly awkward because "closed" has to mean different things
   for the archive and for everything else: the archive defaults to shut and the rest
   default to open, so the stored list records departures from each default rather than a
   plain list of closed sections. */
function tkToggleAdd(){ TK.adding = !TK.adding; TK.err = ""; render(); }

function tkFold(key, open){
  let shut=[];
  try{ shut = JSON.parse(localStorage.getItem("erm-tkshut")||"[]"); }catch(e){}
  const mark = key==="tkDone" ? "!"+key : key;
  const want = key==="tkDone" ? open : !open;
  const i = shut.indexOf(mark);
  if(want && i===-1) shut.push(mark);
  if(!want && i!==-1) shut.splice(i,1);
  try{ localStorage.setItem("erm-tkshut", JSON.stringify(shut)); }catch(e){}
}

function viewTasks(){
  // Behind the same code as quality. The page is public, so a task list sitting on it
  // unguarded is a list of what the factory is worried about, readable by anyone with
  // the address. Same code, same storage, same single place to revoke it.
  if(!QC.code){
    return codeGate(t("tkGate"));
  }
  if(TK.state==="idle" || (TK.state==="ready" && !TK.list)) tkLoad();
  if(TK.state==="loading") return `<div class="card"><div class="muted">${t("tkLoading")}</div></div>`;

  /* Live when the backend answers; the build-time snapshot only as a fallback, and
     said out loud, because a stale list that looks live is worse than no list. */
  const live = TK.state==="ready" && Array.isArray(TK.list);
  /* If the rows carry Notion links, this list is a mirror and the page is a window, not
     a form. Showing an add button that writes somewhere Notion will overwrite within the
     hour would be worse than showing nothing. */
  const fromNotion = live && (TK.list||[]).concat(TK.done||[])
      .some(x => String(x.notes||"").indexOf("notion.so/") !== -1);
  const T2 = live ? TK.list.concat(TK.done||[])
                  : (D.tasks||[]).map(x=>({...x, id:x.id||"", notes:x.notes||""}));

  let head=`<div class="card"><div class="row" style="align-items:center">
      <div><span class="pill ${live?"p-ok":"p-warn"}">${live?t("tkLive"):t("tkSnap")}</span></div>
      ${fromNotion?`<div><span class="pill p-ok">${t("tkFromNotion")}</span></div>`:""}
      ${live&&!fromNotion?`<div style="margin-inline-start:auto"><button class="go"
         onclick="tkToggleAdd()">${TK.adding?t("tkCancel"):"+ "+t("tkAdd")}</button></div>`:""}
    </div>
    ${TK.err?`<div class="warnbox" style="margin-top:9px">${esc(TK.err)}</div>`:""}</div>`;

  if(fromNotion){
    head+=`<div class="card"><div class="src">${t("tkReadOnly")}
      <br><a href="https://www.notion.so/${"3d3dbbef516880919469cc5d8e30760e"}"
        target="_blank" rel="noopener">${t("tkOpenNotion")}</a></div></div>`;
  }

  if(live && !fromNotion && TK.adding){
    const opt=(v,l,sel)=>`<option value="${v}"${sel?" selected":""}>${l}</option>`;
    head+=`<div class="card tkform">
      <label>${t("tkTitle")}</label>
      <input id="tk-title" autocomplete="off" enterkeyhint="done">
      <div class="tkgrid">
        <div><label>${t("tkOwner")}</label><input id="tk-owner" autocomplete="off"></div>
        <div><label>${t("tkDue")}</label><input id="tk-due" type="date"></div>
        <div><label>${t("tkTime")}</label><input id="tk-time" type="time"></div>
        <div><label>${t("tkPrio")}</label><select id="tk-prio">
          ${opt("High",t("prHigh"))}${opt("Medium",t("prMed"),true)}${opt("Low",t("prLow"))}</select></div>
        <div><label>${t("tkRepeat")}</label><select id="tk-repeat">
          ${opt("",t("rpNone"),true)}${opt("Daily",t("rpDaily"))}${opt("Weekly",t("rpWeekly"))}
          ${opt("Every 2 weeks",t("rpFort"))}${opt("Monthly",t("rpMonthly"))}${opt("Quarterly",t("rpQuarterly"))}</select></div>
        <div><label>${t("tkNotes")}</label><input id="tk-notes" autocomplete="off"></div>
      </div>
      <div class="dlgrow"><button class="go" onclick="tkSave()"${TK.busy?" disabled":""}>
        ${TK.busy?t("tkSaving"):t("tkSaveBtn")}</button></div></div>`;
  }

  if(!T2.length) return head+`<div class="card"><div class="muted">${t("tkNone")}</div>
    <div class="src">${t("tkNote")}</div></div>`;

  const today=new Date().toISOString().slice(0,10);
  const wk=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const open=T2.filter(x=>x.status!=="Done");
  const buckets=[
    ["tkOverdue", open.filter(x=>x.due&&x.due<today),            "var(--bad)"],
    ["tkToday",   open.filter(x=>x.due===today),                 "var(--warn)"],
    ["tkWeek",    open.filter(x=>x.due&&x.due>today&&x.due<=wk), "var(--teal)"],
    ["tkLater",   open.filter(x=>x.due&&x.due>wk),               "var(--green)"],
    ["tkNoDate",  open.filter(x=>!x.due),                        "var(--dim)"],
    ["tkDone",    T2.filter(x=>x.status==="Done"),               "var(--dim)"]];

  /* the three numbers worth a glance before any list */
  let h=head+`<div class="card"><div class="row">`
    + buckets.slice(0,3).map(([k,list,col])=>`<div><div class="lbl">${t(k)}</div>
        <div class="big" style="color:${list.length?col:"var(--dim)"}">${n0(list.length)}</div></div>`).join("")
    + `</div></div>`;

  tkCard = x => {
    const late = x.due && x.due < today && x.status !== "Done";
    const now  = x.due === today && x.status !== "Done";
    const pr   = x.priority==="High" ? "p-high" : x.priority==="Medium" ? "p-med" : "";
    const box = live && !fromNotion && x.id
      ? `<button class="tkbox${x.status==="Done"?" on":""}" ${TK.busy?"disabled":""}
           aria-label="${x.status==="Done"?t("tkUndo"):t("tkTick")}"
           onclick="tkDone('${esc(x.id)}',${x.status!=="Done"})">${x.status==="Done"?"\u2713":""}</button>`
      : "";
    return `<div class="tkcard ${pr} ${x.status==="Done"?"is-done":""}">
      <div class="tktitle">${box}<span>${esc(x.title)}</span></div>
      <div class="tkmeta">
        ${x.due?`<span class="tag due ${late?"late":now?"now":""}">${esc(dmy(x.due))}</span>`:""}
        ${(x.project||x.section)?`<span class="tag">${esc(x.project||x.section)}</span>`:""}
        ${x.owner?`<span class="tag">${esc(x.owner)}</span>`:""}
        ${x.repeat?`<span class="tag">↻ ${esc(x.repeat)}</span>`:""}
        ${x.status&&x.status!=="To do"?`<span class="tag">${esc(x.status)}</span>`:""}
      </div>
      ${x.notes?`<div class="tknote">${esc(x.notes)}</div>`:""}
    </div>`;
  };

  /* The month grid is always here, above the list - the way Notion shows it. The
     list/calendar switch is gone: it was reported broken three times, and a control
     that keeps needing explaining is already the wrong control. Nothing to press is
     nothing to fail. */
  h+=`<h3>${t("tkCal")}</h3>` + calView(T2);

  /* Each bucket folds. The archive holds fifty-seven finished tasks and unfolded it
     buries the eight that are still open under a page and a half of work already done -
     so it starts shut, and the open buckets start open. Which ones you left open is
     remembered on this device, because a list you have to re-open every visit is a list
     you stop opening. */
  const shut = (()=>{ try{ return JSON.parse(localStorage.getItem("erm-tkshut")||"[]"); }
                      catch(e){ return []; } })();
  const isShut = k => k==="tkDone" ? shut.indexOf(k)!==-1 || shut.indexOf("!"+k)===-1
                                   : shut.indexOf(k)!==-1;

  h+=`<div class="tkwrap">`
    + buckets.filter(([,list])=>list.length).map(([k,list,col])=>`<details class="tkcol"
        ${isShut(k)?"":"open"} ontoggle="tkFold('${k}',this.open)">
        <summary class="tkhead"><span class="caret">\u276F</span>
          <span class="dot" style="background:${col}"></span>
          <span style="flex:1">${t(k)}</span> <span class="cnt">${list.length}</span></summary>
        <div class="tkbody">${list.map(tkCard).join("")}</div></details>`).join("")
    + `</div>`;

  h+=`<div class="card" style="margin-top:12px"><div class="src">${
      live?t("tkLiveNote")+"<br>":""}${t("tkNote")}<br>
      <a href="#" onclick="qcForget();return false;">${t("qcForget")}</a></div></div>`;
  return h;
}

function viewQc(){
  if(!QC_API) return `<div class="card"><div class="warnbox">${t("qcNoApi")}</div></div>`;
  if(QC.state==="loading") return `<div class="card"><div class="muted">${t("qcLoading")}</div></div>`;
  if(QC.state!=="ready"){
    return codeGate(t("qcGateSub"));
  }

  const R=QC.reports||[];
  const days=[...new Set(R.map(r=>r.date))].sort().reverse();
  const latest=days[0];
  const today=R.filter(r=>r.date===latest);
  let h="";

  /* ---- the latest check ---- */
  h+=`<h3>${t("qcToday")} ${latest?`<span class="n">${esc(dmy(latest))}</span>`:""}</h3>`;
  if(!today.length){
    h+=`<div class="card"><div class="muted">${t("qcNoToday")}</div></div>`;
  } else {
    h+=today.map(r=>`<div class="card"><div class="row">
        <div><div class="lbl">${t("qcBy")}</div><div class="mid">${esc(r.employee)}</div></div>
        <div><div class="lbl">${t("qcShift")}</div><div class="mid">${
          r.shift==="evening"?t("qcEvening"):t("qcMorning")}</div></div>
        <div><div class="lbl">${t("qcDone")}</div><div class="mid">${n0(r.done)}<span class="unit">/${n0(r.total)}</span></div></div>
        <div><div class="lbl">${t("qcIssues")}</div><div class="big" style="color:${
          r.issues?"var(--bad)":"var(--ok)"}">${n0(r.issues)}</div></div>
      </div>${r.notes?`<div class="muted" style="margin-top:9px">${esc(r.notes)}</div>`:""}</div>`).join("");
  }

  /* ---- what failed ---- */
  const bad=[];
  const SECOF = k => k==="units" ? "temperature"
                   : k==="zones" ? "cleanliness"
                   : k==="hyg"   ? "hygiene" : "checks";
  R.forEach(r=>["units","zones","hyg","checks"].forEach(k=>(r.items&&r.items[k]||[]).forEach(it=>{
    if(it.status==="bad") bad.push({d:r.date, who:r.employee, sec:SECOF(k), it:it});
  })));
  const badToday=bad.filter(b=>b.d===latest);
  h+=`<h3>${t("qcOpen")} <span class="n">${badToday.length}</span></h3><div class="card">`;
  h+= badToday.length ? tbl([{h:t("qcSection")},{h:t("qcItem"),wrap:true},{h:t("qcNote"),wrap:true},{h:t("qcBy")}],
        badToday.map(b=>[QCSEC(b.sec), esc(L==="ar"?(b.it.ar||b.it.en):(b.it.en||b.it.ar)),
                         `<span class="muted">${esc(b.it.note||"")}</span>`, esc(b.who)]))
    : `<div class="muted">${t("qcNoOpen")}</div>`;
  h+=`</div>`;

  /* ---- temperatures past their limit ---- */
  const hot=[];
  today.forEach(r=>(r.items&&r.items.units||[]).forEach(u=>{
    if(u.temp==null||u.limit==null) return;
    const over=(u.type==="freezer") ? (u.temp>u.limit) : (u.temp>u.limit);
    if(over) hot.push({u:u, who:r.employee});
  }));
  h+=`<h3>${t("qcTemps")} <span class="n">${hot.length}</span></h3><div class="card">`;
  h+= hot.length ? tbl([{h:t("qcItem"),wrap:true},{h:t("qcReading")},{h:t("qcLimit")},{h:t("qcOver")}],
        hot.map(x=>[esc(L==="ar"?(x.u.ar||x.u.en):(x.u.en||x.u.ar)),
                    `<b style="color:var(--bad)">${n1(x.u.temp)}°</b>`, n1(x.u.limit)+"°",
                    `<span class="ou dn">${n1(x.u.temp-x.u.limit)}°</span>`]))
    : `<div class="muted">${t("qcNoTemps")}</div>`;
  h+=`</div>`;

  /* ---- the filter, then every report, each one openable ---- */
  // Seven days by default. The fetch brings ninety, but a page that opens on three
  // months of checks buries today's under scrolling, and today's is the one that
  // matters most mornings.
  const chip=(v,lbl)=>`<button class="opt" style="display:inline-block;width:auto;
      margin:0 6px 0 0;padding:6px 12px;font-size:12.5px;${
      QC.days===v?"border-color:var(--green);background:var(--okbg)":""}"
      onclick="qcSetDays(${v})">${lbl}</button>`;
  const names=[...new Set((QC.reports||[]).map(r=>r.employee))].sort();
  h+=`<h3>${t("qcFilter")}</h3><div class="card">
    <div>${chip(7,t("qcLast7"))}${chip(30,t("qcLast30"))}${chip(0,t("qcAll"))}</div>
    <div style="margin-top:10px">
      <select onchange="qcSetEmp(this.value)" style="width:100%;padding:9px 11px;
        border:1.5px solid var(--line);border-radius:10px;background:var(--bg);
        color:var(--ink);font:inherit">
        <option value=""${QC.emp?"":" selected"}>${t("qcAllEmp")}</option>
        ${names.map(nm=>`<option value="${esc(nm)}"${QC.emp===nm?" selected":""}>${esc(nm)}</option>`).join("")}
      </select></div></div>`;

  const cut = QC.days ? new Date(Date.now()-QC.days*864e5).toISOString().slice(0,10) : "0000-00-00";
  const shown = R.filter(r=>r.date>=cut && (!QC.emp || r.employee===QC.emp));

  /* per-employee summary, over the filtered window */
  const byEmp={};
  shown.forEach(r=>{ const e=byEmp[r.employee]=byEmp[r.employee]||{n:0,iss:0,last:""};
                     e.n++; e.iss+=(r.issues||0); if(r.date>e.last) e.last=r.date; });
  const emps=Object.entries(byEmp).sort((a,b)=>b[1].n-a[1].n);
  if(emps.length){
    h+=`<h3>${t("qcByEmp")}</h3><div class="card">`+tbl(
        [{h:t("qcBy")},{h:t("qcChecks")},{h:t("qcIssues")},{h:t("qcLast")}],
        emps.map(([nm,e])=>[
          `<a href="#" onclick="qcSetEmp('${esc(nm).replace(/'/g,"\\'")}');return false;">${esc(nm)}</a>`,
          n0(e.n),
          e.iss?`<span class="ou dn">${n0(e.iss)}</span>`:`<span class="ou up">0</span>`,
          esc(dmy(e.last))]))
      +`</div>`;
  }

  /* every report in the window, each opening on the checklist as it was filled */
  h+=`<h3>${t("qcReports")} <span class="n">${shown.length}</span></h3>`;
  h+= shown.length ? shown.map(r=>{
        const secs=[["checks","checks"],["units","temperature"],
                    ["zones","cleanliness"],["hyg","hygiene"]];
        let inner="";
        secs.forEach(([k,sec])=>{
          const list=(r.items&&r.items[k])||[];
          if(!list.length) return;
          /* The checklist is long enough that one flat table is unreadable, so it is
             grouped by the catalogue's own sections - the same grouping the person saw
             while filling it in. */
          if(k==="checks"){
            const order=[], byS={};
            list.forEach(it=>{ const g=it.section||"other";
                               if(!byS[g]){ byS[g]=[]; order.push(g); } byS[g].push(it); });
            order.forEach(g=>{
              const done=byS[g].filter(x=>x.status).length, badN=byS[g].filter(x=>x.status==="bad").length;
              inner+=`<div class="lbl" style="margin:10px 0 4px">${esc(CHKSEC(g))}
                 <span class="muted">${done}/${byS[g].length}${badN?" · "+badN+" \u2717":""}</span></div>`
                + tbl([{h:t("qcItem"),wrap:true},{h:""},{h:t("qcNote"),wrap:true}],
                    byS[g].map(it=>[
                      esc(L==="ar"?(it.ar||it.en):(it.en||it.ar)),
                      it.status==="ok" ?`<span class="pill p-ok">${t("qcStatusOk")}</span>`
                       :it.status==="bad"?`<span class="pill p-bad">${t("qcStatusBad")}</span>`
                       :`<span class="muted">\u2014</span>`,
                      `<span class="muted">${esc(it.note||"")}</span>`]));
            });
            return;
          }
          inner+=`<div class="lbl" style="margin:10px 0 4px">${QCSEC(sec)}</div>`
            + tbl([{h:t("qcItem"),wrap:true},
                   ...(k==="units"?[{h:t("qcReading")},{h:t("qcLimit")}]:[]),
                   {h:""},{h:t("qcNote"),wrap:true}],
                list.map(it=>[
                  esc(L==="ar"?(it.ar||it.en):(it.en||it.ar)),
                  ...(k==="units"?[
                      it.temp==null?dash(null)
                        :`<b style="color:${it.status==="bad"?"var(--bad)":"var(--ink)"}">${n1(it.temp)}°</b>`,
                      it.limit==null?dash(null):n1(it.limit)+"°"]:[]),
                  it.status==="ok" ?`<span class="pill p-ok">${t("qcStatusOk")}</span>`
                   :it.status==="bad"?`<span class="pill p-bad">${t("qcStatusBad")}</span>`
                   :`<span class="muted">${t("qcStatusNone")}</span>`,
                  `<span class="muted">${esc(it.note||"")}</span>`]));
        });
        return `<details class="grp">
          <summary><span class="caret">❯</span>
            <span class="gname">${esc(dmy(r.date))} · ${esc(r.employee)}</span>
            <span class="muted">${r.shift==="evening"?t("qcEvening"):t("qcMorning")}</span>
            <span class="gnum">${n0(r.done)}<span class="unit">/${n0(r.total)}</span></span>
            <span class="pill ${r.issues?"p-bad":"p-ok"}">${n0(r.issues)}</span>
          </summary>
          <div class="inner">
            ${r.notes?`<div class="muted" style="margin:6px 0">${esc(r.notes)}</div>`:""}
            ${inner||`<div class="muted">${t("qcStatusNone")}</div>`}
            <div class="src">${t("qcOpenFull")} · ${t("qcFetched")} ${esc(String(r.submittedAt).slice(11,16))}</div>
          </div></details>`;
      }).join("")
    : `<div class="card"><div class="muted">${t("qcNone")}</div></div>`;

  /* ---- the last fortnight ---- */
  h+=`<h3>${t("qcTrend")}</h3><div class="card">
      <div class="chartbox"><canvas id="c-qc"></canvas></div>
      <div class="src">${QC.sheetUrl?`<a href="${esc(QC.sheetUrl)}" target="_blank" rel="noopener">${t("qcSheet")}</a> · `:""}
      <a href="#" onclick="qcForget();return false;">${t("qcForget")}</a></div></div>`;
  return h;
}

function qcChart(){
  const R=QC.reports||[]; if(!R.length) return;
  const by={};
  R.forEach(r=>{ const d=by[r.date]=by[r.date]||{done:0,total:0,iss:0};
                 d.done+=r.done||0; d.total+=r.total||0; d.iss+=r.issues||0; });
  const days=Object.keys(by).sort().slice(-14);
  chart("c-qc",{data:{labels:days.map(d=>dmy(d)),
    datasets:[
      {type:"bar",label:t("qcIssues"),data:days.map(d=>by[d].iss),
       backgroundColor:css("--red"),borderRadius:4,yAxisID:"y"},
      {type:"line",label:t("qcPctDone"),yAxisID:"y1",
       data:days.map(d=>by[d].total?Math.round(100*by[d].done/by[d].total):null),
       borderColor:css("--teal"),tension:.3,pointRadius:2.5,fill:false}]},
    options:{plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
      scales:{y:{beginAtZero:true},
              y1:{position:"right",beginAtZero:true,suggestedMax:100,
                  grid:{drawOnChartArea:false},ticks:{callback:v=>v+"%"}}}}});
}


/* ================================================================== *
 *  The last seven days.                                              *
 *                                                                    *
 *  Until now the page could show today's plan and the last shift's   *
 *  output, and nothing in between: the question "did the week do     *
 *  what it said it would" had no page to be asked on.                *
 *                                                                    *
 *  Two sources, kept apart on purpose. PLANNED is the page's own      *
 *  daily copy of the plan column, because the workbook clears that    *
 *  column every morning and after today nothing else remembers it.    *
 *  Everything else comes from the Actual Log, which the chef          *
 *  corrects and which is therefore final. Where the flavour snapshot  *
 *  disagrees with the log - it was taken mid-afternoon, the chef kept *
 *  working - the log wins and the snapshot says what time it was      *
 *  taken, rather than the two being quietly averaged into a number    *
 *  that is nobody's.                                                 *
 * ================================================================== */
/* The workbook writes this column in English, and it went straight onto the Arabic
   page - the same fault as the finish note, found the same way, an hour apart. The
   cell is a verdict out of a fixed set, so it is matched and re-said; anything the
   sheet starts writing that is not in the set passes through unchanged rather than
   disappearing. */
function reading(v){
  const x=String(v||"").toLowerCase();
  if(!x) return "";
  if(x.indexOf("too low")>=0)  return t("rdLow");
  if(x.indexOf("too high")>=0) return t("rdHigh");
  if(x.indexOf("within")>=0)   return t("rdOk");
  return v;
}

function viewDays(){
  const DD=(D.days||[]).slice().reverse();      // newest first; that is what gets read
  if(!DD.length) return `<div class="card"><div class="muted">${t("dFlavNone")}</div></div>`;

  let h=`<h3>${t("vDays")}</h3><div class="card">
    <div class="chartbox" style="height:240px"><canvas id="c-d"></canvas></div></div>`;

  const noPlan=DD.some(x=>!x.plan);
  h+=`<h3>${t("dPlanned")} · ${t("dMade")}</h3><div class="card">`+tbl(
    [{h:t("dDayCol")},{h:t("dPlanned")},{h:t("dMade")},{h:t("dHit")},
     {h:t("dPacked")},{h:t("dHrs")},{h:t("dStaff")},{h:t("dReading"),wrap:true}],
    DD.map(x=>[
      `<b>${dmy(x.date)}</b>`,
      x.plan==null?`<span class="muted">${t("dNoPlan")}</span>`:n0(x.plan),
      x.made==null?dash(null):`<b>${n0(x.made)}</b>`,
      x.hit==null?dash(null)
        :`<span class="ou ${x.hit<.9?"dn":"up"}">${pc(x.hit)}</span>`,
      x.packed==null?dash(null):n0(x.packed),
      x.hours==null?dash(null):n1(x.hours),
      x.staff==null?dash(null):n0(x.staff),
      `<span class="muted">${esc(reading(x.reading))}</span>`]),
    [t("dTotalRow"),
     n0(DD.reduce((a,x)=>a+(x.plan||0),0)),
     n0(DD.reduce((a,x)=>a+(x.made||0),0)),
     "", n0(DD.reduce((a,x)=>a+(x.packed||0),0)),
     n1(DD.reduce((a,x)=>a+(x.hours||0),0)), "", ""])
    +`<div class="src">${t("dSrc")}${noPlan?"<br>"+t("dNoPlanWhy"):""}</div></div>`;

  /* The flavour detail, one small table per day that has it. This is the only thing
     this page holds that the shift page does not, so it is shown rather than hidden
     behind a control nobody will press. Days with no snapshot say so and stop. */
  DD.forEach(x=>{
    h+=`<h3>${dmy(x.date)} — ${t("dFlavours")}</h3><div class="card">`;
    if(!x.rows.length){
      h+=`<div class="muted">${t("dFlavNone")}</div></div>`;
      return;
    }
    h+=tbl([{h:t("flavour"),wrap:true},{h:t("dPlanned")},{h:t("dMade")},{h:t("dHit")}],
      x.rows.map(r=>[
        esc(r.name),
        r.plan?n0(r.plan):dash(null),
        r.made?`<b>${n0(r.made)}</b>`:dash(null),
        (r.plan&&r.made)?`<span class="ou ${r.made/r.plan<.9?"dn":"up"}">${pc(r.made/r.plan)}</span>`:dash(null)]));
    /* When the snapshot's own total is short of the day's, say so here rather than
       letting the reader add the column up and wonder which number to believe. */
    /* The mismatch is the point, not the timestamp. Requiring rows_at here meant the
       days captured before that field existed - including 21 October, where the
       flavour lines add to 5,680 against a day of 10,521 - showed the gap and said
       nothing about it. The time is quoted when it is known and omitted when it is
       not; the warning stands either way. */
    if(x.made && x.rows_made && x.rows_made < x.made*0.98)
      h+=`<div class="warnbox" style="margin-top:10px">${
        x.rows_at ? t("dSnapShort").replace("{t}", x.rows_at.slice(11))
                  : t("dSnapPart").replace("{n}", n0(x.rows_made)).replace("{m}", n0(x.made))
      }</div>`;
    else if(x.rows_at)
      h+=`<div class="src">${t("dSnapAt").replace("{t}", x.rows_at.replace("T"," "))}</div>`;
    h+=`</div>`;
  });
  return h;
}

function daysChart(){
  const DD=D.days||[];
  if(!DD.length) return;
  chart("c-d",{data:{labels:DD.map(x=>dmy(x.date)),
    datasets:[
      {type:"bar",label:t("dPlanned"),data:DD.map(x=>x.plan),
       backgroundColor:css("--teal"),borderRadius:4,barPercentage:.9},
      {type:"bar",label:t("dMade"),data:DD.map(x=>x.made),
       backgroundColor:css("--green"),borderRadius:4,barPercentage:.9},
      {type:"line",label:t("dPacked"),data:DD.map(x=>x.packed),yAxisID:"y1",
       borderColor:css("--orange"),borderDash:[5,4],pointRadius:2.5,tension:.3,fill:false}]},
    options:{plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
      scales:{y:{beginAtZero:true},
              y1:{position:"right",beginAtZero:true,grid:{drawOnChartArea:false}}}}});

function monthChart(){

  if(!R.length) return;

       borderRadius:4,barPercentage:.8},

       backgroundColor:css("--teal"),borderRadius:4,barPercentage:.8},
      {label:t("target"),type:"line",data:R.map(r=>r.target||null),
       borderColor:css("--orange"),borderDash:[5,4],pointRadius:2.5,tension:0,fill:false}]},
    options:{plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
             scales:{y:{beginAtZero:true}}}});
}

/* ================================================================== *
 *  Export.                                                           *
 *                                                                    *
 *  The report is built as real HTML and handed to the browser's own   *
 *  print dialog, where "Save as PDF" is one click. No PDF library:    *
 *  every one of them would have to shape and reorder the Arabic       *
 *  itself, which is exactly where they break, and rasterising the     *
 *  page would turn a report into a picture of a report. The browser   *
 *  already shapes Arabic correctly and already has the brand fonts,   *
 *  so the file comes out as selectable text at a fraction of the size.*
 *                                                                    *
 *  Each language is rendered by running the ordinary view functions   *
 *  with the language switched - so a translation that is right on     *
 *  screen is right in the report, and there is no second wording to   *
 *  drift out of step.                                                 *
 * ================================================================== */
const EXPORTABLE = {plan:viewPlan, shift:viewShift, store:viewStore, month:viewMonth};

function exportDialog(){
  // The first version built the options with attributes called "data-l=ar" and then
  // looked for them with [data-l\=ar]. That is not an attribute name - the markup
  // produced data-l="ar" - so nothing ever matched, no handler was attached, and both
  // choices sat frozen on their defaults however hard they were tapped. Plain
  // data-lang / data-scope values and one delegated listener now, which cannot drift
  // apart the same way.
  let lang = localStorage.getItem("erm-explang") || "both";
  let scope = "page";
  const sc = document.createElement("div");
  sc.className = "scrim"; sc.id = "scrim";
  sc.onclick = e => { if(e.target === sc) closeExport(); };
  document.body.appendChild(sc);

  const draw = () => {
    const page = VIEW==="home" ? "hHome"
      : ({plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth"})[VIEW];
    const opt = (attr,val,on,lbl,sub) =>
      `<button class="opt ${on?"sel":""}" data-${attr}="${val}">${lbl}
         <small>${sub}</small></button>`;
    sc.innerHTML = `<div class="dlg">
      <h2>${t("exportT")}</h2><p>${t("exportSub")}</p>
      ${opt("lang","ar",  lang==="ar",  t("expAr"),  t("expArS"))}
      ${opt("lang","en",  lang==="en",  t("expEn"),  t("expEnS"))}
      ${opt("lang","both",lang==="both",t("expBoth"),t("expBothS"))}
      <div style="height:10px"></div>
      ${opt("scope","page",scope==="page",t("expScope"),t(page))}
      ${opt("scope","all", scope==="all", t("expAll"),
            [t("vPlan"),t("vShift"),t("vStore"),t("vMonth")].join(" · "))}
      <div class="dlgrow">
        <button data-act="cancel">${t("expCancel")}</button>
        <button class="go" data-act="go">${t("expGo")} \u2913</button></div></div>`;
  };
  draw();

  sc.addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b || !sc.contains(b)) return;
    if(b.dataset.lang){ lang = b.dataset.lang;
      localStorage.setItem("erm-explang", lang); draw(); return; }
    if(b.dataset.scope){ scope = b.dataset.scope; draw(); return; }
    if(b.dataset.act === "cancel") return closeExport();
    if(b.dataset.act === "go") return doExport(lang, scope);
  });
}

function closeExport(){ const s=$("#scrim"); if(s) s.remove(); }
window.closeExport=closeExport;

/* charts are canvases; a canvas does not survive being copied, so each visible one is
   frozen to a PNG and dropped into the report as an image */
function chartImages(){
  const out={};
  document.querySelectorAll("#main canvas").forEach(c=>{
    try{ if(c.width && c.height) out[c.id]=c.toDataURL("image/png",1); }catch(e){}
  });
  return out;
}

function doExport(lang, scope){
  const langs = lang==="both" ? ["ar","en"] : [lang];
  const pages = scope==="all" ? ["plan","shift","store","month"]
                              : (VIEW==="home" ? ["plan","month"] : [VIEW]);
  const shots = chartImages();
  const keep = L;
  let html="";
  // Page first, language second - so in a bilingual report each section is followed
  // immediately by its own translation instead of the whole Arabic report and then the
  // whole English one. Reading it the other way round, the English half sits past the
  // end of the Arabic half and looks like it was never generated.
  for(const pg of pages){
    for(const lg of langs){
      L = lg;
      const rtl = lg==="ar";
      const titles={plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth"};
      let body = EXPORTABLE[pg] ? EXPORTABLE[pg]() : "";
      // strip the on-screen affordances, they mean nothing on paper
      body = body.replace(/<div class="tapnote">.*?<\/div>/g,"")
                 .replace(/ class="card tap"/g,' class="card"')
                 .replace(/ onclick="[^"]*"/g,"");
      html += `<section class="rsec" dir="${rtl?"rtl":"ltr"}" lang="${lg}">
        <div class="rhead">
          ${MARK?`<img src="${MARK}" alt="">`:""}
          <div class="rt">${T[lg].repTitle}</div>
          <div class="rd">${langs.length>1?`<b>${lg==="ar"?"عربي":"English"}</b> · `:""}${T[lg][titles[pg]]}<br>${
            new Date().toLocaleString(lg==="ar"?"ar-EG":"en-GB",
              {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
        </div>
        <div class="rsub">${T[lg][titles[pg]+"Sub"]||""}</div>
        ${body}
        <div class="rfoot">${T[lg].src}</div></section>`;
    }
  }
  L = keep;
  $("#report").innerHTML = html;
  // the canvases inside the report are empty copies - swap in the frozen pictures
  $("#report").querySelectorAll("canvas").forEach(c=>{
    const src = shots[c.id];
    if(src){ const i=document.createElement("img"); i.src=src; i.className="rchart";
             c.replaceWith(i); }
    else { const box=c.closest(".chartbox"); if(box) box.remove(); }
  });
  closeExport();
  setTimeout(()=>{ window.print(); }, 60);
}

$("#exp").onclick=exportDialog;
$("#hide").onclick=toggleHidden;
/* Fetch the page again from the server rather than from the phone's cache. A home-
   screen app will happily hand back this morning's copy otherwise, which is the whole
   reason this button is here. */
/* What this button does, and what it does not.

   It fetches the published page again instead of letting the phone serve its cached
   copy. That is all. The NUMBERS are rebuilt from the Excel workbook by a separate step
   that needs access to OneDrive, which a phone does not have - so if no rebuild has
   happened since you last looked, this button will honestly tell you so rather than
   spin and leave you thinking the figures are fresh when they are yesterday's. */
$("#reload").onclick=()=>{
  const b=$("#reload"); b.disabled=true; b.textContent="\u00B7\u00B7\u00B7";
  const done=()=>{ b.disabled=false; b.textContent="\u21BB"; };
  fetch("data/build.txt?t="+Date.now(),{cache:"no-store"})
    .then(r=>r.ok?r.text():null)
    .then(latest=>{
      if(latest && Math.abs(new Date(latest.trim())-BUILT)<2000){
        done();
        toast(t("reloadSame"));
        return;
      }
      const u=new URL(location.href); u.searchParams.set("r",Date.now());
      location.replace(u.toString());
    })
    .catch(()=>{ done(); toast(t("reloadFail")); });
};

/* A line that appears, is read, and goes. Used only where a button would otherwise do
   nothing visible and leave you guessing whether it worked. */
let TOAST_T=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
  el.textContent=msg;
  el.classList.add("on");
  clearTimeout(TOAST_T);
  TOAST_T=setTimeout(()=>el.classList.remove("on"), 5200);
}

applyTheme();
VIEW=(location.hash||"").replace("#","")||"home";
if(!PAGES.includes(VIEW)) VIEW="home";
render();
checkFresh();
swipeInit();
/* Coming back to a home-screen app after an hour is exactly when the copy in front of
   you is most likely to be yesterday's. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") checkFresh();
});
</script>
