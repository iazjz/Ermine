<style>
:root{
  color-scheme: light;
  --bg:#f6f7fa; --card:#fff; --line:#e6e9f0; --ink:#111521; --dim:#6b7280;
  --ok:#157f4b; --warn:#a9700d; --bad:#c0392b; --accent:#2563eb;
  --okbg:rgba(21,127,75,.11); --warnbg:rgba(169,112,13,.12); --badbg:rgba(192,57,43,.11);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px -8px rgba(16,24,40,.14);
}
html[data-theme=dark]{
  color-scheme: dark;
  --bg:#0f1115; --card:#171a21; --line:#252a35; --ink:#e9ebf1; --dim:#8b93a7;
  --ok:#34c17e; --warn:#e0a93a; --bad:#e8645f; --accent:#5b95f9;
  --okbg:rgba(52,193,126,.14); --warnbg:rgba(224,169,58,.14); --badbg:rgba(232,100,95,.14);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  padding:0 0 calc(44px + env(safe-area-inset-bottom));
  transition:background .2s,color .2s}
html[dir=rtl] body{font-family:-apple-system,"SF Arabic","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 9px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;width:34px;height:34px;font-size:14px;font-weight:700;cursor:pointer;
  display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.94)}
.stamp{color:var(--dim);font-size:12px;margin-top:4px}
.stamp.old{color:var(--warn);font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 16px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--card);color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s}
nav button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:14px 16px;max-width:760px;margin:0 auto}
section{display:none;animation:in .18s ease-out} section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.chk+.chk{border-top:1px solid var(--line)}
.dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:8px;background:var(--dim)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.chk .n{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:700;flex:0 0 auto}
.big{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.unit{font-size:13px;color:var(--dim);font-weight:500;letter-spacing:0}
.lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:650}
.row{display:flex;gap:12px} .row>*{flex:1;min-width:0}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chartbox{position:relative;height:170px;margin-top:6px}
.chartbox.tall{height:210px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--card);color:var(--dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;text-align:end;padding:8px 5px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:first-child,td:first-child{text-align:start}
th[data-dir="1"]:after{content:" \25B2";font-size:8px;opacity:.7}
th[data-dir="-1"]:after{content:" \25BC";font-size:8px;opacity:.7}
td{padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:end}
tbody tr:last-child td{border-bottom:0}
tr.zero td{opacity:.45}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--dim);font-size:12px}
h3{margin:17px 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.8px;font-weight:700}
h3:first-child{margin-top:2px}
.tiny{font-size:11px;color:var(--dim);margin-top:7px}

/* ---------- the laptop ----------
   The phone shows one tab at a time because a thumb scrolls and a small screen cannot
   hold four subjects at once. A laptop can, and paging through tabs on it is pure
   friction - you came to the desk to see the whole picture. So above 900px the tabs go
   away, every section is on the page at once, and the cards flow into two columns.
   Same data, same markup; only the layout changes. */
@media (min-width:900px){
  body{padding-bottom:40px}
  header{padding:16px 28px 11px}
  h1{font-size:21px}
  nav{display:none}
  main{max-width:1280px;padding:18px 28px;
       display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
  section{display:block !important;animation:none}
  #s-now{grid-column:1;grid-row:1/span 2}
  #s-month{grid-column:2;grid-row:1}
  #s-sales{grid-column:2;grid-row:2}
  #s-store{grid-column:2;grid-row:3}
  section::before{content:attr(data-title);display:block;font-size:12px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;color:var(--accent);
    margin:4px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line)}
  #s-now::before{margin-top:0}
  .card{padding:15px 17px}
  .chartbox{height:200px} .chartbox.tall{height:260px}
  table{font-size:13.5px}
}
@media (min-width:1400px){
  main{max-width:1500px;grid-template-columns:1fr 1fr 1fr}
  #s-now{grid-column:1;grid-row:1/span 3}
  #s-month{grid-column:2;grid-row:1/span 2}
  #s-sales{grid-column:3;grid-row:1}
  #s-store{grid-column:3;grid-row:2}
}

const pc = v => v==null ? "—" : Math.round(v*100).toLocaleString(loc())+"%";
const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dmy = s => s ? new Date(s+"T00:00:00").toLocaleDateString(loc(),{day:"2-digit",month:"short"}) : "";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* A check is green when it says nothing needs doing. Matched on the workbook's own
   wording so there is one phrasing in one place, not two that drift apart. */
function tone(x){
  if(/not listed|behind|not recorded|no headcount|not been earned|has not entered|empty/i.test(x)) return "warn";
  if(/over by|DOES NOT FIT|missed the plan/i.test(x)) return "bad";
  if(/up to date|nothing outstanding|Most of what is left|everyone|fits/i.test(x)) return "ok";
  return "";
}

function stamp(){
  const h=(Date.now()-BUILT)/36e5;
  const age = h<1 ? t("just") : h<24 ? Math.round(h)+t("hAgo") : Math.round(h/24)+t("dAgo");
  const el=$("#stamp");
  el.textContent = t("read")+" · "+age+" · "+BUILT.toLocaleString(loc(),
    {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  el.classList.toggle("old", h>18);
}

/* ---------- charts ----------
   Colours are read from the CSS variables at draw time rather than hard-coded, so one
   theme switch repaints everything and there is no second palette to keep in step. */
window.__charts = [];
window.__pending = [];
/* Chart.js measures its container when it is built, and a container inside a hidden tab
   measures zero - the chart then never resizes when the tab is opened. So a chart is
   REGISTERED here and only built once its section is on screen: immediately on a laptop,
   where every section is visible, and on first tap on a phone. */
function chart(id, cfg){ window.__pending.push([id, cfg]); flush(); }
function flush(){
  window.__pending = window.__pending.filter(([id, cfg])=>{
    const el = document.getElementById(id);
    if(!el || !el.offsetParent) return true;        // not on screen yet - keep it waiting
    build(el, cfg); return false;
  });
}
function build(el, cfg){
  const g = css("--dim"), ln = css("--line");
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = g;
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false,
    animation:{duration:450}}, cfg.options||{});
  (cfg.options.scales = cfg.options.scales || {});
  for(const k of Object.keys(cfg.options.scales))
    Object.assign(cfg.options.scales[k], {grid:{color:ln, drawBorder:false},
      ticks:Object.assign({color:g}, cfg.options.scales[k].ticks||{})});
  window.__charts.push(new Chart(el, cfg));
}
function killCharts(){
  window.__charts.forEach(c=>c.destroy()); window.__charts=[]; window.__pending=[];
}

/* ---------- sortable table ---------- */
let TBL = 0;
function table(rows, cols, sortBy){
  const id = "t"+(++TBL);
  setTimeout(()=>{
    const el = document.getElementById(id); if(!el) return;
    let key = sortBy, dir = -1;
    const fmt = {s:v=>esc(v),
      n:v=>v?n0(v):'<span style="opacity:.3">0</span>',
      n1:v=>v?n1(v):'<span style="opacity:.3">0</span>',
      p:v=>v==null?"—":`<span class="pill ${v>=1?"p-ok":v>=.5?"p-warn":"p-bad"}">${pc(v)}</span>`};
    const draw = ()=>{
      const ty = cols.find(c=>c[0]===key)[2];
      const s = rows.slice().sort((a,b)=>{
        const x=a[key], y=b[key];
        if(ty==="s") return dir*String(x||"").localeCompare(String(y||""));
        return dir*((y==null?-1:y)-(x==null?-1:x));
      });
      el.querySelector("tbody").innerHTML = s.map(r=>
        `<tr class="${cols.slice(1).every(c=>!r[c[0]])?"zero":""}">` +
        cols.map(c=>`<td>${fmt[c[2]](r[c[0]])}</td>`).join("") + `</tr>`).join("");
      el.querySelectorAll("th").forEach(th=>th.dataset.dir = th.dataset.k===key ? dir : "");
    };
    el.querySelectorAll("th").forEach(th => th.onclick = ()=>{
      if(key===th.dataset.k) dir=-dir; else { key=th.dataset.k; dir = th.dataset.t==="s"?1:-1; }
      draw();
    });
    draw();
  });
  return `<div class="card scroll"><table id="${id}"><thead><tr>` +
    cols.map(c=>`<th data-k="${c[0]}" data-t="${c[2]}">${esc(c[1])}</th>`).join("") +
    `</tr></thead><tbody></tbody></table></div>`;
}

/* ---------- the four pages ---------- */
const TABS=[["now","now"],["month","month"],["sales","sales"],["store","store"]];

function render(){
  killCharts();
  document.documentElement.lang = L;
  document.documentElement.dir = L==="ar" ? "rtl" : "ltr";
  $("#title").textContent = t("title");
  $("#lang").textContent = L==="en" ? "ع" : "EN";
  stamp();

  const sel = document.querySelector("nav button[aria-selected=true]");
  const cur = sel ? sel.dataset.k : "now";
  TABS.forEach(([k,l])=> $("#s-"+k).dataset.title = t(l));
  $("#tabs").innerHTML = TABS.map(([k,l])=>
    `<button data-k="${k}" aria-selected="${k===cur}">${t(l)}</button>`).join("");
  $("#tabs").onclick = e => { const b=e.target.closest("button"); if(!b) return;
    TABS.forEach(([k])=>{ $("#s-"+k).classList.toggle("on", k===b.dataset.k);
      $(`#tabs button[data-k="${k}"]`).setAttribute("aria-selected", k===b.dataset.k); });
    window.scrollTo({top:0,behavior:"smooth"});
    setTimeout(flush, 30); };

  now(); month(); sales(); store();
  setTimeout(flush, 40);
  addEventListener("resize", flush, {once:true});
}

function now(){
  let h = `<h3>${t("checks")}</h3><div class="card">` + D.checks.map((c,i)=>
      `<div class="chk"><span class="dot ${tone(c)}"></span><span class="n">${i+1}</span>
       <span>${esc(c.replace(/^\d+\.\s*/,""))}</span></div>`).join("") + `</div>`;

  h += `<h3>${t("today")}</h3>`;
  const fit = s => /fits/.test(s) ? "p-ok" : /over/.test(s) ? "p-bad" : "p-warn";
  D.plans.forEach(p=>{
    h += `<div class="card"><div class="row" style="align-items:flex-start">
      <div><div class="lbl">${esc(p.name)}</div>
        <div class="muted">${esc(p.what.replace(/^[A-Z]+\s*-\s*/,""))}</div></div>
      <div style="flex:0 0 auto;text-align:end">
        <div class="big">${n0(p.hours)}<span class="unit">${t("hours")}</span></div>
        <div class="muted">${n1(p.people)} ${t("people")}</div></div></div>
      <div class="row" style="margin-top:10px;align-items:center">
        <div><div class="lbl">${t("pieces")}</div><b>${n0(p.pcs)}</b></div>
        <div><div class="lbl">${t("boxes")}</div><b>${n0(p.boxes)}</b></div>
        <div style="flex:0 0 auto"><span class="pill ${fit(p.fits)}">${esc(p.fits)||"—"}</span></div>
      </div></div>`;
  });

  const P=D.people;
  h += `<h3>${t("who")}</h3><div class="card"><div class="row">
    <div><div class="lbl">${t("roster")}</div><div class="big">${n0(P.roster)}</div>
      <div class="muted">${esc(P.roster_note)}</div></div>
    <div><div class="lbl">${t("recorded")}</div><div class="big">${n0(P.recorded)}</div>
      <div class="muted">${esc(P.recorded_on)}</div></div></div></div>`;

  if(D.log.length){
    h += `<h3>${t("trend")}</h3><div class="card"><div class="chartbox"><canvas id="c-hours"></canvas></div></div>`;
    h += `<h3>${t("lastDays")}</h3>` + table(D.log.map(r=>({
        d:r.date, staff:r.staff, hours:r.hours, ratio:r.ratio})),
      [["d",t("day"),"s"],["staff",t("staff"),"n"],["hours",t("hrs"),"n1"],
       ["ratio",t("ratio"),"n1"]], "d");
  }
  $("#s-now").innerHTML = h;

  if(D.log.length) setTimeout(()=>chart("c-hours",{type:"line",data:{
    labels: D.log.map(r=>dmy(r.date)),
    datasets:[
      {label:t("actualLine"), data:D.log.map(r=>r.hours), borderColor:css("--accent"),
       backgroundColor:css("--accent")+"22", tension:.35, fill:true, pointRadius:2.5},
      {label:t("modelLine"), data:D.log.map(r=>r.hours!=null&&r.ratio!=null?r.hours*r.ratio:null),
       borderColor:css("--dim"), borderDash:[5,4], tension:.35, pointRadius:0}]},
    options:{plugins:{legend:{display:true,labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
             scales:{y:{beginAtZero:true}}}}));
}

function month(){
  const M=D.month;
  const done=D.boxes.reduce((a,b)=>a+(b.packed||0),0),
        tgt=D.boxes.reduce((a,b)=>a+(b.target||0),0);
  const vcls=/ON TRACK/.test(M.verdict)?"p-ok":/OVERTIME/.test(M.verdict)?"p-warn":"p-bad";
  let h = `<div class="card">
    <div class="lbl">${t("packed")}</div>
    <div class="big">${n0(done)} <span class="unit">${t("of")} ${n0(tgt)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,100*done/(tgt||1))}%"></i></div>
    <div class="row" style="margin-top:13px">
      <div><div class="lbl">${t("hoursDay")}</div><div class="big">${n0(M.hours_day)}</div></div>
      <div><div class="lbl">${t("daysLeft")}</div><div class="big">${n0(M.days_left)}</div></div>
    </div>
    <div style="margin-top:11px"><span class="pill ${vcls}">${esc(M.verdict)}</span></div></div>`;

  if(M.sens.length){
    h += `<h3>${t("atPeople")}</h3><div class="card">
      <div class="chartbox" style="height:150px"><canvas id="c-sens"></canvas></div>
      <div class="tiny">${t("share")}</div></div>`;
  }
  if(M.measured) h += `<div class="card"><div class="lbl">${t("measured")}</div>
    <div style="margin-top:5px">${esc(M.measured)}</div></div>`;

  const top = D.boxes.filter(b=>b.target).sort((a,b)=>(b.target||0)-(a.target||0)).slice(0,8);
  if(top.length) h += `<h3>${t("progress")} · ${t("top")}</h3><div class="card">
    <div class="chartbox tall"><canvas id="c-prog"></canvas></div></div>`;

  h += `<h3>${t("byBox")}</h3>` + table(D.boxes,
    [["box",t("box"),"s"],["target",t("target"),"n"],["packed",t("packedC"),"n"],
     ["left",t("left"),"n"],["perday",t("perDay"),"n1"],["done",t("done"),"p"]], "left");
  $("#s-month").innerHTML = h;

  setTimeout(()=>{
    if(M.sens.length) chart("c-sens",{type:"bar",data:{
      labels:M.sens.map(s=>n0(s.n)),
      datasets:[{data:M.sens.map(s=>s.load==null?null:s.load*100),
        backgroundColor:M.sens.map(s=>s.load>1?css("--bad"):s.load>.9?css("--warn"):css("--ok")),
        borderRadius:6, barPercentage:.62}]},
      options:{plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>Math.round(c.raw)+"%"}}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>v+"%"},suggestedMax:120}}}});
    if(top.length) chart("c-prog",{type:"bar",data:{
      labels:top.map(b=>b.box),
      datasets:[{label:t("packedC"),data:top.map(b=>b.packed||0),
                 backgroundColor:css("--accent"),borderRadius:5,barPercentage:.8},
                {label:t("left"),data:top.map(b=>b.left||0),
                 backgroundColor:css("--line"),borderRadius:5,barPercentage:.8}]},
      options:{indexAxis:"y",plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
        scales:{x:{stacked:true,beginAtZero:true},y:{stacked:true}}}});
  });
}

function sales(){
  const owed=D.boxes.reduce((a,b)=>a+(b.owed||0),0);
  let h = `<div class="card"><div class="lbl">${t("owed")}</div>
    <div class="big">${n0(owed)} <span class="unit">${t("boxes")}</span></div>
    <div class="muted">${t("owedNote")}</div></div>`;
  const top = D.boxes.filter(b=>b.owed).sort((a,b)=>(b.owed||0)-(a.owed||0)).slice(0,8);
  if(top.length) h += `<div class="card"><div class="chartbox tall"><canvas id="c-owed"></canvas></div></div>`;
  h += `<h3>${t("askedPacked")}</h3>` + table(D.boxes,
    [["box",t("box"),"s"],["asked",t("asked"),"n"],["packed",t("packedC"),"n"],
     ["owed",t("owed"),"n"],["store",t("inStore"),"n"]], "owed");
  if(D.days.length){
    h += `<h3>${t("tenDays")}</h3><div class="card scroll"><table><thead><tr><th>${t("box")}</th>`
      + D.days.map(d=>`<th>${dmy(d)}</th>`).join("") + `<th>${t("total")}</th><th>${t("left")}</th></tr></thead><tbody>`
      + D.grid.filter(g=>g.total).map(g=>`<tr><td>${esc(g.box)}</td>`
        + g.days.map(v=>`<td>${v?n0(v):'<span style="opacity:.25">·</span>'}</td>`).join("")
        + `<td><b>${n0(g.total)}</b></td><td>${n0(g.left)}</td></tr>`).join("")
      + `</tbody></table></div>`;
  }
  $("#s-sales").innerHTML = h;
  if(top.length) setTimeout(()=>chart("c-owed",{type:"bar",data:{
    labels:top.map(b=>b.box),
    datasets:[{data:top.map(b=>b.owed),backgroundColor:css("--accent"),
               borderRadius:5,barPercentage:.75}]},
    options:{indexAxis:"y",plugins:{legend:{display:false}},
             scales:{x:{beginAtZero:true}}}}));
}

function store(){
  const S=D.store;
  let h = `<div class="card"><div class="lbl">${t("waiting")}</div>
    <div class="big">${n0(S.boxes)}</div>
    <div class="muted">${t("waitNote").replace("{d}", S.stocktake?dmy(S.stocktake):"—")}</div></div>`;
  const gaps=D.boxes.filter(b=>b.gap);
  if(gaps.length) h += `<div class="card"><div class="lbl">${t("disagree")}</div>` +
    gaps.map(b=>`<div style="margin-top:7px;display:flex"><span style="flex:1">${esc(b.box)}</span>
      <b>${b.gap>0?"+":""}${n0(b.gap)}</b></div>`).join("") + `</div>`;
  const fl = D.flavours.filter(f=>f.box && f.now);
  if(fl.length) h += `<div class="card"><div class="chartbox tall"><canvas id="c-fl"></canvas></div></div>`;
  h += `<h3>${t("byFlavour")}</h3>` + table(D.flavours.filter(f=>f.box),
    [["box",t("box"),"s"],["now",t("inStore"),"n"]], "now");
  $("#s-store").innerHTML = h;
  if(fl.length) setTimeout(()=>{
    const s = fl.slice().sort((a,b)=>b.now-a.now).slice(0,10);
    chart("c-fl",{type:"bar",data:{labels:s.map(f=>f.box),
      datasets:[{data:s.map(f=>f.now),backgroundColor:css("--accent"),
                 borderRadius:5,barPercentage:.75}]},
      options:{indexAxis:"y",plugins:{legend:{display:false}},
               scales:{x:{beginAtZero:true}}}});
  });
}

applyTheme();
render();
</script>
</body>
</html>
