<style>
:root{
  color-scheme: light;
  --bg:#f6f7fa; --card:#fff; --line:#e6e9f0; --ink:#111521; --dim:#6b7280;
  --ok:#157f4b; --warn:#a9700d; --bad:#c0392b; --accent:#2563eb;
  --okbg:rgba(21,127,75,.10); --warnbg:rgba(169,112,13,.11); --badbg:rgba(192,57,43,.10);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px -8px rgba(16,24,40,.14);
}
html[data-theme=dark]{
  color-scheme: dark;
  --bg:#0f1115; --card:#171a21; --line:#252a35; --ink:#e9ebf1; --dim:#8b93a7;
  --ok:#34c17e; --warn:#e0a93a; --bad:#e8645f; --accent:#5b95f9;
  --okbg:rgba(52,193,126,.13); --warnbg:rgba(224,169,58,.13); --badbg:rgba(232,100,95,.13);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  padding:0 0 calc(40px + env(safe-area-inset-bottom))}
html[dir=rtl] body{font-family:-apple-system,"SF Arabic","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:9px}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;width:34px;height:34px;font-size:14px;font-weight:700;cursor:pointer;
  display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.94)}
.stamp{color:var(--dim);font-size:12px;margin-top:5px}
.stamp.old{color:var(--warn);font-weight:600}
main{padding:14px 16px;max-width:760px;margin:0 auto}

/* The banner is the page in one line: green and you can put the phone away, red and you
   cannot. Everything below it is the detail behind that one judgement. */
.banner{border-radius:15px;padding:15px 16px;margin-bottom:12px;color:#fff;
  box-shadow:var(--shadow)}
.banner.ok{background:linear-gradient(135deg,#19955a,#0f6c3f)}
.banner.warn{background:linear-gradient(135deg,#c98a12,#9a6a0c)}
.banner.bad{background:linear-gradient(135deg,#d0493c,#a3352a)}
.banner .big{font-size:26px;font-weight:750;letter-spacing:-.6px;margin-top:2px}
.banner .lbl{color:rgba(255,255,255,.78)}
.banner .sub{color:rgba(255,255,255,.9);font-size:13px;margin-top:7px}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.big{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.7px}
.mid{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.unit{font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:0}
.lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:650}
.row{display:flex;gap:12px} .row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chartbox{position:relative;height:175px;margin-top:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
  text-align:end;padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:start}
td{padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:end}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--dim);font-size:12px}
h3{margin:18px 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.8px;font-weight:700}
h3:first-child{margin-top:2px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.name{background:var(--bg);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-size:12.5px}
.fo{display:flex;gap:10px;align-items:baseline;padding:7px 0}
.fo+.fo{border-top:1px solid var(--line)}
.fo b{font-variant-numeric:tabular-nums}
.src{font-size:10.5px;color:var(--dim);margin-top:9px;letter-spacing:.2px}

@media (min-width:900px){
  header{padding:16px 28px 11px} h1{font-size:21px}
  main{max-width:1240px;padding:18px 28px;
       display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
  .banner{grid-column:1/-1}
  .colA{grid-column:1} .colB{grid-column:2}
  .card{padding:15px 17px} .chartbox{height:200px}
}
@media (min-width:1400px){
  main{max-width:1560px;grid-template-columns:1fr 1fr 1fr}
  .colA{grid-column:1} .colB{grid-column:2} .colC{grid-column:3}
}

function stamp(){
  const h=(Date.now()-BUILT)/36e5;
  const age=h<1?t("just"):h<24?Math.round(h)+t("hAgo"):Math.round(h/24)+t("dAgo");
  const el=$("#stamp");
  el.textContent=t("read")+" · "+age+" · "+BUILT.toLocaleString(loc(),
    {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  el.classList.toggle("old",h>18);
}

/* Is the day going right? One judgement, from the three things that can go wrong: the
   day does not fit, the last shift drifted, or the month cannot be finished. */
function overall(){
  const bad=[], warn=[];
  const A=D.plans[0], last=D.last, M=D.month;
  if(/DOES NOT FIT|over by/i.test(A.fits)) bad.push("today");
  if(last && last.ratio!=null && (last.ratio<0.85||last.ratio>1.15)) warn.push("drift");
  if(/OUT OF REACH/i.test(M.verdict)) bad.push("month");
  else if(/OVERTIME/i.test(M.verdict)) warn.push("month");
  return bad.length?"bad":warn.length?"warn":"ok";
}

      <div><div class="lbl">${t("hours")}</div><div class="big">${n0(A.hours)}</div></div>
      <div><div class="lbl">${t("people")}</div><div class="big">${n1(A.people)}</div></div>
      <div><div class="lbl">${t("wages")}</div><div class="big">${n0(A.cost)}
        <span class="unit">${t("sar")}</span></div></div>
    </div>
    <div style="margin-top:10px"><span class="pill ${/fits/.test(A.fits)?"p-ok":"p-bad"}">${esc(A.fits)}</span></div>
    <div class="muted" style="margin-top:7px">${esc(D.today.finish_note)}</div></div>`;

  h+=`<h3>${t("suggested")}</h3><div class="card"><div class="scroll"><table>
    <thead><tr><th></th><th>${t("pieces")}</th><th>${t("boxes")}</th><th>${t("hours")}</th>
      <th>${t("wages")}</th><th></th></tr></thead><tbody>`
    + D.plans.slice(1).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${n0(p.pcs)}</td>
       <td>${n0(p.boxes)}</td><td>${n0(p.hours)}</td><td>${n0(p.cost)}</td>
       <td><span class="pill ${/fits/.test(p.fits)?"p-ok":"p-bad"}">${/fits/.test(p.fits)?"✓":"✕"}</span></td></tr>`).join("")
    + `</tbody></table></div></div>`;

  /* ---- the shift that was actually worked ---- */
  if(last){
    const r=last.ratio, cls=r==null?"":(r<0.85||r>1.15)?"p-warn":"p-ok";
    const say=r==null?"":r<0.85?t("driftLow"):r>1.15?t("driftHigh"):t("driftOk");
    h+=`<h3>${t("lastShift")} · ${esc(dmy(last.date))}</h3><div class="card">
      <div class="row">
        <div><div class="lbl">${t("made")}</div><div class="mid">${n0(last.made)}</div></div>
        <div><div class="lbl">${t("packedP")}</div><div class="mid">${n0(last.packed)}</div></div>
        <div><div class="lbl">${t("hours")}</div><div class="mid">${n1(last.hours)}</div></div>
        <div><div class="lbl">${t("people")}</div><div class="mid">${n0(last.staff)}</div></div>
      </div>
      <div style="margin-top:10px"><span class="pill ${cls}">${t("drift")} ${n1(r)}</span>
        <span class="muted"> ${esc(say)}</span></div></div>`;
    h+=`<div class="card"><div class="chartbox"><canvas id="c-h"></canvas></div></div></div>`;
  } else h+=`</div>`;

  /* ---- what to put the day into ---- */
  h+=`<div class="colB"><h3>${t("focus")}</h3><div class="card">`;
  D.focus.forEach(f=>{
    h+=`<div class="lbl" style="margin-top:4px">${f.kind==="make"?t("focusMake"):t("focusPack")}</div>`;
    f.items.forEach(i=>h+=`<div class="fo"><span style="flex:1">${esc(i.box)}</span>
      <b>${n0(i.n)}</b><span class="unit">${t("boxes")}</span>
      ${i.hours?`<span class="muted">${n0(i.hours)}${t("hours")}</span>`:""}</div>`);
  });
  h+=`</div>`;

  /* ---- the month ---- */
  h+=`<h3>${t("month")}</h3><div class="card">
    <div class="lbl">${t("monthLeft")}</div>
    <div class="big">${n0(X.left)} <span class="unit">${L==="ar"?"من":"of"} ${n0(X.target)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,100*X.packed/(X.target||1))}%"></i></div>
    <div class="row" style="margin-top:12px">
      <div><div class="lbl">${t("perDay")}</div><div class="mid">${n0(M.hours_day)}</div></div>
      <div><div class="lbl">${t("daysLeft")}</div><div class="mid">${n0(M.days_left)}</div></div>
    </div>
    <div class="chartbox" style="height:140px;margin-top:8px"><canvas id="c-s"></canvas></div></div>`;

  /* ---- stock, both units, and the two flows ---- */
  h+=`<h3>${t("stockBox")}</h3><div class="card"><div class="row">
      <div><div class="lbl">${t("store")}</div><div class="big">${n0(X.store)}</div></div>
      <div><div class="lbl">${t("fromChef")}</div><div class="mid">${n0(X.recv)}</div></div>
      <div><div class="lbl">${t("toSales")}</div><div class="mid">${n0(X.out)}</div></div>
    </div></div>`;
  h+=`<h3>${t("stockPcs")}</h3><div class="card">
      <div class="chartbox"><canvas id="c-p"></canvas></div></div></div>`;

  /* ---- sales ---- */
  h+=`<div class="colC"><h3>${t("salesPlan")}</h3><div class="card"><div class="row">
      <div><div class="lbl">${t("asked")}</div><div class="mid">${n0(X.asked)}</div></div>
      <div><div class="lbl">${t("owed")}</div><div class="big">${n0(X.owed)}</div></div>
    </div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr>
      <th>${t("box")}</th><th>${t("asked")}</th><th>${t("owed")}</th>
      <th>${t("still")}</th><th>${t("store")}</th></tr></thead><tbody>`
    + D.boxes.filter(b=>(b.asked||0)||(b.left||0)).map(b=>
      `<tr><td>${esc(b.box)}</td><td>${n0(b.asked)}</td><td><b>${n0(b.owed)}</b></td>
       <td>${n0(b.left)}</td><td>${n0(b.store)}</td></tr>`).join("")
    + `</tbody></table></div></div>`;

  /* ---- who is in ---- */
  h+=`<h3>${t("floor")} · ${D.names.length}</h3><div class="card">`
    + (D.names.length ? `<div class="names">` +
        D.names.map(p=>`<span class="name">${esc(p.name)}</span>`).join("") + `</div>`
      : `<div class="muted">${t("noNames")}</div>`)
    + `<div class="src">${t("src")}</div></div></div>`;

  $("#main").innerHTML = h;
  window.__drawn = true;

  setTimeout(()=>{
    if(last) chart("c-h",{type:"line",data:{
      labels:D.log.map(r=>dmy(r.date)),
      datasets:[
        {label:t("actualLine"),data:D.log.map(r=>r.hours),borderColor:css("--accent"),
         backgroundColor:css("--accent")+"22",tension:.35,fill:true,pointRadius:2.5},
        {label:t("modelLine"),data:D.log.map(r=>r.hours!=null&&r.ratio!=null?r.hours*r.ratio:null),
         borderColor:css("--dim"),borderDash:[5,4],tension:.35,pointRadius:0}]},
      options:{plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}}},
               scales:{y:{beginAtZero:true}}}});
    if(M.sens.length) chart("c-s",{type:"bar",data:{
      labels:M.sens.map(s=>n0(s.n)),
      datasets:[{data:M.sens.map(s=>s.load==null?null:s.load*100),
        backgroundColor:M.sens.map(s=>s.load>1?css("--bad"):s.load>.9?css("--warn"):css("--ok")),
        borderRadius:6,barPercentage:.6}]},
      options:{plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>Math.round(c.raw)+"%"}}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>v+"%"},suggestedMax:120}}}});
    const ps=D.pieces.filter(p=>p.pcs).sort((a,b)=>b.pcs-a.pcs);
    if(ps.length) chart("c-p",{type:"bar",data:{labels:ps.map(p=>p.product),
      datasets:[{data:ps.map(p=>p.pcs),backgroundColor:css("--accent"),
                 borderRadius:5,barPercentage:.75}]},
      options:{indexAxis:"y",plugins:{legend:{display:false}},
               scales:{x:{beginAtZero:true}}}});
  },40);
}

applyTheme();
render();
</script>
</body>
</html>
