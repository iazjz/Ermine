<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#014833">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Ermine QC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --green: #014833;
  --bg: #F7F5F1;
  --card: #ffffff;
  --field: #F1EEE8;
  --line: #E4E0D8;
  --ink: #14201B;
  --dim: #66726C;
  --accent: #014833;
  --accent-ink: #ffffff;
  --ok: #00756F;
  --okbg: rgba(0,145,139,.12);
  --warn: #B8650F;
  --bad: #BF2028;
  --badbg: rgba(191,32,40,.10);
  --font: "IBM Plex Sans Arabic", "Dubai", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0B1411; --card: #13201B; --field: #1A2B24; --line: #223029; --ink: #ECEFE9; --dim: #8DA096;
    --accent: #2BC2B6; --accent-ink: #04201c; --ok: #2BC2B6; --okbg: rgba(43,194,182,.14);
    --warn: #F3913F; --bad: #E8645F; --badbg: rgba(232,100,95,.14);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* header band */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--green); color: #fff;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.hrow { display: flex; align-items: center; gap: 10px; min-height: 40px; max-width: 640px; margin: 0 auto; }
.wm { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.wm b { letter-spacing: .18em; font-size: 17px; font-weight: 600; }
.wm span { font-size: 12px; opacity: .78; }
.sp { flex: 1; }
.lang { min-width: 52px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
.tabs { display: flex; gap: 6px; max-width: 640px; margin: 8px auto 0; }
.tabs button { flex: 1; min-height: 42px; background: transparent; border: 0; border-bottom: 3px solid transparent; color: rgba(255,255,255,.72); font-weight: 600; }
.tabs button[aria-current="page"] { color: #fff; border-bottom-color: #fff; }

.wrap { max-width: 640px; margin: 14px auto 0; display: grid; gap: 14px; }
.wrap > * { min-width: 0; }
#banner:empty { display: none; }
#banner { display: grid; gap: 10px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pan-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 10px; }
.pan-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.pan-head p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
.count { font-size: 13px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 10px; }
.rowtop { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.nm { min-width: 0; font-weight: 500; }
.nm small { display: block; font-weight: 400; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--field); color: var(--dim); white-space: nowrap; }
.chip.ok { background: var(--okbg); color: var(--ok); }
.chip.bad { background: var(--badbg); color: var(--bad); }

.temp { display: flex; align-items: center; gap: 8px; direction: ltr; }
.temp input { width: 96px; min-height: 46px; text-align: center; font-size: 20px; font-weight: 600; background: var(--field); border: 1px solid var(--line); border-radius: 9px; font-variant-numeric: tabular-nums; }
.step { width: 46px; height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); font-size: 22px; line-height: 1; }
.deg { color: var(--dim); font-size: 14px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { min-height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); font-weight: 500; }
.seg button[aria-pressed="true"].yes { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.seg button[aria-pressed="true"].no { background: var(--badbg); border-color: var(--bad); color: var(--bad); font-weight: 600; }

.txt, .area, select, .num, input[type=date] { width: 100%; min-height: 46px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; }
.area { resize: vertical; min-height: 84px; }
.field label, .action label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 4px; }
.fields { padding: 0 14px 14px; display: grid; gap: 12px; }
.fields.two { grid-template-columns: 1fr 1fr; padding-top: 14px; }
.pad { padding: 0 14px 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.btn.alt { background: transparent; color: var(--accent); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: .55; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px; }
.note { margin: 0; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
.note.warn { background: rgba(184,101,15,.12); color: var(--warn); }
.note.bad { background: var(--badbg); color: var(--bad); }
.note.ok { background: var(--okbg); color: var(--ok); }
.note .btn { margin-top: 8px; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.prog { flex: 1; min-width: 0; }
.prog b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.prog small { display: block; font-size: 12.5px; color: var(--dim); }
.prog small.warn { color: var(--bad); font-weight: 600; }
.meter { height: 4px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; }
.bar .btn { flex: none; }

/* history */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
.filters .full { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.rep { border-top: 1px solid var(--line); }
.rep > button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: transparent; border: 0; padding: 12px 14px; text-align: start; }
.rep .meta { min-width: 0; }
.rep .meta b { display: block; font-weight: 600; }
.rep .meta small { color: var(--dim); font-size: 12.5px; }
.detail { padding: 0 14px 14px; display: grid; gap: 10px; font-size: 14px; }
.detail h3 { margin: 4px 0 2px; font-size: 13px; color: var(--dim); font-weight: 600; }
.detail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.detail li { display: flex; gap: 8px; }
.detail li i { font-style: normal; flex: none; width: 1.4em; }
.detail bdi { direction: ltr; unicode-bidi: isolate; }
.sum { padding: 0 14px 12px; color: var(--dim); font-size: 13.5px; }
.empty { padding: 26px 14px; text-align: center; color: var(--dim); }
#report { width: 100%; min-height: 240px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; resize: vertical; }
@media (max-width: 380px) { .fields.two, .filters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="hrow">
    <div class="wm"><b>ERMINE</b><span id="appSub"></span></div>
    <span class="sp"></span>
    <button class="lang" id="langBtn" data-act="lang" type="button"></button>
  </div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main class="wrap" id="view"></main>
<div class="bar" id="bar" hidden></div>

<script src="config.js"></script>
<script>

    return s;
  }
  function issuesWord(n, lang) {
    if (lang === 'ar') {
      if (n === 0) return 'لا توجد ملاحظات';
      if (n === 1) return 'ملاحظة واحدة';
      if (n === 2) return 'ملاحظتان';
      return n + (n <= 10 ? ' ملاحظات' : ' ملاحظة');
    }
    return n === 0 ? 'no issues' : n === 1 ? '1 issue' : n + ' issues';
  }

  /* ---------- defaults (used until the Config sheet answers, and offline) ---------- */

    units: [

      { id: 'u5', ar: 'مجمد المخزن', en: 'Storage freezer', type: 'freezer', limit: -18 }

    code: sget(KEY.code) || '',

    form: null,
    queue: jget(KEY.queue, []),
    busy: false, flushing: false, confirmMiss: false, err: '', gateErr: '', gateBusy: false,
    last: null,
    mgr: mget('eqc.mgr'),
    hist: { loading: false, err: '', reports: null, sheetUrl: '', from: daysAgo(29), to: today(), emp: '', onlyIssues: false, open: {}, mgrErr: '' }
  };
  if (!Array.isArray(S.queue)) S.queue = [];
  S.form = loadDraft();
  function saveDraft() { sset(KEY.draft, JSON.stringify(S.form)); }
  function saveQueue() { sset(KEY.queue, JSON.stringify(S.queue)); }

  /* ---------- API ---------- */
  function api(payload, ms) {
    if (!CFG.apiUrl) return Promise.reject(new Error('no_api'));
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 20000);
    return fetch(CFG.apiUrl, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined
    }).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(timer); return j; }, function (e) { clearTimeout(timer); throw e; });
  }
  function errText(code) { var k = 'e_' + (code || 'error'); return T[S.lang][k] ? t(k) : t('e_error'); }

  /* ---------- status helpers ---------- */
  function unitStatus(u) {
    var r = S.form.units[u.id], v = r ? parseFloat(r.temp) : NaN;
    if (isNaN(v)) return null;
    return v <= Number(u.limit) ? 'ok' : 'bad';
  }
  function flagStatus(map, id) {
    var r = map[id];
    if (!r || typeof r.ok !== 'boolean') return null;
    return r.ok ? 'ok' : 'bad';
  }
  function totals() {
    var c = S.config, done = 0, bad = 0, total = 0, per = {};
    var groups = [['units', c.units, unitStatus], ['zones', c.zones, function (z) { return flagStatus(S.form.zones, z.id); }], ['hyg', c.hyg, function (h) { return flagStatus(S.form.hyg, h.id); }]];
    groups.forEach(function (g) {
      var d = 0;
      g[1].forEach(function (it) { total++; var s = g[2](it); if (s) { done++; d++; } if (s === 'bad') bad++; });
      per[g[0]] = d + '/' + g[1].length;
    });
    return { done: done, bad: bad, total: total, per: per };
  }
  function repTotals(rep) {
    var done = 0, bad = 0, total = 0;
    ['units', 'zones', 'hyg'].forEach(function (k) {
      ((rep.items && rep.items[k]) || []).forEach(function (it) { total++; if (it.status) done++; if (it.status === 'bad') bad++; });
    });
    return { done: done, bad: bad, total: total };
  }

  /* ---------- report object and text ---------- */
  function buildReport() {
    var f = S.form, c = S.config;
    return {
      id: uid(), date: today(), time: nowHM(), shift: f.shift, employee: f.employee.trim(), workers: f.workers, notes: f.notes, lang: S.lang,
      items: {
        units: c.units.map(function (u) {
          var r = f.units[u.id] || {}, st = unitStatus(u);
          return { id: u.id, ar: u.ar, en: u.en, type: u.type, limit: u.limit, temp: st ? parseFloat(r.temp) : null, status: st, note: st === 'bad' ? (r.action || '') : '' };
        }),
        zones: c.zones.map(function (z) { var r = f.zones[z.id] || {}, st = flagStatus(f.zones, z.id); return { id: z.id, ar: z.ar, en: z.en, status: st, note: st === 'bad' ? (r.note || '') : '' }; }),
        hyg: c.hyg.map(function (h) { var r = f.hyg[h.id] || {}, st = flagStatus(f.hyg, h.id); return { id: h.id, ar: h.ar, en: h.en, status: st, note: st === 'bad' ? (r.note || '') : '' }; })
      }
    };
  }
  // the server reads "action" for temperature rows, "note" for the others
  function forServer(rep) {
    var c = JSON.parse(JSON.stringify(rep));
    c.items.units.forEach(function (u) { u.action = u.note; });
    return c;
  }
  function reportText(rep, lang) {
    var ar = lang === 'ar', L = [], tt = repTotals(rep), issues = [];
    var shiftName = rep.shift === 'evening' ? T[lang].evening : T[lang].morning;
    L.push(ar ? '📋 *سجل فحص الجودة اليومي – إيرماين*' : '📋 *Daily Quality Check – Ermine*');
    L.push((ar ? 'التاريخ: ' : 'Date: ') + dateLong(rep.date, lang) + ' – ' + timeLong(rep.time, lang));
    L.push((ar ? 'الوردية: ' : 'Shift: ') + shiftName);
    if (rep.employee) L.push((ar ? 'المفتش: ' : 'Inspector: ') + rep.employee);
    L.push('');
    L.push(ar ? '🌡️ *حرارة الثلاجات والمجمدات*' : '🌡️ *Fridge & freezer temperatures*');
    rep.items.units.forEach(function (u) {
      var name = nmL(u, lang);
      if (!u.status) { L.push('⚪ ' + name + (ar ? ': لم يُفحص' : ': not checked'));return; }
      var line = (u.status === 'ok' ? '✅ ' : '❌ ') + name + ': ' + ltr(u.temp + '°') + ' (' + (ar ? 'الحد ' : 'limit ') + ltr('≤ ' + u.limit + '°') + ')';
      var note = (u.note || u.action || '').trim();
      if (u.status === 'bad') { if (note) line += (ar ? ' – الإجراء: ' : ' – action: ') + note; issues.push('• ' + name + ': ' + ltr(u.temp + '°') + (note ? ' – ' + note : '')); }
      L.push(line);
    });
    L.push('');
    L.push(ar ? '🧼 *نظافة المناطق والمعدات*' : '🧼 *Area & equipment cleanliness*');
    rep.items.zones.forEach(function (z) {
      var name = nmL(z, lang), note = (z.note || '').trim();
      if (!z.status) { L.push('⚪ ' + name + (ar ? ': لم يُفحص' : ': not checked')); return; }
      L.push((z.status === 'ok' ? '✅ ' : '❌ ') + name + (z.status === 'bad' && note ? ' – ' + note : ''));
      if (z.status === 'bad') issues.push('• ' + name + (note ? ': ' + note : ''));
    });
    L.push('');
    var w = String(rep.workers || '').trim();
    L.push((ar ? '👷 *النظافة الشخصية للعمال*' : '👷 *Personal hygiene*') + (w ? (ar ? ' (عدد المفحوصين: ' : ' (workers checked: ') + w + ')' : ''));
    rep.items.hyg.forEach(function (h) {
      var name = nmL(h, lang), note = (h.note || '').trim();
      if (!h.status) { L.push('⚪ ' + name + (ar ? ': لم يُفحص' : ': not checked')); return; }
      L.push((h.status === 'ok' ? '✅ ' : '❌ ') + name + (h.status === 'bad' && note ? ' – ' + note : ''));
      if (h.status === 'bad') issues.push('• ' + name + (note ? ': ' + note : ''));
    });
    if (issues.length) { L.push(''); L.push(ar ? '⚠️ *تحتاج متابعة*' : '⚠️ *Needs follow-up*'); issues.forEach(function (i) { L.push(i); }); }
    if ((rep.notes || '').trim()) { L.push(''); L.push(ar ? '📝 *ملاحظات عامة*' : '📝 *General notes*'); L.push(rep.notes.trim()); }
    L.push('');
    L.push((ar ? 'الخلاصة: تم فحص ' + tt.done + ' من ' + tt.total + ' – ' : 'Summary: ' + tt.done + ' of ' + tt.total + ' checked – ') + issuesWord(tt.bad, lang));
    return L.join('\n');
  }

  function checkView() {

  function histFiltered() {

    return (h.reports || []).filter(function (r) {
      if (h.emp && r.employee !== h.emp) return false;

  function repDetail(r) {

  function historyView() {

  /* ---------- render ---------- */
  function render() {
    document.documentElement.lang = S.lang;
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('docTitle');
    $('#langBtn').textContent = S.lang === 'ar' ? 'EN' : 'عربي';
    $('#appSub').textContent = t('title');
    var gate = S.apiOn && !S.code, tabs = $('#tabs'), v = $('#view');
    tabs.hidden = gate || !S.apiOn;
    if (!tabs.hidden) {
      tabs.innerHTML = '<button data-act="tab" data-v="check"' + (S.view !== 'history' ? ' aria-current="page"' : '') + '>' + t('tabCheck') + '</button>' +
        '<button data-act="tab" data-v="history"' + (S.view === 'history' ? ' aria-current="page"' : '') + '>' + t('tabHist') + '</button>';
    }
    if (gate) v.innerHTML = gateView();
    else if (S.view === 'history' && S.apiOn) v.innerHTML = historyView();
    else if (S.view === 'done' && S.last) v.innerHTML = doneView();
    else { S.view = 'check'; v.innerHTML = checkView(); updateChips(); }
    renderBar();
  }
  function renderBar() {
    var b = $('#bar');
    if (S.view !== 'check' || (S.apiOn && !S.code)) { b.hidden = true; return; }
    b.hidden = false;
    b.innerHTML = '<div class="bar-in"><div class="prog"><b id="progTxt"></b><small id="progSub"></small><div class="meter"><i id="meter"></i></div></div>' +
      (S.apiOn ? '<button class="btn" id="submitBtn" data-act="submit"></button>' : '<button class="btn" data-act="copy"><span data-copy-label>' + t('copyWa') + '</span></button>') + '</div>';
    derived();
  }
  function updateChips() {
    S.config.units.forEach(function (u) {
      var row = document.querySelector('.row[data-kind="units"][data-id="' + u.id + '"]');
      if (row) updateChip(row, u);
    });
  }
  function updateChip(row, u) {
    var st = unitStatus(u), chip = row.querySelector('[data-chip]'), act = row.querySelector('[data-action]');
    if (chip) { chip.className = 'chip' + (st ? ' ' + st : ''); chip.textContent = st === 'ok' ? t('chipOk') : st === 'bad' ? t('chipBad') : t('chipNone'); }
    if (act) act.hidden = st !== 'bad';
  }
  function derived() {
    if (S.view !== 'check') return;
    var tt = totals();
    var pt = $('#progTxt'); if (!pt) return;
    pt.textContent = t('checked', { d: tt.done, t: tt.total });
    var sub = $('#progSub'); sub.textContent = issuesWord(tt.bad, S.lang); sub.className = tt.bad ? 'warn' : '';
    $('#meter').style.width = (tt.total ? Math.round(tt.done / tt.total * 100) : 0) + '%';
    Object.keys(tt.per).forEach(function (k) { var c = document.querySelector('[data-count="' + k + '"]'); if (c) c.textContent = tt.per[k]; });
    var sb = $('#submitBtn');
    if (sb) { sb.disabled = S.busy; sb.textContent = S.busy ? t('submitting') : S.confirmMiss ? t('submitMiss', { n: tt.total - tt.done }) : t('submit'); }
    var wa = $('#wa'); if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(reportText(buildReport(), S.lang));
  }

  /* ---------- actions ---------- */
  var flashTimer = null;
  function flash(btn, msg) {
    var el = btn && btn.querySelector('[data-copy-label]'); if (!el) return;
    var orig = el.getAttribute('data-orig') || el.textContent; el.setAttribute('data-orig', orig); el.textContent = msg;
    clearTimeout(flashTimer); flashTimer = setTimeout(function () { el.textContent = orig; }, 1800);
  }
  function copyText(txt, btn) {
    var fallback = function () {
      var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); flash(btn, ok ? t('copied') : t('selectCopy'));
    };
    try { navigator.clipboard.writeText(txt).then(function () { flash(btn, t('copied')); }, fallback); } catch (e) { fallback(); }
  }

  function flush() {
    if (S.flushing || !S.apiOn || !S.code) return Promise.resolve();
    S.flushing = true;
    function step() {
      var rep = S.queue.filter(function (r) { return !r.failed; })[0];
      if (!rep) { S.flushing = false; afterFlush(); return Promise.resolve(); }
      return api({ action: 'submit', code: S.code, report: forServer(rep) }).then(function (res) {
        if (res && res.ok) {
          S.queue = S.queue.filter(function (x) { return x.id !== rep.id; }); saveQueue();
          if (S.last && S.last.rep.id === rep.id) S.last.state = 'sent';
          return step();
        }
        if (res && res.error === 'bad_code') { S.flushing = false; S.code = ''; sdel(KEY.code); S.gateErr = 'bad_code'; render(); return; }
        rep.failed = (res && res.error) || 'error'; saveQueue(); return step();
      }, function () { S.flushing = false; afterFlush(); });
    }
    return step();
  }
  function updateBanner() { var b = $('#banner'); if (b) b.innerHTML = bannerHtml(); }
  function afterFlush() { if (S.view === 'done') render(); else updateBanner(); }

  function startSubmit() {
    if (S.busy) return;
    if (!S.form.employee.trim()) { S.err = 'needEmp'; render(); var e = $('#emp'); if (e) { e.focus(); e.scrollIntoView({ block: 'center' }); } return; }
    S.err = '';
    var rep = buildReport(), tt = repTotals(rep), miss = tt.total - tt.done;
    if (miss > 0 && !S.confirmMiss) { S.confirmMiss = true; derived(); setTimeout(function () { S.confirmMiss = false; derived(); }, 6000); return; }
    S.confirmMiss = false;
    sset(KEY.emp, S.form.employee); sset(KEY.shift, S.form.shift);
    S.queue.push(rep); saveQueue();
    S.last = { rep: rep, state: 'queued' };
    S.form = emptyForm(); saveDraft();
    S.view = 'done'; render();
    window.scrollTo(0, 0);
    flush();
  }

  function loadConfig() {
    if (!S.apiOn || !S.code) return Promise.resolve();
    return api({ action: 'config', code: S.code }, 12000).then(function (res) {
      if (res && res.ok && res.config) { var nc = normConfig(res.config), changed = JSON.stringify(nc) !== JSON.stringify(S.config); S.config = nc; sset(KEY.cfg, JSON.stringify(nc)); if (changed && S.view === 'check') render(); }
      else if (res && res.error === 'bad_code') { S.code = ''; sdel(KEY.code); S.gateErr = 'bad_code'; render(); }
    }).catch(function () {});
  }
  function tryGate() {
    var v = ($('#gate-code') || {}).value || '';
    v = v.trim(); if (!v) return;
    S.gateBusy = true; S.gateErr = ''; render();
    api({ action: 'config', code: v }, 15000).then(function (res) {
      S.gateBusy = false;
      if (res && res.ok) { S.code = v; sset(KEY.code, v); S.config = normConfig(res.config); sset(KEY.cfg, JSON.stringify(S.config)); S.gateErr = ''; render(); flush(); }
      else { S.gateErr = (res && res.error) || 'error'; render(); }
    }).catch(function () { S.gateBusy = false; S.gateErr = 'net'; render(); });
  }

  function loadHistory() {
    var h = S.hist; h.loading = true; h.err = ''; render();
    api({ action: 'list', managerCode: S.mgr, from: h.from, to: h.to }, 30000).then(function (res) {
      h.loading = false;
      if (res && res.ok) { h.reports = res.reports || []; h.sheetUrl = res.sheetUrl || ''; }
      else if (res && res.error === 'bad_code') { S.mgr = ''; mdel('eqc.mgr'); h.mgrErr = 'bad_code'; h.reports = null; }
      else h.err = (res && res.error) || 'error';
      render();
    }).catch(function () { h.loading = false; h.err = 'net'; render(); });
  }
  function tryMgr() {
    var v = (($('#mgr-code') || {}).value || '').trim(); if (!v) return;
    S.mgr = v; mset('eqc.mgr', v); S.hist.mgrErr = ''; loadHistory();
  }

  function csvCell(v) { var s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function download(name, rows) {
    var csv = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  function exportItems() {
    var rows = [['report_id', 'date', 'time', 'shift', 'employee', 'section', 'item_ar', 'item_en', 'value', 'limit', 'status', 'note']];
    var secs = [['units', 'temperature'], ['zones', 'cleanliness'], ['hyg', 'hygiene']];
    histFiltered().forEach(function (r) {
      secs.forEach(function (s) {
        ((r.items && r.items[s[0]]) || []).forEach(function (it) {
          rows.push([r.id, r.date, String(r.submittedAt || '').slice(11, 16), r.shift, r.employee, s[1], it.ar, it.en, it.temp == null ? '' : it.temp, it.limit == null ? '' : it.limit, it.status || '', it.note || it.action || '']);
        });
      });
    });
    download('ermine-qc-items-' + today() + '.csv', rows);
  }
  function exportReports() {
    var rows = [['report_id', 'date', 'shift', 'employee', 'workers', 'done', 'total', 'issues', 'notes']];
    histFiltered().forEach(function (r) { rows.push([r.id, r.date, r.shift, r.employee, r.workers, r.done, r.total, r.issues, r.notes]); });
    download('ermine-qc-reports-' + today() + '.csv', rows);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, row = b.closest('.row'), kind = row && row.dataset.kind, id = row && row.dataset.id;
    if (act === 'lang') { S.lang = S.lang === 'ar' ? 'en' : 'ar'; sset(KEY.lang, S.lang); render(); return; }
    if (act === 'tab') { S.view = b.dataset.v; render(); if (S.view === 'history' && S.mgr && !S.hist.reports && !S.hist.loading) loadHistory(); return; }
    if (act === 'gate') { tryGate(); return; }
    if (act === 'mgr') { tryMgr(); return; }
    if (act === 'lock') { S.mgr = ''; mdel('eqc.mgr'); S.hist.reports = null; render(); return; }
    if (act === 'hist-load') { loadHistory(); return; }
    if (act === 'hist-open') { S.hist.open[b.dataset.id] = !S.hist.open[b.dataset.id]; render(); return; }
    if (act === 'exp-items') { exportItems(); return; }
    if (act === 'exp-reps') { exportReports(); return; }
    if (act === 'submit') { startSubmit(); return; }
    if (act === 'copy') { copyText(reportText(buildReport(), S.lang), b); return; }
    if (act === 'copy-last') { copyText(reportText(S.last.rep, S.lang), b); return; }
    if (act === 'newcheck') { S.view = 'check'; S.last = null; render(); window.scrollTo(0, 0); return; }
    if (act === 'retry') { S.queue.forEach(function (r) { delete r.failed; }); saveQueue(); flush(); render(); return; }
    if (!row) return;
    var map = S.form[kind];
    if (act === 'step') {
      var u = S.config.units.filter(function (x) { return x.id === id; })[0], inp = row.querySelector('[data-field="temp"]'), cur = parseFloat(inp.value);
      if (isNaN(cur)) cur = Number(u.limit);
      var next = Math.round((cur + Number(b.dataset.d)) * 10) / 10;
      inp.value = next; map[id] = Object.assign(map[id] || {}, { temp: String(next) });
      updateChip(row, u); derived(); saveDraft(); return;
    }
    if (act === 'ok' || act === 'bad') {
      var want = act === 'ok', cur2 = map[id] || {};
      if (cur2.ok === want) delete cur2.ok; else cur2.ok = want;
      map[id] = cur2; saveDraft();
      var it = S.config[kind].filter(function (x) { return x.id === id; })[0];
      row.outerHTML = flagRow(kind, it, kind === 'zones' ? t('zOk') : t('hOk'), kind === 'zones' ? t('zBad') : t('hBad'));
      derived();
      if (cur2.ok === false) { var n = document.getElementById('a-' + id); if (n) n.focus(); }
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, row = el.closest('.row');
    if (el.dataset.meta) { S.form[el.dataset.meta] = el.value; saveDraft(); if (el.dataset.meta === 'employee') S.err = ''; derived(); return; }
    if (!row || !el.dataset.field) return;
    var kind = row.dataset.kind, id = row.dataset.id, map = S.form[kind], f = el.dataset.field;
    map[id] = Object.assign(map[id] || {}, f === 'temp' ? { temp: el.value } : f === 'action' ? { action: el.value } : { note: el.value });
    if (f === 'temp') { var u = S.config.units.filter(function (x) { return x.id === id; })[0]; if (u) updateChip(row, u); }
    saveDraft(); derived();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.meta === 'employee' || el.dataset.meta === 'shift') { S.form[el.dataset.meta] = el.value; saveDraft(); return; }
    if (el.dataset.h) {
      var k = el.dataset.h;
      S.hist[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'emp' || k === 'onlyIssues') render();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'gate-code') tryGate();
    if (e.target.id === 'mgr-code') tryMgr();
  });
  window.addEventListener('online', function () { flush(); });
  setInterval(function () { if (S.queue.length) flush(); }, 60000);

  /* ---------- start ---------- */
  render();
  if (S.apiOn && S.code) { loadConfig(); flush(); }
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
