<style>
:root {
  color-scheme: light;
  --green: #014833;
  --bg: #F7F5F1;
  --card: #ffffff;
  --field: #F1EEE8;
  --line: #E4E0D8;
  --ink: #14201B;
  --dim: #66726C;
  --accent: #014833;
  --accent-ink: #ffffff;
  --ok: #00756F;
  --okbg: rgba(0,145,139,.12);
  --warn: #B8650F;
  --bad: #BF2028;
  --badbg: rgba(191,32,40,.10);
  --font: "IBM Plex Sans Arabic", "Dubai", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0B1411; --card: #13201B; --field: #1A2B24; --line: #223029; --ink: #ECEFE9; --dim: #8DA096;
    --accent: #2BC2B6; --accent-ink: #04201c; --ok: #2BC2B6; --okbg: rgba(43,194,182,.14);
    --warn: #F3913F; --bad: #E8645F; --badbg: rgba(232,100,95,.14);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* header band */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--green); color: #fff;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.hrow { display: flex; align-items: center; gap: 10px; min-height: 40px; max-width: 640px; margin: 0 auto; }
.wm { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.wm b { letter-spacing: .18em; font-size: 17px; font-weight: 600; }
.wm span { font-size: 12px; opacity: .78; }
.sp { flex: 1; }
.lang { min-width: 52px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
.tabs { display: flex; gap: 6px; max-width: 640px; margin: 8px auto 0; }
.tabs button { flex: 1; min-height: 42px; background: transparent; border: 0; border-bottom: 3px solid transparent; color: rgba(255,255,255,.72); font-weight: 600; }
.tabs button[aria-current="page"] { color: #fff; border-bottom-color: #fff; }

.wrap { max-width: 640px; margin: 14px auto 0; display: grid; gap: 14px; }
.wrap > * { min-width: 0; }
#banner:empty { display: none; }
#banner { display: grid; gap: 10px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pan-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 10px; }
.pan-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.pan-head p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
.count { font-size: 13px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 10px; }
.rowtop { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.nm { min-width: 0; font-weight: 500; }
.nm small { display: block; font-weight: 400; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--field); color: var(--dim); white-space: nowrap; }
.chip.ok { background: var(--okbg); color: var(--ok); }
.chip.bad { background: var(--badbg); color: var(--bad); }

.temp { display: flex; align-items: center; gap: 8px; direction: ltr; }
.temp input { width: 96px; min-height: 46px; text-align: center; font-size: 20px; font-weight: 600; background: var(--field); border: 1px solid var(--line); border-radius: 9px; font-variant-numeric: tabular-nums; }
.step { width: 46px; height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); font-size: 22px; line-height: 1; }
.deg { color: var(--dim); font-size: 14px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { min-height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); font-weight: 500; }
.seg button[aria-pressed="true"].yes { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.seg button[aria-pressed="true"].no { background: var(--badbg); border-color: var(--bad); color: var(--bad); font-weight: 600; }

.txt, .area, select, .num, input[type=date] { width: 100%; min-height: 46px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; }
.area { resize: vertical; min-height: 84px; }
.field label, .action label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 4px; }
.fields { padding: 0 14px 14px; display: grid; gap: 12px; }
.fields.two { grid-template-columns: 1fr 1fr; padding-top: 14px; }
.pad { padding: 0 14px 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.btn.alt { background: transparent; color: var(--accent); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: .55; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px; }
.note { margin: 0; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
.note.warn { background: rgba(184,101,15,.12); color: var(--warn); }
.note.bad { background: var(--badbg); color: var(--bad); }
.note.ok { background: var(--okbg); color: var(--ok); }
.note .btn { margin-top: 8px; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.prog { flex: 1; min-width: 0; }
.prog b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.prog small { display: block; font-size: 12.5px; color: var(--dim); }
.prog small.warn { color: var(--bad); font-weight: 600; }
.meter { height: 4px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; }
.bar .btn { flex: none; }

/* history */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
.filters .full { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.rep { border-top: 1px solid var(--line); }

.rep .meta { min-width: 0; }
.rep .meta b { display: block; font-weight: 600; }
.rep .meta small { color: var(--dim); font-size: 12.5px; }
.detail { padding: 0 14px 14px; display: grid; gap: 10px; font-size: 14px; }
.detail h3 { margin: 4px 0 2px; font-size: 13px; color: var(--dim); font-weight: 600; }
.detail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

.detail li i { font-style: normal; flex: none; width: 1.4em; }
.detail bdi { direction: ltr; unicode-bidi: isolate; }
.sum { padding: 0 14px 12px; color: var(--dim); font-size: 13.5px; }
.empty { padding: 26px 14px; text-align: center; color: var(--dim); }
#report { width: 100%; min-height: 240px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; resize: vertical; }

.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px; }
.seg3 button { min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); font-weight: 500; }
.seg3 button[aria-pressed="true"] { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.act { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 6px; }
.act .det { font-size: 14px; }
.act .det.dim { color: var(--dim); font-size: 13px; }
.act .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.act .editor { display: grid; gap: 10px; margin-top: 6px; }
.chip.warn { background: rgba(184,101,15,.14); color: var(--warn); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 14px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--field); }
.kpi small { display: block; font-size: 12.5px; color: var(--dim); }
.kpi b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
.kpi .vs { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.kpi .vs.good { color: var(--ok); }
.kpi .vs.badc { color: var(--bad); }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.kv > span { min-width: 0; }
.kv small { display: block; font-size: 12.5px; color: var(--dim); }
.kv b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.who { display: grid; gap: 8px; padding: 14px; }
.whoBtn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  min-height: 56px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); color: inherit; font: inherit; text-align: start; cursor: pointer; }
.whoBtn b { font-size: 16px; font-weight: 700; }
.whoBtn small { color: var(--dim); font-size: 13px; }
.whoBtn:active { background: var(--field); }
.whoNow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0;
  min-height: 44px; }
.whoNow b { font-size: 16px; }
.whoNow small { color: var(--dim); font-size: 13px; }
.whoNow .btn { margin-inline-start: auto; width: auto; }
</style>
</head>

    y += Math.ceil(meta.length / 2) * 92 + 12;

    /* ---- summary strip ---- */
    var done = 0, bad = 0, total = 0;
    ['units', 'zones', 'hyg'].forEach(function (k) { ((rep.items && rep.items[k]) || []).forEach(function (it) { total++; if (it.status) done++; if (it.status === 'bad') bad++; }); });

    text(T[lang].checked.replace('{d}', done).replace('{t}', total) + '   ·   ' + issuesWord(bad, lang), 28, y + 54, 32, 600, bad ? BAD : OK);
    y += 84 + 36;

    secs.forEach(function (sec) {

      g.strokeStyle = GREEN; g.lineWidth = 3; g.beginPath(); g.moveTo(M, y + 52); g.lineTo(W - M, y + 52); g.stroke();

        var noteLines = note ? wrap(T[lang].noteL + ': ' + note, nameW, 26, 400) : [];
        var rh = 24 + nameLines.length * 42 + (noteLines.length ? noteLines.length * 36 + 6 : 0) + 18;
        ensure(rh);
        if (it.status === 'bad') { g.fillStyle = BADBG; g.fillRect(M, y, CW, rh); }

        var ty = y + 46;
        nameLines.forEach(function (ln, i) { text(ln, 64, ty + i * 42, 30, 500, INK); });
        ty += (nameLines.length - 1) * 42;
        noteLines.forEach(function (ln, i) { text(ln, 64, ty + 42 + i * 36, 26, 400, BAD); });

    /* ---- general notes ---- */
    if (String(rep.notes || '').trim()) {

    return pages;
  }

      return api({ action: 'submit', code: S.code, employee: S.me.id, report: forServer(rep) }).then(function (res) {
        if (res && res.ok) {
          S.queue = S.queue.filter(function (x) { return x.id !== rep.id; }); saveQueue();
          if (S.last && S.last.rep.id === rep.id) S.last.state = 'sent';
          return step();

        if (res && (res.error === 'bad_code' || res.error === 'unknown_employee' || res.error === 'no_code_set')) {
          S.flushing = false; signOut(res.error); return;

  function weekStats(reps, start) {
    var end = addDays(start, 6), o = { n: 0, checked: 0, bad: 0, rate: null, items: {}, sec: { units: 0, zones: 0, hyg: 0 }, emp: {}, day: {}, temps: {} };
    (reps || []).forEach(function (r) {
      if (r.date < start || r.date > end) return;
      o.n++;
      var d = o.day[r.date] = o.day[r.date] || { n: 0, bad: 0 }; d.n++;
      var e = o.emp[r.employee || '-'] = o.emp[r.employee || '-'] || { n: 0, bad: 0 }; e.n++;
      ['units', 'zones', 'hyg'].forEach(function (sec) {
        ((r.items && r.items[sec]) || []).forEach(function (it) {
          if (it.status) o.checked++;
          if (it.status === 'bad') {
            o.bad++; o.sec[sec]++; d.bad++; e.bad++;
            var k = sec + '|' + it.id, m = o.items[k] = o.items[k] || { it: it, n: 0 }; m.n++;
          }
          if (sec === 'units' && it.temp != null && it.temp !== '' && !isNaN(parseFloat(it.temp))) {
            var tp = o.temps[it.id] = o.temps[it.id] || { it: it, max: -Infinity, over: 0 }, v = parseFloat(it.temp);
            if (v > tp.max) tp.max = v;
            if (it.status === 'bad') tp.over++;
          }
        });
      });
    });
    if (o.checked) o.rate = Math.round((o.checked - o.bad) / o.checked * 1000) / 10;
    return o;
  }
  function kpiHtml(label, cur, prev, lowGood, suffix) {
    var s = cur == null ? '-' : cur + (suffix || ''), vs = '';
    if (prev != null && cur != null) {
      var diff = Math.round((cur - prev) * 10) / 10, cls = diff === 0 ? '' : ((diff < 0) === !!lowGood ? ' good' : ' badc');
      vs = '<span class="vs' + cls + '">' + (diff > 0 ? '▲ ' : diff < 0 ? '▼ ' : '') + t('wkVs', { v: prev + (suffix || '') }) + '</span>';
    } else if (prev == null) vs = '<span class="vs">' + t('wkVs', { v: '-' }) + '</span>';
    return '<div class="kpi"><small>' + label + '</small><b>' + s + '</b>' + vs + '</div>';
  }
  function loadWeekly() {
    var w = S.wk; w.loading = true; w.err = ''; render();
    Promise.all([
      mgrApi({ action: 'list', from: addDays(w.start, -7), to: addDays(w.start, 6) }),
      mgrApi({ action: 'actions' })
    ]).then(function (rs) {
      w.loading = false; w.reports = rs[0].reports || []; S.act.list = rs[1].actions || []; w.week = w.start; render();
    }).catch(function (e) { w.loading = false; w.err = e && e.message === 'bad_code' ? '' : (e && e.message && e.message !== 'Failed to fetch' ? e.message : 'net'); render(); });
  }
  function weeklyView() {
    if (!S.mgr) return mgrGateHtml();
    var w = S.wk, out = '', thisWeek = weekStartOf(today());
    out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkTitle') + '</h2><p>' + dayMonth(w.start, S.lang) + ' – ' + dayMonth(addDays(w.start, 6), S.lang) + '</p></div></div>' +
      '<div class="btns" style="padding-top:0"><button class="btn alt" data-act="wk-prev"' + (w.loading ? ' disabled' : '') + '>' + t('wkPrev') + '</button>' +
      '<button class="btn alt" data-act="wk-next"' + (w.loading || w.start >= thisWeek ? ' disabled' : '') + '>' + t('wkNext') + '</button></div>' +
      '<div class="pad"><button class="btn" style="width:100%" data-act="wk-load"' + (w.loading ? ' disabled' : '') + '>' + (w.loading ? t('loading') : t('refresh')) + '</button></div>' +
      '<div class="pad" style="padding-top:0"><button class="btn alt" style="width:100%" data-act="lock">' + t('lock') + '</button></div></section>';
    if (w.err) out += '<p class="note bad" role="alert">' + esc(errText(w.err)) + '</p>';
    if (!w.reports || w.week !== w.start) return out;
    var cur = weekStats(w.reports, w.start), prev = weekStats(w.reports, addDays(w.start, -7));
    var list = S.act.list || [], open = list.filter(function (x) { return x.status !== 'done'; }), late = list.filter(isLate);
    if (!cur.n) { return out + '<section class="panel"><div class="empty">' + t('wkNoData') + '</div></section>'; }
    var keys = actionKeys(), noAct = problemsOf(w.reports.filter(function (r) { return r.date >= w.start && r.date <= addDays(w.start, 6); })).filter(function (p) { return !keys[p.key]; }).length;
    out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkSummary') + '</h2></div></div><div class="kpis">' +
      kpiHtml(t('wkReports'), cur.n, prev.n, false) + kpiHtml(t('wkRate'), cur.rate, prev.rate, false, '%') +
      kpiHtml(t('wkIssues'), cur.bad, prev.n ? prev.bad : null, true) +
      '<div class="kpi"><small>' + t('wkOpenActs') + '</small><b>' + open.length + '</b><span class="vs' + (late.length ? ' badc' : '') + '">' + (late.length ? t('wkLateWarn', { n: late.length }) : '') + '</span></div></div>' +
      (noAct ? '<p class="note warn" style="margin:0 14px 14px">' + t('wkNoActWarn', { n: noAct }) + '</p>' : '') + '</section>';
    var top = Object.keys(cur.items).map(function (k) { return { k: k, m: cur.items[k] }; }).sort(function (a, b) { return b.m.n - a.m.n; }).slice(0, 5);
    out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkTop') + '</h2></div></div>';
    if (!top.length) out += '<div class="empty">' + t('wkNoProb') + '</div>';
    top.forEach(function (x) {
      var pv = prev.items[x.k];
      out += '<div class="kv"><span>' + esc(nmL(x.m.it, S.lang)) + (pv ? '<small>' + t('wkVs', { v: pv.n }) + '</small>' : '') + '</span><b>' + t('wkTimes', { n: x.m.n }) + '</b></div>';
    });
    out += '</section>';
    out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkBySec') + '</h2></div></div>' +
      [['units', 'secUnits'], ['zones', 'secZones'], ['hyg', 'secHyg']].map(function (s) {
        return '<div class="kv"><span>' + t(s[1]) + '<small>' + t('wkVs', { v: prev.sec[s[0]] }) + '</small></span><b>' + cur.sec[s[0]] + '</b></div>'; }).join('') + '</section>';
    var temps = Object.keys(cur.temps).map(function (k) { return cur.temps[k]; });
    if (temps.length) {
      out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkTemps') + '</h2></div></div>' + temps.map(function (x) {
        return '<div class="kv"><span>' + esc(nmL(x.it, S.lang)) + '<small>' + t('limit') + ' <bdi>' + esc(x.it.limit) + '°</bdi>' + (x.over ? ' · ' + t('wkOver', { n: x.over }) : '') + '</small></span><b><bdi>' + x.max + '°</bdi></b></div>'; }).join('') + '</section>';
    }
    var emps = Object.keys(cur.emp).sort(function (a, b) { return cur.emp[b].n - cur.emp[a].n; });
    out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkByEmp') + '</h2></div></div>' + emps.map(function (n) {
      return '<div class="kv"><span>' + esc(n) + '<small>' + t('wkRepN', { n: cur.emp[n].n }) + '</small></span><b>' + issuesWord(cur.emp[n].bad, S.lang) + '</b></div>'; }).join('') + '</section>';
    var days = '';
    for (var i = 0; i < 7; i++) {
      var ds = addDays(w.start, i), dd = cur.day[ds];
      days += '<div class="kv"><span>' + dayShort(ds, S.lang) + '</span><b>' + (dd ? t('wkRepN', { n: dd.n }) + ' · ' + issuesWord(dd.bad, S.lang) : '<span style="color:var(--dim);font-weight:400">' + t('wkNoReps') + '</span>') + '</b></div>';
    }
    out += '<section class="panel"><div class="pan-head"><div><h2>' + t('wkByDay') + '</h2></div></div>' + days + '</section>';
    return out;
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, row = b.closest('.row'), kind = row && row.dataset.kind, id = row && row.dataset.id;
    if (act === 'lang') { S.lang = S.lang === 'ar' ? 'en' : 'ar'; sset(KEY.lang, S.lang); render(); return; }
    if (act === 'tab') {
      S.view = b.dataset.v; render();
      if (S.mgr) {
        if (S.view === 'history' && !S.hist.reports && !S.hist.loading) loadHistory();
        else if (S.view === 'actions' && !S.act.list && !S.act.loading) loadActions();
        else if (S.view === 'weekly' && (!S.wk.reports || S.wk.week !== S.wk.start) && !S.wk.loading) loadWeekly();
      }
      window.scrollTo(0, 0); return;
    }
    if (act === 'act-filter') { S.act.filter = b.dataset.v; render(); return; }
    if (act === 'act-load') { loadActions(); return; }
    if (act === 'act-new') { S.act.edit = { mode: 'new', key: b.dataset.key }; S.act.formErr = ''; render(); var o1 = $('#ae-owner'); if (o1) o1.focus(); return; }
    if (act === 'act-edit') { S.act.edit = { mode: 'edit', id: b.dataset.id }; S.act.formErr = ''; render(); return; }
    if (act === 'act-cancel') { S.act.edit = null; S.act.formErr = ''; render(); return; }
    if (act === 'act-save') { saveAction(); return; }
    if (act === 'act-toggle') { toggleAction(b.dataset.id); return; }
    if (act === 'act-export') { exportActions(); return; }
    if (act === 'wk-load') { loadWeekly(); return; }
    if (act === 'wk-prev') { S.wk.start = addDays(S.wk.start, -7); loadWeekly(); return; }
    if (act === 'wk-next') { if (S.wk.start < weekStartOf(today())) { S.wk.start = addDays(S.wk.start, 7); loadWeekly(); } return; }
    if (act === 'gate') { tryGate(); return; }
    if (act === 'who-load') { loadWho(true); return; }
    if (act === 'who-pick') {
      var who = (S.who.list || []).filter(function (x) { return x.id === b.dataset.id; })[0];
      if (!who) return;
      S.who.pick = who; S.gateErr = ''; render();
      var gc = $('#gate-code'); if (gc) gc.focus();
      return;
    }
    if (act === 'who-back') { S.who.pick = null; S.gateErr = ''; render(); return; }
    if (act === 'signout') { signOut(''); return; }
    if (act === 'mgr') { tryMgr(); return; }
    if (act === 'lock') { S.mgr = ''; mdel('eqc.mgr'); S.hist.reports = null; S.act.list = null; S.act.reports = null; S.wk.reports = null; render(); return; }
    if (act === 'hist-load') { loadHistory(); return; }
    if (act === 'hist-open') { S.hist.open[b.dataset.id] = !S.hist.open[b.dataset.id]; render(); return; }
    if (act === 'exp-items') { exportItems(); return; }
    if (act === 'exp-reps') { exportReports(); return; }
    if (act === 'submit') { startSubmit(); return; }
    if (act === 'pdf-now') {
      if (b.disabled) return; b.disabled = true;
      makePdf(buildReport(), S.lang).then(function (f) { saveFile(f); b.disabled = false; }, function () { b.disabled = false; S.err = 'pdf'; });
      return;
    }
    if (act === 'pdf-save') { if (S.last && S.last.file) saveFile(S.last.file); return; }
    if (act === 'pdf-share') {
      var lf = S.last && S.last.file; if (!lf) return;
      if (canShareFile(lf)) { navigator.share({ files: [lf], title: 'Ermine QC' }).catch(function (e) { if (!e || e.name !== 'AbortError') saveFile(lf); }); }
      else saveFile(lf);
      return;
    }
    if (act === 'hist-pdf') {
      var hr = (S.hist.reports || []).filter(function (x) { return x.id === b.dataset.id; })[0]; if (!hr || b.disabled) return;
      b.disabled = true;
      makePdf({ date: hr.date, time: String(hr.submittedAt || '').slice(11, 16), shift: hr.shift, employee: hr.employee, workers: hr.workers, notes: hr.notes, items: hr.items || {} }, S.lang)
        .then(function (f) { saveFile(f); b.disabled = false; }, function () { b.disabled = false; });
      return;
    }
    if (act === 'newcheck') { S.view = 'check'; S.last = null; render(); window.scrollTo(0, 0); return; }
    if (act === 'retry') { S.queue.forEach(function (r) { delete r.failed; }); saveQueue(); flush(); render(); return; }
    if (!row) return;
    var map = S.form[kind];
    if (act === 'step') {
      var u = S.config.units.filter(function (x) { return x.id === id; })[0], inp = row.querySelector('[data-field="temp"]'), cur = parseFloat(inp.value);
      if (isNaN(cur)) cur = Number(u.limit);
      var next = Math.round((cur + Number(b.dataset.d)) * 10) / 10;
      inp.value = next; map[id] = Object.assign(map[id] || {}, { temp: String(next) });
      updateChip(row, u); derived(); saveDraft(); return;
    }
    if (act === 'ok' || act === 'bad') {
      var want = act === 'ok', cur2 = map[id] || {};
      if (cur2.ok === want) delete cur2.ok; else cur2.ok = want;
      map[id] = cur2; saveDraft();
      var it = S.config[kind].filter(function (x) { return x.id === id; })[0];
      row.outerHTML = flagRow(kind, it, kind === 'zones' ? t('zOk') : t('hOk'), kind === 'zones' ? t('zBad') : t('hBad'));
      derived();
      if (cur2.ok === false) { var n = document.getElementById('a-' + id); if (n) n.focus(); }
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, row = el.closest('.row');
    if (el.dataset.meta) { S.form[el.dataset.meta] = el.value; saveDraft(); if (el.dataset.meta === 'employee') S.err = ''; derived(); return; }
    if (!row || !el.dataset.field) return;
    var kind = row.dataset.kind, id = row.dataset.id, map = S.form[kind], f = el.dataset.field;
    map[id] = Object.assign(map[id] || {}, f === 'temp' ? { temp: el.value } : f === 'action' ? { action: el.value } : { note: el.value });
    if (f === 'temp') { var u = S.config.units.filter(function (x) { return x.id === id; })[0]; if (u) updateChip(row, u); }
    saveDraft(); derived();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.meta === 'employee' || el.dataset.meta === 'shift' || el.dataset.meta === 'role') { S.form[el.dataset.meta] = el.value; saveDraft(); if (el.dataset.meta === 'role') { sset(KEY.role, el.value); S.err = ''; render(); } return; }
    if (el.dataset.h) {
      var k = el.dataset.h;
      S.hist[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'emp' || k === 'onlyIssues') render();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'gate-code') tryGate();
    if (e.target.id === 'mgr-code') tryMgr();
  });
  window.addEventListener('online', function () { flush(); });
  setInterval(function () { if (S.queue.length) flush(); }, 60000);

  /* ---------- start ---------- */
  render();
  if (S.apiOn && S.me && S.code) { loadConfig(); flush(); }
  else if (S.apiOn) loadWho(true);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
