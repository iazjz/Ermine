<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#014833">
<title>ERMINE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>

/* ------------------------------------------------------------------ *
 *  The Ermine palette, straight off the brand kit.                   *
 *  Green is the brand; the other four are for meaning, never decor:  *
 *  teal reads "good", orange "watch", red "wrong", purple is the     *
 *  second voice in charts.                                           *
 * ------------------------------------------------------------------ */
:root{
  --green:#014833; --purple:#7C2981; --orange:#F37121; --teal:#00918B; --red:#BF2028;
  color-scheme: light;
  --bg:#F7F5F1; --card:#fff; --line:#E4E0D8; --ink:#14201B; --dim:#6E7A74;
  --ok:var(--teal); --warn:#B8650F; --bad:var(--red); --accent:var(--green);
  --okbg:rgba(0,145,139,.10); --warnbg:rgba(243,113,33,.12); --badbg:rgba(191,32,40,.09);
  --shadow:0 1px 2px rgba(1,72,51,.05),0 10px 26px -14px rgba(1,72,51,.28);
  /* the brand faces, inlined above: Zarid Display for titles, Dubai for text */
  --serif:"Zarid Display",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Dubai",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
}
html[data-theme=dark]{
  color-scheme: dark;
  --bg:#0B1411; --card:#13201B; --line:#223029; --ink:#ECEFE9; --dim:#8DA096;
  --ok:#2BC2B6; --warn:#F3913F; --bad:#E8645F; --accent:#2BC2B6;
  --okbg:rgba(43,194,182,.13); --warnbg:rgba(243,145,63,.13); --badbg:rgba(232,100,95,.13);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 var(--sans);
  padding:0 0 calc(44px + env(safe-area-inset-bottom))}
html[dir=rtl] body{font-family:var(--sans)}

/* ---------- header: the green band, the wordmark, the menu ---------- */
header{position:sticky;top:0;z-index:40;background:var(--green);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;
  box-shadow:0 6px 22px -14px rgba(1,72,51,.7)}
.hrow{display:flex;align-items:center;gap:10px;min-height:38px}
.mark{height:19px;width:auto;display:block;flex:none}
.markfall{font-family:var(--serif);font-size:19px;letter-spacing:.16em;font-weight:600}
.hspace{flex:1}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  color:#fff;border-radius:9px;min-width:32px;height:32px;padding:0 8px;font-size:13px;
  font-weight:700;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.stamp{color:rgba(255,255,255,.72);font-size:11.5px;padding:5px 0 0;letter-spacing:.2px}
.stamp.old{color:#FFC98B;font-weight:650}

/* the menu is the only navigation, so it is always visible and always shows where you are */
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px;
  padding-bottom:0}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:rgba(255,255,255,.62);cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:650;padding:9px 11px 10px;white-space:nowrap;
  border-bottom:2.5px solid transparent;transition:color .18s,border-color .18s}
nav button.on{color:#fff;border-bottom-color:var(--orange)}
nav button:hover{color:#fff}

/* ---------- page title: you always know which page you are on ---------- */
.pagehead{padding:16px 16px 2px;max-width:1240px;margin:0 auto}
.pagetitle{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.2px;
  margin:0;line-height:1.2}
.pagesub{color:var(--dim);font-size:12.5px;margin-top:4px}
main{padding:10px 16px;max-width:760px;margin:0 auto}

/* ---------- the banner ---------- */
.banner{border-radius:16px;padding:17px 18px;margin-bottom:14px;color:#fff;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.banner.ok{background:linear-gradient(135deg,#016A4C,#01382A)}
.banner.warn{background:linear-gradient(135deg,#F3853C,#C4551A)}
.banner.bad{background:linear-gradient(135deg,#CE3A32,#8E1E20)}
/* the ermine, watermarked - the brand mark earning its place rather than sitting in a corner */
.banner .crest{position:absolute;inset-inline-end:-18px;top:50%;transform:translateY(-50%);
  height:132%;opacity:.13;pointer-events:none;filter:saturate(0)}
.banner .lbl{color:rgba(255,255,255,.76);position:relative}
.banner .big{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.3px;
  margin-top:3px;position:relative}
.banner .sub{color:rgba(255,255,255,.92);font-size:13.5px;margin-top:8px;position:relative}
.banner .tapnote{color:rgba(255,255,255,.72)}

/* ---------- cards and the standard section heading ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
h3{margin:20px 0 9px;font-size:15px;font-weight:700;font-family:var(--serif);letter-spacing:-.1px;
  color:var(--ink);display:flex;align-items:center;gap:8px}
h3::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--green);
  flex:none}
html[data-theme=dark] h3::before{background:var(--teal)}
h3 .n{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:0}
h3:first-child{margin-top:4px}

.big{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.mid{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.unit{font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:0}
.lbl{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
  font-weight:700}
.row{display:flex;gap:12px} .row>*{flex:1;min-width:0}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:5px;width:0;
  transition:width .9s cubic-bezier(.2,.8,.2,1)}
html[data-theme=dark] .bar>i{background:var(--teal)}
.chartbox{position:relative;height:180px;margin-top:5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  text-align:end;padding:8px 5px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  font-weight:750}
th:first-child,td:first-child{text-align:start}
td{padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:end}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--dim);font-size:12px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.name{background:var(--bg);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-size:12.5px}
.fo{display:flex;gap:10px;align-items:baseline;padding:8px 0}
.fo+.fo{border-top:1px solid var(--line)}
.fo b{font-variant-numeric:tabular-nums}
.src{font-size:10.5px;color:var(--dim);margin-top:10px;letter-spacing:.2px;line-height:1.5}

.tap{cursor:pointer;position:relative;transition:transform .14s,border-color .14s,box-shadow .14s}
.tap:active{transform:scale(.985)}
.tap:hover{border-color:var(--green)}
.tap::after{content:"›";position:absolute;inset-inline-end:14px;top:11px;
  color:var(--dim);font-size:21px;line-height:1;font-weight:700}
html[dir=rtl] .tap::after{content:"‹"}
.banner.tap::after{color:rgba(255,255,255,.9);font-size:25px;top:15px}
.tapnote{font-size:11px;color:var(--dim);margin-top:9px;letter-spacing:.2px;font-weight:600}

.ou{font-variant-numeric:tabular-nums;font-weight:700}
.ou.up{color:var(--ok)} .ou.dn{color:var(--bad)}
.minibar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;
  min-width:56px;margin-top:4px}
.minibar>i{display:block;height:100%;border-radius:4px}
td.wrap,th.wrap{white-space:normal}
.warnbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;
  padding:11px 13px;font-size:12.5px;color:var(--warn);margin-bottom:11px;line-height:1.5}

/* ---------- motion ---------- *
 * Brand movement is slow and even - things arrive, they do not bounce. One stagger on
 * entry and nothing that repeats, because this page is read twenty times a day and a
 * loop would be unbearable by the third. Anyone who has asked their system for less
 * movement gets none at all.                                                           */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes sweep{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.anim{animation:rise .42s cubic-bezier(.22,.8,.26,1) both}
.pagehead{animation:sweep .34s ease-out both}
@media (prefers-reduced-motion:reduce){
  .anim,.pagehead{animation:none !important}
  .bar>i{transition:none}
}

/* ---------- the task board ---------- *
 * One layout, two shapes. On a phone the tasks are a single column of cards you can
 * read with a thumb; past 900px the same cards fall into columns by bucket, which is
 * the view that makes sense on a desk where you are deciding what to do next rather
 * than ticking something off. CSS grid does both from one set of markup - no second
 * template to keep in step, and no device sniffing to get wrong.                       */
.tkwrap{display:grid;gap:12px}
@media (min-width:900px){
  .tkwrap{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}
.tkcol{min-width:0}
.tkhead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:750;
  font-size:13.5px;font-family:var(--serif)}
.tkhead .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tkhead .cnt{color:var(--dim);font-weight:600;font-size:12px}
.tkcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
html[dir=rtl] .tkcard{border-left:1px solid var(--line);border-right:3px solid var(--line)}
.tkcard.p-high{border-left-color:var(--bad)}
html[dir=rtl] .tkcard.p-high{border-right-color:var(--bad)}
.tkcard.p-med{border-left-color:var(--orange)}
html[dir=rtl] .tkcard.p-med{border-right-color:var(--orange)}
.tkcard.is-done{opacity:.55}
.tkcard.is-done .tktitle{text-decoration:line-through}
.tktitle{font-weight:650;font-size:13.5px;line-height:1.4}
.tkmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.due{font-variant-numeric:tabular-nums;font-weight:650}
.tag.late{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tag.now{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.tknote{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45}
@media print{ .tkwrap{display:block} .tkcard{break-inside:avoid} }

/* ---------- expandable rows ---------- *
 * A <details> element, not a script-driven toggle: the browser remembers nothing to get
 * wrong, it works with a keyboard, and when the page is printed every row is forced open
 * so the report carries the detail the screen was hiding.                               */
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:7px;
  background:var(--card);overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:10px 13px;display:flex;
  align-items:center;gap:10px;font-weight:700;font-size:13.5px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .caret{color:var(--dim);font-size:12px;transition:transform .18s;
  flex:none}
details.grp[open]>summary .caret{transform:rotate(90deg)}
html[dir=rtl] details.grp>summary .caret{transform:rotate(180deg)}
html[dir=rtl] details.grp[open]>summary .caret{transform:rotate(90deg)}
details.grp>summary .gname{flex:1;min-width:0}
details.grp>summary .gnum{font-variant-numeric:tabular-nums;font-weight:750}
details.grp>summary:hover{background:var(--bg)}
details.grp .inner{padding:0 13px 11px}
details.grp[open]>summary{border-bottom:1px solid var(--line);margin-bottom:9px}
@media print{
  details.grp{border-color:#D8D8D8;page-break-inside:avoid}
  details.grp>summary{background:#F4F6F4}
  details.grp>summary .caret{display:none}
  details.grp .inner{display:block !important}
}

/* ---------- export dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(1,24,18,.55);z-index:90;display:grid;
  place-items:center;padding:20px;backdrop-filter:blur(2px)}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:rise .22s ease-out both}
.dlg h2{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.dlg p{color:var(--dim);font-size:12.5px;margin:0 0 15px;line-height:1.5}
.opt{display:block;width:100%;text-align:start;background:var(--bg);color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
  font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt.sel{border-color:var(--green);background:var(--okbg)}
.opt small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:2px}
.dlgrow{display:flex;gap:8px;margin-top:14px}
.dlgrow button{flex:1;border-radius:11px;padding:11px;font:inherit;font-weight:700;
  cursor:pointer;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.dlgrow button.go{background:var(--green);color:#fff;border-color:var(--green)}

/* ---------- the printed report ---------- *
 * Printing rather than drawing a PDF in JavaScript. A PDF library would have to shape
 * and reorder the Arabic itself, which is where every one of them falls down, and
 * html2canvas would turn the whole report into a picture of text. The browser already
 * does Arabic properly and already has the brand fonts loaded, so the report is real
 * selectable text and the file comes out small.                                        */
#report{display:none}
@media print{
  /* The report is ink on paper and has one palette, whatever the screen is set to.
     Printing in dark mode produced a page half dark-theme and half light - dark text
     colours over a white background, with the greys unreadable. These overrides are
     inside @media print so they cannot touch the screen. */
  html[data-theme=dark]{
    --bg:#fff; --card:#fff; --line:#D8D8D8; --ink:#111; --dim:#555;
    --ok:#0B6B4F; --warn:#9A5A10; --bad:#B3241C; --accent:#014833;
    --okbg:#EAF4F0; --warnbg:#FDF1E6; --badbg:#FBECEB; --shadow:none;
  }
  @page{size:A4;margin:14mm 12mm}
  header,.pagehead,main,.scrim{display:none !important}
  #report{display:block}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .rsec{page-break-after:always}
  .rsec:last-child{page-break-after:auto}
  .rhead{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #014833;
    padding-bottom:9px;margin-bottom:14px}
  .rhead img{height:22px}
  .rhead .rt{flex:1;font-family:var(--serif);font-size:17pt;font-weight:600;color:#014833}
  .rhead .rd{font-size:9pt;color:#555}
  .rsub{font-size:10pt;color:#444;margin:-8px 0 14px}
  .rblock{margin-bottom:16px;page-break-inside:avoid}
  .rblock h4{font-family:var(--serif);font-size:12.5pt;margin:0 0 7px;color:#014833;
    border-inline-start:3px solid #F37121;padding-inline-start:8px}
  #report table{width:100%;border-collapse:collapse;font-size:9pt}
  #report th{background:#014833;color:#fff;padding:5px 6px;text-align:end;
    font-size:8pt;text-transform:uppercase;letter-spacing:.3px}
  #report th:first-child,#report td:first-child{text-align:start}
  #report td{padding:4px 6px;border-bottom:.5px solid #D8D8D8;text-align:end}
  #report tfoot td{font-weight:700;border-top:1.2px solid #014833}
  #report tbody tr:nth-child(even){background:#F4F6F4}
  #report .kpis{display:flex;gap:10px;margin-bottom:12px}
  #report .kpi{flex:1;border:1px solid #D8D8D8;border-radius:7px;padding:8px 10px}
  #report .kpi .k{font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#666}
  #report .kpi .v{font-size:14pt;font-weight:700;color:#014833}
  #report .rchart{max-width:100%;height:auto;margin:6px 0 2px;
    border:1px solid #E2E2E2;border-radius:6px}
  #report .rfoot{margin-top:12px;font-size:7.5pt;color:#666;line-height:1.45;
    border-top:.5px solid #D8D8D8;padding-top:7px}
  .ou.up{color:#0B6B4F !important} .ou.dn{color:#B3241C !important}
  .muted,.src,.tapnote{color:#666 !important}
  .pill{border:.5px solid #999;padding:1px 6px}
  .tap::after{display:none}
  .minibar,.bar{display:none}
}

@media (min-width:900px){
  header{padding:14px 28px 0}
  .mark{height:22px}
  .pagehead{padding:20px 28px 2px} .pagetitle{font-size:30px}
  main{max-width:1240px;padding:12px 28px;
       display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
  main.detail{grid-template-columns:1fr;max-width:1020px}
  .banner{grid-column:1/-1}
  .colA{grid-column:1} .colB{grid-column:2}
  .card{padding:16px 18px} .chartbox{height:210px}
}
@media (min-width:1400px){
  main{max-width:1560px;grid-template-columns:1fr 1fr 1fr}
  main.detail{grid-template-columns:1fr;max-width:1020px}
  .colA{grid-column:1} .colB{grid-column:2} .colC{grid-column:3}
}
.tkcard .tktitle{display:flex;align-items:flex-start;gap:9px}
.tkbox{flex:0 0 auto;width:23px;height:23px;margin-top:1px;border-radius:7px;
  border:1.8px solid var(--line);background:var(--bg);color:var(--teal);
  font:700 14px/1 inherit;cursor:pointer;display:grid;place-items:center;padding:0}
.tkbox:active{transform:scale(.92)}
.tkbox.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tkbox:disabled{opacity:.45;cursor:default}
.tkcard.is-done .tktitle span{text-decoration:line-through;opacity:.6}
.tkform label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
.tkform input,.tkform select{width:100%;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;
  margin:0 0 10px;-webkit-appearance:none;appearance:none}
.tkform input[type=date],.tkform input[type=time]{min-height:42px}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.segsw{display:flex;gap:0;margin:0 0 12px;border:1.5px solid var(--line);
  border-radius:12px;overflow:hidden;background:var(--card)}
.segsw button{flex:1;padding:9px 0;border:0;background:transparent;color:var(--dim);
  font:600 14px/1 inherit;cursor:pointer}
.segsw button.on{background:var(--accent);color:#fff}
.calcard{padding:12px}
.calbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.calbar b{flex:1;text-align:center;font-size:15px}
.calnav{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:600 17px/1 inherit;cursor:pointer}
.go.sm{padding:6px 11px;font-size:13px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead div{text-align:center;font-size:11px;color:var(--dim);padding:0 0 5px}
.cell{position:relative;min-height:46px;border:1.5px solid transparent;border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;padding:4px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.celloff{min-height:46px}
.cell .dnum{font-size:13px;line-height:1}
.cell.is-today{border-color:var(--accent);font-weight:700}
.cell.is-sel{background:var(--accent);color:#fff}
.cell .dots{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block;background:var(--dim)}
.cell .dots i.p1{background:var(--bad)} .cell .dots i.p2{background:var(--warn)}
.cell .dots i.p3{background:var(--teal)}
.cell .dots i.late{box-shadow:0 0 0 1.5px var(--bad)}
.cell .more{font-size:9px;color:var(--dim)}
.cell.is-sel .more{color:#fff}
.mid b.stale{color:var(--warn)}
.mid .unit{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px}
.tkcol>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  padding:9px 2px;user-select:none}
.tkcol>summary::-webkit-details-marker{display:none}
.tkcol>summary .caret{display:inline-block;transition:transform .16s;font-size:11px;
  color:var(--dim)}
.tkcol[open]>summary .caret{transform:rotate(90deg)}
html[dir=rtl] .tkcol>summary .caret{transform:rotate(180deg)}
html[dir=rtl] .tkcol[open]>summary .caret{transform:rotate(90deg)}
.tkcol>.tkbody{display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
/* Blur rather than blank: the page keeps its shape, so it is still navigable with the
   figures unreadable. Labels and headings stay sharp - they are what you steer by. */
html.hidenums .big, html.hidenums .mid, html.hidenums td, html.hidenums .n,
html.hidenums .cnt, html.hidenums .gnum, html.hidenums .pill, html.hidenums canvas,
html.hidenums .dots,
/* The banner says the figures in a sentence and the note repeats them in brackets.
   Blurring the big numerals and leaving those readable would hide nothing at all. */
html.hidenums .banner .sub, html.hidenums .tapnote { filter: blur(6px); }
html.hidenums .lbl, html.hidenums h3, html.hidenums .src, html.hidenums th { filter: none; }
/* .backbtn sets display, which beats the browser's own [hidden]{display:none} - so the
   button stayed on screen on the home page, offering to go back from the beginning. */
.backbtn[hidden]{display:none}
.backbtn{display:inline-flex;align-items:center;gap:4px;margin:0 0 6px;padding:6px 12px;
  border:1.5px solid var(--line);border-radius:999px;background:var(--card);
  color:var(--ink);font:600 13px/1 inherit;cursor:pointer}
.backbtn:active{background:var(--field)}
html[dir=rtl] .backbtn{transform:scaleX(1)}
</style>
</head>

const loc=()=>L==="ar"?"ar-EG":"en-GB";

const n1=v=>v==null?"—":(Math.round(v*10)/10).toLocaleString(loc(),{minimumFractionDigits:1});
const pc=v=>v==null?"—":Math.round(v*100).toLocaleString(loc())+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dmy=s=>s?new Date(s+"T00:00:00").toLocaleDateString(loc(),{day:"2-digit",month:"short"}):"";

/* ---- the sentences the workbook only speaks in English ---- *
 * Each takes the token and the numbers the builder pulled out, and writes the sentence
 * in the language on screen. If the builder could not classify it, the workbook's own
 * words are shown rather than a blank.                                                  */
function sFits(p){
  if(p.fits_code==="fits") return T[L].sFits(n0(p.fits_h));
  if(p.fits_code==="over") return T[L].sOver(n0(p.fits_h));
  return p.fits||"";
}
function sVerdict(){
  const c=D.today.verdict_code;
  if(c==="ok") return T[L].sVerdictOk;
  if(c==="overtime") return T[L].sVerdictOt(n1(D.today.verdict_h));
  if(c==="toomuch") return T[L].sVerdictBad;
  return D.today.verdict||"";
}
function sCommit(){
  if(D.today.pcs!=null && D.today.boxes!=null)
    return T[L].sCommit(n0(D.today.pcs), n0(D.today.boxes));
  return D.today.committed||"";
}
function sDayNote(){
  const h=D.today.day_hours, s=D.today.day_staff;
  return (h!=null&&s!=null) ? T[L].sDayNote(n1(h), n0(s)) : (D.today.finish_note||"");
}
function sMonth(){
  const c=D.month.verdict_code;
  if(c==="ok") return T[L].sMonthOk;
  if(c==="overtime") return T[L].sMonthOt;
  if(c==="outofreach") return T[L].sMonthBad;
  return D.month.verdict||"";
}

window.__charts=[];
function chart(id,cfg){
  const el=document.getElementById(id); if(!el||!el.offsetParent) return;
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
  Chart.defaults.color=css("--dim");
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,
    animation:{duration:matchMedia("(prefers-reduced-motion:reduce)").matches?0:700}},
    cfg.options||{});
  for(const k of Object.keys(cfg.options.scales||{}))
    Object.assign(cfg.options.scales[k],{grid:{color:css("--line"),drawBorder:false}});
  window.__charts.push(new Chart(el,cfg));
}

/* Is this page the current one?

   The dashboard is installed to a home screen, and an installed web page is cached hard
   - it will serve yesterday's file all day without asking anyone. That turned a morning
   of fixes into a morning of "it still does not work", because the fixes were published
   and the phone was reading the old copy. So the page now checks a one-line file holding
   the stamp of the latest build, and if it is running something older it reloads itself
   once. Once, and recorded in sessionStorage - a reload loop on a page you cannot easily
   close is far worse than a stale one. */
function checkFresh(){
  fetch("data/build.txt?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.text() : null)
    .then(latest => {
      if(!latest) return;
      latest = latest.trim();
      const mine = BUILT.toISOString();
      if(!latest || Math.abs(new Date(latest) - BUILT) < 2000) return;
      if(new Date(latest) <= BUILT) return;            // never go backwards
      let done = "";
      try { done = sessionStorage.getItem("erm-reloaded") || ""; } catch(e){}
      if(done === latest) return;
      try { sessionStorage.setItem("erm-reloaded", latest); } catch(e){}
      location.reload();
    })
    .catch(()=>{});
}

/* Hiding the numbers, the way a banking app does.

   The dashboard carries revenue, wages and headcount, and it is opened on a factory
   floor and in meetings with people standing behind you. Blur is the right tool: the
   page keeps its shape so you can still find your way around it, and one tap brings it
   back. This is not security - whoever holds the phone can tap it too - it is privacy
   from a glance over your shoulder, which is the thing actually at risk in a corridor. */
let NUMS_HIDDEN = (() => { try { return localStorage.getItem("erm-hide") === "1"; }
                           catch(e){ return false; } })();
function applyHidden(){
  document.documentElement.classList.toggle("hidenums", NUMS_HIDDEN);
  const b = document.getElementById("hide");
  if(b){ b.textContent = NUMS_HIDDEN ? "\u25CB" : "\u25C9";
         b.title = NUMS_HIDDEN ? t("showNums") : t("hideNums"); }
}
function toggleHidden(){
  NUMS_HIDDEN = !NUMS_HIDDEN;
  try { localStorage.setItem("erm-hide", NUMS_HIDDEN ? "1" : "0"); } catch(e){}
  applyHidden();
}

function stamp(){
  const h=(Date.now()-BUILT)/36e5;
  const age=h<1?t("just"):h<24?Math.round(h)+t("hAgo"):Math.round(h/24)+t("dAgo");
  const el=$("#stamp");
  el.textContent=t("read")+" · "+age+" · "+BUILT.toLocaleString(loc(),
    {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  el.classList.toggle("old",h>18);
}

function overall(){
  const bad=[], warn=[];
  const A=D.plans[0], last=D.last, M=D.month;
  if(D.today.verdict_code==="toomuch"||A.fits_code==="over") bad.push("today");
  else if(D.today.verdict_code==="overtime") warn.push("today");
  if(last && last.ratio!=null && (last.ratio<0.85||last.ratio>1.15)) warn.push("drift");
  if(M.verdict_code==="outofreach") bad.push("month");
  else if(M.verdict_code==="overtime") warn.push("month");
  return bad.length?"bad":warn.length?"warn":"ok";
}

/* ------------------------------------------------------------------ *
 *  Routing. One file, so a page is a state. The browser's back        *
 *  button is wired in, because on a phone the back swipe is the only  *
 *  way out of a detail view.                                          *
 * ------------------------------------------------------------------ */
const PAGES=["home","plan","shift","store","month","mat","qc","tasks"];
let VIEW="home";
/* Where you came from, and where you were on that page.

   Tapping a card to open a detail page and then having to scroll the home page from the
   top again is the kind of small friction that stops people using a thing. The trail
   records the page and the scroll position, so Back returns you to the spot you left,
   not to the top of it. Only a trail, not a history: going Home clears it, because
   "back" from the start of a journey means nothing. */
let TRAIL = [];
function go(v, push){
  const from = VIEW;
  if(v && v !== VIEW) TRAIL.push({v: from, y: window.scrollY});
  if(v === "home") TRAIL = [];
  if(TRAIL.length > 12) TRAIL.shift();
  VIEW = v || "home";
  if(push !== false) history.pushState({v:VIEW}, "", "#"+VIEW);
  window.scrollTo(0,0);
  render();
}
function goBack(){
  const prev = TRAIL.pop();
  if(!prev){ VIEW = "home"; history.pushState({v:"home"}, "", "#home"); render();
             window.scrollTo(0,0); return; }
  VIEW = prev.v;
  history.pushState({v:VIEW}, "", "#"+VIEW);
  render();
  /* after the new page has painted, not before */
  requestAnimationFrame(()=>window.scrollTo(0, prev.y||0));
}
window.go = go;
addEventListener("popstate", e => { VIEW=(e.state&&e.state.v)||"home"; render(); });

function tbl(cols, rows, foot){
  return `<div class="scroll"><table><thead><tr>`
    + cols.map(c=>`<th class="${c.wrap?"wrap":""}">${c.h}</th>`).join("")
    + `</tr></thead><tbody>`
    + rows.map(r=>`<tr>`+r.map((c,i)=>`<td class="${cols[i]&&cols[i].wrap?"wrap":""}">${c}</td>`).join("")+`</tr>`).join("")
    + `</tbody>`
    + (foot?`<tfoot><tr>`+foot.map(c=>`<td style="font-weight:750;border-top:2px solid var(--line)">${c}</td>`).join("")+`</tr></tfoot>`:"")
    + `</table></div>`;
}

  window.__charts.forEach(c=>c.destroy()); window.__charts=[];

  stamp();

  const back=$("#back");
  if(back){
    back.hidden = !TRAIL.length;
    back.textContent = "\u2039 " + t("backTo");
  }
  $("#nav").innerHTML=PAGES.map(p=>
    `<button class="${p===VIEW?"on":""}" onclick="go('${p}')">${
      t("m"+p[0].toUpperCase()+p.slice(1))}</button>`).join("");

  const TITLES={home:["hHome","hHomeSub"],plan:["vPlan","vPlanSub"],
                shift:["vShift","vShiftSub"],store:["vStore","vStoreSub"],
                month:["vMonth","vMonthSub"],qc:["vQc","vQcSub"],
                tasks:["vTasks","vTasksSub"],mat:["vMat","vMatSub"]};
  $("#ptitle").textContent=t(TITLES[VIEW][0]);
  $("#psub").textContent=t(TITLES[VIEW][1]);
  $(".pagehead").style.animation="none"; void $(".pagehead").offsetWidth;
  $(".pagehead").style.animation="";

  const VIEWS={plan:viewPlan, shift:viewShift, store:viewStore, month:viewMonth,
               qc:viewQc, tasks:viewTasks, mat:viewMat};
  if(VIEW!=="home"){
    $("#main").className="detail";
    $("#main").innerHTML=VIEWS[VIEW]();
    window.__drawn=true;
    stagger();
    setTimeout(()=>{ if(VIEW==="month") monthChart(); if(VIEW==="shift") keptChart();
                     if(VIEW==="qc") qcAfter(); },40);
    return;
  }
  $("#main").className="";
  renderHome();
}

/* entry motion: cards arrive in order, 45ms apart, once */
function stagger(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  [...document.querySelectorAll("#main .card, #main .banner")].forEach((el,i)=>{
    el.classList.add("anim"); el.style.animationDelay=(i*45)+"ms";
  });
}

function renderHome(){
  const A=D.plans[0], last=D.last, M=D.month, X=D.tot;
  const st=overall();
  let h="";

  /* 1. the one judgement */
  h+=`<div class="banner tap ${st}" onclick="go('plan')">
    ${SYMBOL?`<img class="crest" src="${SYMBOL}" alt="">`:""}
    <div class="lbl">${esc(dmy(D.today.date))}</div>
    <div class="big">${st==="ok"?t("onTrack"):t("attention")}</div>
    <div class="sub">${esc(sCommit())}
      ${D.today.finish?` · ${t("finish")} ${esc(String(D.today.finish).slice(0,5))}`:""}</div>
    ${D.today.finish&&D.today.finish_note?`<div class="tapnote">${t("finishHow")} ${
        esc(D.today.finish_note)}</div>`:""}
    <div class="tapnote">${t("tapPlan")}</div></div>`;

  /* 1b. when the files themselves last moved - the question the page's own timestamp
     cannot answer, and the first thing to check when a number looks wrong */
  const SV=D.saved;
  if(SV && (SV.plan || SV.store)){
    const when=iso=>{
      if(!iso) return `<span class="muted">${t("savedNever")}</span>`;

      return `<b class="${hrs>30?"stale":""}">${age}</b><span class="unit">${
        d.toLocaleString(loc(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span>`;

    h+=`<h3>${t("savedTitle")}</h3><div class="card"><div class="row">

          (()=>{const dd=Math.round((Date.now()-new Date(D.chef_last_day))/864e5);
                return dd<=0?t("just"):dd+t("dAgo");})()}</span></div></div>`:""}

      D.today.verdict_code==="ok"?"p-ok":D.today.verdict_code==="overtime"?"p-warn":"p-bad"
      }">${esc(sVerdict())}</span></div>

  /* 3. what to put the day into */
  h+=`<h3>${t("focus")}</h3><div class="card">
      <div class="src" style="margin:0 0 8px">${t("focusSub")}</div>`;
  D.focus.forEach(f=>{
    h+=`<div class="lbl" style="margin-top:4px">${f.kind==="make"?t("focusMake"):t("focusPack")}</div>`;
    f.items.forEach(i=>h+=`<div class="fo"><span style="flex:1">${esc(i.box)}</span>

  /* 6. the month */
  h+=`<h3>${t("month")}</h3><div class="card tap" onclick="go('month')">

    </div>
    <div style="margin-top:10px"><span class="pill ${
      M.verdict_code==="ok"?"p-ok":M.verdict_code==="overtime"?"p-warn":"p-bad"
      }">${esc(sMonth())}</span></div>
    <div class="tapnote">${t("tapMonth")}</div></div>`;
  h+=`<h3>${t("sensTitle")}</h3><div class="card">
      <div class="chartbox" style="height:150px"><canvas id="c-s"></canvas></div></div></div>`;

  /* 7. the store, then the factory, then sales, then the floor */
  h+=`<div class="colC"><h3>${t("stockBox")}</h3>
    <div class="card tap" onclick="go('store')"><div class="row">
      <div><div class="lbl">${t("store")}</div><div class="big">${n0(X.store)}</div></div>
      <div><div class="lbl">${t("fromChef")}</div><div class="mid">${n0(X.recv)}</div></div>
      <div><div class="lbl">${t("toSales")}</div><div class="mid">${n0(X.out)}</div></div>
    </div><div class="tapnote">${t("tapStore")}</div></div>`;

  h+=`<h3>${t("stockPcs")}</h3><div class="card">
      <div class="chartbox"><canvas id="c-p"></canvas></div></div>`;

  h+=`<h3>${t("salesPlan")}</h3><div class="card">
    <div class="row">
      <div><div class="lbl">${t("asked")} · ${t("boxes")}</div>
        <div class="mid">${n0(X.asked_box)}</div></div>
      <div><div class="lbl">${t("asked")} · ${t("pieces")}</div>
        <div class="mid">${n0(X.asked_pcs)}</div></div>

    <div class="row" style="margin-top:12px">
      <div><div class="lbl">${t("owed")} · ${t("boxes")}</div>
        <div class="big" style="color:${X.owed_box?"var(--bad)":"var(--ok)"}">${n0(X.owed_box)}</div></div>
      <div><div class="lbl">${t("owed")} · ${t("pieces")}</div>
        <div class="big" style="color:${X.owed_pcs?"var(--bad)":"var(--ok)"}">${n0(X.owed_pcs)}</div></div>
    </div>
    <div class="src">${t("mixNote")}<br>${t("owedNote")}</div>
    <div class="scroll" style="margin-top:11px"><table><thead><tr>
      <th>${t("box")}</th><th>${t("asked")}</th><th class="wrap">${t("owed")}</th>
      <th>${t("store")}</th><th class="wrap">${t("stillMonth")}</th></tr></thead><tbody>`
    + D.boxes.filter(b=>(b.asked||0)||(b.left||0)).map(b=>

  h+=`<h3>${t("floor")} <span class="n">${D.names.length}</span></h3><div class="card">`
    + (D.names.length ? `<div class="names">` +

/* ================================================================== *
 *  The detail pages. They compute nothing: every figure is a cell,    *
 *  and where the workbook does not hold something they say so.        *
 * ================================================================== */
/* One product, folded shut, with its flavours inside.
 *
 * The flavour detail only exists for the day the sheet is planning - the Stock sheet has
 * one row per flavour and it is cleared each morning - so a past day can show its product
 * totals and nothing under them. Rather than leave an arrow that opens on emptiness, a
 * group with no detail is drawn as a plain row and cannot be opened at all.
 */
function group(name, total, unit, rows, cols, open){
  if(!rows || !rows.length)
    return `<div class="fo"><span style="flex:1"><b>${esc(name)}</b></span>
      <b>${n0(total)}</b><span class="unit">${unit}</span></div>`;
  return `<details class="grp" ${open?"open":""}>
    <summary><span class="caret">\u276F</span>
      <span class="gname">${esc(name)}</span>
      <span class="gnum">${n0(total)}</span><span class="unit">${unit}</span>
      <span class="muted">${rows.length}</span></summary>
    <div class="inner">${tbl(cols, rows)}</div></details>`;
}

/* what changed today - the only place the two people's work meets */
function feedBlock(){
  const F=D.feed||[];
  let h=`<h3>${t("feedTitle")}</h3><div class="card">`;
  if(!F.length){ h+=`<div class="muted">${t("feedNone")}</div></div>`; return h; }
  /* An empty store half is a fact about the writing-down, not about the boxes, and the
     page should not let the two be confused. */
  const hasAli = F.some(f=>f.who==="ali");
  const word={made:"feedMade",packed:"feedPacked",in:"feedIn",out:"feedOut",waste:"feedWaste"};
  h+=F.map(f=>`<div class="fo">
      <span class="pill ${f.who==="ali"?"p-ok":"p-warn"}" style="min-width:42px;text-align:center">${
        f.who==="ali"?t("feedAli"):t("feedChef")}</span>
      <span style="flex:1">${t(word[f.what]||"feedMade")}${f.box?" · "+esc(f.box):""}</span>
      <b>${n0(f.n)}</b><span class="unit">${f.unit==="pcs"?t("pieces"):t("boxes")}</span>
      <span class="muted">${esc(dmy(f.date))}</span></div>`).join("");
  if(!hasAli) h+=`<div class="src">${t("feedNoneAli")}</div>`;
  return h+`</div>`;
}

function viewPlan(){
  const P=D.plan||{flavours:[],boxes:[]};
  const fl=P.flavours.filter(f=>f.plan||f.sugg||f.stock||f.actual);
  const bx=P.boxes.filter(b=>b.plan||b.asked||b.actual);
  let h=`<div class="card"><div class="row">
      <div><div class="lbl">${t("pieces")}</div><div class="big">${n0(fl.reduce((s,f)=>s+(f.plan||0),0))}</div></div>
      <div><div class="lbl">${t("boxes")}</div><div class="big">${n0(bx.reduce((s,b)=>s+(b.plan||0),0))}</div></div>
      <div><div class="lbl">${t("hours")}</div><div class="big">${n0(D.plans[0].hours)}</div></div>
    </div><div class="muted" style="margin-top:8px">${esc(sCommit())}</div></div>`;

  // grouped, not one flat list of thirty-nine flavours. The question is always "what is
  // Classic doing today", and the answer was spread over five rows a screen apart.
  // Group on "Counts as", not on "Product". The Stock sheet's Product column says "Big"
  // for every large macaron - Classic and Kingdom alike - and the name a person actually
  // asks for sits in "Counts as". Grouping on Product produced one giant "Big" heading
  // and no way to see Classic apart from Kingdom, which is the exact split being asked
  // for. "Counts as" also matches the names the Actual Log uses, so the two agree.
  const byProd = {};
  fl.forEach(f => { const k = f.counts || f.product || "—";
                    (byProd[k] = byProd[k] || []).push(f); });
  h+=`<h3>${t("inPieces")}</h3>`;
  const fcols=[{h:t("flavour"),wrap:true},{h:t("stockNow")},{h:t("suggested2")},
               {h:t("planned")},{h:t("actual")}];
  h+= Object.keys(byProd).length ? Object.entries(byProd).map(([prod,list])=>{
        const tot=list.reduce((s,f)=>s+(f.plan||0),0);
        return group(prod||"—", tot, t("pieces"),
          list.map(f=>[esc(f.flavour),dash(n0(f.stock)),dash(f.sugg?n0(f.sugg):null),
                       f.plan?`<b>${n0(f.plan)}</b>`:dash(null),
                       dash(f.actual?n0(f.actual):null)]),
          fcols, tot>0);
      }).join("")
    : `<div class="card"><div class="muted">${t("nothingPlanned")}</div></div>`;
  h+=`<div class="card"><b>${t("totalRow")}</b> &nbsp; ${
      n0(fl.reduce((s,f)=>s+(f.plan||0),0))} <span class="unit">${t("pieces")}</span></div>`;

  // and each box opens on the flavours that feed it
  h+=`<h3>${t("inBoxes")}</h3>`;
  const bcols=[{h:t("flavour"),wrap:true},{h:t("planned")},{h:t("stockNow")}];
  h+= bx.length ? bx.map(b=>{
        // three ways a flavour can belong to a box, because the sheet records it three
        // ways: a piece count in that box's own column (the four Big boxes), the product
        // it counts as (Coins, Mini, Half...), or the box set it belongs to.
        const feeds=(P.flavours||[]).filter(f=>
          ((f.per&&f.per[b.box]>0) || f.counts===b.box || f.set===b.box));
        return group(b.box, b.plan||0, t("boxes"),
          feeds.map(f=>[esc(f.flavour),dash(f.plan?n0(f.plan):null),dash(n0(f.stock))]),
          bcols, false)
          .replace("</summary>", `</summary>`);
      }).join("")
    : `<div class="card"><div class="muted">${t("nothingPlanned")}</div></div>`;
  h+=`<div class="card"><b>${t("totalRow")}</b> &nbsp; ${
      n0(bx.reduce((s,b)=>s+(b.plan||0),0))} <span class="unit">${t("boxes")}</span>
      <div class="src">${t("src")}</div></div>`;
  return h;
}

function viewShift(){
  const S=D.shift;
  if(!S) return `<div class="card"><div class="muted">—</div></div>`;
  const dd=(a,p)=>{
    if(p==null) return dash(null);
    const v=(a||0)-p;
    return `<span class="ou ${v<0?"dn":"up"}">${v>0?"+":""}${n0(v)}</span>`;
  };
  let h=`<div class="card"><div class="lbl">${esc(dmy(S.date))}</div>

      <div><div class="lbl">${t("hoursModel")}</div><div class="mid">${n1(S.model)}</div></div>

          <span class="unit">${t("sar")}</span></div></div>`:""}
      </div>
      <div class="src">${t("otNote")}</div></div>`;
  }

  /* the fillings, which the product families cannot tell you */
  const F=D.flav_last;
  h+=`<h3>${t("flavTitle")}</h3>`;
  if(F && F.rows && F.rows.length){

      D.flav_days?` · <span class="muted">${n0(D.flav_days)} ${t("flavDays")}</span>`:""}</div>
      <div style="margin-top:8px">${tbl(
        [{h:t("product"),wrap:true},{h:t("flavPlan")},{h:t("flavMade")},{h:t("flavCoat")}],
        fr.map(x=>[esc(x.name),dash(x.plan?n0(x.plan):null),
                   `<b>${n0(x.made)}</b>`, x.coated?n0(x.coated):dash(null)]),
        [t("totalRow"),n0(fr.reduce((a,x)=>a+(x.plan||0),0)),
         n0(fr.reduce((a,x)=>a+(x.made||0),0)),
         n0(fr.reduce((a,x)=>a+(x.coated||0),0))])}</div></div>`;
  } else {
    h+=`<div class="card"><div class="src">${t("flavNone")}</div></div>`;
  }

  /* the series the capture makes possible: planned against made, day by day */
  const K=D.kept||[];
  if(K.length){
    const avg=K.reduce((s,k)=>s+k.hit,0)/K.length;
    h+=`<h3>${t("keptTitle")}</h3><div class="card">
      <div class="row">
        <div><div class="lbl">${t("keptAvg")}</div><div class="big">${pc(avg)}</div></div>
        <div><div class="lbl">${t("keptDays")}</div><div class="mid">${n0(K.length)}</div></div>
      </div>
      <div class="chartbox" style="height:200px;margin-top:8px"><canvas id="c-k"></canvas></div>
      <div class="src">${t("keptNote")}</div></div>`;
  }

  const pr=S.products.filter(p=>p.actual||p.plan);
  h+=`<h3>${t("byProduct")}</h3><div class="card">`;
  h+= pr.length ? tbl(
      S.same_day_plan?[{h:t("product")},{h:t("planned")},{h:t("actual")},{h:t("diff")}]
                     :[{h:t("product")},{h:t("actual")}],
      pr.map(p=>S.same_day_plan
        ?[esc(p.name),dash(p.plan?n0(p.plan):null),`<b>${n0(p.actual)}</b>`,dd(p.actual,p.plan)]
        :[esc(p.name),`<b>${n0(p.actual)}</b>`]),
      S.same_day_plan
        ?[t("totalRow"),n0(pr.reduce((s,p)=>s+(p.plan||0),0)),n0(pr.reduce((s,p)=>s+(p.actual||0),0)),""]
        :[t("totalRow"),n0(pr.reduce((s,p)=>s+(p.actual||0),0))])
    : `<div class="muted">—</div>`;
  h+=`</div>`;

  const un=S.units.filter(u=>u.actual||u.plan);
  h+=`<h3>${t("byUnit")}</h3><div class="card">`;
  h+= un.length ? tbl(
      S.same_day_plan?[{h:t("box")},{h:t("planned")},{h:t("actual")},{h:t("diff")}]
                     :[{h:t("box")},{h:t("actual")}],
      un.map(u=>S.same_day_plan
        ?[esc(u.name),dash(u.plan?n0(u.plan):null),`<b>${n0(u.actual)}</b>`,dd(u.actual,u.plan)]
        :[esc(u.name),`<b>${n0(u.actual)}</b>`]),
      S.same_day_plan
        ?[t("totalRow"),n0(un.reduce((s,u)=>s+(u.plan||0),0)),n0(un.reduce((s,u)=>s+(u.actual||0),0)),""]
        :[t("totalRow"),n0(un.reduce((s,u)=>s+(u.actual||0),0))])
    : `<div class="muted">—</div>`;
  h+=`<div class="src">${t("src")}</div></div>`;
  return h;
}

/* ================================================================== *
 *  Quality.                                                          *
 *                                                                    *
 *  The reports live in a private Google Sheet and the only way in is  *
 *  the Apps Script, which wants the manager code. That code is asked  *
 *  for here and kept in this browser: it is never built into the      *
 *  page, because the page is public and anyone holding the link would *
 *  otherwise hold the code too.                                       *
 *                                                                    *
 *  The request is a plain POST with a text/plain content type - the   *
 *  same shape the QC page itself uses - because Apps Script answers   *
 *  no CORS preflight, and any other content type triggers one.        *
 * ================================================================== */
var QC = { code: null, reports: null, state: "idle", err: "", days: 7, emp: "" };
try { QC.code = localStorage.getItem("erm-qccode"); } catch (e) {}

function qcPost(body){
  return fetch(QC_API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                         body: JSON.stringify(body) }).then(r=>r.json());
}

/* ---- tasks, live ----------------------------------------------------------
   The task list used to be a photograph: built into the page once a day from the
   spreadsheet, so ticking something on a phone changed a picture and nothing else.
   It now talks to the same Apps Script that holds quality, behind the same code, so
   a task added at the factory floor is a task, not a note that has to be retyped on
   a laptop later. The snapshot is kept only as a fallback for when the backend is
   unreachable, and is labelled as such rather than quietly standing in for the truth. */
const TK = { state:"idle", list:null, done:null, err:"", busy:false,
             showDone:false, adding:false };

function tkLoad(force){
  if(!QC_API || !QC.code) return;
  if(TK.state==="loading" || (TK.list && !force)) return;
  TK.state="loading"; TK.err=""; render();
  Promise.all([
    qcPost({action:"tasksList", managerCode:QC.code}),
    qcPost({action:"tasksList", managerCode:QC.code, archived:true})
  ]).then(([open,done])=>{
    if(open && open.ok){
      TK.list=open.tasks||[]; TK.done=(done&&done.ok&&done.tasks)||[]; TK.state="ready";
    } else {
      TK.state="error";
      TK.err=(open&&open.error==="bad_code")?t("qcBad"):t("tkFail");
      if(open&&open.error==="bad_code"){ QC.code=null; try{localStorage.removeItem("erm-qccode");}catch(e){} }
    }
    render();
  }).catch(e=>{ TK.state="error"; TK.err=t("tkFail")+" — "+e.message; render(); });
}

function tkDone(id, done){
  if(TK.busy) return;
  TK.busy=true; render();
  qcPost({action:"tasksDone", managerCode:QC.code, id:id, done:done})
    .then(res=>{
      TK.busy=false;
      /* The old version ignored the reply and reloaded regardless. A refused tick then
         looked exactly like a successful one that had not moved - the card sat where it
         was and said nothing. Now a refusal says so. */
      if(res && res.ok){ tkLoad(true); return; }
      TK.err=(res && res.error==="bad_code") ? t("qcBad") : ((res && res.error) || t("tkFail"));
      render();
    })
    .catch(e=>{ TK.busy=false; TK.err=t("tkFail")+" \u2014 "+e.message; render(); });
}

function tkSave(){
  const g=id=>{const el=document.getElementById(id); return el?el.value.trim():"";};
  const title=g("tk-title");
  if(!title){ TK.err=t("tkNeedTitle"); render(); const el=document.getElementById("tk-title"); if(el) el.focus(); return; }
  if(TK.busy) return;
  TK.busy=true; TK.err=""; render();
  qcPost({action:"tasksSave", managerCode:QC.code, task:{
    title:title, owner:g("tk-owner"), section:g("tk-section"), due:g("tk-due"),
    time:g("tk-time"), priority:g("tk-prio")||"Medium", status:"To do",
    repeat:g("tk-repeat"), notes:g("tk-notes")}})
    .then(res=>{ TK.busy=false;
      if(res&&res.ok){ TK.adding=false; tkLoad(true); }
      else { TK.err=(res&&res.error)||t("tkFail"); render(); } })
    .catch(e=>{ TK.busy=false; TK.err=t("tkFail")+" — "+e.message; render(); });
}

function qcLoad(){
  if(!QC_API){ QC.state="noapi"; render(); return; }
  QC.state="loading"; QC.err="";
  // pull a wide window once and filter in the page: the backend round trip is the
  // slow part, and changing the filter should not pay for it again.
  const to=new Date(), from=new Date(to.getTime()-90*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  qcPost({action:"list", managerCode:QC.code, from:iso(from), to:iso(to)})
    .then(res=>{
      if(res && res.ok){ QC.reports=res.reports||[]; QC.sheetUrl=res.sheetUrl||""; QC.state="ready"; }
      else { QC.state="gate"; QC.err=(res&&res.error==="bad_code")?t("qcBad"):(res&&res.error)||t("qcFail");
             QC.code=null; try{localStorage.removeItem("erm-qccode");}catch(e){} }
      render();
    })
    .catch(e=>{ QC.state="gate"; QC.err=t("qcFail")+" — "+e.message; render(); });
}
window.qcSubmitCode=function(){
  const v=(document.querySelector("#qccode")||{}).value||"";
  if(!v.trim()) return;
  QC.code=v.trim(); try{localStorage.setItem("erm-qccode",QC.code);}catch(e){}
  // On the tasks page there is nothing to fetch - the tasks are already in the page -
  // so unlock and redraw. On the quality page the code still has to be proved against
  // the backend, and a wrong one is cleared again there.
  if(VIEW==="tasks") render(); else qcLoad();
};
window.qcSetDays=function(d){ QC.days=d; render(); };
window.qcSetEmp=function(e){ QC.emp=e||""; render(); };
window.qcForget=function(){
  QC.code=null; QC.reports=null; QC.state="idle"; QC.err="";
  try{localStorage.removeItem("erm-qccode");}catch(e){}
  render();
};

function qcAfter(){
  if(QC.state==="idle"){ if(QC.code) qcLoad(); else { QC.state="gate"; render(); } return; }
  if(QC.state==="ready") qcChart();
}

function viewMat(){
  const M=(D.materials||[]);
  if(!M.length) return `<div class="card"><div class="muted">${t("matOk")}</div>
    <div class="src">${t("matNote")}</div></div>`;
  const neg=M.filter(x=>x.negative), low=M.filter(x=>!x.negative);
  const rows=list=>tbl(
    [{h:t("matItem"),wrap:true},{h:t("matUnit")},{h:t("matLeft")},{h:t("matNeed")},{h:t("matAct")}],
    list.map(x=>[
      `${esc(x.item)}<span class="sub2">${esc(x.tab)}</span>`,
      `<span class="muted">${esc(x.unit)}</span>`,
      x.left==null?dash(null)
        :`<b style="color:${x.negative?"var(--bad)":"var(--warn)"}">${n1(x.left)}</b>`,
      x.need==null?dash(null):n1(x.need),
      x.action?`<span class="pill ${/make|need/i.test(x.action)?"p-bad":"p-ok"}">${esc(x.action)}</span>`:""]));
  let h=`<div class="card"><div class="row">
      <div><div class="lbl">${t("matNeg")}</div>
        <div class="big" style="color:${neg.length?"var(--bad)":"var(--ok)"}">${n0(neg.length)}</div></div>
      <div><div class="lbl">${t("matLow")}</div>
        <div class="big" style="color:${low.length?"var(--warn)":"var(--ok)"}">${n0(low.length)}</div></div>
    </div></div>`;
  /* Grouped by what the thing IS - chocolate is not a cardboard box and does not get
     reordered the same way - and inside each group the worst line is first, because the
     order within a kind is the order of danger. */
  const KIND={"Raw Materials":"matRaw","Consumables":"matCons","Packaging":"matPack"};
  (D.mat_groups||Object.keys(KIND)).forEach(g=>{
    const inG=M.filter(x=>x.tab===g);
    if(!inG.length) return;
    const nneg=inG.filter(x=>x.negative).length;
    h+=`<h3>${t(KIND[g]||"matLow")} <span class="n">${inG.length}</span></h3>
      <div class="card">
        <div class="src" style="margin:0 0 8px">${t("matWorst")}${
          nneg?` · <b style="color:var(--bad)">${n0(nneg)} ${t("matNeg").toLowerCase()}</b>`:""}</div>
        ${rows(inG)}</div>`;
  });
  h+=`<div class="card"><div class="src">${t("matNote")}</div></div>`;
  return h;
}

/* A month grid, because a list answers "what is late" and a calendar answers "what is
   this week actually going to feel like" - and those are different questions. Sunday
   first, which is how a Saudi working week reads. */
const CAL = { ym:null, day:null, mode:"list" };

function monthName(y,m){
  return new Date(y,m,1).toLocaleDateString(S.lang==="ar"?"ar":"en-GB",{month:"long",year:"numeric"});
}
function ymKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function isoDay(y,m,d){
  return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}

function calView(tasks){
  const today=new Date().toISOString().slice(0,10);
  if(!CAL.ym) CAL.ym=today.slice(0,7);
  const [Y,M]=CAL.ym.split("-").map(Number), y=Y, m=M-1;
  const first=new Date(y,m,1), lead=first.getDay();          /* 0 = Sunday */
  const days=new Date(y,m+1,0).getDate();

  const byDay={};
  tasks.forEach(t=>{ if(t.due){ (byDay[t.due]=byDay[t.due]||[]).push(t); } });

  const dow=(S.lang==="ar"?["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"]
                          :["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]);
  let h=`<div class="card calcard">
    <div class="calbar">
      <button class="calnav" onclick="calStep(-1)" aria-label="prev">‹</button>
      <b>${esc(monthName(y,m))}</b>
      <button class="calnav" onclick="calStep(1)" aria-label="next">›</button>
      <button class="go sm" onclick="calToday()">${t("tkToday")}</button>
    </div>
    <div class="calgrid calhead">${dow.map(d=>`<div>${d}</div>`).join("")}</div>
    <div class="calgrid">`;
  for(let i=0;i<lead;i++) h+=`<div class="celloff"></div>`;
  for(let d=1;d<=days;d++){
    const iso=isoDay(y,m,d), list=byDay[iso]||[];
    const open=list.filter(x=>x.status!=="Done");
    const late=open.filter(x=>iso<today).length;
    h+=`<button class="cell${iso===today?" is-today":""}${CAL.day===iso?" is-sel":""}"
         onclick="calPick('${iso}')">
      <span class="dnum">${d}</span>
      ${list.length?`<span class="dots">${open.slice(0,3).map(x=>
         `<i class="${x.priority==="High"?"p1":x.priority==="Low"?"p3":"p2"}${late?" late":""}"></i>`).join("")}${
         open.length>3?`<span class="more">+${open.length-3}</span>`:""}</span>`:""}
    </button>`;
  }
  h+=`</div></div>`;

  if(CAL.day){
    const list=(byDay[CAL.day]||[]);
    h+=`<h3>${esc(dmy(CAL.day))} <span class="n">${list.length}</span></h3>`;
    h+= list.length ? `<div class="tkcol">${list.map(tkCard).join("")}</div>`
                    : `<div class="card"><div class="muted">${t("tkNoDay")}</div></div>`;
  }
  return h;
}
function calStep(n){
  const [y,m]=CAL.ym.split("-").map(Number);
  const d=new Date(y,m-1+n,1); CAL.ym=ymKey(d); CAL.day=null; render();
}
function calToday(){ const t=new Date(); CAL.ym=ymKey(t); CAL.day=t.toISOString().slice(0,10); render(); }
function calPick(iso){ CAL.day = CAL.day===iso?null:iso; render(); }
let tkCard = x => "";

/* Remembering a fold is slightly awkward because "closed" has to mean different things
   for the archive and for everything else: the archive defaults to shut and the rest
   default to open, so the stored list records departures from each default rather than a
   plain list of closed sections. */
function tkToggleAdd(){ TK.adding = !TK.adding; TK.err = ""; render(); }

function tkFold(key, open){
  let shut=[];
  try{ shut = JSON.parse(localStorage.getItem("erm-tkshut")||"[]"); }catch(e){}
  const mark = key==="tkDone" ? "!"+key : key;
  const want = key==="tkDone" ? open : !open;
  const i = shut.indexOf(mark);
  if(want && i===-1) shut.push(mark);
  if(!want && i!==-1) shut.splice(i,1);
  try{ localStorage.setItem("erm-tkshut", JSON.stringify(shut)); }catch(e){}
}

function viewTasks(){
  // Behind the same code as quality. The page is public, so a task list sitting on it
  // unguarded is a list of what the factory is worried about, readable by anyone with
  // the address. Same code, same storage, same single place to revoke it.
  if(!QC.code){
    return `<div class="card">
      <h3 style="margin-top:0">${t("qcGate")}</h3>
      <p class="muted" style="margin:0 0 12px">${t("tkGate")} ${t("qcGateSub")}</p>
      ${QC.err?`<div class="warnbox">${esc(QC.err)}</div>`:""}
      <input id="qccode" type="password" autocomplete="off"
        style="width:100%;padding:11px 13px;border:1.5px solid var(--line);
               border-radius:11px;background:var(--bg);color:var(--ink);font:inherit">
      <div class="dlgrow"><button class="go" onclick="qcSubmitCode()">${t("qcEnter")}</button></div>
      </div>`;
  }
  if(TK.state==="idle" || (TK.state==="ready" && !TK.list)) tkLoad();
  if(TK.state==="loading") return `<div class="card"><div class="muted">${t("tkLoading")}</div></div>`;

  /* Live when the backend answers; the build-time snapshot only as a fallback, and
     said out loud, because a stale list that looks live is worse than no list. */
  const live = TK.state==="ready" && Array.isArray(TK.list);
  /* If the rows carry Notion links, this list is a mirror and the page is a window, not
     a form. Showing an add button that writes somewhere Notion will overwrite within the
     hour would be worse than showing nothing. */
  const fromNotion = live && (TK.list||[]).concat(TK.done||[])
      .some(x => String(x.notes||"").indexOf("notion.so/") !== -1);
  const T2 = live ? TK.list.concat(TK.done||[])
                  : (D.tasks||[]).map(x=>({...x, id:x.id||"", notes:x.notes||""}));

  let head=`<div class="card"><div class="row" style="align-items:center">
      <div><span class="pill ${live?"p-ok":"p-warn"}">${live?t("tkLive"):t("tkSnap")}</span></div>
      ${fromNotion?`<div><span class="pill p-ok">${t("tkFromNotion")}</span></div>`:""}
      ${live&&!fromNotion?`<div style="margin-inline-start:auto"><button class="go"
         onclick="tkToggleAdd()">${TK.adding?t("tkCancel"):"+ "+t("tkAdd")}</button></div>`:""}
    </div>
    ${TK.err?`<div class="warnbox" style="margin-top:9px">${esc(TK.err)}</div>`:""}</div>`;

  if(fromNotion){
    head+=`<div class="card"><div class="src">${t("tkReadOnly")}
      <br><a href="https://www.notion.so/${"3d3dbbef516880919469cc5d8e30760e"}"
        target="_blank" rel="noopener">${t("tkOpenNotion")}</a></div></div>`;
  }

  if(live && !fromNotion && TK.adding){
    const opt=(v,l,sel)=>`<option value="${v}"${sel?" selected":""}>${l}</option>`;
    head+=`<div class="card tkform">
      <label>${t("tkTitle")}</label>
      <input id="tk-title" autocomplete="off" enterkeyhint="done">
      <div class="tkgrid">
        <div><label>${t("tkOwner")}</label><input id="tk-owner" autocomplete="off"></div>
        <div><label>${t("tkDue")}</label><input id="tk-due" type="date"></div>
        <div><label>${t("tkTime")}</label><input id="tk-time" type="time"></div>
        <div><label>${t("tkPrio")}</label><select id="tk-prio">
          ${opt("High",t("prHigh"))}${opt("Medium",t("prMed"),true)}${opt("Low",t("prLow"))}</select></div>
        <div><label>${t("tkRepeat")}</label><select id="tk-repeat">
          ${opt("",t("rpNone"),true)}${opt("Daily",t("rpDaily"))}${opt("Weekly",t("rpWeekly"))}
          ${opt("Every 2 weeks",t("rpFort"))}${opt("Monthly",t("rpMonthly"))}${opt("Quarterly",t("rpQuarterly"))}</select></div>
        <div><label>${t("tkNotes")}</label><input id="tk-notes" autocomplete="off"></div>
      </div>
      <div class="dlgrow"><button class="go" onclick="tkSave()"${TK.busy?" disabled":""}>
        ${TK.busy?t("tkSaving"):t("tkSaveBtn")}</button></div></div>`;
  }

  if(!T2.length) return head+`<div class="card"><div class="muted">${t("tkNone")}</div>
    <div class="src">${t("tkNote")}</div></div>`;

  const today=new Date().toISOString().slice(0,10);
  const wk=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const open=T2.filter(x=>x.status!=="Done");
  const buckets=[
    ["tkOverdue", open.filter(x=>x.due&&x.due<today),            "var(--bad)"],
    ["tkToday",   open.filter(x=>x.due===today),                 "var(--warn)"],
    ["tkWeek",    open.filter(x=>x.due&&x.due>today&&x.due<=wk), "var(--teal)"],
    ["tkLater",   open.filter(x=>x.due&&x.due>wk),               "var(--green)"],
    ["tkNoDate",  open.filter(x=>!x.due),                        "var(--dim)"],
    ["tkDone",    T2.filter(x=>x.status==="Done"),               "var(--dim)"]];

  /* the three numbers worth a glance before any list */
  let h=head+`<div class="card"><div class="row">`
    + buckets.slice(0,3).map(([k,list,col])=>`<div><div class="lbl">${t(k)}</div>
        <div class="big" style="color:${list.length?col:"var(--dim)"}">${n0(list.length)}</div></div>`).join("")
    + `</div></div>`;

  tkCard = x => {
    const late = x.due && x.due < today && x.status !== "Done";
    const now  = x.due === today && x.status !== "Done";
    const pr   = x.priority==="High" ? "p-high" : x.priority==="Medium" ? "p-med" : "";
    const box = live && !fromNotion && x.id
      ? `<button class="tkbox${x.status==="Done"?" on":""}" ${TK.busy?"disabled":""}
           aria-label="${x.status==="Done"?t("tkUndo"):t("tkTick")}"
           onclick="tkDone('${esc(x.id)}',${x.status!=="Done"})">${x.status==="Done"?"\u2713":""}</button>`
      : "";
    return `<div class="tkcard ${pr} ${x.status==="Done"?"is-done":""}">
      <div class="tktitle">${box}<span>${esc(x.title)}</span></div>
      <div class="tkmeta">
        ${x.due?`<span class="tag due ${late?"late":now?"now":""}">${esc(dmy(x.due))}</span>`:""}
        ${(x.project||x.section)?`<span class="tag">${esc(x.project||x.section)}</span>`:""}
        ${x.owner?`<span class="tag">${esc(x.owner)}</span>`:""}
        ${x.repeat?`<span class="tag">↻ ${esc(x.repeat)}</span>`:""}
        ${x.status&&x.status!=="To do"?`<span class="tag">${esc(x.status)}</span>`:""}
      </div>
      ${x.notes?`<div class="tknote">${esc(x.notes)}</div>`:""}
    </div>`;
  };

  /* The month grid is always here, above the list - the way Notion shows it. The
     list/calendar switch is gone: it was reported broken three times, and a control
     that keeps needing explaining is already the wrong control. Nothing to press is
     nothing to fail. */
  h+=`<h3>${t("tkCal")}</h3>` + calView(T2);

  /* Each bucket folds. The archive holds fifty-seven finished tasks and unfolded it
     buries the eight that are still open under a page and a half of work already done -
     so it starts shut, and the open buckets start open. Which ones you left open is
     remembered on this device, because a list you have to re-open every visit is a list
     you stop opening. */
  const shut = (()=>{ try{ return JSON.parse(localStorage.getItem("erm-tkshut")||"[]"); }
                      catch(e){ return []; } })();
  const isShut = k => k==="tkDone" ? shut.indexOf(k)!==-1 || shut.indexOf("!"+k)===-1
                                   : shut.indexOf(k)!==-1;

  h+=`<div class="tkwrap">`
    + buckets.filter(([,list])=>list.length).map(([k,list,col])=>`<details class="tkcol"
        ${isShut(k)?"":"open"} ontoggle="tkFold('${k}',this.open)">
        <summary class="tkhead"><span class="caret">\u276F</span>
          <span class="dot" style="background:${col}"></span>
          <span style="flex:1">${t(k)}</span> <span class="cnt">${list.length}</span></summary>
        <div class="tkbody">${list.map(tkCard).join("")}</div></details>`).join("")
    + `</div>`;

  h+=`<div class="card" style="margin-top:12px"><div class="src">${
      live?t("tkLiveNote")+"<br>":""}${t("tkNote")}<br>
      <a href="#" onclick="qcForget();return false;">${t("qcForget")}</a></div></div>`;
  return h;
}

function viewQc(){
  if(!QC_API) return `<div class="card"><div class="warnbox">${t("qcNoApi")}</div></div>`;
  if(QC.state==="loading") return `<div class="card"><div class="muted">${t("qcLoading")}</div></div>`;
  if(QC.state!=="ready"){
    return `<div class="card">
      <h3 style="margin-top:0">${t("qcGate")}</h3>
      <p class="muted" style="margin:0 0 12px">${t("qcGateSub")}</p>
      ${QC.err?`<div class="warnbox">${esc(QC.err)}</div>`:""}
      <input id="qccode" type="password" autocomplete="off"
        style="width:100%;padding:11px 13px;border:1.5px solid var(--line);
              border-radius:11px;background:var(--bg);color:var(--ink);font:inherit">
      <div class="dlgrow"><button class="go" onclick="qcSubmitCode()">${t("qcEnter")}</button></div>
      </div>`;
  }

  const R=QC.reports||[];
  const days=[...new Set(R.map(r=>r.date))].sort().reverse();
  const latest=days[0];
  const today=R.filter(r=>r.date===latest);
  let h="";

  /* ---- the latest check ---- */
  h+=`<h3>${t("qcToday")} ${latest?`<span class="n">${esc(dmy(latest))}</span>`:""}</h3>`;
  if(!today.length){
    h+=`<div class="card"><div class="muted">${t("qcNoToday")}</div></div>`;
  } else {
    h+=today.map(r=>`<div class="card"><div class="row">
        <div><div class="lbl">${t("qcBy")}</div><div class="mid">${esc(r.employee)}</div></div>
        <div><div class="lbl">${t("qcShift")}</div><div class="mid">${
          r.shift==="evening"?t("qcEvening"):t("qcMorning")}</div></div>
        <div><div class="lbl">${t("qcDone")}</div><div class="mid">${n0(r.done)}<span class="unit">/${n0(r.total)}</span></div></div>
        <div><div class="lbl">${t("qcIssues")}</div><div class="big" style="color:${
          r.issues?"var(--bad)":"var(--ok)"}">${n0(r.issues)}</div></div>
      </div>${r.notes?`<div class="muted" style="margin-top:9px">${esc(r.notes)}</div>`:""}</div>`).join("");
  }

  /* ---- what failed ---- */
  const bad=[];
  R.forEach(r=>["units","zones","hyg"].forEach(k=>(r.items&&r.items[k]||[]).forEach(it=>{
    if(it.status==="bad") bad.push({d:r.date, who:r.employee, sec:k==="units"?"temperature":k==="zones"?"cleanliness":"hygiene", it:it});
  })));
  const badToday=bad.filter(b=>b.d===latest);
  h+=`<h3>${t("qcOpen")} <span class="n">${badToday.length}</span></h3><div class="card">`;
  h+= badToday.length ? tbl([{h:t("qcSection")},{h:t("qcItem"),wrap:true},{h:t("qcNote"),wrap:true},{h:t("qcBy")}],
        badToday.map(b=>[QCSEC(b.sec), esc(L==="ar"?(b.it.ar||b.it.en):(b.it.en||b.it.ar)),
                         `<span class="muted">${esc(b.it.note||"")}</span>`, esc(b.who)]))
    : `<div class="muted">${t("qcNoOpen")}</div>`;
  h+=`</div>`;

  /* ---- temperatures past their limit ---- */
  const hot=[];
  today.forEach(r=>(r.items&&r.items.units||[]).forEach(u=>{
    if(u.temp==null||u.limit==null) return;
    const over=(u.type==="freezer") ? (u.temp>u.limit) : (u.temp>u.limit);
    if(over) hot.push({u:u, who:r.employee});
  }));
  h+=`<h3>${t("qcTemps")} <span class="n">${hot.length}</span></h3><div class="card">`;
  h+= hot.length ? tbl([{h:t("qcItem"),wrap:true},{h:t("qcReading")},{h:t("qcLimit")},{h:t("qcOver")}],
        hot.map(x=>[esc(L==="ar"?(x.u.ar||x.u.en):(x.u.en||x.u.ar)),
                    `<b style="color:var(--bad)">${n1(x.u.temp)}°</b>`, n1(x.u.limit)+"°",
                    `<span class="ou dn">${n1(x.u.temp-x.u.limit)}°</span>`]))
    : `<div class="muted">${t("qcNoTemps")}</div>`;
  h+=`</div>`;

  /* ---- the filter, then every report, each one openable ---- */
  // Seven days by default. The fetch brings ninety, but a page that opens on three
  // months of checks buries today's under scrolling, and today's is the one that
  // matters most mornings.
  const chip=(v,lbl)=>`<button class="opt" style="display:inline-block;width:auto;
      margin:0 6px 0 0;padding:6px 12px;font-size:12.5px;${
      QC.days===v?"border-color:var(--green);background:var(--okbg)":""}"
      onclick="qcSetDays(${v})">${lbl}</button>`;
  const names=[...new Set((QC.reports||[]).map(r=>r.employee))].sort();
  h+=`<h3>${t("qcFilter")}</h3><div class="card">
    <div>${chip(7,t("qcLast7"))}${chip(30,t("qcLast30"))}${chip(0,t("qcAll"))}</div>
    <div style="margin-top:10px">
      <select onchange="qcSetEmp(this.value)" style="width:100%;padding:9px 11px;
        border:1.5px solid var(--line);border-radius:10px;background:var(--bg);
        color:var(--ink);font:inherit">
        <option value=""${QC.emp?"":" selected"}>${t("qcAllEmp")}</option>
        ${names.map(nm=>`<option value="${esc(nm)}"${QC.emp===nm?" selected":""}>${esc(nm)}</option>`).join("")}
      </select></div></div>`;

  const cut = QC.days ? new Date(Date.now()-QC.days*864e5).toISOString().slice(0,10) : "0000-00-00";
  const shown = R.filter(r=>r.date>=cut && (!QC.emp || r.employee===QC.emp));

  /* per-employee summary, over the filtered window */
  const byEmp={};
  shown.forEach(r=>{ const e=byEmp[r.employee]=byEmp[r.employee]||{n:0,iss:0,last:""};
                     e.n++; e.iss+=(r.issues||0); if(r.date>e.last) e.last=r.date; });
  const emps=Object.entries(byEmp).sort((a,b)=>b[1].n-a[1].n);
  if(emps.length){
    h+=`<h3>${t("qcByEmp")}</h3><div class="card">`+tbl(
        [{h:t("qcBy")},{h:t("qcChecks")},{h:t("qcIssues")},{h:t("qcLast")}],
        emps.map(([nm,e])=>[
          `<a href="#" onclick="qcSetEmp('${esc(nm).replace(/'/g,"\\'")}');return false;">${esc(nm)}</a>`,
          n0(e.n),
          e.iss?`<span class="ou dn">${n0(e.iss)}</span>`:`<span class="ou up">0</span>`,
          esc(dmy(e.last))]))
      +`</div>`;
  }

  /* every report in the window, each opening on the checklist as it was filled */
  h+=`<h3>${t("qcReports")} <span class="n">${shown.length}</span></h3>`;
  h+= shown.length ? shown.map(r=>{
        const secs=[["units","temperature"],["zones","cleanliness"],["hyg","hygiene"]];
        let inner="";
        secs.forEach(([k,sec])=>{
          const list=(r.items&&r.items[k])||[];
          if(!list.length) return;
          inner+=`<div class="lbl" style="margin:10px 0 4px">${QCSEC(sec)}</div>`
            + tbl([{h:t("qcItem"),wrap:true},
                   ...(k==="units"?[{h:t("qcReading")},{h:t("qcLimit")}]:[]),
                   {h:""},{h:t("qcNote"),wrap:true}],
                list.map(it=>[
                  esc(L==="ar"?(it.ar||it.en):(it.en||it.ar)),
                  ...(k==="units"?[
                      it.temp==null?dash(null)
                        :`<b style="color:${it.status==="bad"?"var(--bad)":"var(--ink)"}">${n1(it.temp)}°</b>`,
                      it.limit==null?dash(null):n1(it.limit)+"°"]:[]),
                  it.status==="ok" ?`<span class="pill p-ok">${t("qcStatusOk")}</span>`
                   :it.status==="bad"?`<span class="pill p-bad">${t("qcStatusBad")}</span>`
                   :`<span class="muted">${t("qcStatusNone")}</span>`,
                  `<span class="muted">${esc(it.note||"")}</span>`]));
        });
        return `<details class="grp">
          <summary><span class="caret">❯</span>
            <span class="gname">${esc(dmy(r.date))} · ${esc(r.employee)}</span>
            <span class="muted">${r.shift==="evening"?t("qcEvening"):t("qcMorning")}</span>
            <span class="gnum">${n0(r.done)}<span class="unit">/${n0(r.total)}</span></span>
            <span class="pill ${r.issues?"p-bad":"p-ok"}">${n0(r.issues)}</span>
          </summary>
          <div class="inner">
            ${r.notes?`<div class="muted" style="margin:6px 0">${esc(r.notes)}</div>`:""}
            ${inner||`<div class="muted">${t("qcStatusNone")}</div>`}
            <div class="src">${t("qcOpenFull")} · ${t("qcFetched")} ${esc(String(r.submittedAt).slice(11,16))}</div>
          </div></details>`;
      }).join("")
    : `<div class="card"><div class="muted">${t("qcNone")}</div></div>`;

  /* ---- the last fortnight ---- */
  h+=`<h3>${t("qcTrend")}</h3><div class="card">
      <div class="chartbox"><canvas id="c-qc"></canvas></div>
      <div class="src">${QC.sheetUrl?`<a href="${esc(QC.sheetUrl)}" target="_blank" rel="noopener">${t("qcSheet")}</a> · `:""}
      <a href="#" onclick="qcForget();return false;">${t("qcForget")}</a></div></div>`;
  return h;
}

/* ================================================================== *
 *  Export.                                                           *
 *                                                                    *
 *  The report is built as real HTML and handed to the browser's own   *
 *  print dialog, where "Save as PDF" is one click. No PDF library:    *
 *  every one of them would have to shape and reorder the Arabic       *
 *  itself, which is exactly where they break, and rasterising the     *
 *  page would turn a report into a picture of a report. The browser   *
 *  already shapes Arabic correctly and already has the brand fonts,   *
 *  so the file comes out as selectable text at a fraction of the size.*
 *                                                                    *
 *  Each language is rendered by running the ordinary view functions   *
 *  with the language switched - so a translation that is right on     *
 *  screen is right in the report, and there is no second wording to   *
 *  drift out of step.                                                 *
 * ================================================================== */
const EXPORTABLE = {plan:viewPlan, shift:viewShift, store:viewStore, month:viewMonth};

function exportDialog(){
  // The first version built the options with attributes called "data-l=ar" and then
  // looked for them with [data-l\=ar]. That is not an attribute name - the markup
  // produced data-l="ar" - so nothing ever matched, no handler was attached, and both
  // choices sat frozen on their defaults however hard they were tapped. Plain
  // data-lang / data-scope values and one delegated listener now, which cannot drift
  // apart the same way.
  let lang = localStorage.getItem("erm-explang") || "both";
  let scope = "page";
  const sc = document.createElement("div");
  sc.className = "scrim"; sc.id = "scrim";
  sc.onclick = e => { if(e.target === sc) closeExport(); };
  document.body.appendChild(sc);

  const draw = () => {
    const page = VIEW==="home" ? "hHome"
      : ({plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth"})[VIEW];
    const opt = (attr,val,on,lbl,sub) =>
      `<button class="opt ${on?"sel":""}" data-${attr}="${val}">${lbl}
         <small>${sub}</small></button>`;
    sc.innerHTML = `<div class="dlg">
      <h2>${t("exportT")}</h2><p>${t("exportSub")}</p>
      ${opt("lang","ar",  lang==="ar",  t("expAr"),  t("expArS"))}
      ${opt("lang","en",  lang==="en",  t("expEn"),  t("expEnS"))}
      ${opt("lang","both",lang==="both",t("expBoth"),t("expBothS"))}
      <div style="height:10px"></div>
      ${opt("scope","page",scope==="page",t("expScope"),t(page))}
      ${opt("scope","all", scope==="all", t("expAll"),
            [t("vPlan"),t("vShift"),t("vStore"),t("vMonth")].join(" · "))}
      <div class="dlgrow">
        <button data-act="cancel">${t("expCancel")}</button>
        <button class="go" data-act="go">${t("expGo")} \u2913</button></div></div>`;
  };
  draw();

  sc.addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b || !sc.contains(b)) return;
    if(b.dataset.lang){ lang = b.dataset.lang;
      localStorage.setItem("erm-explang", lang); draw(); return; }
    if(b.dataset.scope){ scope = b.dataset.scope; draw(); return; }
    if(b.dataset.act === "cancel") return closeExport();
    if(b.dataset.act === "go") return doExport(lang, scope);
  });
}

function closeExport(){ const s=$("#scrim"); if(s) s.remove(); }
window.closeExport=closeExport;

/* charts are canvases; a canvas does not survive being copied, so each visible one is
   frozen to a PNG and dropped into the report as an image */
function chartImages(){
  const out={};
  document.querySelectorAll("#main canvas").forEach(c=>{
    try{ if(c.width && c.height) out[c.id]=c.toDataURL("image/png",1); }catch(e){}
  });
  return out;
}

function doExport(lang, scope){
  const langs = lang==="both" ? ["ar","en"] : [lang];
  const pages = scope==="all" ? ["plan","shift","store","month"]
                              : (VIEW==="home" ? ["plan","month"] : [VIEW]);
  const shots = chartImages();
  const keep = L;
  let html="";
  // Page first, language second - so in a bilingual report each section is followed
  // immediately by its own translation instead of the whole Arabic report and then the
  // whole English one. Reading it the other way round, the English half sits past the
  // end of the Arabic half and looks like it was never generated.
  for(const pg of pages){
    for(const lg of langs){
      L = lg;
      const rtl = lg==="ar";
      const titles={plan:"vPlan",shift:"vShift",store:"vStore",month:"vMonth"};
      let body = EXPORTABLE[pg] ? EXPORTABLE[pg]() : "";
      // strip the on-screen affordances, they mean nothing on paper
      body = body.replace(/<div class="tapnote">.*?<\/div>/g,"")
                 .replace(/ class="card tap"/g,' class="card"')
                 .replace(/ onclick="[^"]*"/g,"");
      html += `<section class="rsec" dir="${rtl?"rtl":"ltr"}" lang="${lg}">
        <div class="rhead">
          ${MARK?`<img src="${MARK}" alt="">`:""}
          <div class="rt">${T[lg].repTitle}</div>
          <div class="rd">${langs.length>1?`<b>${lg==="ar"?"عربي":"English"}</b> · `:""}${T[lg][titles[pg]]}<br>${
            new Date().toLocaleString(lg==="ar"?"ar-EG":"en-GB",
              {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
        </div>
        <div class="rsub">${T[lg][titles[pg]+"Sub"]||""}</div>
        ${body}
        <div class="rfoot">${T[lg].src}</div></section>`;
    }
  }
  L = keep;
  $("#report").innerHTML = html;
  // the canvases inside the report are empty copies - swap in the frozen pictures
  $("#report").querySelectorAll("canvas").forEach(c=>{
    const src = shots[c.id];
    if(src){ const i=document.createElement("img"); i.src=src; i.className="rchart";
             c.replaceWith(i); }
    else { const box=c.closest(".chartbox"); if(box) box.remove(); }
  });
  closeExport();
  setTimeout(()=>{ window.print(); }, 60);
}

$("#exp").onclick=exportDialog;
$("#hide").onclick=toggleHidden;

applyTheme();
VIEW=(location.hash||"").replace("#","")||"home";
if(!PAGES.includes(VIEW)) VIEW="home";
render();
checkFresh();
/* Coming back to a home-screen app after an hour is exactly when the copy in front of
   you is most likely to be yesterday's. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") checkFresh();
});
