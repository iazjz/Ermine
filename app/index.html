<!-- Wardiya - sign-in (20 Nov 2026). Email code, no password. Public values only on this
     page: the project URL and the publishable key. Row security in the database decides
     what each person can see; this page never holds the server key. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p50:#FDF2F7;--p100:#FBE4EF;--p200:#F7C6DC;--p300:#F09CC0;--p400:#E66A9E;--p500:#D9417E;
  --p600:#BF2C66;--p700:#9C2353;--p900:#5C1733;--bg:#FDF2F7;--card:#fff;--ink:#3A1426;--dim:#8A5A6F;
  --line:#F7C6DC;--main:#D9417E;--ok:#1F8A5B;--bad:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0D14;--card:#2A1520;--ink:#FBE4EF;
  --dim:#C99AB0;--line:#4A2436;--main:#F09CC0}}
:root[data-theme="dark"]{--bg:#1A0D14;--card:#2A1520;--ink:#FBE4EF;--dim:#C99AB0;--line:#4A2436;--main:#F09CC0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:520px;width:100%;margin:0 auto}
.brand{font-weight:700;font-size:22px;color:var(--main);letter-spacing:0}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
main{flex:1;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;width:100%;max-width:420px;
  box-shadow:0 10px 30px rgba(217,65,126,.10);animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
h1{margin:0 0 6px;font-size:22px}
p.sub{margin:0 0 20px;color:var(--dim);font-size:14.5px;line-height:1.6}
label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--main)}
input.code{letter-spacing:.35em;text-align:center;font-size:24px;direction:ltr}
button.go{width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:14px;
  background:var(--p500);color:#fff;cursor:pointer;transition:transform .1s,opacity .15s}
button.go:active{transform:scale(.98)} button.go:disabled{opacity:.55;cursor:default}
button.link{background:none;border:0;color:var(--main);font:inherit;font-size:14px;cursor:pointer;margin-top:12px;padding:4px}
.msg{margin-top:12px;font-size:14px;line-height:1.6;min-height:1.2em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.who{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;background:var(--p100);color:var(--p700);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .pill{background:#4A2436;color:var(--p200)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{background:#4A2436;color:var(--p200)}}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:16px}
/* app (20 Nov 2026): entry, today, team */
.app{width:100%;max-width:560px;margin:0 auto;padding:0 16px 90px;overflow-x:hidden}
.app input,.app select{min-width:0;max-width:100%}
.fname{font-weight:700;font-size:18px;margin:4px 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;min-width:0;background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--dim);padding:10px 0;white-space:nowrap;overflow:hidden;
  border-radius:12px;cursor:pointer}
.tabs button.on{color:#fff;background:var(--p500)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big4 button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:22px 10px;
  font:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .1s,border-color .15s}
.big4 button:active{transform:scale(.97)} .big4 button:hover{border-color:var(--main)}
.big4 .ic{font-size:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-top:14px;animation:rise .3s ease-out both}
.panel h2{margin:0 0 12px;font-size:18px}
.fld{margin-bottom:12px}
select{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px;font:inherit;cursor:pointer}
.seg button.on{border-color:var(--main);color:var(--main);font-weight:700}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tot b{display:block;font-size:20px} .tot span{font-size:12px;color:var(--dim)}
.ent{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:8px}
.ent .w{font-size:15px;font-weight:600} .ent .m{font-size:12.5px;color:var(--dim);margin-top:2px}
.ent.void{opacity:.45} .ent.void .w{text-decoration:line-through}
.x{border:1px solid var(--line);background:none;color:var(--dim);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.st{font-size:11.5px;border-radius:999px;padding:2px 8px;margin-inline-start:6px}
.st.pending{background:#FFF3D6;color:#8A5A00} .st.void{background:#eee;color:#666}
.empty{color:var(--dim);text-align:center;padding:20px 0}
/* closed groups (Aziz, 20 Nov 2026): a long list opens one product / area at a time */
details.grp{border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--card)}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px;cursor:pointer;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"\203A";display:inline-block;transition:transform .2s;color:var(--dim);font-size:18px}
html[dir="rtl"] details.grp>summary::before{content:"\2039"}
details.grp[open]>summary::before{transform:rotate(-90deg)}
details.grp>summary .gs{margin-inline-start:auto;font-weight:600;font-size:13px;color:var(--dim)}
details.grp>summary .gt{font-weight:700;color:var(--main);font-size:14px}
details.grp>.gb{padding:0 10px 6px}
[hidden]{display:none !important}
</style>
</head>

const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
const T={
 ar:{brand:"وردية",other:"EN",hello:"تسجيل الدخول",sub:"اكتب بريدك، ونرسل لك رمز دخول. لا توجد كلمة مرور.",

  out:"تسجيل الخروج",foot:"وردية · أول مصنع: إيرماين",

 en:{brand:"Wardiya",other:"ع",hello:"Sign in",sub:"Type your email and we send you a sign-in code. No password.",
  email:"Email",send:"Send the code",sending:"Sending…",codeT:"Enter the code",

let L="ar"; try{ L=localStorage.getItem("wd-lang")||"ar"; }catch(e){}
let EMAIL="", STEP="email";
const t=(k,v={})=>String(T[L][k]).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function msg(text,cls){ const m=$("#msg"); if(m){ m.textContent=text||""; m.className="msg "+(cls||""); } }
async function draw(){
  document.documentElement.lang=L; document.documentElement.dir=L==="ar"?"rtl":"ltr";
  $("#brand").textContent=t("brand"); $("#lang").textContent=t("other"); $("#foot").textContent=t("foot");
  document.title=t("brand");
  const {data:{session}}=await sb.auth.getSession();
  const c=$("#card");
  if(session){ return drawIn(session); }
  $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
  if(STEP==="code"){
    c.innerHTML=`<h1>${t("codeT")}</h1><p class="sub">${esc(t("codeSub",{e:EMAIL}))}</p>
      <label for="code">${t("code")}</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="go" id="verify" type="button">${t("verify")}</button>
      <div class="msg" id="msg"></div>
      <button class="link" id="resend" type="button">${t("resend")}</button>
      <button class="link" id="back" type="button">${t("back")}</button>`;
    $("#code").focus();
    $("#code").addEventListener("keydown",e=>{ if(e.key==="Enter") verify(); });
    $("#verify").onclick=verify; $("#resend").onclick=send; $("#back").onclick=()=>{STEP="email";draw();};
    return;
  }
  c.innerHTML=`<h1>${t("hello")}</h1><p class="sub">${t("sub")}</p>
    <label for="email">${t("email")}</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(EMAIL)}">
    <button class="go" id="send" type="button">${t("send")}</button><div class="msg" id="msg"></div>`;
  $("#email").focus();
  $("#email").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
  $("#send").onclick=send;
}
async function send(){
  const el=$("#email"); if(el) EMAIL=el.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(EMAIL)) return msg(t("badEmail"),"bad");
  const b=$("#send")||$("#resend"); if(b){ b.disabled=true; b.textContent=t("sending"); }
  const {error}=await sb.auth.signInWithOtp({email:EMAIL,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  if(error){ if(b){ b.disabled=false; b.textContent=STEP==="code"?t("resend"):t("send"); }
    return msg(/rate|seconds|security/i.test(error.message)?t("wait"):t("fail"),"bad"); }
  STEP="code"; draw();
}
async function verify(){
  const token=($("#code").value||"").replace(/\D/g,"");
  if(token.length<6) return msg(t("badCode"),"bad");
  const b=$("#verify"); b.disabled=true; b.textContent=t("checking");
  const {error}=await sb.auth.verifyOtp({email:EMAIL,token,type:"email"});
  if(error){ b.disabled=false; b.textContent=t("verify"); return msg(t("badCode"),"bad"); }
  STEP="email"; draw();
}

const T2={
 ar:{tEntry:"إدخال",tToday:"اليوم",tTeam:"الفريق",made:"صُنع",coated:"غُطّي",packed:"عُبّئ",delay:"تأخير",
  product:"المنتج",flavour:"النكهة",box:"البوكس",qtyP:"العدد (حبة)",qtyB:"العدد (بوكس)",day:"اليوم",today:"اليوم",yday:"أمس",

  save:"حفظ",cancel:"إلغاء",saved:"تم الحفظ ✓",pickAll:"اختر كل الخانات واكتب العدد.",big:"الرقم {n} أكبر من المعتاد. متأكد؟",
  pcs:"حبة",boxes:"بوكس",tMade:"صُنع",tCoat:"غُطّي",tPack:"عُبّئ",nothing:"لا إدخالات لهذا اليوم بعد.",
  voidB:"إلغاء",voidQ:"إلغاء هذا الإدخال؟ يبقى ظاهرًا مشطوبًا ولا يُحذف.",pending:"بانتظار الاعتماد",voided:"ملغى",
  delayW:"تأخير: {r}",min:"دقيقة",invite:"إضافة شخص",inviteSub:"اكتب بريده ودوره. إذا لم يدخل بعد، تُطبَّق الإضافة أول ما يدخل.",
  role:"الدور",add:"أضف",added:"أُضيف ✓",invited:"أُرسلت الدعوة، تُطبَّق عند أول دخول ✓",waiting:"بانتظار أول دخول",

  by:"بواسطة",appOut:"تسجيل الخروج"},
 en:{tEntry:"Entry",tToday:"Today",tTeam:"Team",made:"Made",coated:"Coated",packed:"Packed",delay:"Delay",
  product:"Product",flavour:"Flavour",box:"Box",qtyP:"Quantity (pieces)",qtyB:"Quantity (boxes)",day:"Day",today:"Today",yday:"Yesterday",
  reason:"Reason",minutes:"Minutes lost",note:"What happened",noteNeed:"Write what happened (needed for this reason).",any:"— none —",
  save:"Save",cancel:"Cancel",saved:"Saved ✓",pickAll:"Pick every field and type the quantity.",big:"{n} is higher than usual. Are you sure?",
  pcs:"pcs",boxes:"boxes",tMade:"Made",tCoat:"Coated",tPack:"Packed",nothing:"No entries for this day yet.",

const u=(k,v={})=>String(T2[L][k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const S={fid:null,fname:"",roles:[],me:null,ref:null,view:"entry",form:null,day:0};
const riyadh=(off=0)=>{ const d=new Date(Date.now()-off*864e5);
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(d); };

const n0=v=>Math.round(v||0).toLocaleString(L==="ar"?"ar-EG":"en-GB");

async function drawIn(session){
  const c=$("#card"), uid=session.user.id; S.me=uid;
  const {data:prof}=await sb.from("profiles").select("full_name,lang").eq("user_id",uid).maybeSingle();
  if(!prof){
    $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
    c.innerHTML=`<h1>${t("nameT")}</h1><p class="sub">${t("nameSub")}</p>
      <label for="nm">${t("name")}</label><input id="nm" autocomplete="name">
      <button class="go" id="sv" type="button">${t("save")}</button><div class="msg" id="msg"></div>
      <button class="link" id="out" type="button">${t("out")}</button>`;
    $("#nm").focus(); $("#out").onclick=signOut;
    $("#sv").onclick=async()=>{ const n=$("#nm").value.trim(); if(n.length<2) return;
      const {error}=await sb.from("profiles").insert({user_id:uid,full_name:n,lang:L});
      if(error) return msg(t("fail"),"bad"); draw(); };
    return;
  }
  const {data:mem}=await sb.from("memberships").select("factory_id,role,factories(name)").eq("user_id",uid).eq("active",true);
  if(!mem||!mem.length){
    $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
    c.innerHTML=`<h1>${t("inT")}</h1><p class="sub">${esc(prof.full_name)} · <span dir="ltr">${esc(session.user.email)}</span></p>
      <p class="sub">${t("none")}</p><button class="link" id="out" type="button">${t("out")}</button>`;
    $("#out").onclick=signOut; return;
  }
  S.fid=mem[0].factory_id; S.fname=mem[0].factories?.name||""; S.roles=mem.filter(m=>m.factory_id===S.fid).map(m=>m.role);
  if(!S.ref) await loadRef();
  $("#mainbox").hidden=true; $("#app").hidden=false; $("#tabs").hidden=false;
  drawApp();
}
async function loadRef(){
  const f=S.fid;
  const [p,fl,b,bc,r]=await Promise.all([
    sb.from("products").select("id,code,is_coated,sort").eq("factory_id",f).eq("active",true).order("sort"),
    sb.from("flavours").select("id,product_id,name_en").eq("factory_id",f).eq("active",true).order("name_en"),
    sb.from("boxes").select("id,code,pieces_per_box,by_flavour,sort").eq("factory_id",f).eq("active",true).order("sort"),
    sb.from("box_contents").select("box_id,product_id"),
    sb.from("delay_reasons").select("id,category,text_en,needs_note").eq("factory_id",f).eq("active",true)]);
  S.ref={products:p.data||[],flavours:fl.data||[],boxes:b.data||[],bc:bc.data||[],reasons:r.data||[]};
}
function drawApp(){
  /* tabs by role (20 Nov 2026): the storekeeper sees the store only; production roles see the floor */
  const prod=S.roles.some(r=>["owner","admin","planner","chef","lead"].includes(r));
  const tabs=(prod?[["entry","tEntry"],["plan","tPlan"],["stock","tStock"]]:[]).concat([["store","tStore"]])
    .concat(prod?[["today","tToday"]]:[]).concat(isMgr()?[["team","tTeam"],["admin","tAdmin"]]:[]);
  if(!tabs.some(x=>x[0]===S.view)) S.view=tabs[0][0];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button class="${S.view===k?"on":""}" data-v="${k}" type="button">${u(l)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; S.form=null; drawApp(); });
  const head=`<div class="fname">${esc(S.fname)} · <span class="pill">${S.roles.map(r=>esc(T[L].roles[r]||r)).join("، ")}</span></div>`;
  const a=$("#app");
  if(S.view==="plan") return drawPlan(a,head);
  if(S.view==="stock") return drawStock(a,head);
  if(S.view==="store") return drawStore(a,head);
  if(S.view==="admin") return drawAdmin(a,head);
  if(S.view==="today") return drawToday(a,head);

async function saveForm(k){

  let row, table="production_entries";
  if(k==="delay"){
    const rid=v("fr"), rs=R.reasons.find(r=>r.id===rid), note=v("fn").trim();
    if(!rid) return msg(u("pickAll"),"bad");
    if(rs&&rs.needs_note&&!note) return msg(u("noteNeed"),"bad");
    const mins=parseInt(v("fm").replace(/\D/g,""))||null;
    table="delays"; row={factory_id:S.fid,client_id:uuid(),day,product_id:v("fp")||null,reason_id:rid,minutes_lost:mins,what_happened:note||null};
  } else {

    if(k==="packed"){
      const bid=v("fb"), b=R.boxes.find(x=>x.id===bid), pc=R.bc.find(x=>x.box_id===bid);
      if(!bid||!q||(b&&b.by_flavour&&pc&&!v("ff"))) return msg(u("pickAll"),"bad");
      if(q>1500&&!confirm(u("big",{n:q}))) return;
      row={factory_id:S.fid,client_id:uuid(),day,stage:"packed",box_id:bid,product_id:pc?pc.product_id:null,flavour_id:v("ff")||null,qty:q};
    } else {
      const pid=v("fp"), hasFl=R.flavours.some(f=>f.product_id===pid);
      if(!pid||!q||(hasFl&&!v("ff"))) return msg(u("pickAll"),"bad");
      if(q>15000&&!confirm(u("big",{n:q}))) return;
      row={factory_id:S.fid,client_id:uuid(),day,stage:k,product_id:pid,flavour_id:v("ff")||null,qty:q};
    }

  const {error}=await sb.from(table).insert(row);

  msg(u("saved"),"ok"); if($("#fq")) $("#fq").value=""; if($("#fm")) $("#fm").value=""; if($("#fn")) $("#fn").value="";
}

  for(const [tb,rows] of [["daily_plan_lines",lines],["plan_tasks",tasks],["plan_roster",ros]]){
    const d=await sb.from(tb).delete().eq("plan_id",id); if(d.error){ console.warn(d.error); return msg(t("fail"),"bad"); }

const COATED_BOX=new Set(["Mini","Ice Cream","Large Bites"]);
async function stockModel(){
  const X=await loadPlanExtras(), R=S.ref, f=S.fid;
  const since=new Date(Date.now()-14*864e5).toISOString();
  const [sc,pe,bf,rf]=await Promise.all([
    sb.from("stock_counts").select("flavour_id,stock,coated,exp_stock,exp_coated,day,entered_at,status").eq("factory_id",f).neq("status","void").order("entered_at",{ascending:false}).limit(1000),
    sb.from("production_entries").select("stage,flavour_id,box_id,qty,entered_at").eq("factory_id",f).eq("status","approved").gte("entered_at",since),
    sb.from("box_flavours").select("box_id,flavour_id,pcs"),
    sb.from("ref_flavour").select("flavour_id,at").eq("factory_id",f)]);
  const last={}; (sc.data||[]).forEach(c=>{ if(!last[c.flavour_id]) last[c.flavour_id]=c; });
  const refAt=Object.fromEntries((rf.data||[]).map(x=>[x.flavour_id,x.at]));
  const box=Object.fromEntries(R.boxes.map(b=>[b.id,b]));
  const M={};
  R.flavours.forEach(fl=>{
    const c=last[fl.id], ref=X.rf[fl.id]||{};
    const base = c ? {stock:c.stock||0, coated:c.coated||0, at:c.entered_at, src:"count", day:c.day}
                   : {stock:ref.stock||0, coated:ref.coated_stock||0, at:refAt[fl.id]||since, src:"file"};
    M[fl.id]={fl, base, made:0, coat:0, useU:0, useC:0, last:c||null};
  });
  (pe.data||[]).forEach(e=>{
    if(e.stage==="made"&&M[e.flavour_id]&&e.entered_at>M[e.flavour_id].base.at) M[e.flavour_id].made+=e.qty;
    if(e.stage==="coated"&&M[e.flavour_id]&&e.entered_at>M[e.flavour_id].base.at) M[e.flavour_id].coat+=e.qty;
    if(e.stage==="packed"){ const b=box[e.box_id]; if(!b) return; const coatedBox=COATED_BOX.has(b.code);
      const parts = e.flavour_id ? [{flavour_id:e.flavour_id,pcs:b.pieces_per_box}] : (bf.data||[]).filter(x=>x.box_id===e.box_id);
      parts.forEach(pt=>{ const m=M[pt.flavour_id]; if(!m||e.entered_at<=m.base.at) return;
        if(coatedBox) m.useC+=e.qty*pt.pcs; else m.useU+=e.qty*pt.pcs; }); }
  });
  Object.values(M).forEach(m=>{ m.expU=Math.round(m.base.stock+m.made-m.coat-m.useU); m.expC=Math.round(m.base.coated+m.coat-m.useC); });
  return M;
}

  let hT=`<div class="seg" style="flex-wrap:wrap"><label style="flex:1 1 100%;margin:0">${u("month")}<input type="month" id="am" value="${AD.month}"></label>
    <label style="flex:1;margin:0">${u("wdays")}<input id="aw" inputmode="numeric" value="${esc(mt?mt.working_days??"":"")}"></label><label style="flex:1;margin:0">${u("staffN")}<input id="as" inputmode="numeric" value="${esc(mt?mt.staff??"":"")}"></label></div>`;
  hT+=`<div class="fname">${u("tBox")}</div>`+P2.map(p=>{ const bs=B2.filter(b=>boxProd(b.id)===p.id); if(!bs.length) return "";
    return grp(esc(p.code), bs.map(b=>`<div class="ent"><div class="w"><bdi>${esc(b.code)}</bdi> <span class="m">· ${n0(b.pieces_per_box)} ${u("pcs")}</span></div>${numIn("tb",`data-b="${b.id}" data-p="${p.id}" data-s="${b.pieces_per_box}"`,tq("box","box_id",b.id))}</div>`).join("")); }).join("");
  hT+=`<div class="fname" style="margin-top:12px">${u("tProd")}</div>`+P2.map(p=>`<div class="ent"><div><div class="w"><bdi>${esc(p.code)}</bdi></div><div class="m">${u("fromBoxes")}: <b class="fb" data-p="${p.id}">0</b> ${u("pcs")}</div></div>${numIn("tp",`data-p="${p.id}"`,tq("product","product_id",p.id))}</div>`).join("");
  hT+=`<div class="fname" style="margin-top:12px">${u("tFl")}</div>`+P2.map(p=>{ const fs=F2.filter(x=>x.product_id===p.id); if(!fs.length) return "";
    return grp(esc(p.code), fs.map(x=>`<div class="ent"><div class="w"><bdi>${esc(x.name_en)}</bdi></div>${numIn("tf",`data-f="${x.id}"`,tq("flavour","flavour_id",x.id))}</div>`).join("")); }).join("");
  hT+=`<button class="go" id="ats" type="button">${u("saveT")}</button><div class="msg" id="msgT"></div>`;
  // --- sales request
  let hS=`<div class="seg" style="flex-wrap:wrap"><label style="flex:1 1 60%;margin:0">${u("firstDay")}<input type="date" id="sd" value="${AD.first}"></label>
    <label style="flex:1;margin:0">${u("nDays")}<select id="sn">${[10,20].map(n=>opt(n,n,AD.n===n)).join("")}</select></label></div>`+
    P2.map(p=>{ const bs=B2.filter(b=>boxProd(b.id)===p.id); if(!bs.length) return "";
      return grp(esc(p.code), bs.map(b=> b.by_flavour
        ? `<div class="m" style="margin:8px 0 4px"><b><bdi>${esc(b.code)}</bdi></b></div>`+F2.filter(x=>x.product_id===p.id).map(x=>`<div class="ent"><div class="w"><bdi>${esc(x.name_en)}</bdi></div>${numIn("sq",`data-b="${b.id}" data-f="${x.id}"`)}</div>`).join("")
        : `<div class="ent"><div class="w"><bdi>${esc(b.code)}</bdi></div>${numIn("sq",`data-b="${b.id}" data-f=""`)}</div>`).join(""),
        `<span class="gt sgt">0</span> ${u("boxes")}`); }).join("")+
    `<button class="x" id="spv" type="button" style="margin-top:10px">${u("preview")}</button><p class="sub" id="spt"></p>
     <button class="go" id="sss" type="button">${u("saveSales")}</button><div class="msg" id="msgS"></div>`;
  // --- prices
  const {data:bp}=await sb.from("box_prices").select("box_id,valid_from,price_sar").order("valid_from",{ascending:false});
  const cur={}; (bp||[]).forEach(x=>{ if(!cur[x.box_id]&&x.valid_from<=riyadh(0)) cur[x.box_id]=x; });
  let hP=`<div class="fld"><label>${u("validFrom")}</label><input type="date" id="pvf" value="${riyadh(0)}"></div>`+
    B2.map(b=>`<div class="ent"><div><div class="w"><bdi>${esc(b.code)}</bdi></div><div class="m">${u("curPrice")}: ${cur[b.id]?(+cur[b.id].price_sar).toLocaleString(L==="ar"?"ar-EG":"en-GB",{maximumFractionDigits:2})+" · "+esc(cur[b.id].valid_from):"—"}</div></div>
      <input class="pp" data-b="${b.id}" inputmode="decimal" style="width:92px" placeholder="${u("newPrice")}"></div>`).join("")+
    `<button class="go" id="pps" type="button">${u("savePrices")}</button><div class="msg" id="msgP"></div>`;
  // --- catalogue
  const tog=(tb,id,act)=>`<button class="x" type="button" data-tog="${tb}" data-id="${id}" data-a="${act?1:0}">${act?u("stopA"):u("startA")}</button>`;
  let hC=grp(u("products"), C.p.map(p=>`<div class="ent ${p.active?"":"void"}"><div class="w"><bdi>${esc(p.code)}</bdi></div>${tog("products",p.id,p.active)}</div>`).join("")+
      `<div class="seg"><input id="np" placeholder="${u("code")}"><button class="x" id="npa" type="button">${u("addNew")}</button></div>`, n0(C.p.length))
    +grp(u("flavours"), C.p.map(p=>{ const fs=C.fl.filter(x=>x.product_id===p.id); return `<div class="m" style="margin:8px 0 4px"><b><bdi>${esc(p.code)}</bdi></b></div>`+
      fs.map(x=>`<div class="ent ${x.active?"":"void"}"><div class="w"><bdi>${esc(x.name_en)}</bdi></div>${tog("flavours",x.id,x.active)}</div>`).join(""); }).join("")+
      `<div class="seg"><select id="nfp">${C.p.map(p=>opt(p.id,p.code)).join("")}</select><input id="nf" placeholder="${u("code")}"><button class="x" id="nfa" type="button">${u("addNew")}</button></div>`, n0(C.fl.length))
    +grp(u("boxesL"), C.b.map(b=>`<div class="ent ${b.active?"":"void"}"><div><div class="w"><bdi>${esc(b.code)}</bdi></div><div class="m">${n0(b.pieces_per_box)} ${u("pcs")} · ${esc(prodName(boxProd(b.id)))}${b.by_flavour?" · "+u("byFl"):""}</div></div>${tog("boxes",b.id,b.active)}</div>`).join("")+
      `<div class="fld"><input id="nb" placeholder="${u("code")}"></div><div class="seg"><input id="nbs" inputmode="numeric" placeholder="${u("size")}"><select id="nbp">${C.p.map(p=>opt(p.id,p.code)).join("")}</select></div>
       <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="nbf" style="width:auto"> ${u("byFl")}</label><button class="x" id="nba" type="button">${u("addNew")}</button>`, n0(C.b.length));
  // --- settings
  const [sf,dr,stn,stp,fac]=await Promise.all([
    sb.from("staff").select("id,name,active").eq("factory_id",f).order("sort"),
    sb.from("delay_reasons").select("id,category,text_en,active").eq("factory_id",f).order("category"),
    sb.from("stations").select("id,name_en,active").eq("factory_id",f),
    sb.from("step_types").select("name,active").eq("factory_id",f).order("sort"),
    sb.from("factories").select("week_off").eq("id",f).maybeSingle()]);
  const wo=((fac.data||{}).week_off||[5])[0];
  let hX=grp(u("staffL"), (sf.data||[]).map(x=>`<div class="ent ${x.active?"":"void"}"><div class="w"><bdi>${esc(x.name)}</bdi></div>${tog("staff",x.id,x.active)}</div>`).join("")+
      `<div class="seg"><input id="nsf" placeholder="${u("code")}"><button class="x" id="nsfa" type="button">${u("addNew")}</button></div>`, n0((sf.data||[]).filter(x=>x.active).length))
    +grp(u("reasonsL"), (dr.data||[]).map(x=>`<div class="ent ${x.active?"":"void"}"><div><div class="w"><bdi>${esc(x.text_en)}</bdi></div><div class="m">${esc(x.category)}</div></div>${tog("delay_reasons",x.id,x.active)}</div>`).join("")+
      `<div class="seg"><input id="nrc" placeholder="${u("category")}"><input id="nr" placeholder="${u("reason")}"><button class="x" id="nra" type="button">${u("addNew")}</button></div>`, n0((dr.data||[]).filter(x=>x.active).length))
    +grp(u("areasL"), (stn.data||[]).sort((x,y)=>(parseInt(x.name_en)||99)-(parseInt(y.name_en)||99)).map(x=>`<div class="ent ${x.active?"":"void"}"><div class="w"><bdi>${esc(x.name_en)}</bdi></div>${tog("stations",x.id,x.active)}</div>`).join("")+
      `<div class="seg"><input id="nst" placeholder="11 - …"><button class="x" id="nsta" type="button">${u("addNew")}</button></div>`)
    +grp(u("stepsL"), (stp.data||[]).map(x=>`<div class="ent ${x.active?"":"void"}"><div class="w"><bdi>${esc(x.name)}</bdi></div>${tog("step_types",x.name,x.active)}</div>`).join("")+
      `<div class="seg"><input id="nsp" placeholder="${u("code")}"><button class="x" id="nspa" type="button">${u("addNew")}</button></div>`)
    +`<div class="fld" style="margin-top:12px"><label>${u("dayOff")}</label><select id="wo">${T2[L].days7.map((d,i)=>opt(i,d,i===wo)).join("")}</select></div>`;
  $("#ad").className=""; $("#ad").innerHTML=
    `<div class="panel">${grp(`<b>${u("aTarget")}</b>`,hT)}${grp(`<b>${u("aSales")}</b>`,hS)}${grp(`<b>${u("aPrices")}</b>`,hP)}${grp(`<b>${u("aCat")}</b>`,hC)}${grp(`<b>${u("aSet")}</b>`,hX)}</div><div class="msg" id="msg"></div>`;
  // live: pieces from box targets, sales group totals
  const recalc=()=>{ const by={}; a.querySelectorAll(".tb").forEach(i=>{ by[i.dataset.p]=(by[i.dataset.p]||0)+(toI(i.value)||0)*(+i.dataset.s); });
    a.querySelectorAll(".fb").forEach(e=>e.textContent=n0(by[e.dataset.p]||0));
    a.querySelectorAll("#ad details.grp").forEach(d=>{ const g=d.querySelector(":scope>summary .sgt"); if(g) g.textContent=n0([...d.querySelectorAll(".sq")].reduce((s2,i)=>s2+(toI(i.value)||0),0)); }); };
  a.querySelectorAll("#ad input").forEach(i=>i.addEventListener("input",recalc)); recalc();
  $("#am").onchange=e=>{ AD.month=e.target.value||AD.month; drawApp(); };
  $("#ats").onclick=async()=>{ const lines=[];
    a.querySelectorAll(".tb").forEach(i=>{ const q=toI(i.value); if(q!=null) lines.push({kind:"box",box_id:i.dataset.b,qty:q}); });
    a.querySelectorAll(".tp").forEach(i=>{ const q=toI(i.value); if(q!=null) lines.push({kind:"product",product_id:i.dataset.p,qty:q}); });
    a.querySelectorAll(".tf").forEach(i=>{ const q=toI(i.value); if(q!=null) lines.push({kind:"flavour",flavour_id:i.dataset.f,qty:q}); });
    const {error}=await sb.rpc("save_month_target",{f,m:m1,wd:toI($("#aw").value),st:toI($("#as").value),lines});
    const mm=$("#msgT"); mm.textContent=error?t("fail"):u("tSaved"); mm.className="msg "+(error?"bad":"ok"); };
  const salesLines=()=>{ const l=[]; a.querySelectorAll(".sq").forEach(i=>{ const q=toI(i.value); if(q) l.push({box_id:i.dataset.b,flavour_id:i.dataset.f||"",qty:q}); }); return l; };
  $("#spv").onclick=async()=>{ const d=$("#sd").value, n=+$("#sn").value; AD.first=d; AD.n=n;
    const {data:ex}=await sb.from("sales_orders").select("qty").eq("factory_id",f).gte("day",d);
    $("#spt").textContent=u("willRemove",{a:n0((ex||[]).reduce((s2,x)=>s2+x.qty,0)),d,b:n0(salesLines().reduce((s2,x)=>s2+x.qty,0)),n:n0(n)}); };
  $("#sss").onclick=async()=>{ const d=$("#sd").value, n=+$("#sn").value, lines=salesLines(); const mm=$("#msgS");
    if(!d||!lines.length){ mm.textContent=u("pickAll"); mm.className="msg bad"; return; }
    await $("#spv").onclick(); if(!confirm($("#spt").textContent)) return;
    const {data,error}=await sb.rpc("replace_sales",{f,first_day:d,n_days:n,lines,src:`request ${d} +${n}d`});
    mm.textContent=error?t("fail"):u("salesSaved",{r:n0(data.removed),a:n0(data.added)}); mm.className="msg "+(error?"bad":"ok"); };
  $("#pps").onclick=async()=>{ const vf=$("#pvf").value, rows=[]; a.querySelectorAll(".pp").forEach(i=>{ const v=parseFloat((i.value||"").replace(",",".")); if(!isNaN(v)&&v>=0) rows.push({box_id:i.dataset.b,valid_from:vf,price_sar:v}); });
    const mm=$("#msgP"); if(!rows.length){ mm.textContent=u("nothingTyped"); mm.className="msg bad"; return; }
    const {error}=await sb.from("box_prices").upsert(rows,{onConflict:"box_id,valid_from"}); mm.textContent=error?t("fail"):u("pSaved"); mm.className="msg "+(error?"bad":"ok"); };
  const act=async(p)=>{ const {error}=await p; if(error){ console.warn(error); msg(t("fail"),"bad"); return; } S.ref=null; await loadRef(); P.ext=null; drawApp(); };
  a.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{ const tb=b.dataset.tog, on=b.dataset.a!=="1";
    act(tb==="step_types"?sb.from(tb).update({active:on}).eq("factory_id",f).eq("name",b.dataset.id):sb.from(tb).update({active:on}).eq("id",b.dataset.id)); });
  const v=id=>($("#"+id).value||"").trim();
  $("#npa").onclick=()=>v("np")&&act(sb.from("products").insert({factory_id:f,code:v("np"),name_en:v("np"),sort:C.p.length}));
  $("#nfa").onclick=()=>v("nf")&&act(sb.from("flavours").insert({factory_id:f,product_id:$("#nfp").value,name_en:v("nf")}));
  $("#nba").onclick=async()=>{ const sz=toI(v("nbs")); if(!v("nb")||!sz) return msg(u("pickAll"),"bad");
    const {data,error}=await sb.from("boxes").insert({factory_id:f,code:v("nb"),name_en:v("nb"),pieces_per_box:sz,by_flavour:$("#nbf").checked,sort:C.b.length}).select("id").single();
    if(error) return msg(t("fail"),"bad"); act(sb.from("box_contents").insert({box_id:data.id,product_id:$("#nbp").value,pieces:sz})); };
  $("#nsfa").onclick=()=>v("nsf")&&act(sb.from("staff").insert({factory_id:f,name:v("nsf"),sort:(sf.data||[]).length}));
  $("#nra").onclick=()=>v("nr")&&act(sb.from("delay_reasons").insert({factory_id:f,category:v("nrc")||"Other",text_en:v("nr")}));
  $("#nsta").onclick=()=>v("nst")&&act(sb.from("stations").insert({factory_id:f,name_en:v("nst")}));
  $("#nspa").onclick=()=>v("nsp")&&act(sb.from("step_types").insert({factory_id:f,name:v("nsp"),sort:(stp.data||[]).length}));
  $("#wo").onchange=e=>act(sb.from("factories").update({week_off:[+e.target.value]}).eq("id",f));
}
async function signOut(){ await sb.auth.signOut(); STEP="email"; S.fid=null; S.ref=null; $("#app").hidden=true; $("#tabs").hidden=true; $("#mainbox").hidden=false; draw(); }
$("#lang").onclick=()=>{ L=L==="ar"?"en":"ar"; try{ localStorage.setItem("wd-lang",L); }catch(e){} draw(); };
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"||ev==="SIGNED_IN") draw(); });
draw();
</script>
</body>
</html>
