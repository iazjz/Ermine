<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وردية</title>
<meta name="theme-color" content="#D9417E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Wardiya - sign-in (20 Nov 2026). Email code, no password. Public values only on this
     page: the project URL and the publishable key. Row security in the database decides
     what each person can see; this page never holds the server key. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p50:#FDF2F7;--p100:#FBE4EF;--p200:#F7C6DC;--p300:#F09CC0;--p400:#E66A9E;--p500:#D9417E;
  --p600:#BF2C66;--p700:#9C2353;--p900:#5C1733;--bg:#FDF2F7;--card:#fff;--ink:#3A1426;--dim:#8A5A6F;
  --line:#F7C6DC;--main:#D9417E;--ok:#1F8A5B;--bad:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0D14;--card:#2A1520;--ink:#FBE4EF;
  --dim:#C99AB0;--line:#4A2436;--main:#F09CC0}}
:root[data-theme="dark"]{--bg:#1A0D14;--card:#2A1520;--ink:#FBE4EF;--dim:#C99AB0;--line:#4A2436;--main:#F09CC0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:520px;width:100%;margin:0 auto}
.brand{font-weight:700;font-size:22px;color:var(--main);letter-spacing:0}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
main{flex:1;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;width:100%;max-width:420px;
  box-shadow:0 10px 30px rgba(217,65,126,.10);animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
h1{margin:0 0 6px;font-size:22px}
p.sub{margin:0 0 20px;color:var(--dim);font-size:14.5px;line-height:1.6}
label{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--main)}
input.code{letter-spacing:.35em;text-align:center;font-size:24px;direction:ltr}
button.go{width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:14px;
  background:var(--p500);color:#fff;cursor:pointer;transition:transform .1s,opacity .15s}
button.go:active{transform:scale(.98)} button.go:disabled{opacity:.55;cursor:default}
button.link{background:none;border:0;color:var(--main);font:inherit;font-size:14px;cursor:pointer;margin-top:12px;padding:4px}
.msg{margin-top:12px;font-size:14px;line-height:1.6;min-height:1.2em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.who{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;background:var(--p100);color:var(--p700);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .pill{background:#4A2436;color:var(--p200)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{background:#4A2436;color:var(--p200)}}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:16px}
/* app (20 Nov 2026): entry, today, team */
.app{width:100%;max-width:560px;margin:0 auto;padding:0 16px 90px}
.fname{font-weight:700;font-size:18px;margin:4px 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:none;border:0;font:inherit;font-size:13.5px;font-weight:600;color:var(--dim);padding:10px 4px;
  border-radius:12px;cursor:pointer}
.tabs button.on{color:#fff;background:var(--p500)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big4 button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:22px 10px;
  font:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .1s,border-color .15s}
.big4 button:active{transform:scale(.97)} .big4 button:hover{border-color:var(--main)}
.big4 .ic{font-size:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-top:14px;animation:rise .3s ease-out both}
.panel h2{margin:0 0 12px;font-size:18px}
.fld{margin-bottom:12px}
select{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px;font:inherit;cursor:pointer}
.seg button.on{border-color:var(--main);color:var(--main);font-weight:700}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tot b{display:block;font-size:20px} .tot span{font-size:12px;color:var(--dim)}
.ent{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:8px}
.ent .w{font-size:15px;font-weight:600} .ent .m{font-size:12.5px;color:var(--dim);margin-top:2px}
.ent.void{opacity:.45} .ent.void .w{text-decoration:line-through}
.x{border:1px solid var(--line);background:none;color:var(--dim);border-radius:10px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.st{font-size:11.5px;border-radius:999px;padding:2px 8px;margin-inline-start:6px}
.st.pending{background:#FFF3D6;color:#8A5A00} .st.void{background:#eee;color:#666}
.empty{color:var(--dim);text-align:center;padding:20px 0}
[hidden]{display:none !important}
</style>
</head>
<body>

<main id="mainbox"><div class="card" id="card"></div></main>
<div class="app" id="app" hidden></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="foot" id="foot"></div>
<script>
const SB_URL="https://txqrrnymaglkilowgvee.supabase.co";
const SB_KEY="sb_publishable_Jc1BIS5tm2t04X6982tHfQ_mQmSokSJ";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
const T={
 ar:{brand:"وردية",other:"EN",hello:"تسجيل الدخول",sub:"اكتب بريدك، ونرسل لك رمز دخول. لا توجد كلمة مرور.",
  email:"البريد الإلكتروني",send:"أرسل الرمز",sending:"جارٍ الإرسال…",codeT:"أدخل الرمز",

  checking:"جارٍ التحقق…",back:"تغيير البريد",resend:"أرسل الرمز مرة أخرى",badEmail:"اكتب بريدًا صحيحًا.",
  badCode:"الرمز غير صحيح أو انتهت صلاحيته. اطلب رمزًا جديدًا.",wait:"انتظر قليلًا قبل طلب رمز جديد.",
  fail:"تعذّر الاتصال. حاول مرة أخرى.",nameT:"مرحبًا بك",nameSub:"اكتب اسمك كما تريد أن يظهر للفريق.",
  name:"الاسم",save:"حفظ",inT:"أنت داخل",factory:"المصنع",role:"الدور",none:"حسابك غير مرتبط بمصنع بعد. اطلب من المدير إضافتك.",
  out:"تسجيل الخروج",foot:"وردية · أول مصنع: إيرماين",
  roles:{owner:"المالك",admin:"مدير",planner:"مخطِّط",chef:"شيف",lead:"قائد محطة",storekeeper:"أمين المخزن",qc:"الجودة",viewer:"مشاهد"}},
 en:{brand:"Wardiya",other:"ع",hello:"Sign in",sub:"Type your email and we send you a sign-in code. No password.",
  email:"Email",send:"Send the code",sending:"Sending…",codeT:"Enter the code",
  codeSub:"We sent a code to {e}. It arrives within a minute; check spam if you cannot see it.",code:"Code",verify:"Sign in",
  checking:"Checking…",back:"Change email",resend:"Send the code again",badEmail:"Type a valid email.",
  badCode:"The code is wrong or has expired. Ask for a new one.",wait:"Wait a little before asking for a new code.",

let L="ar"; try{ L=localStorage.getItem("wd-lang")||"ar"; }catch(e){}
let EMAIL="", STEP="email";
const t=(k,v={})=>String(T[L][k]).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function msg(text,cls){ const m=$("#msg"); if(m){ m.textContent=text||""; m.className="msg "+(cls||""); } }
async function draw(){
  document.documentElement.lang=L; document.documentElement.dir=L==="ar"?"rtl":"ltr";
  $("#brand").textContent=t("brand"); $("#lang").textContent=t("other"); $("#foot").textContent=t("foot");
  document.title=t("brand");
  const {data:{session}}=await sb.auth.getSession();
  const c=$("#card");
  if(session){ return drawIn(session); }
  $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
  if(STEP==="code"){
    c.innerHTML=`<h1>${t("codeT")}</h1><p class="sub">${esc(t("codeSub",{e:EMAIL}))}</p>
      <label for="code">${t("code")}</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="go" id="verify" type="button">${t("verify")}</button>
      <div class="msg" id="msg"></div>
      <button class="link" id="resend" type="button">${t("resend")}</button>
      <button class="link" id="back" type="button">${t("back")}</button>`;
    $("#code").focus();
    $("#code").addEventListener("keydown",e=>{ if(e.key==="Enter") verify(); });
    $("#verify").onclick=verify; $("#resend").onclick=send; $("#back").onclick=()=>{STEP="email";draw();};
    return;
  }
  c.innerHTML=`<h1>${t("hello")}</h1><p class="sub">${t("sub")}</p>
    <label for="email">${t("email")}</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(EMAIL)}">
    <button class="go" id="send" type="button">${t("send")}</button><div class="msg" id="msg"></div>`;
  $("#email").focus();
  $("#email").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
  $("#send").onclick=send;
}
async function send(){
  const el=$("#email"); if(el) EMAIL=el.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(EMAIL)) return msg(t("badEmail"),"bad");
  const b=$("#send")||$("#resend"); if(b){ b.disabled=true; b.textContent=t("sending"); }
  const {error}=await sb.auth.signInWithOtp({email:EMAIL,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  if(error){ if(b){ b.disabled=false; b.textContent=STEP==="code"?t("resend"):t("send"); }
    return msg(/rate|seconds|security/i.test(error.message)?t("wait"):t("fail"),"bad"); }
  STEP="code"; draw();
}
async function verify(){
  const token=($("#code").value||"").replace(/\D/g,"");
  if(token.length<6) return msg(t("badCode"),"bad");
  const b=$("#verify"); b.disabled=true; b.textContent=t("checking");
  const {error}=await sb.auth.verifyOtp({email:EMAIL,token,type:"email"});
  if(error){ b.disabled=false; b.textContent=t("verify"); return msg(t("badCode"),"bad"); }
  STEP="email"; draw();
}

const T2={

  product:"المنتج",flavour:"النكهة",box:"البوكس",qtyP:"العدد (حبة)",qtyB:"العدد (بوكس)",day:"اليوم",today:"اليوم",yday:"أمس",
  reason:"السبب",minutes:"الدقائق الضائعة",note:"ماذا حدث",noteNeed:"اكتب ماذا حدث (مطلوب لهذا السبب).",any:"— بدون —",
  save:"حفظ",cancel:"إلغاء",saved:"تم الحفظ ✓",pickAll:"اختر كل الخانات واكتب العدد.",big:"الرقم {n} أكبر من المعتاد. متأكد؟",
  pcs:"حبة",boxes:"بوكس",tMade:"صُنع",tCoat:"غُطّي",tPack:"عُبّئ",nothing:"لا إدخالات لهذا اليوم بعد.",
  voidB:"إلغاء",voidQ:"إلغاء هذا الإدخال؟ يبقى ظاهرًا مشطوبًا ولا يُحذف.",pending:"بانتظار الاعتماد",voided:"ملغى",
  delayW:"تأخير: {r}",min:"دقيقة",invite:"إضافة شخص",inviteSub:"اكتب بريده ودوره. إذا لم يدخل بعد، تُطبَّق الإضافة أول ما يدخل.",

  stop:"إيقاف",stopQ:"إيقاف صلاحية هذا الشخص؟",stopped:"موقوف",noRights:"إضافة الأشخاص للمالك والمدير فقط.",
  by:"بواسطة",appOut:"تسجيل الخروج"},
 en:{tEntry:"Entry",tToday:"Today",tTeam:"Team",made:"Made",coated:"Coated",packed:"Packed",delay:"Delay",
  product:"Product",flavour:"Flavour",box:"Box",qtyP:"Quantity (pieces)",qtyB:"Quantity (boxes)",day:"Day",today:"Today",yday:"Yesterday",
  reason:"Reason",minutes:"Minutes lost",note:"What happened",noteNeed:"Write what happened (needed for this reason).",any:"— none —",
  save:"Save",cancel:"Cancel",saved:"Saved ✓",pickAll:"Pick every field and type the quantity.",big:"{n} is higher than usual. Are you sure?",
  pcs:"pcs",boxes:"boxes",tMade:"Made",tCoat:"Coated",tPack:"Packed",nothing:"No entries for this day yet.",
  voidB:"Cancel",voidQ:"Cancel this entry? It stays visible, crossed out; it is not deleted.",pending:"Waiting for approval",voided:"Cancelled",
  delayW:"Delay: {r}",min:"min",invite:"Add a person",inviteSub:"Type their email and role. If they have not signed in yet, it applies at their first sign-in.",
  role:"Role",add:"Add",added:"Added ✓",invited:"Invited, applies at first sign-in ✓",waiting:"Waiting for first sign-in",

const u=(k,v={})=>String(T2[L][k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
const S={fid:null,fname:"",roles:[],me:null,ref:null,view:"entry",form:null,day:0};
const riyadh=(off=0)=>{ const d=new Date(Date.now()-off*864e5);
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(d); };
const isMgr=()=>S.roles.some(r=>["owner","admin"].includes(r));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=="x"?r:(r&3|8)).toString(16);}));
const n0=v=>Math.round(v||0).toLocaleString(L==="ar"?"ar-EG":"en-GB");

async function drawIn(session){
  const c=$("#card"), uid=session.user.id; S.me=uid;
  const {data:prof}=await sb.from("profiles").select("full_name,lang").eq("user_id",uid).maybeSingle();
  if(!prof){
    $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
    c.innerHTML=`<h1>${t("nameT")}</h1><p class="sub">${t("nameSub")}</p>
      <label for="nm">${t("name")}</label><input id="nm" autocomplete="name">
      <button class="go" id="sv" type="button">${t("save")}</button><div class="msg" id="msg"></div>
      <button class="link" id="out" type="button">${t("out")}</button>`;
    $("#nm").focus(); $("#out").onclick=signOut;
    $("#sv").onclick=async()=>{ const n=$("#nm").value.trim(); if(n.length<2) return;
      const {error}=await sb.from("profiles").insert({user_id:uid,full_name:n,lang:L});
      if(error) return msg(t("fail"),"bad"); draw(); };
    return;
  }
  const {data:mem}=await sb.from("memberships").select("factory_id,role,factories(name)").eq("user_id",uid).eq("active",true);
  if(!mem||!mem.length){
    $("#mainbox").hidden=false; $("#app").hidden=true; $("#tabs").hidden=true;
    c.innerHTML=`<h1>${t("inT")}</h1><p class="sub">${esc(prof.full_name)} · <span dir="ltr">${esc(session.user.email)}</span></p>
      <p class="sub">${t("none")}</p><button class="link" id="out" type="button">${t("out")}</button>`;
    $("#out").onclick=signOut; return;
  }
  S.fid=mem[0].factory_id; S.fname=mem[0].factories?.name||""; S.roles=mem.filter(m=>m.factory_id===S.fid).map(m=>m.role);
  if(!S.ref) await loadRef();
  $("#mainbox").hidden=true; $("#app").hidden=false; $("#tabs").hidden=false;
  drawApp();
}
async function loadRef(){
  const f=S.fid;
  const [p,fl,b,bc,r]=await Promise.all([
    sb.from("products").select("id,code,is_coated,sort").eq("factory_id",f).eq("active",true).order("sort"),
    sb.from("flavours").select("id,product_id,name_en").eq("factory_id",f).eq("active",true).order("name_en"),
    sb.from("boxes").select("id,code,pieces_per_box,by_flavour,sort").eq("factory_id",f).eq("active",true).order("sort"),
    sb.from("box_contents").select("box_id,product_id"),
    sb.from("delay_reasons").select("id,category,text_en,needs_note").eq("factory_id",f).eq("active",true)]);
  S.ref={products:p.data||[],flavours:fl.data||[],boxes:b.data||[],bc:bc.data||[],reasons:r.data||[]};
}
function drawApp(){
  const tabs=[["entry","tEntry"],["today","tToday"]].concat(isMgr()?[["team","tTeam"]]:[]);
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button class="${S.view===k?"on":""}" data-v="${k}" type="button">${u(l)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; S.form=null; drawApp(); });
  const head=`<div class="fname">${esc(S.fname)} · <span class="pill">${S.roles.map(r=>esc(T[L].roles[r]||r)).join("، ")}</span></div>`;
  const a=$("#app");
  if(S.view==="today") return drawToday(a,head);
  if(S.view==="team") return drawTeam(a,head);
  a.innerHTML=head+`<div class="big4">
     <button data-f="made" type="button"><span class="ic">🧁</span>${u("made")}</button>
     <button data-f="coated" type="button"><span class="ic">🍫</span>${u("coated")}</button>
     <button data-f="packed" type="button"><span class="ic">📦</span>${u("packed")}</button>
     <button data-f="delay" type="button"><span class="ic">⏱</span>${u("delay")}</button></div>
     <div id="form"></div><button class="link" id="out2" type="button">${u("appOut")}</button>`;
  a.querySelectorAll(".big4 button").forEach(b=>b.onclick=()=>{ S.form=b.dataset.f; drawForm(); });
  $("#out2").onclick=signOut;
  if(S.form) drawForm();
}
const opt=(v,l,sel)=>`<option value="${esc(v)}"${sel?" selected":""}>${esc(l)}</option>`;
function daySeg(){ return `<div class="fld"><label>${u("day")}</label><div class="seg">
  <button type="button" data-d="0" class="${S.day===0?"on":""}">${u("today")}<br><small dir="ltr">${riyadh(0)}</small></button>
  <button type="button" data-d="1" class="${S.day===1?"on":""}">${u("yday")}<br><small dir="ltr">${riyadh(1)}</small></button></div></div>`; }
function drawForm(){
  const R=S.ref, k=S.form, box=$("#form"); let h=`<div class="panel"><h2>${u(k)}</h2>`+daySeg();
  if(k==="made"||k==="coated"){
    const ps=R.products.filter(p=>k==="made"||p.is_coated);
    h+=`<div class="fld"><label>${u("product")}</label><select id="fp">${opt("",u("any"))}${ps.map(p=>opt(p.id,p.code)).join("")}</select></div>
        <div class="fld"><label>${u("flavour")}</label><select id="ff"></select></div>
        <div class="fld"><label>${u("qtyP")}</label><input id="fq" inputmode="numeric"></div>`;
  } else if(k==="packed"){
    h+=`<div class="fld"><label>${u("box")}</label><select id="fb">${opt("",u("any"))}${R.boxes.map(b=>opt(b.id,b.code+" · "+b.pieces_per_box)).join("")}</select></div>
        <div class="fld" id="ffw" hidden><label>${u("flavour")}</label><select id="ff"></select></div>
        <div class="fld"><label>${u("qtyB")}</label><input id="fq" inputmode="numeric"></div>`;
  } else {
    const cats=[...new Set(R.reasons.map(r=>r.category))];
    h+=`<div class="fld"><label>${u("product")}</label><select id="fp">${opt("",u("any"))}${R.products.map(p=>opt(p.id,p.code)).join("")}</select></div>
        <div class="fld"><label>${u("reason")}</label><select id="fr">${opt("",u("any"))}${cats.map(c=>`<optgroup label="${esc(c)}">${
          R.reasons.filter(r=>r.category===c).map(r=>opt(r.id,r.text_en)).join("")}</optgroup>`).join("")}</select></div>
        <div class="fld"><label>${u("minutes")}</label><input id="fm" inputmode="numeric"></div>
        <div class="fld"><label>${u("note")}</label><input id="fn"></div>`;
  }
  h+=`<button class="go" id="fs" type="button">${u("save")}</button><div class="msg" id="msg"></div>
      <button class="link" id="fc" type="button">${u("cancel")}</button></div>`;
  box.innerHTML=h;
  box.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.day=+b.dataset.d; box.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b)); });
  const fillFl=(pid)=>{ const s=$("#ff"); if(!s) return; const fl=R.flavours.filter(f=>f.product_id===pid);
    s.innerHTML=opt("",u("any"))+fl.map(f=>opt(f.id,f.name_en)).join(""); return fl.length; };
  if($("#fp")&&$("#ff")) $("#fp").onchange=e=>fillFl(e.target.value);
  if($("#fb")) $("#fb").onchange=e=>{ const b=R.boxes.find(x=>x.id===e.target.value);
    const pc=R.bc.find(x=>x.box_id===e.target.value); const show=!!(b&&b.by_flavour&&pc);
    $("#ffw").hidden=!show; if(show) fillFl(pc.product_id); };
  $("#fc").onclick=()=>{ S.form=null; box.innerHTML=""; };
  $("#fs").onclick=()=>saveForm(k);
  box.scrollIntoView({behavior:"smooth",block:"start"});
}
async function saveForm(k){
  const R=S.ref, day=riyadh(S.day), v=id=>($("#"+id)||{}).value||"";
  let row, table="production_entries";
  if(k==="delay"){
    const rid=v("fr"), rs=R.reasons.find(r=>r.id===rid), note=v("fn").trim();
    if(!rid) return msg(u("pickAll"),"bad");
    if(rs&&rs.needs_note&&!note) return msg(u("noteNeed"),"bad");
    const mins=parseInt(v("fm").replace(/\D/g,""))||null;
    table="delays"; row={factory_id:S.fid,client_id:uuid(),day,product_id:v("fp")||null,reason_id:rid,minutes_lost:mins,what_happened:note||null};
  } else {
    const q=parseInt(v("fq").replace(/\D/g,""))||0;
    if(k==="packed"){
      const bid=v("fb"), b=R.boxes.find(x=>x.id===bid), pc=R.bc.find(x=>x.box_id===bid);
      if(!bid||!q||(b&&b.by_flavour&&pc&&!v("ff"))) return msg(u("pickAll"),"bad");
      if(q>1500&&!confirm(u("big",{n:q}))) return;
      row={factory_id:S.fid,client_id:uuid(),day,stage:"packed",box_id:bid,product_id:pc?pc.product_id:null,flavour_id:v("ff")||null,qty:q};
    } else {
      const pid=v("fp"), hasFl=R.flavours.some(f=>f.product_id===pid);
      if(!pid||!q||(hasFl&&!v("ff"))) return msg(u("pickAll"),"bad");
      if(q>15000&&!confirm(u("big",{n:q}))) return;
      row={factory_id:S.fid,client_id:uuid(),day,stage:k,product_id:pid,flavour_id:v("ff")||null,qty:q};
    }
  }
  const btn=$("#fs"); btn.disabled=true;
  const {error}=await sb.from(table).insert(row);
  btn.disabled=false;
  if(error){ console.warn(error); return msg(t("fail")+" ("+(error.code||"")+")","bad"); }
  msg(u("saved"),"ok"); if($("#fq")) $("#fq").value=""; if($("#fm")) $("#fm").value=""; if($("#fn")) $("#fn").value="";
}
async function drawToday(a,head){
  const day=riyadh(S.day);
  a.innerHTML=head+`<div class="seg"><button type="button" data-d="0" class="${S.day===0?"on":""}">${u("today")}<br><small dir="ltr">${riyadh(0)}</small></button>
    <button type="button" data-d="1" class="${S.day===1?"on":""}">${u("yday")}<br><small dir="ltr">${riyadh(1)}</small></button></div><div id="tl" class="empty">…</div>`;
  a.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.day=+b.dataset.d; drawApp(); });
  const [pe,dl]=await Promise.all([
    sb.from("production_entries").select("id,stage,product_id,flavour_id,box_id,qty,status,entered_by,entered_at").eq("factory_id",S.fid).eq("day",day),
    sb.from("delays").select("id,product_id,reason_id,minutes_lost,what_happened,status,entered_by,entered_at").eq("factory_id",S.fid).eq("day",day)]);
  const R=S.ref, P=id=>(R.products.find(x=>x.id===id)||{}).code||"", F=id=>(R.flavours.find(x=>x.id===id)||{}).name_en||"",
        B=id=>(R.boxes.find(x=>x.id===id)||{}).code||"", RS=id=>(R.reasons.find(x=>x.id===id)||{}).text_en||"";
  const all=[...(pe.data||[]).map(x=>({...x,kind:"pe"})),...(dl.data||[]).map(x=>({...x,kind:"dl"}))]
    .sort((x,y)=>y.entered_at.localeCompare(x.entered_at));
  const ids=[...new Set(all.map(x=>x.entered_by))];
  const names={}; if(ids.length){ const {data}=await sb.from("profiles").select("user_id,full_name").in("user_id",ids); (data||[]).forEach(p=>names[p.user_id]=p.full_name); }
  const ok=x=>x.kind==="pe"&&x.status==="approved";
  const sum=st=>all.filter(x=>ok(x)&&x.stage===st).reduce((s,x)=>s+x.qty,0);
  const tm=d=>new Date(d).toLocaleTimeString(L==="ar"?"ar-EG":"en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Riyadh"});
  let h=`<div class="tot"><div><b>${n0(sum("made"))}</b><span>${u("tMade")} · ${u("pcs")}</span></div>
    <div><b>${n0(sum("coated"))}</b><span>${u("tCoat")} · ${u("pcs")}</span></div>
    <div><b>${n0(sum("packed"))}</b><span>${u("tPack")} · ${u("boxes")}</span></div></div>`;
  if(!all.length) h+=`<div class="empty">${u("nothing")}</div>`;
  h+=all.map(x=>{
    const w = x.kind==="dl" ? u("delayW",{r:RS(x.reason_id)})+(x.minutes_lost?` · ${n0(x.minutes_lost)} ${u("min")}`:"")
      : x.stage==="packed" ? `${u("tPack")} ${n0(x.qty)} ${u("boxes")} · ${B(x.box_id)}${x.flavour_id?" · "+F(x.flavour_id):""}`
      : `${u(x.stage==="made"?"tMade":"tCoat")} ${n0(x.qty)} ${u("pcs")} · ${x.flavour_id?F(x.flavour_id):P(x.product_id)}`;
    const st = x.status==="pending"?`<span class="st pending">${u("pending")}</span>`:x.status==="void"?`<span class="st void">${u("voided")}</span>`:"";
    const can = x.status!=="void" && (x.entered_by===S.me || S.roles.some(r=>["owner","admin","planner","chef"].includes(r)));
    return `<div class="ent ${x.status==="void"?"void":""}"><div><div class="w"><bdi>${esc(w)}</bdi>${st}</div>
      <div class="m">${tm(x.entered_at)} · ${u("by")} ${esc(names[x.entered_by]||"—")}</div></div>
      ${can?`<button class="x" type="button" data-k="${x.kind}" data-id="${x.id}">${u("voidB")}</button>`:""}</div>`;
  }).join("");
  $("#tl").className=""; $("#tl").innerHTML=h;
  $("#tl").querySelectorAll(".x").forEach(b=>b.onclick=async()=>{
    if(!confirm(u("voidQ"))) return;
    const {error}=await sb.from(b.dataset.k==="pe"?"production_entries":"delays").update({status:"void"}).eq("id",b.dataset.id);
    if(error) return alert(t("fail")); drawApp(); });
}
async function drawTeam(a,head){
  if(!isMgr()){ a.innerHTML=head+`<div class="empty">${u("noRights")}</div>`; return; }
  const roles=["planner","chef","lead","storekeeper","qc","viewer","admin"];
  a.innerHTML=head+`<div class="panel"><h2>${u("invite")}</h2><p class="sub">${u("inviteSub")}</p>
    <div class="fld"><label>${t("email")}</label><input id="ie" type="email" dir="ltr" autocomplete="off"></div>
    <div class="fld"><label>${u("role")}</label><select id="ir">${roles.map(r=>opt(r,T[L].roles[r])).join("")}</select></div>
    <button class="go" id="ia" type="button">${u("add")}</button><div class="msg" id="msg"></div></div><div id="tm" style="margin-top:14px">…</div>`;
  $("#ia").onclick=async()=>{ const e=$("#ie").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return msg(t("badEmail"),"bad");
    const {data,error}=await sb.rpc("invite_member",{f:S.fid,mail:e,r:$("#ir").value});
    if(error) return msg(t("fail"),"bad"); msg(u(data==="added"?"added":"invited"),"ok"); $("#ie").value=""; listTeam(); };
  listTeam();
}
async function listTeam(){
  const {data,error}=await sb.rpc("team",{f:S.fid});
  if(error){ $("#tm").innerHTML=`<div class="empty">${t("fail")}</div>`; return; }
  $("#tm").innerHTML=(data||[]).map(m=>`<div class="ent ${m.active?"":"void"}"><div>
      <div class="w">${esc(m.full_name||m.email)} <span class="pill">${esc(T[L].roles[m.role]||m.role)}</span>${
        m.waiting?`<span class="st pending">${u("waiting")}</span>`:(!m.active?`<span class="st void">${u("stopped")}</span>`:"")}</div>
      <div class="m" dir="ltr">${esc(m.email)}</div></div>${
      (!m.waiting&&m.active&&m.user_id!==S.me)?`<button class="x" type="button" data-u="${m.user_id}" data-r="${m.role}">${u("stop")}</button>`:""}</div>`).join("");
  $("#tm").querySelectorAll(".x").forEach(b=>b.onclick=async()=>{ if(!confirm(u("stopQ"))) return;
    const {error}=await sb.from("memberships").update({active:false}).eq("factory_id",S.fid).eq("user_id",b.dataset.u).eq("role",b.dataset.r);
    if(error) return alert(t("fail")); listTeam(); });
}
async function signOut(){ await sb.auth.signOut(); STEP="email"; S.fid=null; S.ref=null; $("#app").hidden=true; $("#tabs").hidden=true; $("#mainbox").hidden=false; draw(); }
$("#lang").onclick=()=>{ L=L==="ar"?"en":"ar"; try{ localStorage.setItem("wd-lang",L); }catch(e){} draw(); };
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"||ev==="SIGNED_IN") draw(); });
draw();
</script>
